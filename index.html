    // Re-render the latest snapshot locally, without another Firestore request.
    if (window.__prlLatestAdminLinks) {
      const snap = window.__prlLatestAdminLinks;
      const allLinks = snap.docs.map(d => ({id:d.id, ...d.data()})).sort(newest);
      const queryText = ($("#adminLinkSearch")?.value || "").trim().toLowerCase();
      const list = allLinks.filter(l => [l.title,l.url,l.tag,l.description].some(v => String(v||"").toLowerCase().includes(queryText)));
      const countEl = $("#adminLinkCount"); if (countEl) countEl.textContent = `${list.length} of ${allLinks.length} links`;
      const el = $("#linksList"); if (!el) return;
      if (!list.length) { el.innerHTML = `<div class="empty">${allLinks.length ? "No matching links found" : "No links yet"}</div>`; return; }
      el.innerHTML = `<div class="table-wrap scroll"><table class="table"><thead><tr><th>Image</th><th>Title</th><th>Price</th><th>Featured</th><th>Actions</th></tr></thead><tbody>${list.map(l => `<tr><td><img src="${esc(validUrl(l.imageUrl) ? l.imageUrl : PLACEHOLDER_IMG)}" style="width:60px;height:44px;object-fit:cover;border-radius:8px" onerror="this.src='${PLACEHOLDER_IMG}'"></td><td><div class="font-semibold">${esc(l.title||"")}</div><div class="text-xs text-soft">${esc((l.url||"").slice(0,40))}…</div></td><td>${l.price ? inr(l.price) : "—"}</td><td>${l.isFeatured ? '<span class="badge badge-success">Yes</span>' : '<span class="badge badge-neutral">No</span>'}</td><td class="acts"><button class="btn btn-secondary btn-xs" onclick="copyDealUrl('${esc(l.url||"")}')">Copy URL</button><button class="btn btn-secondary btn-xs" onclick="editLink('${l.id}')">Edit</button><button class="btn btn-danger btn-xs" onclick="deleteLink('${l.id}')">Delete</button></td></tr>`).join("")}</tbody></table></div>`;
    }
  });
  const unsub = onSnapshot(collection(db,"links"), snap => {
    window.__prlLatestAdminLinks = snap;
    const allLinks = snap.docs.map(d => ({id:d.id, ...d.data()})).sort(newest);
    const el = $("#linksList");
    if (!el) return;
    const queryText = ($("#adminLinkSearch")?.value || "").trim().toLowerCase();
    const list = allLinks.filter(l => [l.title,l.url,l.tag,l.description].some(v => String(v||"").toLowerCase().includes(queryText)));
    const countEl = $("#adminLinkCount");
    if (countEl) countEl.textContent = `${list.length} of ${allLinks.length} links`;
    if (!allLinks.length){ el.innerHTML = `<div class="empty">No links yet</div>`; return; }
    if (!list.length){ el.innerHTML = `<div class="empty">No matching links found</div>`; return; }
    el.innerHTML = `<div class="table-wrap scroll"><table class="table">
      <thead><tr><th>Image</th><th>Title</th><th>Price</th><th>Featured</th><th>Actions</th></tr></thead>
      <tbody>${list.map(l => `<tr>
        <td><img src="${esc(validUrl(l.imageUrl) ? l.imageUrl : PLACEHOLDER_IMG)}" style="width:60px;height:44px;object-fit:cover;border-radius:8px" onerror="this.src='${PLACEHOLDER_IMG}'"></td>

        <td>${l.price ? inr(l.price) : "—"}</td>
        <td>${l.isFeatured ? '<span class="badge badge-success">Yes</span>' : '<span class="badge badge-neutral">No</span>'}</td>

          <button class="btn btn-danger btn-xs" onclick="deleteLink('${l.id}')">Delete</button>
        </td>
      </tr>`).join("")}</tbody></table></div>`;
  });
  S.adminSubs.add(unsub);
}

window.deleteLink = (id) => confirmDialog("Delete link?", async () => {

        <td class="font-mono font-bold">${esc(c.code||"")}</td>
        <td>${c.discountType === "percent" ? `${c.discountValue}%` : `₹${c.discountValue}`}</td>

      </tr>`).join("")}</tbody></table></div>`;

window.couponForm = (coupon = null) => {
  const ed = !!coupon;
  openModal(`<div class="modal-title">${ed?"Edit":"Add"} Coupon</div>
    <div class="form-group"><label class="form-label">Code</label><input class="form-input font-mono" id="cpCode" value="${esc(coupon?.code||"")}" style="text-transform:uppercase"></div>
    <div class="form-group"><label class="form-label">Type</label>
      <select class="form-select" id="cpType">
        <option value="flat" ${coupon?.discountType==="flat"?"selected":""}>Flat (₹)</option>
        <option value="percent" ${coupon?.discountType==="percent"?"selected":""}>Percent (%)</option>
      </select></div>
    <div class="form-group"><label class="form-label">Value</label><input class="form-input" type="number" id="cpValue" value="${coupon?.discountValue||0}"></div>
    <div class="form-group"><label class="form-label">Max discount (₹)</label><input class="form-input" type="number" id="cpMax" value="${coupon?.maxDiscount||0}"></div>
    <div class="form-group"><label class="form-label">Min order (₹)</label><input class="form-input" type="number" id="cpMin" value="${coupon?.minOrder||0}"></div>
    <div class="form-group"><label class="checkbox-row"><input type="checkbox" id="cpActive" ${coupon?.isActive !== false ? "checked" : ""}> Active</label></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="cpSave">Save</button>
    </div>`);
  $("#cpSave").onclick = async () => {
    const data = {
      code: $("#cpCode").value.trim().toUpperCase(),
      discountType: $("#cpType").value,
      discountValue: parseFloat($("#cpValue").value) || 0,
      maxDiscount: parseFloat($("#cpMax").value) || 0,
      minOrder: parseFloat($("#cpMin").value) || 0,
      isActive: $("#cpActive").checked, updatedAt: serverTimestamp()
    };
    if (!data.code) return toast("Code required", "error");
    if (data.discountValue <= 0) return toast("Value > 0", "error");
    try {
      if (ed) await updateDoc(doc(db,"coupons",coupon.id), data);
      else await addDoc(collection(db,"coupons"), {...data, createdAt: serverTimestamp()});
      toast("Saved", "success"); closeModal();
    } catch(err){ toast(errMsg(err), "error"); }
  };
};

window.editCoupon = async (id) => {
  const snap = await getDoc(doc(db,"coupons",id));
  if (snap.exists()) couponForm({id, ...snap.data()});
};

window.deleteCoupon = (id) => confirmDialog("Delete coupon?", async () => {
  try { await deleteDoc(doc(db,"coupons",id)); toast("Deleted", "success"); }
  catch(err){ toast(errMsg(err), "error"); }
});

/* ============ ADMIN ORDERS ============ */
let adminOrderFilter = "all";
function renderAdminOrders(){
  $("#adminContent").innerHTML = `
    <div class="chip-row mb-4" id="adminOrderTabs">
      ${["all","pending","processing","successful","rejected"].map(f =>
        `<button class="chip ${adminOrderFilter===f?"active":""}" data-f="${f}">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`
      ).join("")}
    </div><div id="adminOrdersList"></div>`;
  $$("#adminOrderTabs .chip").forEach(chip => chip.onclick = () => {
    $$("#adminOrderTabs .chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active"); adminOrderFilter = chip.dataset.f; paintAdminOrders();
  });
  const unsub = onSnapshot(collection(db,"orders"), snap => {
    S.cached.orders = snap.docs.map(d => ({id:d.id, ...d.data()})).sort(newest);
    paintAdminOrders();
  });
  S.adminSubs.add(unsub);
}

function paintAdminOrders(){
  const el = $("#adminOrdersList");
  if (!el) return;
  let list = S.cached.orders;
  if (adminOrderFilter !== "all") list = list.filter(o => o.status === adminOrderFilter);
  if (!list.length){ el.innerHTML = `<div class="empty">No orders</div>`; return; }
  el.innerHTML = `<div class="table-wrap scroll"><table class="table">
    <thead><tr><th>Order</th><th>Customer</th><th>Company</th><th>Total</th><th>Status</th><th></th></tr></thead>
    <tbody>${list.map(o => {
      const info = ORDER_ST[o.status] || {label:o.status, tone:"neutral"};
      return `<tr>
        <td class="font-mono text-xs font-bold">#${esc(o.orderId || o.id)}</td>
        <td>${esc(o.customerName||"")}</td>
        <td>${esc(o.companyName||"")}</td>
        <td class="font-bold">${inr(o.grandTotal)}</td>
        <td><span class="badge badge-${info.tone}">${info.label}</span></td>
        <td><button class="btn btn-secondary btn-xs" onclick="adminOpenOrder('${o.id}')">Manage</button></td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

window.adminOpenOrder = async (orderId) => {
  const snap = await getDoc(doc(db,"orders",orderId));
  if (!snap.exists()) return toast("Not found", "error");
  const o = {id:snap.id, ...snap.data()};
  const info = ORDER_ST[o.status] || {label:o.status, tone:"neutral"};
  const payLbl = o.paymentMethod === "cod" ? "Cash on Delivery" : "Online (UPI)";
  openModal(`
    <div class="modal-title">Order #${esc(o.orderId || o.id)}</div>
    <div class="mb-3" style="text-align:center"><span class="badge badge-${info.tone}">${info.label}</span></div>
    <div class="section-title">Customer</div>
    <div class="text-sm font-semibold">${esc(o.customerName||"")}</div>
    <div class="text-sm text-muted">${esc(o.customerPhone||"")}</div>
    <div class="text-sm text-muted">${esc(o.customerEmail||"")}</div>
    <div class="section-title mt-4">Company</div>
    <div class="text-sm font-semibold">${esc(o.companyName||"")}</div>
    <div class="section-title mt-4">Items</div>
    ${(o.items||[]).map(i => `<div class="row" style="padding:8px 0">
      <img src="${esc(validUrl(i.imageUrl) ? i.imageUrl : PLACEHOLDER_IMG)}" style="width:44px;height:44px;border-radius:10px;object-fit:cover" onerror="this.src='${PLACEHOLDER_IMG}'">
      <div style="flex:1"><div class="text-sm font-semibold">${esc(i.name)}</div><div class="text-xs text-soft">${i.quantity} × ${inr(i.unitPrice)}</div></div>
    </div>`).join("")}
    <div class="price-row total"><span>Total</span><span>${inr(o.grandTotal)}</span></div>
    <div class="price-row"><span class="text-muted">Payment</span><span class="font-bold">${esc(payLbl)}</span></div>
    <div class="section-title mt-4">Update Status</div>
    <select class="form-select mb-2" id="admStatus">
      ${Object.keys(ORDER_ST).map(k => `<option value="${k}" ${o.status===k?"selected":""}>${ORDER_ST[k].label}</option>`).join("")}
    </select>
    <button class="btn btn-primary btn-block" id="admUpdateStatus">Update Status</button>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`);
  $("#admUpdateStatus").onclick = async () => {
    const ns = $("#admStatus").value;
    if (ns === o.status) return toast("Unchanged", "info");
    if (ns === "successful"){
      openModal(`<div class="modal-title">Tracking URL</div>
        <div class="form-group"><input class="form-input" id="trackUrlInput" type="url" value="${esc(o.trackingUrl||"")}" placeholder="https://..."></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="adminOpenOrder('${o.id}')">Back</button>
          <button class="btn btn-success" id="trackConfirm">Mark Delivered</button>
        </div>`);
      $("#trackConfirm").onclick = async () => {
        const url = $("#trackUrlInput").value.trim();
        if (!url) return toast("URL required", "error");
        if (!validUrl(url)) return toast("Invalid URL", "error");
        try {
          await updateDoc(doc(db,"orders",o.id), {status:"successful", trackingUrl:url, deliveredAt: serverTimestamp(), updatedAt: serverTimestamp()});
          await addDoc(collection(db,"orders",o.id,"statusHistory"), {status:"successful", note:"Delivered", changedBy: S.user.uid, createdAt: serverTimestamp()});
          toast("Delivered!", "success"); closeModal();
        } catch(err){ toast(errMsg(err), "error"); }
      };
      return;
    }
    try {
      await updateDoc(doc(db,"orders",o.id), {status:ns, updatedAt: serverTimestamp()});
      await addDoc(collection(db,"orders",o.id,"statusHistory"), {status:ns, note:"", changedBy: S.user.uid, createdAt: serverTimestamp()});
      toast("Updated", "success"); closeModal();
    } catch(err){ toast(errMsg(err), "error"); }
  };
};

function renderAdminReviews(){
  $("#adminContent").innerHTML = `<div id="reviewsList"><div class="skeleton"></div></div>`;

    const list = snap.docs.map(d => ({id:d.id, ...d.data()})).sort(newest);

      <thead><tr><th>Order</th><th>Customer</th><th>Rating</th><th>Review</th><th>Date</th></tr></thead>
      <tbody>${list.map(r => `
        <tr>
          <td class="font-mono text-xs font-bold">#${esc(r.orderId||"")}</td>
          <td>${esc(r.customerName||"")}</td>
          <td><span style="color:var(--amber)">${[1,2,3,4,5].map(n => `<span style="${n<=r.rating?"":"opacity:.3"}">★</span>`).join("")}</span></td>
          <td class="text-xs">${esc(r.reviewText||"—")}</td>

        </tr>`).join("")}</tbody></table></div>`;

async function renderAdminCustomers(){
  $("#adminContent").innerHTML = `<div id="customersList"><div class="skeleton"></div></div>`;
  try {
    const snap = await getDocs(collection(db,"users"));
    const users = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(u => u.role !== "admin");
    const el = $("#customersList");
    if (!users.length){ el.innerHTML = `<div class="empty">No customers</div>`; return; }
    el.innerHTML = `<div class="table-wrap scroll"><table class="table">
      <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${users.map(u => {
        const s = u.status || "active";
        const si = ACCT_ST[s] || ACCT_ST.active;
        return `<tr>
          <td class="font-semibold">${esc(u.name||"")}<div class="text-xs text-soft">${esc(u.phone||"")}</div></td>
          <td>${esc(u.email||"")}</td>
          <td><span class="badge badge-${si.tone}">${si.label}</span></td>
          <td class="acts">
            ${s === "active" ? `
              <button class="btn btn-secondary btn-xs" onclick="adminSuspendUser('${u.id}')">Suspend</button>
              <button class="btn btn-danger btn-xs" onclick="adminBlockUser('${u.id}')">Block</button>
            ` : `
              <button class="btn btn-success btn-xs" onclick="adminUnblockUser('${u.id}')">Unblock</button>
            `}
          </td>
        </tr>`;
      }).join("")}</tbody></table></div>`;
  } catch(err){ $("#customersList").innerHTML = `<div class="empty">Failed</div>`; }
}

window.adminBlockUser = (userId) => {
  openModal(`<div class="modal-title">Block User</div>
    <div class="form-group"><label class="form-label">Reason</label><textarea class="form-textarea" id="blockReason"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="blockConfirm">Block</button>
    </div>`);
  $("#blockConfirm").onclick = async () => {
    const r = $("#blockReason").value.trim();
    if (!r) return toast("Reason required", "error");
    try {
      await updateDoc(doc(db,"users",userId), {status:"blocked", blockReason:r, blockedAt: serverTimestamp(), blockedBy: S.user.uid});
      toast("Blocked", "success"); closeModal(); renderAdminCustomers();
    } catch(err){ toast(errMsg(err), "error"); }
  };
};

window.adminSuspendUser = (userId) => {
  openModal(`<div class="modal-title">Suspend User</div>
    <div class="form-group"><label class="form-label">Duration</label>
      <select class="form-select" id="suspendDuration">
        <option value="1">1 hour</option><option value="6">6 hours</option>
        <option value="24" selected>24 hours</option><option value="72">3 days</option>
        <option value="168">7 days</option>
      </select></div>
    <div class="form-group"><label class="form-label">Reason</label><textarea class="form-textarea" id="suspendReason"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="suspendConfirm">Suspend</button>
    </div>`);
  $("#suspendConfirm").onclick = async () => {
    const r = $("#suspendReason").value.trim();
    const h = parseInt($("#suspendDuration").value, 10);
    if (!r) return toast("Reason required", "error");
    const until = new Date(Date.now() + h * 60 * 60 * 1000);
    try {
      await updateDoc(doc(db,"users",userId), {status:"suspended", blockReason:r, suspendedUntil:until, suspendedAt: serverTimestamp(), suspendedBy: S.user.uid});
      toast("Suspended", "success"); closeModal(); renderAdminCustomers();
    } catch(err){ toast(errMsg(err), "error"); }
  };
};

window.adminUnblockUser = (userId) => {
  confirmDialog("Unblock user?", async () => {
    try {
      await updateDoc(doc(db,"users",userId), {status:"active", blockReason:"", suspendedUntil:null, unblockedAt: serverTimestamp(), unblockedBy: S.user.uid});
      toast("Unblocked", "success"); renderAdminCustomers();
    } catch(err){ toast(errMsg(err), "error"); }
  });
};
