<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Pawan Retail Limited — A Priya Electricals Venture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef2f9;--bg-gradient:linear-gradient(180deg,#eef2f9 0%,#e4ebf7 100%);
  --surface:#fff;--glass:rgba(255,255,255,.72);--glass-strong:rgba(255,255,255,.88);--glass-border:rgba(255,255,255,.6);
  --surface-3:#f1f5f9;--border:#e2e8f0;--border-strong:#cbd5e1;
  --text:#0f172a;--text-2:#475569;--text-3:#94a3b8;
  --brand:#4f46e5;--brand-dark:#4338ca;--brand-light:#6366f1;--brand-soft:#eef2ff;
  --brand-gradient:linear-gradient(135deg,#4f46e5 0%,#06b6d4 100%);
  --accent:#06b6d4;--accent-soft:#cffafe;--amber:#f59e0b;
  --success:#059669;--success-soft:#ecfdf5;--warning:#d97706;--warning-soft:#fffbeb;
  --danger:#dc2626;--danger-soft:#fef2f2;
  --r-sm:8px;--r:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;--r-2xl:32px;
  --sh-xs:0 1px 2px rgba(15,23,42,.04);--sh-sm:0 2px 8px rgba(15,23,42,.06);
  --sh-md:0 12px 32px rgba(15,23,42,.10);--sh-lg:0 20px 48px rgba(15,23,42,.14);
  --sh-brand:0 12px 32px rgba(79,70,229,.30);--sh-inset:inset 0 1px 0 rgba(255,255,255,.7);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --font-display:'Outfit',sans-serif;--font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
html,body{font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg-gradient);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#4f46e5,#06b6d4,#ec4899,#f59e0b,#4f46e5);background-size:200% 100%;animation:gradientShift 6s linear infinite;z-index:1000;pointer-events:none}
@keyframes gradientShift{to{background-position:200% 0}}
a{color:var(--brand);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1)}
input,textarea,select{font:inherit;color:inherit}
img{max-width:100%;display:block}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.shell{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:calc(90px + var(--safe-bottom));position:relative}
.appbar{position:sticky;top:4px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--glass-border);box-shadow:0 4px 24px rgba(15,23,42,.06)}
.appbar-title{font-size:15px;font-weight:700;color:var(--text);font-family:var(--font-display)}
.appbar-back{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r);margin-left:-8px;color:var(--text-2);background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--sh-xs)}
.appbar-back:hover{background:var(--brand-soft);color:var(--brand)}
.appbar-actions{display:flex;align-items:center;gap:8px}
.iconbtn{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:var(--r);color:var(--text-2);background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--sh-xs)}
.iconbtn:hover{background:var(--brand-soft);color:var(--brand)}
.iconbtn svg{width:20px;height:20px}
.badge-dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;background:var(--brand-gradient);color:#fff;font-size:10px;font-weight:800;border-radius:999px;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.badge-dot.show{display:flex}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;font-family:var(--font-display);color:var(--text)}
.brand-mark{width:42px;height:42px;background:var(--brand-gradient);color:#fff;display:grid;place-items:center;border-radius:12px;font-size:20px;font-weight:800;font-family:var(--font-display);box-shadow:var(--sh-brand)}
.page{padding:16px}
.section-title{font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:12px;font-family:var(--font-display);display:flex;align-items:center;gap:8px;letter-spacing:.02em;text-transform:uppercase}
.section-title::before{content:'';width:3px;height:16px;background:var(--brand-gradient);border-radius:2px}
.section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.section-header h2{font-size:20px;font-weight:800;font-family:var(--font-display);color:var(--text)}
.card{background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-sm),var(--sh-inset)}
.card+.card{margin-top:14px}
.card-flat{padding:0;overflow:hidden}
.card-elevated{box-shadow:var(--sh-md),var(--sh-inset)}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .2s}
.card-row:last-child{border-bottom:0}
.card-row:hover{background:var(--brand-soft);padding-left:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;font-size:13px;font-weight:700;border-radius:var(--r);border:1px solid transparent;white-space:nowrap;transition:all .25s;font-family:var(--font-display)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand-gradient);color:#fff;box-shadow:var(--sh-brand)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px)}
.btn-secondary{background:var(--glass-strong);color:var(--text);border-color:var(--border-strong);box-shadow:var(--sh-xs)}
.btn-secondary:hover:not(:disabled){background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.btn-danger{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff}
.btn-success{background:linear-gradient(135deg,#059669,#047857);color:#fff}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px}
.btn-xs{padding:6px 11px;font-size:11px;border-radius:8px}
.btn-lg{padding:16px 28px;font-size:15px;border-radius:var(--r-md);font-weight:800}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px}
.form-input,.form-textarea,.form-select{width:100%;padding:14px 16px;background:var(--glass-strong);border:1.5px solid var(--border);border-radius:var(--r);font-size:14px;color:var(--text);transition:all .2s}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.12);background:#fff}
.form-textarea{min-height:92px;resize:vertical}
.input-wrap{position:relative}
.input-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);padding:6px 10px;font-size:11px;font-weight:800;color:var(--brand);border-radius:8px;background:var(--brand-soft);text-transform:uppercase}
.checkbox-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);cursor:pointer}
.checkbox-row input{accent-color:var(--brand);width:18px;height:18px}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--glass-border);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 0 calc(10px + var(--safe-bottom));z-index:30;box-shadow:0 -12px 40px rgba(15,23,42,.08)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px;color:var(--text-3);font-size:10px;font-weight:700;cursor:pointer;position:relative;transition:all .25s}
.bnav-item svg{width:24px;height:24px}
.bnav-item.active{color:var(--brand)}
.bnav-item.active::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:36px;height:3px;background:var(--brand-gradient);border-radius:2px}
.bnav-badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;background:var(--brand-gradient);color:#fff;font-size:9px;font-weight:800;border-radius:999px;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.bnav-badge.show{display:flex}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;font-size:11px;font-weight:700;border-radius:999px}
.badge-neutral{background:var(--surface-3);color:var(--text-2)}
.badge-info{background:var(--brand-soft);color:var(--brand-dark)}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px 16px;position:relative;overflow:hidden;background:linear-gradient(135deg,#4f46e5 0%,#06b6d4 100%)}
.auth-shell::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(236,72,153,.4) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(6,182,212,.5) 0%,transparent 50%);pointer-events:none}
.auth-box{width:100%;max-width:440px;position:relative;z-index:2;animation:fadeInUp .7s cubic-bezier(.16,1,.3,1)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.auth-logo-wrap{text-align:center;margin-bottom:20px}
.auth-logo{width:80px;height:80px;margin:0 auto 14px;background:linear-gradient(135deg,#fff,#e0e7ff);border-radius:24px;display:grid;place-items:center;font-size:38px;font-weight:900;color:var(--brand);font-family:var(--font-display);box-shadow:0 24px 60px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.9)}
.auth-brand{font-family:var(--font-display);font-size:24px;font-weight:900;color:#fff;letter-spacing:-.02em;text-shadow:0 4px 20px rgba(0,0,0,.3);margin-bottom:4px}
.auth-tagline{font-size:12px;color:rgba(255,255,255,.95);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.auth-parent{font-size:11px;color:rgba(255,255,255,.75);margin-top:6px;letter-spacing:.05em}
.auth-card{background:rgba(255,255,255,.96);backdrop-filter:blur(32px) saturate(180%);border:1px solid rgba(255,255,255,.6);border-radius:var(--r-2xl);padding:32px 28px;box-shadow:0 40px 100px rgba(0,0,0,.35);position:relative;overflow:hidden}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--brand-gradient)}
.auth-card h1{font-size:26px;font-weight:800;font-family:var(--font-display);color:var(--text);text-align:center;margin-bottom:6px}
.auth-sub{font-size:13.5px;color:var(--text-2);margin-bottom:26px;text-align:center}
.auth-foot{text-align:center;margin-top:18px;font-size:13px;color:var(--text-2)}
.hero-banner{position:relative;border-radius:var(--r-xl);overflow:hidden;margin-bottom:20px;height:220px;box-shadow:var(--sh-lg);background:var(--brand-gradient)}
.hero-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(79,70,229,.92) 0%,rgba(6,182,212,.75) 50%,rgba(236,72,153,.55) 100%);z-index:2}
.hero-banner::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.3) 0%,transparent 50%);z-index:2}
.hero-banner .hero-content{position:relative;z-index:3;padding:26px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.hero-banner .hero-tag{display:inline-block;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;align-self:flex-start}
.hero-banner .hero-title{font-family:var(--font-display);font-size:26px;font-weight:900;line-height:1.15;letter-spacing:-.03em;margin-bottom:8px;text-shadow:0 4px 20px rgba(0,0,0,.3)}
.hero-banner .hero-sub{font-size:13px;opacity:.95;line-height:1.5;max-width:85%;margin-bottom:16px}
.hero-banner .hero-cta{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--brand);padding:11px 20px;border-radius:12px;font-size:13px;font-weight:800;font-family:var(--font-display);box-shadow:0 12px 32px rgba(0,0,0,.25);align-self:flex-start;transition:all .25s;border:0;cursor:pointer}
.hero-banner .hero-cta:hover{transform:translateY(-2px)}
.chip-row{display:flex;gap:10px;overflow-x:auto;padding:4px 18px 14px;margin:0 -18px}
.chip-row::-webkit-scrollbar{display:none}
.chip{padding:10px 17px;font-size:12.5px;font-weight:700;background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:999px;white-space:nowrap;cursor:pointer;color:var(--text-2);transition:all .25s;box-shadow:var(--sh-xs);font-family:var(--font-display)}
.chip:hover{transform:translateY(-2px);color:var(--brand);border-color:var(--brand)}
.chip.active{background:var(--brand-gradient);color:#fff;border-color:transparent;box-shadow:var(--sh-brand)}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.product{background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;position:relative;cursor:pointer;transition:all .3s;box-shadow:var(--sh-xs)}
.product:hover{transform:translateY(-6px);box-shadow:var(--sh-lg);border-color:var(--brand-light)}
.product.closed{opacity:.55}
.product-img{aspect-ratio:1/1;width:100%;object-fit:cover;background:var(--surface-3)}
.product-body{padding:14px;display:flex;flex-direction:column;flex:1;gap:6px}
.product-cat{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--brand)}
.product-name{font-size:14px;font-weight:700;line-height:1.3;font-family:var(--font-display)}
.product-desc{font-size:12px;color:var(--text-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-price{font-size:17px;font-weight:800;color:var(--brand);margin-top:6px;font-family:var(--font-display)}
.product-cta{margin-top:10px}
.closed-overlay{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;font-size:10px;font-weight:800;padding:5px 10px;border-radius:8px;letter-spacing:.06em;text-transform:uppercase;z-index:2}
.link-card{background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-xs);transition:all .3s;cursor:pointer;position:relative}
.link-card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--brand-light)}
.link-card-img{width:100%;height:170px;object-fit:cover;background:linear-gradient(135deg,#4f46e5,#06b6d4)}
.link-card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.link-card-tag{display:inline-block;background:var(--brand-soft);color:var(--brand);padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;align-self:flex-start}
.link-card-title{font-size:15px;font-weight:800;font-family:var(--font-display);line-height:1.3}
.link-card-desc{font-size:12px;color:var(--text-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.link-card-price{font-size:19px;font-weight:900;color:var(--brand);font-family:var(--font-display)}
.link-card-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.link-save-btn{width:42px;height:42px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-3);flex-shrink:0}
.link-save-btn.saved{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.link-save-btn:hover{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.deals-grid{display:grid;grid-template-columns:1fr;gap:14px}
.saved-link-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:10px;cursor:pointer}
.saved-link-row:hover{border-color:var(--brand)}
.saved-link-row img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surface-3);flex-shrink:0}
.saved-link-info{flex:1;min-width:0}
.saved-link-info .t{font-size:13px;font-weight:700;font-family:var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-link-info .p{font-size:12px;color:var(--brand);font-weight:700;margin-top:2px}
.saved-link-info .u{font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.empty{text-align:center;padding:60px 20px;color:var(--text-3);font-size:13.5px}
.skeleton{background:linear-gradient(90deg,#eef2f9 25%,#e2e8f0 37%,#eef2f9 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--r);height:60px;margin-bottom:10px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rotate .7s linear infinite;display:inline-block}
@keyframes rotate{to{transform:rotate(360deg)}}
.toast-root{position:fixed;top:calc(76px + var(--safe-top));left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 32px);width:100%}
.toast{padding:14px 22px;background:rgba(15,23,42,.95);backdrop-filter:blur(20px);color:#fff;border-radius:14px;font-size:13.5px;font-weight:700;animation:toastIn .35s;max-width:100%;text-align:center;box-shadow:0 20px 48px rgba(0,0,0,.3)}
.toast.success{background:linear-gradient(135deg,#059669,#047857)}
.toast.error{background:linear-gradient(135deg,#dc2626,#991b1b)}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;z-index:500;overflow:auto}
.modal{background:var(--surface);border-radius:var(--r-xl);padding:26px;width:100%;max-width:480px;max-height:90vh;overflow:auto;box-shadow:0 32px 80px rgba(15,23,42,.4)}
.modal-title{font-size:19px;font-weight:800;margin-bottom:20px;font-family:var(--font-display);color:var(--text)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.admin-layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.admin-side{background:linear-gradient(180deg,#0f172a 0%,#1e1b4b 50%,#312e81 100%);color:#cbd5e1;padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side-brand{display:flex;align-items:center;gap:12px;color:#fff;font-size:17px;font-weight:800;padding:8px 10px;margin-bottom:28px;font-family:var(--font-display)}
.admin-side-brand .brand-mark{width:36px;height:36px;font-size:17px}
.admin-nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:13.5px;font-weight:600;color:#94a3b8;border-radius:12px;margin-bottom:4px;cursor:pointer;transition:all .2s}
.admin-nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.admin-nav a.active{background:var(--brand-gradient);color:#fff;box-shadow:var(--sh-brand)}
.admin-main{padding:28px;min-height:100vh;background:var(--bg)}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.admin-header h1{font-size:26px;font-weight:800;font-family:var(--font-display);color:var(--text)}
.admin-user{font-size:12px;color:var(--text-3);padding:6px 14px;background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:999px;font-weight:600}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stat{background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);position:relative;overflow:hidden}

<body>

<div id="root">
  <div style="min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#4f46e5 0%,#06b6d4 100%);color:#fff;font-family:sans-serif">
    <div style="text-align:center;padding:24px">
      <div style="font-size:56px;margin-bottom:16px">⏳</div>
      <div style="font-size:18px;font-weight:700">Loading Pawan Retail…</div>
    </div>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast-root" id="toast-root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  sendPasswordResetEmail, signOut, onAuthStateChanged,
  setPersistence, browserLocalPersistence, browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc,
  collection, query, where, getDocs, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAZy_JeQH7Ofvqru2DME1EsH59Yh5JtRjs",
  authDomain: "pawan-retail-limited07.firebaseapp.com",
  projectId: "pawan-retail-limited07",
  storageBucket: "pawan-retail-limited07.firebasestorage.app",
  messagingSenderId: "595261097611",
  appId: "1:595261097611:web:88a136d144129b142b368e"
};

const fb = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(fb);
const db = getFirestore(fb);

const PLACEHOLDER_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23f1f5f9'/><text x='100' y='105' text-anchor='middle' font-family='sans-serif' font-size='14' fill='%2394a3b8'>No image</text></svg>";
const CART_STORAGE_KEY = "prl_cart_v12";

const S = {
  user: null, profile: null,
  cart: { companyId: null, companyName: null, items: [] },
  appliedCoupon: null,
  isFirstOrder: false,
  currentCategory: "all", searchQuery: "",
  customerSubs: new Set(), adminSubs: new Set(),
  cached: { banners: [], companies: [], orders: [], coupons: [], links: [], savedLinks: [] },
  blockTimerInterval: null,
  currentProduct: null,
  currentCompany: null,
  productQty: 1,
  pendingUserDocId: null,
  activeComplaintId: null,
  activeChatUnsub: null,
  currentLink: null,
  savedLinkIds: new Set()
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const escapeHtml = (s = "") => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const fmtINR = n => (n == null || isNaN(n)) ? "—" : "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const fmtDate = (ts, withTime = false) => {
  if (!ts) return "—";
  try {
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    if (isNaN(d.getTime())) return "—";
    return withTime
      ? d.toLocaleString("en-IN", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" })
      : d.toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
  } catch { return "—"; }
};
const fmtTime = ts => {
  if (!ts) return "";
  try { const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleTimeString("en-IN", { hour:"2-digit", minute:"2-digit" }); }
  catch { return ""; }
};
const millis = ts => ts?.toMillis?.() || 0;
const byNewest = (a,b) => millis(b.createdAt) - millis(a.createdAt);
const isValidUrl = u => /^https?:\/\//i.test(u || "");

function saveCart() { try { localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(S.cart)); } catch(_){} }
function loadCart() {
  try {
    const raw = localStorage.getItem(CART_STORAGE_KEY);
    if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.items)) S.cart = { companyId:null, companyName:null, items:[], ...p }; }
  } catch(_){}
}
function clearCart() { S.cart = { companyId:null, companyName:null, items:[] }; S.appliedCoupon = null; try { localStorage.removeItem(CART_STORAGE_KEY); } catch(_){} }

function genOrderId() {
  const d = new Date();
  const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let rnd = "";
  for (let i = 0; i < 8; i++) rnd += chars[Math.floor(Math.random()*chars.length)];
  return `PRL-${ymd}-${rnd}`;
}

function isCompanyOpen(c) {
  if (!c) return true;
  if (c.autoOpenClose !== true) return true;
  if (!c.openTime || !c.closeTime) return true;
  const now = new Date();
  const cur = now.getHours()*60 + now.getMinutes();
  const [oh,om] = c.openTime.split(":").map(Number);
  const [ch,cm] = c.closeTime.split(":").map(Number);
  const open = oh*60+om, close = ch*60+cm;
  if (open === close) return true;
  if (open < close) return cur >= open && cur < close;
  return cur >= open || cur < close;
}
const hoursText = c => (!c?.openTime || !c?.closeTime) ? "" : `${c.openTime} – ${c.closeTime}`;

function showScreen(id) {
  if (id !== "scrChat" && S.activeChatUnsub) {
    try { S.activeChatUnsub(); } catch(_){}
    S.activeChatUnsub = null;
  }
  $$(".screen").forEach(el => el.classList.remove("active"));
  const el = document.getElementById(id);
  if (el) el.classList.add("active");
  window.scrollTo(0,0);
}

function toast(msg, type = "") {
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  $("#toast-root").appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .3s, transform .3s";
    el.style.opacity = "0";
    el.style.transform = "translateY(-16px) scale(.9)";
    setTimeout(() => el.remove(), 300);
  }, 3500);
}

function errorMsg(err) {
  const map = {
    "auth/invalid-email":"Please enter a valid email address.",
    "auth/user-not-found":"No account found with this email.",
    "auth/wrong-password":"Incorrect password.",
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/email-already-in-use":"This email is already registered.",
    "auth/weak-password":"Password must be at least 6 characters.",
    "auth/too-many-requests":"Too many attempts. Try again later.",
    "auth/network-request-failed":"Network error. Check your connection.",
    "permission-denied":"You don't have permission for this action.",
    "unavailable":"Service temporarily unavailable.",
    "not-found":"Data not found."
  };
  return map[err?.code] || err?.message || "Something went wrong.";
}

function getStatusMessage() {
  if (!S.profile) return { blocked:true, title:"Not signed in", message:"Please sign in." };
  const status = S.profile.status || "active";
  if (status === "blocked") return { blocked:true, type:"blocked", title:"Account Blocked", message:"Your account has been blocked.", reason: S.profile.blockReason || "Not specified" };
  if (status === "suspended") {
    const until = S.profile.suspendedUntil?.toMillis?.() || 0;
    if (until > Date.now()) return { blocked:true, type:"suspended", title:"Account Suspended", message:"Temporarily suspended.", reason: S.profile.blockReason || "Not specified", until };
  }
  return { blocked:false };
}

function formatCountdown(ms) {
  if (ms <= 0) return "00:00:00";
  const total = Math.floor(ms/1000);
  const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function renderBlockedBanner() {
  const info = getStatusMessage();
  if (!info.blocked) return "";
  if (info.type === "blocked") {
    return `<div class="blocked-banner"><div class="icon">🚫</div><h2>${escapeHtml(info.title)}</h2>
      <p>${escapeHtml(info.message)}</p>
      <div class="blocked-reason"><div class="lbl">Reason</div><div class="txt">${escapeHtml(info.reason)}</div></div></div>`;
  }
  if (info.type === "suspended") {
    return `<div class="blocked-banner"><div class="icon">⏸️</div><h2>${escapeHtml(info.title)}</h2>
      <p>${escapeHtml(info.message)}</p>
      <div class="blocked-reason"><div class="lbl">Reason</div><div class="txt">${escapeHtml(info.reason)}</div></div>
      <div style="background:rgba(0,0,0,.32);border-radius:14px;padding:20px;margin-top:18px;display:inline-block;min-width:240px">
        <div style="font-size:11px;text-transform:uppercase;opacity:.8;margin-bottom:10px;font-weight:800">Time Remaining</div>
        <div style="font-family:ui-monospace,monospace;font-size:28px;font-weight:800" id="blockedTimer">--:--:--</div>
      </div></div>`;
  }
  return "";
}

function startBlockTimer() {
  if (S.blockTimerInterval) { clearInterval(S.blockTimerInterval); S.blockTimerInterval = null; }
  const info = getStatusMessage();
  if (!info.blocked || info.type !== "suspended" || !info.until) return;
  const tick = () => {
    const el = $("#blockedTimer");
    if (!el) { clearInterval(S.blockTimerInterval); S.blockTimerInterval = null; return; }
    const remaining = info.until - Date.now();
    if (remaining <= 0) { clearInterval(S.blockTimerInterval); S.blockTimerInterval = null; refreshProfile(); return; }
    el.textContent = formatCountdown(remaining);
  };
  tick();
  S.blockTimerInterval = setInterval(tick, 1000);
}

async function refreshProfile() {
  try {
    const snap = await getDoc(doc(db,"users",S.user.uid));
    if (snap.exists()) {
      S.profile = { uid: S.user.uid, ...snap.data() };
      const activeScreen = $(".screen.active")?.id;
      if (activeScreen === "scrHome") renderHome();
      if (activeScreen === "scrCheckout") renderCheckout();
      if (activeScreen === "scrCart") renderCart();
      if (activeScreen === "scrCompanies") renderBrowse();
      if (activeScreen === "scrOrders") renderOrders();
      if (activeScreen === "scrSavedLinks") renderSavedLinks();
      if (activeScreen === "scrDeals") renderDeals();
    }
  } catch(e) { console.warn(e); }
}

function calcCouponDiscount(c, subtotal) {
  if (!c) return 0;
  let d = 0;
  if (c.discountType === "percent") {
    d = subtotal * (c.discountValue / 100);
    if (c.maxDiscount) d = Math.min(d, c.maxDiscount);
  } else d = c.discountValue;
  return Math.min(d, subtotal);
}

async function validateCoupon(code, subtotal) {
  if (!code) return { valid:false, error:"Enter a code" };
  try {
    const snap = await getDocs(query(collection(db,"coupons"), where("code","==",code.toUpperCase().trim())));
    if (snap.empty) return { valid:false, error:"Invalid code" };
    const c = { id: snap.docs[0].id, ...snap.docs[0].data() };
    if (!c.isActive) return { valid:false, error:"Coupon inactive" };
    if (subtotal < (c.minOrder || 0)) return { valid:false, error:`Min ₹${c.minOrder} required` };
    return { valid:true, coupon:c, discount: calcCouponDiscount(c, subtotal) };
  } catch(e) { return { valid:false, error:"Failed to check" }; }
}

async function checkFirstOrder() {
  try {
    const snap = await getDocs(query(collection(db,"orders"), where("customerId","==",S.user.uid)));
    S.isFirstOrder = snap.empty;
  } catch(e) { S.isFirstOrder = false; }
}

function openModal(html) {
  $("#modal-root").innerHTML = `<div class="modal-backdrop"><div class="modal">${html}</div></div>`;
  const bd = $(".modal-backdrop");
  bd.onclick = e => { if (e.target === bd) closeModal(); };
}
function closeModal() { $("#modal-root").innerHTML = ""; }
window.closeModal = closeModal;

function confirmDialog(message, onConfirm) {
  openModal(`<div class="modal-title">Confirm</div>
    <p class="text-sm text-muted">${escapeHtml(message)}</p>
    <div class="modal-actions">

    <div id="scrReview" class="screen">${screenReview()}</div>
    <div id="scrAdmin" class="screen">${screenAdmin()}</div>
  `;

  document.querySelectorAll("[data-toggle]").forEach(b => {
    b.onclick = () => {
      const inp = document.getElementById(b.dataset.toggle);
      if (!inp) return;
      inp.type = inp.type === "password" ? "text" : "password";
      b.textContent = inp.type === "password" ? "Show" : "Hide";
    };
  });

  const safe = (sel, fn) => { const el = document.querySelector(sel); if (el) fn(el); };
  safe("#linkRegister", el => el.onclick = e => { e.preventDefault(); showScreen("scrRegister"); });
  safe("#linkLogin", el => el.onclick = e => { e.preventDefault(); showScreen("scrLogin"); });
  safe("#linkForgot", el => el.onclick = e => { e.preventDefault(); showScreen("scrForgot"); });
  safe("#linkBackLogin", el => el.onclick = e => { e.preventDefault(); showScreen("scrLogin"); });
  safe("#linkBackToLogin", el => el.onclick = e => {
    e.preventDefault();
    document.getElementById("loginStep1").classList.remove("hidden");
    document.getElementById("loginStep2").classList.add("hidden");
    document.getElementById("cpPass").value = ""; document.getElementById("cpPass2").value = "";
    S.pendingUserDocId = null;
  });

  safe("#loginForm", el => el.addEventListener("submit", handleLogin));
  safe("#registerForm", el => el.addEventListener("submit", handleRegister));
  safe("#forgotForm", el => el.addEventListener("submit", handleForgot));
  safe("#cpCreateBtn", el => el.onclick = handleCreatePassword);

  safe("#btnSaved", el => el.onclick = () => { showScreen("scrSavedLinks"); renderSavedLinks(); });
  safe("#btnSearchToggle", el => el.onclick = () => {
    const inp = document.querySelector("#searchInput");
    if (!inp) return;
    inp.classList.toggle("hidden");
    if (!inp.classList.contains("hidden")) inp.focus();
  });
  safe("#searchInput", el => el.addEventListener("input", e => {
    S.searchQuery = e.target.value.toLowerCase();
    paintBrowseCompanies();
  }));

  safe("#dealsSavedBtn", el => el.onclick = () => { showScreen("scrSavedLinks"); renderSavedLinks(); });
  safe("#companyBack", el => el.onclick = () => goTo("products"));
  safe("#linkDetailBack", el => el.onclick = () => goTo("deals"));
  safe("#productBack", el => el.onclick = () => {
    if (S.currentCompany?.id) openCompany(S.currentCompany.id);
    else goTo("products");
  });
  safe("#checkoutBack", el => el.onclick = () => goTo("cart"));
  safe("#orderDetailBack", el => el.onclick = () => { showScreen("scrOrders"); renderOrders(); });
  safe("#reviewBack", el => el.onclick = () => { showScreen("scrOrders"); renderOrders(); });
  safe("#chatBack", el => el.onclick = () => {
    if (S.profile?.role === "admin") { showScreen("scrAdmin"); renderAdmin(); }
    else { showScreen("scrOrders"); renderOrders(); }
  });

  document.addEventListener("click", e => {
    const item = e.target.closest(".bnav-item[data-nav]");
    if (item) { e.preventDefault(); goTo(item.dataset.nav); }
  });
}

function goTo(route) {
  if (route === "home")     { showScreen("scrHome"); renderHome(); }
  if (route === "products") { showScreen("scrCompanies"); renderBrowse(); }
  if (route === "deals")    { showScreen("scrDeals"); renderDeals(); }
  if (route === "cart")     { showScreen("scrCart"); renderCart(); }
  if (route === "orders")   { showScreen("scrOrders"); renderOrders(); }
  if (route === "account")  { showScreen("scrAccount"); renderAccount(); }
  $$(".bnav-item").forEach(el => el.classList.toggle("active", el.dataset.nav === route));
  updateCartBadge();
}
window.goTo = goTo;

function updateCartBadge() {
  const count = S.cart.items.reduce((sum, i) => sum + i.quantity, 0);
  $$("[data-cart-badge]").forEach(el => {
    if (count > 0) { el.textContent = count; el.classList.add("show"); }
    else el.classList.remove("show");
  });
  const pBadge = $("#productCartBadge");
  if (pBadge) {
    if (count > 0) { pBadge.textContent = count; pBadge.classList.add("show"); }
    else pBadge.classList.remove("show");
  }
}

/* ============ AUTH HANDLERS ============ */
async function handleLogin(e) {
  e.preventDefault();
  const email = $("#loginEmail").value.trim();
  const pass = $("#loginPassword").value;
  const remember = $("#loginRemember").checked;
  if (!email || !pass) return toast("Fill all fields", "error");
  const btn = $("#loginSubmit");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Checking';
  try {
    const userSnap = await getDocs(query(collection(db,"users"), where("email","==",email.toLowerCase())));
    const pendingDoc = userSnap.docs.find(d => d.data().status === "pending_password");
    if (pendingDoc) {
      S.pendingUserDocId = pendingDoc.id;
      const userData = pendingDoc.data();
      $("#cpEmail").value = email;
      $("#welcomeMsg").textContent = `👋 Hi ${userData.name || ""}! Please create your password to continue.`;
      document.getElementById("loginStep1").classList.add("hidden");
      document.getElementById("loginStep2").classList.remove("hidden");
      toast("Welcome! Please create your password.", "info");
      btn.disabled = false; btn.textContent = "Sign in →";
      return;
    }
    btn.innerHTML = '<span class="spin"></span> Signing in';
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(err) {
    toast(errorMsg(err), "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in →";
  }
}

async function handleCreatePassword() {
  const pass = $("#cpPass").value;
  const pass2 = $("#cpPass2").value;
  if (!pass || !pass2) return toast("Fill both fields", "error");
  if (pass.length < 6) return toast("Password must be 6+ characters", "error");
  if (pass !== pass2) return toast("Passwords don't match", "error");
  const email = $("#cpEmail").value.trim().toLowerCase();
  const btn = $("#cpCreateBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Creating';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid = cred.user.uid;
    const oldSnap = await getDoc(doc(db,"users",S.pendingUserDocId));
    const oldData = oldSnap.exists() ? oldSnap.data() : {};
    await setDoc(doc(db,"users",uid), {
      name: oldData.name || "", email,
      phone: oldData.phone || "", address: oldData.address || "",
      role: "customer", status: "active",
      blockReason: "", suspendedUntil: null,
      createdBy: oldData.createdBy || "admin",
      passwordCreatedAt: serverTimestamp(),
      createdAt: oldData.createdAt || serverTimestamp()
    });
    try { await deleteDoc(doc(db,"users",S.pendingUserDocId)); } catch(_){}
    toast("✅ Password created! Welcome aboard.", "success");
  } catch(err) {
    console.error(err);
    toast(errorMsg(err), "error");
  } finally {
    btn.disabled = false; btn.textContent = "Create Password →";
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const name = $("#regName").value.trim();
  const phone = $("#regPhone").value.trim();
  const email = $("#regEmail").value.trim();
  const pass = $("#regPassword").value;
  const pass2 = $("#regPassword2").value;
  const address = $("#regAddress").value.trim();
  if (!name || !email || !pass || !address) return toast("Fill all fields", "error");
  if (!/^[0-9]{10}$/.test(phone)) return toast("Enter valid 10-digit", "error");
  if (pass.length < 6) return toast("Password 6+ chars", "error");
  if (pass !== pass2) return toast("Passwords don't match", "error");
  const btn = $("#regSubmit");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Creating';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db,"users",cred.user.uid), {
      name, email, phone, address,
      role: "customer", status: "active",
      blockReason: "", suspendedUntil: null,
      createdBy: "self",
      createdAt: serverTimestamp()
    });
    toast("Account created!", "success");
  } catch(err) {
    toast(errorMsg(err), "error");
  } finally {
    btn.disabled = false; btn.textContent = "Create account →";
  }
}

async function handleForgot(e) {
  e.preventDefault();
  const email = $("#forgotEmail").value.trim();
  if (!email) return toast("Enter your email", "error");
  const btn = $("#forgotSubmit");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Sending';
  try {
    await sendPasswordResetEmail(auth, email);
    toast("Reset link sent", "success");
    showScreen("scrLogin");
  } catch(err) {
    toast(errorMsg(err), "error");
  } finally {
    btn.disabled = false; btn.textContent = "Send link →";
  }
}

async function logout() {
  try { await signOut(auth); } catch(_){}
  S.customerSubs.forEach(u => { try { u(); } catch(_){} });
  S.adminSubs.forEach(u => { try { u(); } catch(_){} });
  if (S.activeChatUnsub) { try { S.activeChatUnsub(); } catch(_){} S.activeChatUnsub = null; }
  S.customerSubs.clear(); S.adminSubs.clear();
  if (S.blockTimerInterval) { clearInterval(S.blockTimerInterval); S.blockTimerInterval = null; }
  S.user = null; S.profile = null; S.pendingUserDocId = null;
  S.savedLinkIds = new Set();
  clearCart();
  const step1 = document.getElementById("loginStep1");
  const step2 = document.getElementById("loginStep2");
  if (step1) step1.classList.remove("hidden");
  if (step2) step2.classList.add("hidden");
}
window.logout = logout;

async function onAuthChanged(user) {
  if (!user) { S.user = null; S.profile = null; showScreen("scrLogin"); return; }
  S.user = user;
  try {
    const snap = await getDoc(doc(db,"users",user.uid));
    if (!snap.exists()) { await signOut(auth); return; }
    S.profile = { uid: user.uid, ...snap.data() };
    if (S.profile.role === "admin") bootAdmin();
    else { loadCart(); bootCustomer(); }
  } catch(err) { console.error(err); toast(errorMsg(err), "error"); await signOut(auth); }
}

function bootCustomer() {
  goTo("home");
  watchCustomerOrders();
  watchSavedLinks();
  checkFirstOrder();
  updateCartBadge();
}

function watchCustomerOrders() {
  const q = query(collection(db,"orders"), where("customerId","==",S.user.uid));
  const unsub = onSnapshot(q, snap => {
    S.cached.orders = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
    if ($("#ordersList")) paintOrders();
  }, err => console.warn("Orders:", err?.code));
  S.customerSubs.add(unsub);
}

function watchSavedLinks() {
  const unsub = onSnapshot(collection(db,"savedLinks",S.user.uid,"items"), snap => {
    S.savedLinkIds = new Set(snap.docs.map(d => d.id));
    S.cached.savedLinks = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
    if ($("#savedLinksBody")) renderSavedLinks();
    if ($("#dealsList")) paintDeals();
  }, err => console.warn("SavedLinks:", err?.code));
  S.customerSubs.add(unsub);
}

/* ============ HOME ============ */
async function renderHome() {
  if (!S.profile) return;
  const statusSlot = $("#statusBannerSlot");
  if (statusSlot) { statusSlot.innerHTML = renderBlockedBanner(); startBlockTimer(); }
  try {
    const snap = await getDocs(query(collection(db,"companies"), where("isActive","==",true)));
    const companies = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
    S.cached.companies = companies;
    const grid = $("#homeCompanies");
    if (!grid) return;
    if (!companies.length) grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No companies yet</div>`;
    else grid.innerHTML = companies.slice(0, 6).map(companyCard).join("");
  } catch(e) { console.warn("Home:", e); }
  await loadHomeDeals();
}

async function loadHomeDeals() {
  const el = $("#homeDeals");
  if (!el) return;
  try {
    const snap = await getDocs(collection(db,"links"));
    let links = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    links.sort(byNewest);
    links = links.filter(l => l.isFeatured === true).slice(0, 4);
    if (!links.length) {
      // Fallback: just take first 4
      links = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest).slice(0, 4);
    }
    if (!links.length) { el.innerHTML = `<div class="empty" style="grid-column:1/-1">No deals yet</div>`; return; }
    el.innerHTML = links.map(linkCard).join("");
  } catch(e) { console.warn("Deals:", e); el.innerHTML = ""; }
}

function companyCard(c) {
  const img = isValidUrl(c.logoUrl) ? c.logoUrl : "";
  const open = isCompanyOpen(c);
  return `<article class="product ${open?"":"closed"}" onclick="openCompany('${c.id}')" style="cursor:pointer">
    ${open?"":`<div class="closed-overlay">CLOSED</div>`}
    <div class="product-img" style="display:grid;place-items:center;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;font-size:32px;font-weight:800">
      ${img ? `<img src="${escapeHtml(img)}" style="width:100%;height:100%;object-fit:cover" onerror="this.outerHTML='<span>${escapeHtml((c.name||'C')[0].toUpperCase())}</span>'">` : `<span>${escapeHtml((c.name||"C")[0].toUpperCase())}</span>`}
    </div>
    <div class="product-body">
      <div class="product-cat">${escapeHtml(c.category || "Store")}</div>
      <div class="product-name">${escapeHtml(c.name || "")}</div>
      <div class="product-desc">${escapeHtml(c.description || "")}</div>
      ${c.autoOpenClose && c.openTime && c.closeTime ? `
        <div class="text-xs mt-2" style="color:${open?"var(--success)":"var(--danger)"};font-weight:800">
          ${open?"● Open":"● Closed"} · ${escapeHtml(hoursText(c))}

    </div>
  </article>`;
}

function linkCard(link) {
  const img = isValidUrl(link.imageUrl) ? link.imageUrl : PLACEHOLDER_IMG;
  const saved = S.savedLinkIds.has(link.id);
  return `<article class="link-card" onclick="openLinkDetail('${link.id}')">
    <img class="link-card-img" src="${escapeHtml(img)}" onerror="this.src='${PLACEHOLDER_IMG}'">
    <div class="link-card-body">
      ${link.companyName ? `<div class="link-card-tag">${escapeHtml(link.companyName)}</div>` : (link.tag ? `<div class="link-card-tag">${escapeHtml(link.tag)}</div>` : "")}

      ${link.description ? `<div class="link-card-desc">${escapeHtml(link.description)}</div>` : ""}
      ${link.price ? `<div class="link-card-price">${fmtINR(link.price)}</div>` : ""}
      <div class="link-card-actions">
        <button class="btn btn-primary btn-sm" style="flex:1" onclick="event.stopPropagation();openExternalLink('${link.id}')">
          ${icon.external} Open Deal

/* ============ BROWSE ============ */
async function renderBrowse() {
  try {
    const snap = await getDocs(query(collection(db,"companies"), where("isActive","==",true)));
    S.cached.companies = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
  } catch(e) { console.warn("Browse:", e); }
  const cats = new Set();
  S.cached.companies.forEach(c => { if (c.category) cats.add(c.category); });
  const cc = $("#browseCategories");
  if (cc) cc.innerHTML =
    `<button class="chip ${S.currentCategory==="all"?"active":""}" onclick="setCategory('all')">All</button>` +
    [...cats].map(c => `<button class="chip ${S.currentCategory===c?"active":""}" onclick="setCategory('${escapeHtml(c)}')">${escapeHtml(c)}</button>`).join("");
  paintBrowseCompanies();
}

window.setCategory = cat => { S.currentCategory = cat; renderBrowse(); };

function paintBrowseCompanies() {
  let list = S.cached.companies;
  if (S.currentCategory !== "all") list = list.filter(c => c.category === S.currentCategory);
  if (S.searchQuery) list = list.filter(c =>
    (c.name||"").toLowerCase().includes(S.searchQuery) ||
    (c.description||"").toLowerCase().includes(S.searchQuery));
  const grid = $("#browseCompanies");
  if (!grid) return;
  if (!list.length) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No companies found</div>`; return; }
  grid.innerHTML = list.map(companyCard).join("");
}

let dealsCategory = "all";
async function renderDeals() {
  try {
    const snap = await getDocs(collection(db,"links"));
    S.cached.links = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
  } catch(e) { console.warn("Deals:", e); S.cached.links = []; }

  S.cached.links.forEach(l => { if (l.tag) cats.add(l.tag); });

window.setDealsCat = cat => { dealsCategory = cat; renderDeals(); };

function paintDeals() {
  const el = $("#dealsList");

/* ============ LINK DETAIL ============ */
window.openLinkDetail = async (linkId) => {
  showScreen("scrLinkDetail");
  const body = $("#linkDetailBody");
  body.innerHTML = `<div class="skeleton" style="height:240px"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  let link = S.cached.links.find(l => l.id === linkId);
  if (!link) {
    try {
      const snap = await getDoc(doc(db,"links",linkId));
      if (snap.exists()) link = { id: snap.id, ...snap.data() };
    } catch(_){}
  }
  if (!link) { body.innerHTML = `<div class="empty">Deal not found</div>`; return; }
  S.currentLink = link;
  paintLinkDetail(link);
};

function paintLinkDetail(link) {
  const body = $("#linkDetailBody");
  if (!body) return;
  const img = isValidUrl(link.imageUrl) ? link.imageUrl : PLACEHOLDER_IMG;
  const saved = S.savedLinkIds.has(link.id);
  const saveBtn = $("#linkDetailSaveBtn");
  if (saveBtn) {
    saveBtn.innerHTML = saved ? icon.bookmarkFill : icon.bookmark;
    saveBtn.style.background = saved ? "var(--brand-soft)" : "";
    saveBtn.style.color = saved ? "var(--brand)" : "";
    saveBtn.onclick = () => toggleSaveLink(link.id, true);
  }
  body.innerHTML = `
    <div class="product-detail">
      <img class="product-detail-img" src="${escapeHtml(img)}" onerror="this.src='${PLACEHOLDER_IMG}'">
      <div class="product-detail-body">
        ${link.companyName ? `<div class="product-detail-cat">${escapeHtml(link.companyName)}</div>` : (link.tag ? `<div class="product-detail-cat">${escapeHtml(link.tag)}</div>` : "")}
        <div class="product-detail-name">${escapeHtml(link.title || "")}</div>
        ${link.price ? `<div class="product-detail-price">${fmtINR(link.price)}</div>` : ""}
        ${link.description ? `<div class="product-detail-desc">${escapeHtml(link.description)}</div>` : ""}
      </div>
    </div>
    <div class="card mt-3">
      <div class="section-title">Deal Link</div>
      <div class="text-xs text-soft" style="word-break:break-all;font-family:monospace;background:var(--surface-3);padding:10px;border-radius:8px">
        ${escapeHtml(link.url || "")}
      </div>
    </div>
    <div class="row mt-3" style="gap:10px">
      <button class="btn btn-secondary" style="flex:1" onclick="toggleSaveLink('${link.id}', true)">
        ${saved ? icon.bookmarkFill + " Saved" : icon.bookmark + " Save for later"}
      </button>
      <button class="btn btn-primary" style="flex:2" onclick="openExternalLink('${link.id}')">
        ${icon.external} Open Deal
      </button>
    </div>`;
}

window.openExternalLink = async (linkId) => {
  let link = S.cached.links.find(l => l.id === linkId) || S.currentLink;
  if (!link || link.id !== linkId) {
    try {
      const snap = await getDoc(doc(db,"links",linkId));
      if (snap.exists()) link = { id: snap.id, ...snap.data() };
    } catch(_){}
  }
  if (!link || !link.url) return toast("Link unavailable", "error");
  if (!isValidUrl(link.url)) return toast("Invalid URL", "error");
  try {
    if (S.user) {
      await addDoc(collection(db,"linkClicks"), {
        linkId: link.id,
        linkTitle: link.title || "",
        url: link.url,
        userId: S.user.uid,
        userName: S.profile?.name || "",
        userEmail: S.profile?.email || "",
        clickedAt: serverTimestamp()
      });
    }
  } catch(e) { console.warn("Click log failed:", e); }
  window.open(link.url, "_blank", "noopener,noreferrer");
  toast("Opening link…", "info");
};

window.toggleSaveLink = async (linkId, fromDetail = false) => {
  if (!S.user) return toast("Sign in required", "error");
  const isSaved = S.savedLinkIds.has(linkId);
  try {
    if (isSaved) {
      await deleteDoc(doc(db,"savedLinks",S.user.uid,"items",linkId));
      toast("Removed from saved", "info");
    } else {
      let link = S.cached.links.find(l => l.id === linkId);
      if (!link) {
        const snap = await getDoc(doc(db,"links",linkId));
        if (snap.exists()) link = { id: snap.id, ...snap.data() };
      }
      if (!link) return toast("Link not found", "error");
      await setDoc(doc(db,"savedLinks",S.user.uid,"items",linkId), {
        linkId: link.id,
        title: link.title || "",
        description: link.description || "",
        imageUrl: link.imageUrl || "",
        price: link.price || 0,
        url: link.url || "",
        companyName: link.companyName || "",
        tag: link.tag || "",
        savedAt: serverTimestamp()
      });
      toast("✅ Saved for later", "success");
    }
    if (fromDetail && S.currentLink) paintLinkDetail(S.currentLink);
    paintDeals();
  } catch(err) { toast(errorMsg(err), "error"); }
};

window.openCompany = async (companyId) => {
  showScreen("scrCompany");
  $("#companyBody").innerHTML = `<div class="skeleton" style="height:120px"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  let company, products = [];
  try {
    const cSnap = await getDoc(doc(db,"companies",companyId));
    if (!cSnap.exists()) { $("#companyBody").innerHTML = `<div class="empty">Company not found</div>`; return; }
    company = { id: cSnap.id, ...cSnap.data() };

    $("#companyTitle").textContent = company.name || "Company";
  } catch(err) {
    console.error(err);
    $("#companyBody").innerHTML = `<div class="empty">Failed to load</div>`; return;

  const logo = isValidUrl(company.logoUrl) ? company.logoUrl : "";

    ? '<span class="badge badge-success">COD available</span>'

  $("#companyBody").innerHTML = `
    ${status.blocked ? renderBlockedBanner() : ""}

      <div style="background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;padding:20px;border-radius:var(--r-lg);margin-bottom:16px;display:flex;gap:14px">

          <div style="font-weight:800;font-size:15px;margin-bottom:5px;font-family:var(--font-display)">Currently Closed</div>
          <div style="font-size:13px;opacity:.94">${escapeHtml(company.closedMessage || "This store is closed.")}</div>
          ${hours ? `<div style="font-size:12px;opacity:.8;margin-top:8px">Hours: ${escapeHtml(hours)}</div>` : ""}
        </div>
      </div>` : ""}
    <div class="card card-elevated">
      <div class="row">
        <div style="width:72px;height:72px;border-radius:16px;background:var(--brand-gradient);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;overflow:hidden">
          ${logo ? `<img src="${escapeHtml(logo)}" style="width:100%;height:100%;object-fit:cover">` : `<span>${escapeHtml((company.name||"C")[0])}</span>`}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:19px;font-weight:800;font-family:var(--font-display)">${escapeHtml(company.name || "")}</div>
          <div class="text-xs text-soft" style="margin-top:4px">${escapeHtml(company.category || "")}</div>
          <div class="row mt-2" style="gap:6px">${codBadge}</div>
          ${showHours ? `<div class="text-xs mt-2" style="color:${isOpen?"var(--success)":"var(--danger)"};font-weight:800">${isOpen?"● Open now":"● Closed"} · ${escapeHtml(hours)}</div>` : ""}
        </div>
      </div>
      <div class="text-sm text-muted mt-3" style="line-height:1.6">${escapeHtml(company.description || "")}</div>
    </div>
    <div class="section-header mt-4" style="margin-bottom:12px"><h2>Products</h2></div>
    <div class="product-grid" id="companyProducts"></div>`;
  startBlockTimer();
  const grid = $("#companyProducts");

  if (!products.length) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No products available</div>`; return; }
  grid.innerHTML = products.map(p => `
    <article class="product ${isOpen?"":"closed"}" onclick="openProductDetail('${company.id}','${p.id}')">
      <img class="product-img" src="${escapeHtml(isValidUrl(p.imageUrl) ? p.imageUrl : PLACEHOLDER_IMG)}" onerror="this.src='${PLACEHOLDER_IMG}'">

async function addProductToCartWithQty(productId, companyId, qty) {
  const status = getStatusMessage();
  if (status.blocked) { toast(status.title + ": " + status.message, "error"); return; }
  try {
    const cS = await getDoc(doc(db,"companies",companyId));
    if (!cS.exists()) return toast("Company not found", "error");
    const pS = await getDoc(doc(db,"companies",companyId,"products",productId));
    if (!pS.exists()) return toast("Product not found", "error");
    const company = { id: companyId, ...cS.data() };
    const product = { id: productId, ...pS.data() };
    if (!isCompanyOpen(company)) return toast(`${company.name} closed`, "error");
    if (product.isActive === false) return toast("Not available", "error");
    if (S.cart.companyId && S.cart.companyId !== companyId) {
      return confirmDialog(`Cart has items from ${S.cart.companyName}. Clear it?`, () => {
        clearCart();
        addProductToCartWithQty(productId, companyId, qty);
      });
    }
    if (!S.cart.companyId) { S.cart.companyId = companyId; S.cart.companyName = company.name; }
    const existing = S.cart.items.find(i => i.productId === productId);
    if (existing) existing.quantity += qty;
    else S.cart.items.push({ productId, name: product.name, imageUrl: product.imageUrl || "", price: Number(product.price) || 0, quantity: qty });
    saveCart();
    updateCartBadge();
    toast(`${product.name} × ${qty} added`, "success");
    setTimeout(() => goTo("cart"), 400);
  } catch(err) { console.error(err); toast("Failed to add", "error"); }
}
window.addProductToCart = async (productId, companyId) => { await addProductToCartWithQty(productId, companyId, 1); };

window.changeQty = (productId, delta) => {
  const item = S.cart.items.find(i => i.productId === productId);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) S.cart.items = S.cart.items.filter(i => i.productId !== productId);
  if (!S.cart.items.length) clearCart(); else saveCart();
  updateCartBadge(); renderCart();
};

window.removeFromCart = (productId) => {
  S.cart.items = S.cart.items.filter(i => i.productId !== productId);
  if (!S.cart.items.length) clearCart(); else saveCart();
  updateCartBadge(); renderCart();
};

window.startCheckout = () => {

async function placeOrder({ company, subtotal, deliveryCharge, serviceCharge, paymentMethod }) {
  await refreshProfile();
  const status = getStatusMessage();
  if (status.blocked) return toast(status.title + ": " + status.message, "error");
  if (!isCompanyOpen(company)) return toast(`${company.name} closed.`, "error");
  const phone = $("#coPhone").value.trim();
  const address = $("#coAddress").value.trim();
  const notes = $("#coNotes").value.trim();
  if (!/^[0-9]{10}$/.test(phone)) return toast("Valid phone required", "error");
  if (!address) return toast("Address required", "error");
  const codEnabled = company.codEnabled !== false;
  if (paymentMethod === "cod" && !codEnabled) return toast("COD not available", "error");
  const btn = $("#placeOrderBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Placing';
  try {
    const validItems = [];
    for (const item of S.cart.items) {
      const pS = await getDoc(doc(db,"companies",company.id,"products",item.productId));
      if (!pS.exists()) throw new Error(`"${item.name}" unavailable`);
      const p = pS.data();
      if (p.isActive === false) throw new Error(`"${p.name}" not available`);
      validItems.push({
        productId: item.productId, name: p.name, imageUrl: p.imageUrl || "",
        unitPrice: Number(p.price) || 0, quantity: item.quantity,
        lineTotal: (Number(p.price) || 0) * item.quantity
      });
    }
    const finalSubtotal = validItems.reduce((s,i) => s + i.lineTotal, 0);
    const couponDiscount = S.appliedCoupon?.discount || 0;
    const finalTotal = Math.max(0, finalSubtotal + deliveryCharge + serviceCharge - couponDiscount);
    const orderId = genOrderId();
    const orderData = {
      orderId, customerId: S.user.uid,
      customerName: S.profile.name || "", customerEmail: S.profile.email || "",
      customerPhone: phone, address, notes,
      companyId: company.id, companyName: company.name, companyLogo: company.logoUrl || "",
      items: validItems, subtotal: finalSubtotal,
      deliveryCharge, serviceCharge,
      couponCode: S.appliedCoupon?.code || "", couponDiscount,
      isFirstOrder: S.isFirstOrder,
      paymentMethod,
      grandTotal: finalTotal,
      status: "pending",
      trackingUrl: "",
      hasReview: false,
      hasComplaint: false,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    };
    const ref = await addDoc(collection(db,"orders"), orderData);
    await addDoc(collection(db,"orders",ref.id,"statusHistory"), {
      status: "pending", note: "Order placed", changedBy: S.user.uid, createdAt: serverTimestamp()
    });
    clearCart();
    updateCartBadge();
    toast(`Order placed — ${orderId}`, "success");
    showScreen("scrOrders"); renderOrders();
  } catch(err) {
    console.error("ORDER ERROR:", err);
    toast(err.message || errorMsg(err), "error");
  } finally {
    btn.disabled = false; btn.textContent = "Place Order →";
  }
}

window.openOrderDetail = async (orderId) => {
  showScreen("scrOrderDetail");
  const body = $("#orderDetailBody");
  body.innerHTML = `<div class="skeleton" style="height:120px"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  try {
    const snap = await getDoc(doc(db,"orders",orderId));
    if (!snap.exists()) { body.innerHTML = `<div class="empty">Not found</div>`; return; }
    const o = { id: snap.id, ...snap.data() };
    let review = null, complaint = null;
    try {
      const rS = await getDocs(query(collection(db,"reviews"), where("orderId","==",orderId)));
      if (!rS.empty) review = rS.docs[0].data();
    } catch(_){}
    try {
      const cS = await getDocs(query(collection(db,"complaints"), where("orderId","==",orderId)));
      if (!cS.empty) complaint = { id: cS.docs[0].id, ...cS.docs[0].data() };
    } catch(_){}
    paintOrderDetail(o, review, complaint);
  } catch(err) { body.innerHTML = `<div class="empty">Failed</div>`; }
};

function paintOrderDetail(o, review, complaint) {
  const info = ORDER_STATUS[o.status] || { label: o.status, tone: "neutral" };
  const steps = ["pending","processing","successful"];
  const currentIdx = steps.indexOf(o.status);
  const timeline = steps.map((s,i) => {
    let cls = "";
    if (o.status === "cancelled" || o.status === "rejected") cls = i === 0 ? "done" : "";
    else if (i < currentIdx) cls = "done";

window.openReviewForm = async (orderId) => {

  } catch(_){}
  showScreen("scrReview");
  $("#reviewBody").innerHTML = `
    <div class="card card-elevated">
      <div class="section-title">Rate Your Experience</div>
      <div class="text-center mb-4">
        <div class="stars-input" id="reviewStars" style="font-size:44px;display:inline-flex;gap:8px;cursor:pointer;user-select:none">${[1,2,3,4,5].map(n => `<span data-n="${n}" style="color:#e5e7eb;transition:all .25s;line-height:1">★</span>`).join("")}</div>
      </div>

        <textarea class="form-textarea" id="reviewText"></textarea></div>
      <div class="form-group"><label class="form-label">Maps link (optional)</label>
        <input class="form-input" id="reviewMaps" type="url"></div>
      <button class="btn btn-primary btn-lg btn-block" id="reviewSubmit">Submit Review</button>
    </div>`;
  let rating = 0;
  $$("#reviewStars span").forEach(s => s.onclick = () => {
    rating = +s.dataset.n;
    $$("#reviewStars span").forEach(x => x.style.color = (+x.dataset.n <= rating) ? "var(--amber)" : "#e5e7eb");
  });
  $("#reviewSubmit").onclick = async () => {

    try {
      const ex = await getDocs(query(collection(db,"reviews"), where("orderId","==",orderId)));
      if (!ex.empty) { toast("Already reviewed", "info"); showScreen("scrOrders"); renderOrders(); return; }
      await addDoc(collection(db,"reviews"), {
        orderId, customerId: S.user.uid,
        customerName: S.profile.name || "", customerEmail: S.profile.email || "",
        rating, reviewText, mapsLink, createdAt: serverTimestamp()
      });

};

window.openComplaintForm = async (orderId) => {

  } catch(_){}
  showScreen("scrComplaint");
  $("#complaintBody").innerHTML = `
    <div class="card card-elevated">

      <div class="info-box mb-4">ℹ️ Please describe the issue. You can chat with our team after submitting.</div>

        <label class="form-label">What went wrong?</label>
        <select class="form-select" id="complaintType">
          <option value="Less quantity received">📦 Less quantity received</option>

          <option value="Damaged product">💔 Damaged product</option>
          <option value="Wrong item received">❌ Wrong item received</option>

window.openComplaintChat = async (orderId) => {
  showScreen("scrChat");
  const container = $("#chatContainer");
  container.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-3)">
    <div class="spin" style="border-color:rgba(79,70,229,.3);border-top-color:var(--brand);width:24px;height:24px;display:inline-block;border-width:3px"></div>
    <div style="margin-top:12px">Loading chat…</div>
  </div>`;
  try {
    let complaint = null, complaintId = null;
    try {
      const orderSnap = await getDoc(doc(db,"orders",orderId));
      if (orderSnap.exists()) {
        const orderData = orderSnap.data();
        if (orderData.complaintId) {
          const cSnap = await getDoc(doc(db,"complaints",orderData.complaintId));
          if (cSnap.exists()) { complaintId = cSnap.id; complaint = cSnap.data(); }
        }
      }
    } catch(_){}
    if (!complaint) {
      const cSnap = await getDocs(query(collection(db,"complaints"), where("orderId","==",orderId)));
      if (!cSnap.empty) { complaintId = cSnap.docs[0].id; complaint = cSnap.docs[0].data(); }
    }
    if (!complaint || !complaintId) {
      container.innerHTML = `<div class="empty" style="padding:40px 20px;text-align:center">
        <div style="font-size:40px;margin-bottom:10px">📭</div>
        <div style="font-weight:700;margin-bottom:6px">No complaint found</div>
        <button class="btn btn-secondary mt-4" onclick="goTo('orders')">Back</button>
      </div>`;
      return;
    }
    S.activeComplaintId = complaintId;
    const isAdmin = S.profile?.role === "admin";
    const statusInfo = COMPLAINT_STATUS[complaint.status] || COMPLAINT_STATUS.pending;
    const isResolved = complaint.status === "resolved";
    container.innerHTML = `
      <div class="chat-header">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--brand-gradient);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0">
          ${escapeHtml((complaint.customerName || "C")[0].toUpperCase())}
        </div>
        <div class="info">
          <div class="title">${isAdmin ? escapeHtml(complaint.customerName || "Customer") : "Pawan Retail Support"}</div>
          <div class="subtitle">Order #${escapeHtml(complaint.orderNumber || orderId)} · <span class="badge badge-${statusInfo.tone}" style="font-size:10px;padding:2px 7px">${statusInfo.label}</span></div>
        </div>
        ${isAdmin && !isResolved ? `<button class="btn btn-success btn-xs" id="resolveChatBtn">✓ Resolve</button>` : ""}
      </div>
      <div class="complaint-info-box">
        <strong>⚠️ Complaint:</strong> ${escapeHtml(complaint.complaintType || "")}
      </div>
      ${isResolved ? `<div class="chat-closed-banner">✓ This complaint has been resolved. Thank you!</div>` : ""}
      <div class="chat-messages" id="chatMessages">
        <div style="text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px">
          <div class="spin" style="border-color:rgba(79,70,229,.3);border-top-color:var(--brand);width:20px;height:20px;display:inline-block;border-width:3px"></div>
          <div style="margin-top:10px">Loading messages…</div>
        </div>
      </div>
      ${!isResolved ? `
        <div class="chat-input-area">
          <textarea id="chatInput" placeholder="Type your message…" rows="1"></textarea>
          <button class="chat-send-btn" id="chatSendBtn">${icon.send}</button>
        </div>` : ""}
    `;
    const textarea = $("#chatInput");
    if (textarea) {
      textarea.addEventListener("input", () => {
        textarea.style.height = "auto";
        textarea.style.height = Math.min(textarea.scrollHeight, 100) + "px";
      });
      textarea.addEventListener("keypress", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
      });
    }
    const sendBtn = $("#chatSendBtn");
    if (sendBtn) sendBtn.onclick = sendChatMessage;
    const resolveBtn = $("#resolveChatBtn");
    if (resolveBtn) resolveBtn.onclick = async () => {
      if (!confirm("Mark this complaint as resolved?")) return;
      resolveBtn.disabled = true; resolveBtn.innerHTML = '<span class="spin"></span>';
      try {
        await updateDoc(doc(db,"complaints",complaintId), {
          status: "resolved", resolvedAt: serverTimestamp(), resolvedBy: S.user.uid
        });
        await addDoc(collection(db,"complaints",complaintId,"messages"), {
          senderId: S.user.uid,
          senderName: S.profile?.name || "Admin",
          senderRole: "admin",
          text: "✅ This complaint has been marked as resolved. Thank you for your patience!",
          createdAt: serverTimestamp()
        });
        toast("Complaint resolved", "success");
        setTimeout(() => openComplaintChat(orderId), 600);
      } catch(err) {
        toast(errorMsg(err), "error");
        resolveBtn.disabled = false; resolveBtn.textContent = "✓ Resolve";
      }
    };
    if (S.activeChatUnsub) { try { S.activeChatUnsub(); } catch(_){} S.activeChatUnsub = null; }
    const messagesRef = collection(db,"complaints",complaintId,"messages");
    S.activeChatUnsub = onSnapshot(messagesRef, snap => {
      let messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      messages.sort((a,b) => millis(a.createdAt) - millis(b.createdAt));
      paintChatMessages(messages);
    }, err => {
      console.error("Chat listener error:", err);
      const msgBox = $("#chatMessages");
      if (msgBox) {
        msgBox.innerHTML = `<div style="text-align:center;padding:30px 20px;color:var(--danger);font-size:13px;line-height:1.6">
          <div style="font-size:36px;margin-bottom:10px">⚠️</div>
          <div style="font-weight:700;margin-bottom:6px">Could not load messages</div>
          <div style="font-size:11px;opacity:.7;font-family:monospace;word-break:break-all">${escapeHtml(err?.code || err?.message || "Unknown error")}</div>
          <button class="btn btn-secondary mt-4" onclick="openComplaintChat('${orderId}')">Retry</button>
        </div>`;
      }
    });
  } catch(err) {
    console.error("Chat open error:", err);
    container.innerHTML = `<div class="empty" style="padding:40px 20px;text-align:center">
      <div style="font-size:40px;margin-bottom:10px">⚠️</div>
      <div style="color:var(--danger);font-weight:700;margin-bottom:6px">Failed to open chat</div>
      <div style="color:var(--text-3);font-size:11px;font-family:monospace;word-break:break-all">${escapeHtml(err?.code || err?.message || "Unknown")}</div>
      <button class="btn btn-secondary mt-4" onclick="goTo('orders')">Back to Orders</button>
    </div>`;
  }
};

async function sendChatMessage() {
  const input = $("#chatInput");
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  if (!S.activeComplaintId) return toast("No active chat", "error");
  const btn = $("#chatSendBtn");
  btn.disabled = true; input.disabled = true;
  try {
    const isAdmin = S.profile?.role === "admin";
    await addDoc(collection(db,"complaints",S.activeComplaintId,"messages"), {
      senderId: S.user.uid,
      senderName: S.profile?.name || (isAdmin ? "Admin" : "Customer"),
      senderRole: isAdmin ? "admin" : "customer",
      text: text,
      createdAt: serverTimestamp()
    });
    const updates = { lastMessageAt: serverTimestamp() };
    if (isAdmin) updates.status = "in_progress";
    await updateDoc(doc(db,"complaints",S.activeComplaintId), updates);
    input.value = "";
    input.style.height = "auto";
    input.focus();
  } catch(err) {
    console.error("Send error:", err);
    toast(errorMsg(err), "error");
  } finally {
    btn.disabled = false; input.disabled = false;
  }
}

function paintChatMessages(messages) {
  const box = $("#chatMessages");
  if (!box) return;
  if (!messages.length) {
    box.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px">
      <div style="font-size:36px;margin-bottom:10px;opacity:.4">💬</div>
      No messages yet.
    </div>`;
    return;
  }
  box.innerHTML = messages.map(m => {
    if (m.senderRole === "system") return `<div class="chat-bubble system">${escapeHtml(m.text || "")}</div>`;
    const isCustomer = m.senderRole === "customer";
    return `<div class="chat-bubble ${isCustomer ? "customer" : "admin"}">
      ${!isCustomer ? `<div class="sender">${escapeHtml(m.senderName || "Admin")}</div>` : ""}
      <div>${escapeHtml(m.text || "").replace(/\n/g, "<br>")}</div>
      <div class="meta">${fmtTime(m.createdAt)}</div>
    </div>`;
  }).join("");
  setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
}

async function renderAdminDashboard() {
  $("#adminContent").innerHTML = `<div class="stats-grid" id="statsGrid"></div><div id="recentOrders"></div>`;
  const [oS, cS, lS] = await Promise.all([
    getDocs(collection(db,"orders")),
    getDocs(collection(db,"complaints")),
    getDocs(collection(db,"linkClicks"))
  ]);
  const orders = oS.docs.map(d => d.data());
  const complaints = cS.docs.map(d => d.data());
  const clicks = lS.docs.map(d => d.data());
  const stats = [
    { label:"Total Orders", value: orders.length },
    { label:"Pending", value: orders.filter(o => o.status==="pending").length },
    { label:"Delivered", value: orders.filter(o => o.status==="successful").length },
    { label:"Open Complaints", value: complaints.filter(c => c.status!=="resolved").length },
    { label:"Link Clicks", value: clicks.length }
  ];
  $("#statsGrid").innerHTML = stats.map(s => `<div class="stat">
    <div class="stat-label">${escapeHtml(s.label)}</div>
    <div class="stat-value">${s.value}</div></div>`).join("");
  const recent = orders.map((o,i) => ({ id: oS.docs[i].id, ...o })).sort(byNewest).slice(0,10);
  $("#recentOrders").innerHTML = `
    <div class="section-header"><h2>Recent Orders</h2></div>
    <div class="table-wrap scroll"><table class="table">
      <thead><tr><th>Order</th><th>Customer</th><th>Company</th><th>Total</th><th>Status</th><th></th></tr></thead>
      <tbody>${recent.length ? recent.map(o => {
        const info = ORDER_STATUS[o.status] || { label: o.status, tone: "neutral" };
        return `<tr>
          <td class="font-mono text-xs">#${escapeHtml(o.orderId || o.id)}</td>
          <td>${escapeHtml(o.customerName || "")}</td>
          <td>${escapeHtml(o.companyName || "")}</td>
          <td class="font-bold">${fmtINR(o.grandTotal)}</td>
          <td><span class="badge badge-${info.tone}">${info.label}</span></td>
          <td><button class="btn btn-secondary btn-xs" onclick="adminOpenOrder('${o.id}')">Open</button></td>
        </tr>`;
      }).join("") : '<tr><td colspan="6" class="text-soft" style="text-align:center">No orders</td></tr>'}
      </tbody></table></div>`;
}

      ).join("")}
