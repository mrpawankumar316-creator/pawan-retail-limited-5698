<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pawan Retail - Customer App</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    
    <style>
        /* ============================================================
           PREMIUM DESIGN SYSTEM
           ============================================================ */
        :root {
            --primary-forest: #243B35;
            --primary-forest-light: #2d4d45;
            --background-cream: #F6F1E8;
            --almond: #D6BD98;
            --sage: #78917C;
            --cta: #C86B4A;
            --cta-hover: #b85d3d;
            --white: #FFFFFF;
            --dark-text: #17201D;
            --muted-text: #6B756F;
            --light-border: #E4DED2;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 40px rgba(0,0,0,0.1);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xl: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-height: 64px;
            --bottom-nav-height: 68px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--background-cream);
            color: var(--dark-text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* ============================================================
           SPLASH SCREEN
           ============================================================ */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        #splashScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #splashScreen .logo {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary-forest);
            animation: splashLogo 1s ease;
        }
        #splashScreen .logo span { color: var(--cta); }
        #splashScreen .tagline {
            font-size: 16px;
            color: var(--muted-text);
            margin-top: 8px;
            animation: splashFade 1.2s ease;
        }
        #splashScreen .loader {
            margin-top: 30px;
            width: 40px;
            height: 40px;
            border: 3px solid var(--light-border);
            border-top-color: var(--cta);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes splashLogo {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes splashFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Location Detection Overlay */
        #locationOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #locationOverlay.active { display: flex; }
        #locationOverlay .location-box {
            background: var(--white);
            border-radius: var(--radius);
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: scaleIn 0.4s ease;
        }
        #locationOverlay .location-box .icon {
            font-size: 48px;
            color: var(--sage);
            margin-bottom: 12px;
        }
        #locationOverlay .location-box h3 {
            font-size: 20px;
            color: var(--dark-text);
            margin-bottom: 4px;
        }
        #locationOverlay .location-box p {
            color: var(--muted-text);
            font-size: 14px;
            margin-bottom: 16px;
        }
        #locationOverlay .location-box .pincode-input {
            display: flex;
            gap: 8px;
        }
        #locationOverlay .location-box .pincode-input input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid var(--light-border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            text-align: center;
            letter-spacing: 4px;
        }
        #locationOverlay .location-box .pincode-input input:focus {
            outline: none;
            border-color: var(--sage);
        }
        #locationOverlay .location-box .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
        }
        #locationOverlay .location-box .btn-primary {
            background: var(--primary-forest);
            color: var(--white);
        }
        #locationOverlay .location-box .btn-primary:hover {
            background: var(--primary-forest-light);
        }
        #locationOverlay .location-box .btn-ghost {
            background: transparent;
            color: var(--muted-text);
            border: 1px solid var(--light-border);
        }
        #locationOverlay .location-box .error-msg {
            color: var(--cta);
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        #locationOverlay .location-box .error-msg.show { display: block; }
        #locationOverlay .location-box .detecting {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--muted-text);
            font-size: 14px;
            padding: 8px 0;
        }
        #locationOverlay .location-box .detecting i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* ============================================================
           APP SHELL
           ============================================================ */
        .app-shell {
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--background-cream);
            display: none;
            flex-direction: column;
            position: relative;
        }
        .app-shell.active { display: flex; }
        
        /* ============================================================
           HEADER
           ============================================================ */
        .app-header {
            background: var(--primary-forest);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: var(--nav-height);
        }
        .app-header .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .app-header .logo span { color: var(--almond); }
        .app-header .header-actions {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .app-header .header-actions button {
            background: none;
            border: none;
            color: var(--white);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            position: relative;
            transition: var(--transition);
        }
        .app-header .header-actions button:hover { opacity: 0.8; }
        .app-header .header-actions .badge-count {
            position: absolute;
            top: -6px;
            right: -8px;
            background: var(--cta);
            color: var(--white);
            font-size: 9px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .user-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--almond);
            cursor: pointer;
            transition: var(--transition);
        }
        .user-avatar-small:hover { transform: scale(1.05); }
        
        /* Location Badge in Header */
        .location-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.12);
            padding: 4px 12px;
            border-radius: 50px;
            color: var(--white);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .location-badge:hover { background: rgba(255,255,255,0.2); }
        .location-badge i { font-size: 12px; }
        
        /* ============================================================
           SEARCH BAR
           ============================================================ */
        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.12);
            border-radius: 50px;
            padding: 4px 14px;
            flex: 1;
            max-width: 400px;
            transition: var(--transition);
        }
        .search-bar:focus-within {
            background: rgba(255,255,255,0.2);
        }
        .search-bar input {
            background: none;
            border: none;
            color: var(--white);
            padding: 8px 10px;
            font-size: 14px;
            width: 100%;
            outline: none;
        }
        .search-bar input::placeholder { color: rgba(255,255,255,0.6); }
        .search-bar button {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            opacity: 0.7;
        }
        
        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 80px;
            -webkit-overflow-scrolling: touch;
        }
        .main-content::-webkit-scrollbar { width: 0; display: none; }
        
        /* ============================================================
           BOTTOM NAVIGATION
           ============================================================ */
        .bottom-nav {
            background: var(--white);
            border-top: 1px solid var(--light-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
            height: var(--bottom-nav-height);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.04);
            z-index: 200;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 12px;
            transition: var(--transition);
            position: relative;
            min-width: 48px;
        }
        .bottom-nav .nav-item i {
            font-size: 20px;
            color: var(--muted-text);
            transition: var(--transition);
        }
        .bottom-nav .nav-item span {
            font-size: 9px;
            font-weight: 600;
            color: var(--muted-text);
            transition: var(--transition);
        }
        .bottom-nav .nav-item.active i {
            color: var(--primary-forest);
            transform: translateY(-2px);
        }
        .bottom-nav .nav-item.active span {
            color: var(--primary-forest);
        }
        .bottom-nav .nav-item .nav-badge {
            position: absolute;
            top: -4px;
            right: 0;
            background: var(--cta);
            color: var(--white);
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        
        /* ============================================================
           PAGES
           ============================================================ */
        .page {
            display: none;
            animation: fadeUp 0.4s ease;
            padding-top: 12px;
        }
        .page.active { display: block; }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* ============================================================
           COMPONENTS
           ============================================================ */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-hover); }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: var(--primary-forest);
            color: var(--white);
        }
        .btn-primary:hover { background: var(--primary-forest-light); }
        .btn-cta {
            background: var(--cta);
            color: var(--white);
        }
        .btn-cta:hover { background: var(--cta-hover); }
        .btn-outline {
            background: transparent;
            color: var(--primary-forest);
            border: 2px solid var(--primary-forest);
        }
        .btn-ghost {
            background: transparent;
            color: var(--muted-text);
            border: 1px solid var(--light-border);
        }
        .btn-sm { padding: 8px 16px; font-size: 12px; min-height: 36px; }
        .btn-block { width: 100%; justify-content: center; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--dark-text);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--light-border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--white);
            transition: var(--transition);
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--sage);
            box-shadow: 0 0 0 4px rgba(120,145,124,0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 8px;
        }
        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .product-card .img-wrap {
            position: relative;
            padding-top: 100%;
            background: var(--background-cream);
        }
        .product-card .img-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-card .img-wrap .discount-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--cta);
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 50px;
        }
        .product-card .img-wrap .wishlist-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted-text);
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .product-card .img-wrap .wishlist-btn.liked { color: var(--cta); }
        .product-card .info {
            padding: 12px 14px 14px;
        }
        .product-card .info .name {
            font-size: 13px;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 36px;
            line-height: 1.3;
        }
        .product-card .info .price-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .product-card .info .price-row .current {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-forest);
        }
        .product-card .info .price-row .original {
            font-size: 13px;
            color: var(--muted-text);
            text-decoration: line-through;
        }
        .product-card .info .add-btn {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary-forest);
            color: var(--white);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .product-card .info .add-btn.in-cart { background: var(--sage); }
        .product-card .info .add-btn.out-of-stock {
            background: var(--muted-text);
            cursor: not-allowed;
        }
        
        /* Hero Banner */
        .hero-banner {
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            background: linear-gradient(135deg, var(--primary-forest), var(--sage));
            min-height: 180px;
            display: flex;
            align-items: center;
            padding: 24px 28px;
        }
        .hero-banner .content { flex: 1; z-index: 2; }
        .hero-banner .content .badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            color: var(--white);
            display: inline-block;
            margin-bottom: 6px;
        }
        .hero-banner .content h2 {
            color: var(--white);
            font-size: 24px;
            font-weight: 800;
            line-height: 1.2;
        }
        .hero-banner .content p {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin: 4px 0 12px;
        }
        .hero-banner .content .btn {
            background: var(--cta);
            color: var(--white);
            padding: 8px 24px;
            font-size: 13px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .hero-banner .art {
            position: absolute;
            right: -10px;
            bottom: -20px;
            font-size: 100px;
            opacity: 0.08;
            z-index: 1;
            color: var(--white);
        }
        
        /* Categories */
        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0 12px;
            -webkit-overflow-scrolling: touch;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        .category-pill {
            flex-shrink: 0;
            padding: 8px 20px;
            border-radius: 50px;
            background: var(--white);
            border: 1.5px solid var(--light-border);
            font-size: 13px;
            font-weight: 600;
            color: var(--muted-text);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .category-pill.active {
            background: var(--primary-forest);
            color: var(--white);
            border-color: var(--primary-forest);
        }
        
        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 8px;
        }
        .section-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--dark-text);
        }
        .section-header .see-all {
            font-size: 13px;
            color: var(--cta);
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
        }
        
        /* Flash Deals */
        .flash-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 0 12px;
            -webkit-overflow-scrolling: touch;
        }
        .flash-scroll::-webkit-scrollbar { display: none; }
        .flash-card {
            flex-shrink: 0;
            width: 200px;
            background: var(--white);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--cta);
        }
        .flash-card .flash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .flash-card .flash-header .tag {
            background: var(--cta);
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 50px;
        }
        .flash-card .flash-header .countdown {
            font-size: 16px;
            font-weight: 700;
            color: var(--cta);
            font-variant-numeric: tabular-nums;
        }
        .flash-card .flash-name {
            font-weight: 600;
            font-size: 14px;
        }
        .flash-card .flash-discount {
            font-size: 22px;
            font-weight: 800;
            color: var(--cta);
            margin-top: 2px;
        }
        
        /* Order Item */
        .order-item {
            background: var(--white);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
        }
        .order-item .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .order-item .order-id {
            font-weight: 600;
            font-size: 13px;
        }
        .order-item .order-status {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 50px;
        }
        .order-item .order-status.processing { background: #fef3c7; color: #92400e; }
        .order-item .order-status.shipped { background: #dbeafe; color: #1e40af; }
        .order-item .order-status.delivered { background: #dcfce7; color: #166534; }
        .order-item .order-status.cancelled { background: #fee2e2; color: #991b1b; }
        .order-item .order-items { font-size: 13px; color: var(--muted-text); }
        .order-item .order-total {
            font-weight: 700;
            font-size: 17px;

<script>
// ============================================================
// FIREBASE INIT
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyDwEdbqfxXrJTy1I2gqS9zZKhZgJgBWZ1k",
    authDomain: "admin-panel-15c8b.firebaseapp.com",
    projectId: "admin-panel-15c8b",
    storageBucket: "admin-panel-15c8b.firebasestorage.app",
    messagingSenderId: "801420671780",
    appId: "1:801420671780:web:ac7005c3f8e4e6c50e51b1",
    measurementId: "G-YEK5TYN1FS"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

// ============================================================
// STATE
// ============================================================
const state = {
    user: null,
    profile: null,
    currentPage: 'home',
    products: [],
    cart: [],
    orders: [],
    wishlist: [],
    pincode: '',
    flashDeals: [],
    isAdmin: false,
    registeredUser: null,
    lastOrderId: null,
    selectedProduct: null,
    isLoading: false,
    appliedCoupon: null,
    avatars: [
        'https://ui-avatars.com/api/?name=User+1&background=D6BD98&color=243B35&size=128&bold=true',
        'https://ui-avatars.com/api/?name=User+2&background=78917C&color=FFFFFF&size=128&bold=true',
        'https://ui-avatars.com/api/?name=User+3&background=C86B4A&color=FFFFFF&size=128&bold=true',
        'https://ui-avatars.com/api/?name=User+4&background=243B35&color=D6BD98&size=128&bold=true',
        'https://ui-avatars.com/api/?name=User+5&background=F6F1E8&color=243B35&size=128&bold=true',
        'https://ui-avatars.com/api/?name=User+6&background=17201D&color=F6F1E8&size=128&bold=true'
    ],
    selectedAvatar: 0,
    isPincodeSet: false,
    locationDetected: false
};

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function $(id) { return document.getElementById(id); }
function qs(sel, ctx = document) { return ctx.querySelector(sel); }
function qsa(sel, ctx = document) { return ctx.querySelectorAll(sel); }

function formatCurrency(amt) { return '₹' + Number(amt).toFixed(2); }
function getTS() { return firebase.firestore.FieldValue.serverTimestamp(); }
function generateOrderId() { return 'ORD' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substring(2, 5).toUpperCase(); }
function formatDate(ts) {
    if (!ts) return 'N/A';
    const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

// Toast System
function showToast(message, type = 'info', duration = 3000) {
    const container = $('toastContainer');
    const toast = document.createElement('div');
    const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
        <span class="toast-icon"><i class="fas ${icons[type] || icons.info}"></i></span>
        <span>${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
    `;
    container.appendChild(toast);
    setTimeout(() => {
        if (toast.parentElement) toast.remove();
    }, duration);
    return toast;
}

// Modal System
function openModal(html) {
    $('modalBody').innerHTML = html;
    $('modalOverlay').classList.add('active');
}
function closeModal() { 
    $('modalOverlay').classList.remove('active'); 
}

$('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// Navigation
function navigateTo(page) {
    state.currentPage = page;
    qsa('.bottom-nav .nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
    });
    renderPage(page);
    $('mainContent').scrollTop = 0;
}

// ============================================================
// LOCATION DETECTION
// ============================================================
function detectLocation() {
    const overlay = $('locationOverlay');
    const status = $('detectingStatus');
    const manualInput = $('manualPincodeInput');
    const submitBtn = $('locationSubmitBtn');
    const manualBtn = $('manualEntryBtn');
    const error = $('locationError');
    
    overlay.classList.add('active');
    status.style.display = 'flex';
    manualInput.style.display = 'none';
    submitBtn.style.display = 'none';
    manualBtn.style.display = 'inline-block';
    error.classList.remove('show');
    
    // Try geolocation first
    if (navigator.geolocation) {
        status.innerHTML = '<i class="fas fa-spinner"></i> Detecting your location...';
        
        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                try {
                    // Try to get pincode from reverse geocoding
                    // Using free API - for production use better service
                    const response = await fetch(
                        `https://api.zippopotam.us/in/${pos.coords.latitude},${pos.coords.longitude}`
                    );
                    
                    if (response.ok) {
                        const data = await response.json();
                        const pincode = data['post code'] || '400001';
                        setPincode(pincode);
                        showToast('Location detected: ' + pincode, 'success');
                        overlay.classList.remove('active');
                        return;
                    } else {
                        // Fallback - use mock pincode for demo
                        const mockPincode = '400001';
                        setPincode(mockPincode);
                        showToast('Location detected (demo): ' + mockPincode, 'success');
                        overlay.classList.remove('active');
                        return;
                    }
                } catch (e) {
                    // If reverse geocoding fails, show manual entry
                    showManualEntry();
                    showToast('Could not detect pincode. Please enter manually.', 'warning');
                }
            },
            () => {
                // Geolocation failed
                showManualEntry();
                showToast('Location access denied. Please enter pincode manually.', 'warning');
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    } else {
        // Geolocation not supported
        showManualEntry();
        showToast('Geolocation not supported. Please enter pincode manually.', 'warning');
    }
}

function showManualEntry() {
    const status = $('detectingStatus');
    const manualInput = $('manualPincodeInput');
    const submitBtn = $('locationSubmitBtn');
    const manualBtn = $('manualEntryBtn');
    
    status.style.display = 'none';
    manualInput.style.display = 'flex';
    submitBtn.style.display = 'block';
    manualBtn.style.display = 'none';
    
    // Focus on input
    setTimeout(() => {
        document.getElementById('pincodeInput').focus();
    }, 300);
}

function submitPincode() {
    const input = document.getElementById('pincodeInput');
    const pincode = input.value.trim();
    const error = $('locationError');
    
    if (pincode.length === 6 && /^\d+$/.test(pincode)) {
        setPincode(pincode);
        showToast('Pincode set: ' + pincode, 'success');
        $('locationOverlay').classList.remove('active');
        renderPage('home');
    } else {
        error.classList.add('show');
        error.textContent = 'Please enter a valid 6-digit pincode';
        input.classList.add('error');
        setTimeout(() => {
            input.classList.remove('error');
        }, 2000);
    }
}

function setPincode(pincode) {
    state.pincode = pincode;
    state.isPincodeSet = true;
    state.locationDetected = true;
    $('locationDisplay').textContent = pincode;
    
    // Save to Firestore if user is logged in
    if (state.user) {
        db.collection('users').doc(state.user.uid).update({
            defaultPincode: pincode,
            savedPincodes: firebase.firestore.FieldValue.arrayUnion(pincode)
        }).catch(() => {});
    }
    
    // Update products
    getProducts(pincode);
}

function showLocationModal() {
    $('locationOverlay').classList.add('active');
    showManualEntry();
}

// ============================================================
// RENDER ENGINE
// ============================================================
function renderAll() {
    updateHeader();
    renderPage(state.currentPage);
    updateCartBadge();
}

function updateHeader() {
    const avatar = $('headerAvatar');
    if (state.profile?.avatar) {
        avatar.src = state.profile.avatar;
    } else if (state.user) {
        avatar.src = state.avatars[0];
    } else {
        avatar.src = 'https://ui-avatars.com/api/?name=Guest&background=D6BD98&color=243B35&size=64';
    }
    
    if (state.pincode) {
        $('locationDisplay').textContent = state.pincode;
    } else {
        $('locationDisplay').textContent = 'Set Location';
    }
}

function updateCartBadge() {
    const count = state.cart?.length || 0;
    const badge = $('cartBadge');
    const navBadge = $('navCartBadge');
    if (count > 0) {
        badge.textContent = count;
        badge.style.display = 'flex';
        navBadge.textContent = count;
        navBadge.style.display = 'flex';
    } else {
        badge.style.display = 'none';
        navBadge.style.display = 'none';
    }
}

// ============================================================
// PAGE RENDERER
// ============================================================
async function renderPage(page) {
    state.currentPage = page;
    const pages = {
        'home': renderHome,
        'categories': renderCategories,
        'search': renderSearch,
        'cart': renderCart,
        'orders': renderOrders,

        'forgot-password': renderForgotPassword

}

// HOME PAGE
// ============================================================

        </div>
        
        <!-- Flash Deals -->
        ${state.flashDeals.length > 0 ? `

                <button class="see-all" onclick="showToast('All Deals','info')">See All</button>

function productCardHtml(p) {
    const inWishlist = state.wishlist.includes(p.id);
    const inCart = state.cart?.some(i => i.productId === p.id);
    const discount = p.basePrice && p.currentPrice ? Math.round((1 - p.currentPrice/p.basePrice) * 100) : 0;
    const isOutOfStock = (p.stockQuantity || 0) <= 0;
    
    return `
        <div class="product-card" data-id="${p.id}" data-name="${p.name.toLowerCase()}" onclick="viewProduct('${p.id}')">
            <div class="img-wrap">
                <img src="${p.images?.[0]?.url || 'https://via.placeholder.com/400x400?text=No+Image'}" 
                     alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x400?text=No+Image'" />
                ${discount > 0 ? `<span class="discount-badge">${discount}%</span>` : ''}
                ${isOutOfStock ? `<span style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.7);color:white;font-size:9px;padding:2px 10px;border-radius:50px;">Out of Stock</span>` : ''}
                <button class="wishlist-btn ${inWishlist ? 'liked' : ''}" onclick="event.stopPropagation();toggleWishlist('${p.id}')">
                    <i class="fas fa-heart"></i>
                </button>
            </div>
            <div class="info">
                <div class="name">${p.name}</div>
                <div class="price-row">
                    <span class="current">${formatCurrency(p.currentPrice || p.basePrice)}</span>
                    ${p.basePrice && p.currentPrice < p.basePrice ? `<span class="original">${formatCurrency(p.basePrice)}</span>` : ''}
                </div>
                <button class="add-btn ${inCart ? 'in-cart' : ''} ${isOutOfStock ? 'out-of-stock' : ''}" 
                        onclick="event.stopPropagation();addToCart('${p.id}')"
                        ${isOutOfStock ? 'disabled' : ''}>
                    ${isOutOfStock ? 'Out of Stock' : (inCart ? '✓ In Cart' : 'Add to Cart')}
                </button>
            </div>
        </div>
    `;
}

async function performPageSearch() {
    const input = document.getElementById('searchPageInput');
    if (!input) return;
    const query = input.value.trim();
    const container = document.getElementById('searchResults');
    
    if (query.length < 2) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-search"></i>
                <h4>Search for products</h4>
                <p>Enter keywords to find what you're looking for</p>
            </div>
        `;
        return;
    }
    
    const products = await getProducts(state.pincode);
    const results = products.filter(p => 
        p.name.toLowerCase().includes(query.toLowerCase()) || 
        (p.sku && p.sku.toLowerCase().includes(query.toLowerCase())) ||
        (p.category && p.category.toLowerCase().includes(query.toLowerCase()))
    );
    
    if (results.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-search"></i>
                <h4>No results found</h4>
                <p>Try searching with different keywords</p>

        `;
    } else {
        container.innerHTML = `
            <div style="margin-top:8px;">
                <div style="font-size:14px;color:var(--muted-text);margin-bottom:8px;">${results.length} results found</div>
                <div class="product-grid">
                    ${results.map(p => productCardHtml(p)).join('')}
                </div>
            </div>
        `;
    }
}

function performSearch() {
    const input = document.getElementById('searchInput');

// ============================================================
// FIRESTORE HELPERS
// ============================================================
async function getProducts(pincode = '') {
    try {
        let query = db.collection('products')
            .where('isActive', '==', true)
            .where('isDeleted', '==', false);
        
        if (pincode) {
            query = query.where('availablePincodes', 'array-contains', pincode);
        }
        
        const snap = await query.limit(30).get();
        const products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.products = products;
        return products;
    } catch (e) {
        return [];
    }
}

async function getFlashDeals() {
    try {
        const snap = await db.collection('flashDeals')
            .where('status', '==', 'active')
            .get();
        const deals = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.flashDeals = deals;
        return deals;
    } catch (e) {
        return [];
    }
}

async function getCart(uid) {
    try {
        const doc = await db.collection('carts').doc(uid).get();
        if (doc.exists) return { id: doc.id, ...doc.data() };
        return null;
    } catch (e) { return null; }
}

async function getOrders(uid) {
    try {
        const snap = await db.collection('orders')
            .where('userId', '==', uid)
            .orderBy('createdAt', 'desc')
            .get();
        return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { return []; }
}

// ============================================================
// CART OPERATIONS
// ============================================================
async function addToCart(productId) {
    if (!state.user) {
        showToast('Please login first', 'error');
        showLoginModal();
        return;
    }
    
    try {
        const p = await db.collection('products').doc(productId).get();
        if (!p.exists) { showToast('Product not found', 'error'); return; }
        const data = p.data();
        if (data.stockQuantity <= 0) { showToast('Out of stock', 'error'); return; }
        
        const cartRef = db.collection('carts').doc(state.user.uid);
        const cartDoc = await cartRef.get();
        let items = cartDoc.exists ? cartDoc.data().items || [] : [];
        
        const existing = items.find(i => i.productId === productId);
        if (existing) {
            existing.quantity += 1;
        } else {
            items.push({
                productId: productId,
                name: data.name,
                quantity: 1,
                priceAtAdd: data.currentPrice || data.basePrice,
                imageUrl: data.images?.[0]?.url || '',
                sku: data.sku || ''
            });
        }
        
        await cartRef.set({ userId: state.user.uid, items, updatedAt: getTS() }, { merge: true });
        state.cart = items;
        updateCartBadge();
        showToast('Added to cart!', 'success');
        renderPage(state.currentPage);
    } catch (e) {
        showToast(e.message, 'error');
    }
}

async function removeFromCart(productId) {
    if (!state.user) return;
    try {
        const cartRef = db.collection('carts').doc(state.user.uid);
        const cartDoc = await cartRef.get();
        if (!cartDoc.exists) return;
        let items = cartDoc.data().items || [];
        items = items.filter(i => i.productId !== productId);
        await cartRef.set({ items }, { merge: true });
        state.cart = items;
        updateCartBadge();
        showToast('Removed from cart', 'info');
        renderPage(state.currentPage);
    } catch (e) {
        showToast(e.message, 'error');
    }
}

async function updateCartQty(productId, change) {
    if (!state.user) return;
    try {
        const cartRef = db.collection('carts').doc(state.user.uid);
        const cartDoc = await cartRef.get();
        if (!cartDoc.exists) return;
        let items = cartDoc.data().items || [];
        const idx = items.findIndex(i => i.productId === productId);
        if (idx === -1) return;
        
        items[idx].quantity += change;
        if (items[idx].quantity <= 0) {
            items.splice(idx, 1);
        }
        await cartRef.set({ items }, { merge: true });
        state.cart = items;
        updateCartBadge();
        renderCart();
    } catch (e) {
        showToast(e.message, 'error');
    }
}

function goToCheckout() {
    if (state.cart.length === 0) {
        showToast('Cart is empty', 'error');
        return;
    }
    if (!state.pincode) {
        showToast('Please set your location first', 'warning');
        showLocationModal();
        return;
    }
    showToast('Checkout coming soon!', 'info');
}

// ============================================================
// WISHLIST OPERATIONS
// ============================================================
async function toggleWishlist(productId) {
    if (!state.user) {
        showToast('Please login first', 'error');
        showLoginModal();
        return;
    }
    
    const idx = state.wishlist.indexOf(productId);
    if (idx > -1) {
        state.wishlist.splice(idx, 1);
        showToast('Removed from wishlist', 'info');
    } else {
        state.wishlist.push(productId);
        showToast('Added to wishlist ❤️', 'success');
    }
    
    try {
        await db.collection('users').doc(state.user.uid).update({
            wishlist: state.wishlist
        });
    } catch (e) {}
    
    renderPage(state.currentPage);
}

function startCountdown(elementId, endTime) {
    const el = document.getElementById(elementId);
    if (!el) return;
    
    const end = endTime.seconds ? endTime.seconds * 1000 : new Date(endTime).getTime();
    
    function update() {
        const now = Date.now();
        const diff = Math.max(0, end - now);
        const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
        const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
        const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
        el.textContent = `${h}:${m}:${s}`;
        if (diff <= 0) el.textContent = '00:00:00';
    }
    update();
    setInterval(update, 1000);
}

async function viewDeal(dealId) {
    const deal = await db.collection('flashDeals').doc(dealId).get();
    if (!deal.exists) return;
    const d = deal.data();
    const products = [];
    for (const pid of (d.productIds || [])) {
        const p = await db.collection('products').doc(pid).get();
        if (p.exists) products.push({ id: p.id, ...p.data() });
    }
    
    openModal(`
        <h3>⚡ ${d.name}</h3>
        <p class="text-muted">${d.discountPercentage}% OFF</p>
        ${products.length === 0 ? `<p class="text-muted">No products in this deal</p>` : 
        products.map(p => `
            <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--light-border);align-items:center;">
                <img src="${p.images?.[0]?.url || 'https://via.placeholder.com/40x40'}" 
                     style="width:40px;height:40px;object-fit:cover;border-radius:6px;" />
                <div style="flex:1;font-weight:600;font-size:13px;">${p.name}</div>
                <div style="font-weight:700;color:var(--primary-forest);">${formatCurrency(p.currentPrice)}</div>
            </div>
        `).join('')}
        <button class="btn btn-primary" onclick="closeModal()">Close</button>
    `);
}

function filterCategory(cat) {
    qsa('.category-pill').forEach(el => {
        el.classList.toggle('active', el.textContent.trim() === cat);
    });
    const cards = qsa('#productGrid .product-card');
    cards.forEach(card => {
        const name = card.dataset.name || '';
        const match = cat === 'All' || name.includes(cat.toLowerCase());
        card.style.display = match ? '' : 'none';
    });
}

async function registerUser(email, password, name) {
    try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const defaultAvatar = state.avatars[0];
        
        const userData = {
            uid: cred.user.uid,
            email: email,
            username: name,
            displayName: name,
            avatar: defaultAvatar,
            status: 'active',
            suspensionReason: null,
            wallet: { pCoins: 0, pCash: 0, totalLifetimePCoins: 0, totalLifetimePCash: 0 },
            wishlist: [],
            defaultPincode: state.pincode || '',
            savedPincodes: state.pincode ? [state.pincode] : [],
            role: 'user',
            createdAt: getTS(),
            lastLoginAt: getTS()
        };
        await db.collection('users').doc(cred.user.uid).set(userData);
        state.registeredUser = userData;
        state.user = cred.user;
        state.profile = userData;
        return { success: true, user: userData };
    } catch (e) {
        return { success: false, error: e.message };
    }
}

async function loginUser(email, password) {
    try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const doc = await db.collection('users').doc(cred.user.uid).get();
        if (!doc.exists) throw new Error('User profile not found');
        const userData = doc.data();
        
        if (userData.status === 'blocked' || userData.status === 'suspended') {
            await auth.signOut();
            throw new Error(`Account ${userData.status}. ${userData.suspensionReason || 'Contact support.'}`);
        }
        
        const token = await cred.user.getIdTokenResult();
        const isAdmin = token.claims?.admin === true || userData.role === 'admin';
        state.isAdmin = isAdmin;
        state.user = cred.user;
        state.profile = userData;
        
        return { success: true, user: userData, isAdmin };
    } catch (e) {
        return { success: false, error: e.message };
    }
}

async function logoutUser() {
    await auth.signOut();
    state.user = null;
    state.profile = null;
    state.isAdmin = false;
    state.cart = [];
    state.orders = [];
    state.wishlist = [];
    state.registeredUser = null;
    state.appliedCoupon = null;
    showToast('Logged out successfully', 'info');
    renderAll();
}

// AUTH STATE LISTENER
// ============================================================
auth.onAuthStateChanged(async (user) => {
    state.user = user;
    if (user) {
        try {
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists) {
                state.profile = { id: doc.id, ...doc.data() };
                state.wishlist = state.profile.wishlist || [];
                if (state.profile.defaultPincode) {
                    state.pincode = state.profile.defaultPincode;
                    state.isPincodeSet = true;
                    $('locationDisplay').textContent = state.pincode;
                }
                const token = await user.getIdTokenResult();
                const isAdmin = token.claims?.admin === true || state.profile.role === 'admin';
                state.isAdmin = isAdmin;
            }
            const cartData = await getCart(user.uid);
            state.cart = cartData?.items || [];
            state.orders = await getOrders(user.uid);
            await getFlashDeals();
        } catch (e) {
            console.error('Profile load error:', e);
        }
    } else {
        state.profile = null;
        state.isAdmin = false;
        state.cart = [];
        state.orders = [];
        state.wishlist = [];
        state.registeredUser = null;
        state.appliedCoupon = null;
    }
    renderAll();
});
