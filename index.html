<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pawan Retail - Complete E-Commerce</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    
    <style>
        /* ============================================================
           COMPLETE STYLES
           ============================================================ */
        :root {
            --primary: #243B35;
            --primary-light: #2d4d45;
            --secondary: #7c3aed;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --almond: #D6BD98;
            --sage: #78917C;
            --cta: #C86B4A;
            --dark: #17201D;
            --gray: #6B756F;
            --gray-light: #94a3b8;
            --bg: #F6F1E8;
            --white: #ffffff;
            --shadow: 0 2px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --nav-height: 68px;
            --header-height: 56px;
            --light-border: #E4DED2;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--dark);
            min-height: 100vh;
        }
        
        /* ----- SPLASH SCREEN ----- */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        #splashScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #splashScreen .logo {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary);
            animation: splashLogo 1s ease;
        }
        #splashScreen .logo span { color: var(--cta); }
        #splashScreen .tagline {
            font-size: 16px;
            color: var(--gray);
            margin-top: 8px;
            animation: splashFade 1.2s ease;
        }
        #splashScreen .loader {
            margin-top: 30px;
            width: 40px;
            height: 40px;
            border: 3px solid var(--light-border);
            border-top-color: var(--cta);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes splashLogo {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes splashFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ----- APP SHELL ----- */
        .app-shell {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg);
            display: none;
            flex-direction: column;
            position: relative;
        }
        .app-shell.active { display: flex; }
        
        /* ----- HEADER ----- */
        .app-header {
            background: var(--primary);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--header-height);
        }
        .app-header .logo {
            font-size: 17px;
            font-weight: 800;
            color: var(--white);
        }
        .app-header .logo span { color: var(--almond); }
        .app-header .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .app-header .header-actions button {
            background: none;
            border: none;
            font-size: 16px;
            color: var(--white);
            cursor: pointer;
            padding: 4px;
            position: relative;
        }
        .app-header .header-actions button:hover { opacity: 0.8; }
        .user-avatar-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--almond);
            cursor: pointer;
        }
        .badge-dot {
            position: absolute;
            top: -2px;
            right: -4px;
            width: 7px;
            height: 7px;
            background: var(--cta);
            border-radius: 50%;
            border: 2px solid var(--primary);
        }
        .badge-count {
            position: absolute;
            top: -4px;
            right: -6px;
            background: var(--cta);
            color: var(--white);
            font-size: 8px;
            font-weight: 700;
            min-width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
        }
        
        /* ----- SEARCH BAR ----- */
        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.12);
            border-radius: 50px;
            padding: 4px 12px;
            flex: 1;
            max-width: 300px;
            transition: all 0.3s;
        }
        .search-bar:focus-within {
            background: rgba(255,255,255,0.2);
        }
        .search-bar input {
            background: none;
            border: none;
            color: var(--white);
            padding: 6px 8px;
            font-size: 13px;
            width: 100%;
            outline: none;
        }
        .search-bar input::placeholder { color: rgba(255,255,255,0.6); }
        .search-bar button {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
        }
        
        /* ----- MAIN CONTENT ----- */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 80px;
            -webkit-overflow-scrolling: touch;
        }
        .main-content::-webkit-scrollbar { width: 0; display: none; }
        
        /* ----- BOTTOM NAV ----- */
        .bottom-nav {
            background: var(--white);
            border-top: 1px solid var(--light-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
            flex-shrink: 0;
            height: var(--nav-height);
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 480px;
            width: 100%;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.04);
            z-index: 200;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            transition: all 0.2s;
            min-width: 40px;
            position: relative;
        }
        .bottom-nav .nav-item i {
            font-size: 17px;
            color: var(--gray-light);
            transition: all 0.2s;
        }
        .bottom-nav .nav-item span {
            font-size: 8px;
            font-weight: 600;
            color: var(--gray-light);
            transition: all 0.2s;
        }
        .bottom-nav .nav-item.active i {
            color: var(--primary);
            transform: translateY(-2px);
        }
        .bottom-nav .nav-item.active span {
            color: var(--primary);
        }
        .bottom-nav .nav-item .nav-badge {
            position: absolute;
            top: -4px;
            right: -6px;
            background: var(--cta);
            color: var(--white);
            font-size: 8px;
            font-weight: 700;
            min-width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
        }
        
        /* ----- PAGES ----- */
        .page {
            display: none;
            animation: fadeUp 0.3s ease;
            padding-top: 8px;
        }
        .page.active { display: block; }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* ----- CARDS ----- */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 12px 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }
        .card:active { transform: scale(0.99); }
        
        /* ----- BUTTONS ----- */
        .btn {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-success { background: var(--success); color: var(--white); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-warning { background: var(--warning); color: var(--white); }
        .btn-cta { background: var(--cta); color: var(--white); }
        .btn-cta:hover { background: #b85d3d; }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-ghost {
            background: transparent;
            color: var(--gray);
            border: 1px solid var(--light-border);
        }
        .btn-sm { padding: 4px 10px; font-size: 11px; width: auto; }
        .btn-block { width: 100%; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* ----- FORMS ----- */
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--dark);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid var(--light-border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: var(--bg);
            transition: all 0.2s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--sage);
            background: var(--white);
        }
        .form-group .error-text {
            color: var(--danger);
            font-size: 11px;
            margin-top: 4px;
            display: none;
        }
        .form-group .error-text.show { display: block; }
        .form-group textarea { min-height: 50px; resize: vertical; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        /* ----- HERO BANNER ----- */
        .hero-banner {
            background: linear-gradient(135deg, var(--primary), var(--sage));
            border-radius: var(--radius);
            padding: 18px 20px;
            color: var(--white);
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            min-height: 130px;
            display: flex;
            align-items: center;
        }
        .hero-banner .content { flex: 1; z-index: 2; }
        .hero-banner .content .tag {
            background: rgba(255,255,255,0.15);
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 9px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 4px;
        }
        .hero-banner .content h2 { font-size: 19px; font-weight: 800; line-height: 1.2; }
        .hero-banner .content p { font-size: 12px; opacity: 0.8; margin: 2px 0 8px; }
        .hero-banner .content .btn { width: auto; padding: 5px 16px; font-size: 11px; background: var(--white); color: var(--primary); }
        .hero-banner .art {
            position: absolute;
            right: -10px;
            bottom: -20px;
            font-size: 70px;
            opacity: 0.08;
            z-index: 1;
        }
        .hero-banner .dots {
            position: absolute;
            bottom: 10px;
            right: 14px;
            display: flex;
            gap: 4px;
            z-index: 3;
        }
        .hero-banner .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s;
            cursor: pointer;
        }
        .hero-banner .dots span.active {
            background: var(--white);
            width: 16px;
            border-radius: 4px;
        }
        
        /* ----- CATEGORY SCROLL ----- */
        .category-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0 8px;
            -webkit-overflow-scrolling: touch;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        .category-pill {
            flex-shrink: 0;
            padding: 4px 12px;
            border-radius: 50px;
            background: var(--white);
            border: 1.5px solid var(--light-border);
            font-size: 10px;
            font-weight: 600;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .category-pill.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }
        .category-pill:active { transform: scale(0.95); }
        
        /* ----- PRODUCT GRID ----- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 6px;
        }
        .product-item {
            background: var(--white);
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            cursor: pointer;
        }
        .product-item:active { transform: scale(0.97); }
        .product-item .img-wrap {
            position: relative;
            padding-top: 100%;
            background: var(--bg);
        }
        .product-item .img-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-item .img-wrap .discount-tag {
            position: absolute;
            top: 4px;
            left: 4px;
            background: var(--cta);
            color: var(--white);
            font-size: 8px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 50px;
        }
        .product-item .img-wrap .wishlist-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .product-item .img-wrap .wishlist-btn.liked { color: var(--cta); }
        .product-item .img-wrap .stock-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0,0,0,0.7);
            color: var(--white);
            font-size: 7px;
            padding: 2px 6px;
            border-radius: 50px;
        }
        .product-item .info {
            padding: 6px 8px 8px;
        }
        .product-item .info .name {
            font-size: 11px;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 26px;
            line-height: 1.3;
        }
        .product-item .info .price-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }
        .product-item .info .price-row .current {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }
        .product-item .info .price-row .old {
            font-size: 10px;
            color: var(--gray-light);
            text-decoration: line-through;
        }
        .product-item .info .rating {
            font-size: 9px;
            color: var(--sage);
            margin-top: 2px;
        }
        .product-item .info .add-btn {
            width: 100%;
            margin-top: 4px;
            padding: 4px;
            border: none;
            border-radius: 4px;
            background: var(--primary);
            color: var(--white);
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .product-item .info .add-btn:active { transform: scale(0.96); }
        .product-item .info .add-btn.in-cart { background: var(--sage); }
        .product-item .info .add-btn.out-of-stock { background: var(--gray); cursor: not-allowed; }
        
        /* ----- FLASH DEAL ----- */
        .flash-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 8px;
            -webkit-overflow-scrolling: touch;
        }
        .flash-scroll::-webkit-scrollbar { display: none; }
        .flash-card {
            flex-shrink: 0;
            width: 170px;
            background: var(--white);
            border-radius: var(--radius-sm);
            padding: 10px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--cta);
        }
        .flash-card .flash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .flash-card .flash-header .tag {
            background: var(--cta);
            color: var(--white);
            font-size: 8px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 50px;
        }
        .flash-card .flash-header .countdown {
            font-size: 12px;
            font-weight: 700;
            color: var(--cta);
            font-variant-numeric: tabular-nums;
        }
        .flash-card .flash-name {
            font-weight: 600;
            font-size: 11px;
        }
        .flash-card .flash-discount {
            font-size: 16px;
            font-weight: 800;
            color: var(--cta);
        }
        
        /* ----- ORDER ITEM ----- */
        .order-item {
            background: var(--white);
            border-radius: var(--radius-sm);
            padding: 10px;
            margin-bottom: 8px;
            box-shadow: var(--shadow);
        }
        .order-item .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .order-item .order-id {
            font-weight: 600;
            font-size: 11px;
        }
        .order-item .order-status {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 50px;
        }
        .order-item .order-status.processing { background: #fef3c7; color: #92400e; }
        .order-item .order-status.shipped { background: #dbeafe; color: #1e40af; }
        .order-item .order-status.delivered { background: #dcfce7; color: #166534; }
        .order-item .order-status.cancelled { background: #fee2e2; color: #991b1b; }
        .order-item .order-status.cancellation_requested { background: #fef3c7; color: #92400e; }
        .order-item .order-items { font-size: 10px; color: var(--gray); }
        .order-item .order-total {
            font-weight: 700;
            font-size: 14px;
            color: var(--primary);
        }
        .order-item .order-tracking {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .order-item .order-tracking .step {
            flex: 1;
            text-align: center;
            padding: 2px;
            border-radius: 4px;
            font-size: 8px;
            background: var(--bg);
            color: var(--gray);
        }
        .order-item .order-tracking .step.done {
            background: #dcfce7;
            color: #166534;
        }
        .order-item .order-tracking .step.active {
            background: #dbeafe;
            color: #1e40af;
            font-weight: 700;
        }
        
        /* ----- WALLET CARD ----- */
        .wallet-card {
            background: linear-gradient(135deg, var(--primary), var(--sage));
            border-radius: var(--radius);
            padding: 14px 16px;
            color: var(--white);
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .wallet-card:active { transform: scale(0.98); }
        .wallet-card .wallet-label { font-size: 11px; opacity: 0.8; }
        .wallet-card .wallet-row {
            display: flex;
            gap: 14px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }
        .wallet-card .wallet-row .item .num {
            font-size: 17px;
            font-weight: 700;
        }
        .wallet-card .wallet-row .item .lbl {
            font-size: 9px;
            opacity: 0.7;
        }
        
        /* ----- TRANSACTION ----- */
        .transaction-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid var(--light-border);
        }
        .transaction-item:last-child { border-bottom: none; }
        .transaction-item .icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        .transaction-item .icon.credit { background: #dcfce7; color: #166534; }
        .transaction-item .icon.debit { background: #fee2e2; color: #991b1b; }
        .transaction-item .info { flex: 1; }
        .transaction-item .info .title {
            font-weight: 600;
            font-size: 11px;
        }
        .transaction-item .info .sub {
            font-size: 9px;
            color: var(--gray);
        }
        .transaction-item .amount {
            font-weight: 700;
            font-size: 12px;
        }
        .transaction-item .amount.credit { color: var(--success); }
        .transaction-item .amount.debit { color: var(--danger); }
        
        /* ----- COUPON INPUT ----- */
        .coupon-input {
            display: flex;
            gap: 6px;
        }
        .coupon-input input {
            flex: 1;
            padding: 6px 10px;
            border: 2px solid var(--light-border);
            border-radius: var(--radius-sm);
            font-size: 12px;
        }

// ============================================================

function $(id) { return document.getElementById(id); }
function qs(sel, ctx = document) { return ctx.querySelector(sel); }
function qsa(sel, ctx = document) { return ctx.querySelectorAll(sel); }

function formatCurrency(amt) { return '₹' + Number(amt).toFixed(2); }
function getTS() { return firebase.firestore.FieldValue.serverTimestamp(); }
function generateOrderId() { return 'ORD' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substring(2, 5).toUpperCase(); }
function formatDate(ts) {
    if (!ts) return 'N/A';
    const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function formatDateTime(ts) {
    if (!ts) return 'N/A';
    const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
    return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function showToast(msg, type = 'info') {
    const c = $('toastContainer');
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'scale(0.9)';
        setTimeout(() => t.remove(), 300);
    }, 3000);
}

function openModal(html) {
    $('modalBody').innerHTML = html;
    $('modalOverlay').classList.add('active');
}
function closeModal() { $('modalOverlay').classList.remove('active'); }

$('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// ============================================================
// NAVIGATION
// ============================================================
function navigateTo(page) {
    state.currentPage = page;
    qsa('.bottom-nav .nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
    });
    renderPage(page);
    $('mainContent').scrollTop = 0;
}

// ============================================================
// RENDER ENGINE
// ============================================================
function renderAll() {
    updateHeader();
    renderPage(state.currentPage);
    updateCartBadge();
}

function updateHeader() {
    const avatar = $('headerAvatar');
    const adminBadge = $('adminBadgeHeader');
    
    if (state.profile?.avatar) {
        avatar.src = state.profile.avatar;
    } else if (state.user) {
        avatar.src = state.avatars[0];
    } else {
        avatar.src = 'https://ui-avatars.com/api/?name=Guest&background=D6BD98&color=243B35&size=64';
    }
    
    if (state.isAdmin) {
        adminBadge.classList.remove('hidden');
    } else {
        adminBadge.classList.add('hidden');
    }
}

function updateCartBadge() {
    const count = state.cart?.length || 0;
    const badge = $('cartBadge');
    const navBadge = $('cartNavBadge');
    if (count > 0) {
        badge.textContent = count;
        badge.style.display = 'flex';
        navBadge.textContent = count;
        navBadge.style.display = 'flex';
    } else {
        badge.style.display = 'none';
        navBadge.style.display = 'none';
    }
}

        'admin': renderAdmin,
        'login': renderLogin,
        'register': renderRegister,
        'forgot-password': renderForgotPassword
    };
    if (pages[page]) await pages[page]();
}

function productCardHtml(p) {
    const inWishlist = state.wishlist.includes(p.id);
    const inCart = state.cart?.some(i => i.productId === p.id);
    const discount = p.basePrice && p.currentPrice ? Math.round((1 - p.currentPrice/p.basePrice) * 100) : 0;
    const isOutOfStock = (p.stockQuantity || 0) <= 0;
    const rating = p.rating || 0;
    const starHtml = '★'.repeat(Math.floor(rating)) + '☆'.repeat(5 - Math.floor(rating));
    
    return `
        <div class="product-item" data-id="${p.id}" data-name="${p.name.toLowerCase()}" onclick="viewProduct('${p.id}')">
            <div class="img-wrap">
                <img src="${p.images?.[0]?.url || 'https://via.placeholder.com/300x300?text=No+Image'}" 
                     alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'" />
                ${discount > 0 ? `<span class="discount-tag">${discount}%</span>` : ''}
                ${isOutOfStock ? `<span class="stock-badge">Out of Stock</span>` : ''}
                <button class="wishlist-btn ${inWishlist ? 'liked' : ''}" onclick="event.stopPropagation();toggleWishlist('${p.id}')">
                    <i class="fas fa-heart"></i>
                </button>
            </div>
            <div class="info">
                <div class="name">${p.name}</div>
                ${rating > 0 ? `<div class="rating">${starHtml}</div>` : ''}
                <div class="price-row">
                    <span class="current">${formatCurrency(p.currentPrice || p.basePrice)}</span>
                    ${p.basePrice && p.currentPrice < p.basePrice ? `<span class="old">${formatCurrency(p.basePrice)}</span>` : ''}
                </div>
                <button class="add-btn ${inCart ? 'in-cart' : ''} ${isOutOfStock ? 'out-of-stock' : ''}" 
                        onclick="event.stopPropagation();addToCart('${p.id}')"
                        ${isOutOfStock ? 'disabled' : ''}>
                    ${isOutOfStock ? 'Out of Stock' : (inCart ? '✓ In Cart' : 'Add to Cart')}

            </div>
        </div>
    `;
}

async function updateCartQty(productId, change) {
    if (!state.user) return;
    try {
        const cartRef = db.collection('carts').doc(state.user.uid);
        const cartDoc = await cartRef.get();
        if (!cartDoc.exists) return;
        let items = cartDoc.data().items || [];
        const idx = items.findIndex(i => i.productId === productId);
        if (idx === -1) return;
        
        items[idx].quantity += change;
        if (items[idx].quantity <= 0) {
            items.splice(idx, 1);
        }
        await cartRef.set({ items }, { merge: true });
        state.cart = items;
        updateCartBadge();
        renderCart();
    } catch (e) {
        showToast(e.message, 'error');
    }
}

function applyCoupon() {
    const input = document.getElementById('couponInput');
    if (!input) return;
    const code = input.value.trim().toUpperCase();
    if (!code) { showToast('Enter a coupon code', 'warning'); return; }
    
    // Check against Firestore coupons
    db.collection('coupons')
        .where('code', '==', code)
        .where('isActive', '==', true)
        .get()
        .then(snap => {
            if (!snap.empty) {
                const coupon = snap.docs[0].data();
                const now = new Date();
                if (coupon.validFrom && coupon.validUntil) {
                    const validFrom = coupon.validFrom.toDate ? coupon.validFrom.toDate() : new Date(coupon.validFrom);
                    const validUntil = coupon.validUntil.toDate ? coupon.validUntil.toDate() : new Date(coupon.validUntil);
                    if (now < validFrom) {
                        showToast('Coupon not yet active', 'error');
                        return;
                    }
                    if (now > validUntil) {
                        showToast('Coupon expired', 'error');
                        return;
                    }
                }
                state.appliedCoupon = code;
                showToast('Coupon applied!', 'success');
                renderCart();
            } else {
                showToast('Invalid coupon code', 'error');
            }
        })
        .catch(() => {
            showToast('Error validating coupon', 'error');
        });
}

function goToCheckout() {

async function placeOrderCheckout() {
    if (!state.user) { showToast('Please login', 'error'); return; }
    if (state.cart.length === 0) { showToast('Cart is empty', 'error'); return; }
    
    const name = document.getElementById('checkoutName')?.value.trim() || state.profile?.displayName || '';
    const phone = document.getElementById('checkoutPhone')?.value.trim() || '';
    const address = document.getElementById('checkoutAddress')?.value.trim() || 'Demo Address';
    const city = document.getElementById('checkoutCity')?.value.trim() || 'Mumbai';
    const stateVal = document.getElementById('checkoutState')?.value.trim() || 'Maharashtra';
    const pincode = document.getElementById('checkoutPincode')?.value.trim() || state.pincode || '400001';
    
    if (!name) { showToast('Name is required', 'error'); return; }
    if (pincode.length !== 6) { showToast('Valid pincode required', 'error'); return; }
    
    const items = state.cart;
    const subtotal = items.reduce((s, i) => s + i.priceAtAdd * i.quantity, 0);
    const deliveryCharge = 50;
    const tax = subtotal * 0.12;
    let discount = 0;
    if (state.appliedCoupon) {
        discount = subtotal * 0.10;
    }
    const total = subtotal + deliveryCharge + tax - discount;
    
    // Validate stock
    for (const item of items) {
        const prodSnap = await db.collection('products').doc(item.productId).get();
        if (!prodSnap.exists) {
            showToast(`Product ${item.name} not found`, 'error');
            return;
        }
        const prodData = prodSnap.data();
        if ((prodData.stockQuantity || 0) < item.quantity) {
            showToast(`Insufficient stock for ${item.name}`, 'error');
            return;
        }
    }
    
    const orderData = {
        orderId: generateOrderId(),
        userId: state.user.uid,
        items: items,
        pricing: {
            subtotal: subtotal,
            totalDiscount: discount,
            taxAmount: tax,
            deliveryCharge: deliveryCharge,
            grandTotal: total,
            appliedDiscount: state.appliedCoupon ? { type: 'coupon', value: discount, referenceId: state.appliedCoupon } : null
        },
        payment: {
            method: 'cod',
            transactionId: 'TXN' + Date.now(),
            paymentStatus: 'pending',
            amount: total
        },
        shipping: {
            address: { name, phone, addressLine1: address, city, state: stateVal, pincode, country: 'India' },
            deliveryMethod: 'standard',
            estimatedDelivery: new Date(Date.now() + 7*86400000).toISOString()
        },
        status: 'processing',
        statusHistory: [{ status: 'processing', timestamp: new Date().toISOString(), note: 'Order placed' }],
        tracking: {
            steps: [
                { status: 'Order Placed', timestamp: new Date().toISOString(), done: true },
                { status: 'Confirmed', timestamp: '', done: false },
                { status: 'Processing', timestamp: '', done: false },
                { status: 'Shipped', timestamp: '', done: false },
                { status: 'Out for Delivery', timestamp: '', done: false },
                { status: 'Delivered', timestamp: '', done: false }
            ]
        },
        createdAt: getTS()
    };
    
    try {
        // Update stock
        for (const item of items) {
            await db.collection('products').doc(item.productId).update({
                stockQuantity: firebase.firestore.FieldValue.increment(-item.quantity),
                soldCount: firebase.firestore.FieldValue.increment(item.quantity)
            });
        }
        
        const orderRef = await db.collection('orders').add(orderData);
        await db.collection('carts').doc(state.user.uid).set({ items: [] });
        state.cart = [];
        state.appliedCoupon = null;
        updateCartBadge();
        state.lastOrderId = orderRef.id;
        navigateTo('order-success');
        showToast('Order placed! 🎉', 'success');
    } catch (e) {
        showToast('Order failed: ' + e.message, 'error');
    }
}

    }
    
    const orders = await getOrders(state.user.uid);
    state.orders = orders;
    
    let html = `
        <div style="padding:4px 0 6px;">
            <h2 style="font-size:17px;font-weight:800;"><i class="fas fa-list-ul"></i> Orders</h2>
            <p style="font-size:11px;color:var(--gray);">${orders.length} orders</p>

    `;
    
    if (orders.length === 0) {
        html += `
            <div class="empty-state">
                <i class="fas fa-box-open"></i>
                <h4>No Orders Yet</h4>
                <p>Start shopping to see your orders here</p>
                <button class="btn btn-primary" style="margin-top:8px;width:auto;padding:6px 24px;display:inline-flex;" onclick="navigateTo('home')">Start Shopping</button>
            </div>
        `;
    } else {
        html += orders.map(o => {
            const steps = o.tracking?.steps || [];
            return `
                <div class="order-item">
                    <div class="order-top">
                        <span class="order-id">#${o.orderId || o.id.slice(0, 8)}</span>
                        <span class="order-status ${o.status}">${o.status}</span>
                    </div>
                    <div class="order-items">
                        ${o.items?.slice(0, 2).map(i => `${i.name} × ${i.quantity}`).join(', ')}
                        ${o.items?.length > 2 ? ` + ${o.items.length - 2} more` : ''}
                    </div>
                    <div class="order-total">${formatCurrency(o.pricing?.grandTotal || 0)}</div>
                    ${o.shipping?.address ? `
                        <div style="font-size:9px;color:var(--gray);margin-top:2px;">
                            <i class="fas fa-map-pin"></i> ${o.shipping.address.city}, ${o.shipping.address.pincode}
                        </div>
                    ` : ''}
                    
                    <!-- Order Tracking -->
                    <div class="order-tracking">
                        ${['Order Placed', 'Confirmed', 'Processing', 'Shipped', 'Out for Delivery', 'Delivered'].map((step, i) => {
                            const statusMap = { 'Order Placed': 0, 'Confirmed': 1, 'Processing': 2, 'Shipped': 3, 'Out for Delivery': 4, 'Delivered': 5 };
                            const currentIndex = statusMap[o.status] !== undefined ? statusMap[o.status] : 0;
                            const isDone = i <= currentIndex;
                            const isActive = i === currentIndex;
                            return `
                                <div class="step ${isDone ? 'done' : ''} ${isActive ? 'active' : ''}">
                                    ${step}
                                </div>
                            `;
                        }).join('')}
                    </div>
                    
                    ${o.status === 'processing' || o.status === 'pending' ? `
                        <button class="btn btn-sm btn-danger" style="margin-top:4px;padding:2px 10px;font-size:9px;" onclick="requestCancel('${o.id}')">
                            Request Cancellation
                        </button>
                    ` : ''}
                    ${o.status === 'cancelled' && o.cancellation?.adminUTRNNumber ? `
                        <div style="font-size:9px;color:var(--gray);margin-top:4px;">
                            <i class="fas fa-check-circle" style="color:var(--success);"></i> 
                            Refunded UTR: ${o.cancellation.adminUTRNNumber}
                        </div>
                    ` : ''}
                    ${o.status === 'cancellation_requested' ? `
                        <div style="font-size:9px;color:var(--warning);margin-top:4px;">
                            <i class="fas fa-clock"></i> Cancellation pending approval
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }
    
    container.innerHTML = html;
}

async function adjustWallet(userId) {
    const walletType = document.getElementById('walletType').value;
    const txnType = document.getElementById('txnType').value;
    const amount = parseFloat(document.getElementById('walletAmount').value);
    const reason = document.getElementById('walletReason').value.trim();
    
    if (!amount || amount <= 0) { showToast('Valid amount required', 'error'); return; }
    if (!reason) { showToast('Reason is mandatory', 'error'); return; }
    
    try {
        const userRef = db.collection('users').doc(userId);
        const userSnap = await userRef.get();
        if (!userSnap.exists) { showToast('User not found', 'error'); return; }
        const userData = userSnap.data();
        
        const field = walletType === 'pcoin' ? 'wallet.pCoins' : 'wallet.pCash';
        const currentBalance = walletType === 'pcoin' ? (userData.wallet?.pCoins || 0) : (userData.wallet?.pCash || 0);
        const newBalance = txnType === 'credit' ? currentBalance + amount : currentBalance - amount;
        
        if (newBalance < 0) { showToast('Insufficient balance', 'error'); return; }
        
        await userRef.update({
            [field]: newBalance,
            updatedAt: getTS()
        });
        
        await db.collection('walletTransactions').add({
            userId: userId,
            type: txnType,
            walletType: walletType,
            amount: amount,
            balanceAfter: newBalance,
            source: 'admin_adjustment',
            adminId: state.user?.uid,
            reason: reason,
            createdAt: getTS()
        });
        
        closeModal();
        showToast(`Wallet adjusted! ${txnType === 'credit' ? '+' : '-'} ${amount} ${walletType}`, 'success');
        renderPage('admin');
    } catch (e) {
        showToast(e.message, 'error');
    }
}

async function submitCancel(orderId) {
    const method = document.getElementById('cancelMethod').value;
    let details = {};
    
    if (method === 'upi') {
        const upi = document.getElementById('cancelUpi').value.trim();
        if (!upi) { showToast('UPI ID is required', 'error'); return; }
        details = { type: 'upi', upiId: upi };
    } else {
        const acc = document.getElementById('cancelBankAcc').value.trim();
        const ifsc = document.getElementById('cancelIfsc').value.trim();
        const holder = document.getElementById('cancelHolder').value.trim();
        if (!acc || !ifsc || !holder) { showToast('All bank fields are required', 'error'); return; }
        details = { type: 'bank', bankAccount: { accountNumber: acc, ifsc, accountHolder: holder } };
    }
    
    try {
        await db.collection('orders').doc(orderId).update({
            status: 'cancellation_requested',
            cancellation: {
                requestedAt: new Date().toISOString(),
                refundDetails: details
            },

function startCountdown(elementId, endTime) {
    const el = document.getElementById(elementId);
    if (!el) return;
    
    const end = endTime.seconds ? endTime.seconds * 1000 : new Date(endTime).getTime();
    
    function update() {
        const now = Date.now();
        const diff = Math.max(0, end - now);
        const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
        const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
        const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
        el.textContent = `${h}:${m}:${s}`;
        if (diff <= 0) el.textContent = '00:00:00';
    }
    update();
    setInterval(update, 1000);
}

async function registerUser(email, password, name) {
    try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const defaultAvatar = state.avatars[0];
        
        const userData = {
            uid: cred.user.uid,
            email: email,
            username: name,
            displayName: name,
            avatar: defaultAvatar,
            status: 'active',
            suspensionReason: null,
            wallet: { pCoins: 0, pCash: 0, totalLifetimePCoins: 0, totalLifetimePCash: 0 },
            wishlist: [],
            defaultPincode: state.pincode || '',
            savedPincodes: state.pincode ? [state.pincode] : [],
            role: 'user',
            createdAt: getTS(),
            lastLoginAt: getTS()
        };
        await db.collection('users').doc(cred.user.uid).set(userData);
        state.registeredUser = userData;
        state.user = cred.user;
        state.profile = userData;
        return { success: true, user: userData };
    } catch (e) {
        return { success: false, error: e.message };
    }
}

async function loginUser(email, password) {
    try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const doc = await db.collection('users').doc(cred.user.uid).get();
        if (!doc.exists) throw new Error('User profile not found');
        const userData = doc.data();
        
        if (userData.status === 'blocked' || userData.status === 'suspended') {
            await auth.signOut();
            throw new Error(`Account ${userData.status}. ${userData.suspensionReason || 'Contact support.'}`);
        }
        
        const token = await cred.user.getIdTokenResult();
        const isAdmin = token.claims?.admin === true || userData.role === 'admin';
        state.isAdmin = isAdmin;
        state.user = cred.user;
        state.profile = userData;
        
        return { success: true, user: userData, isAdmin };
    } catch (e) {
        return { success: false, error: e.message };
    }
}

async function logoutUser() {
    await auth.signOut();
    state.user = null;
    state.profile = null;
    state.isAdmin = false;
    state.cart = [];
    state.orders = [];
    state.wishlist = [];
    state.registeredUser = null;
    state.appliedCoupon = null;
    showToast('Logged out successfully', 'info');

function showChangeAvatar() {
    const currentAvatar = state.profile?.avatar || state.avatars[0];
    
    openModal(`
        <h3>Change Avatar</h3>
        <p class="text-muted">Select your profile picture</p>
        <div class="avatar-grid">
            ${state.avatars.map((url, i) => `
                <img src="${url}" class="avatar-option ${url === currentAvatar ? 'selected' : ''}" 
                     onclick="selectAvatarUpdate(${i})" />
            `).join('')}
        </div>
        <button class="btn btn-primary" onclick="updateAvatar()">Save Avatar</button>
    `);
}

let newAvatarIndex = -1;

function selectAvatarUpdate(index) {
    newAvatarIndex = index;
    qsa('#modalBody .avatar-option').forEach((el, i) => {
        el.classList.toggle('selected', i === index);
    });
}

async function updateAvatar() {
    if (newAvatarIndex === -1) { showToast('Please select an avatar', 'error'); return; }
    const avatar = state.avatars[newAvatarIndex];
    
    try {
        await db.collection('users').doc(state.user.uid).update({
            avatar: avatar
        });
        state.profile.avatar = avatar;
        closeModal();
        showToast('Avatar updated!', 'success');
        renderAll();
    } catch (e) {
        showToast(e.message, 'error');
    }
}

// ============================================================
async function toggleWishlist(productId) {
    if (!state.user) {
        showToast('Please login first', 'error');
        showLoginModal();
        return;
    }
    
    const idx = state.wishlist.indexOf(productId);
    if (idx > -1) {
        state.wishlist.splice(idx, 1);
        showToast('Removed from wishlist', 'info');
    } else {
        state.wishlist.push(productId);
        showToast('Added to wishlist ❤️', 'success');
    }
    
    try {
        await db.collection('users').doc(state.user.uid).update({
            wishlist: state.wishlist
        });
    } catch (e) {}
    
    renderPage(state.currentPage);
}

// ============================================================
// CART OPERATIONS
// ============================================================
async function addToCart(productId) {
    if (!state.user) {
        showToast('Please login first', 'error');
        showLoginModal();
        return;
    }
    
    try {
        const p = await db.collection('products').doc(productId).get();
        if (!p.exists) { showToast('Product not found', 'error'); return; }
        const data = p.data();
        if (data.stockQuantity <= 0) { showToast('Out of stock', 'error'); return; }
        
        const cartRef = db.collection('carts').doc(state.user.uid);
        const cartDoc = await cartRef.get();
        let items = cartDoc.exists ? cartDoc.data().items || [] : [];
        
        const existing = items.find(i => i.productId === productId);
        if (existing) {
            existing.quantity += 1;
        } else {
            items.push({
                productId: productId,
                name: data.name,
                quantity: 1,
                priceAtAdd: data.currentPrice || data.basePrice,
                imageUrl: data.images?.[0]?.url || '',
                sku: data.sku || ''
            });
        }
        
        await cartRef.set({ userId: state.user.uid, items, updatedAt: getTS() }, { merge: true });
        state.cart = items;
        updateCartBadge();
        showToast('Added to cart!', 'success');
        renderPage(state.currentPage);
    } catch (e) {
        showToast(e.message, 'error');
    }
}

async function removeFromCart(productId) {
    if (!state.user) return;
    try {
        const cartRef = db.collection('carts').doc(state.user.uid);
        const cartDoc = await cartRef.get();
        if (!cartDoc.exists) return;
        let items = cartDoc.data().items || [];
        items = items.filter(i => i.productId !== productId);
        await cartRef.set({ items }, { merge: true });
        state.cart = items;
        updateCartBadge();
        showToast('Removed from cart', 'info');
        renderPage(state.currentPage);
    } catch (e) {
        showToast(e.message, 'error');
    }
}

// ============================================================
// FIRESTORE HELPERS
// ============================================================
async function getProducts(pincode = '') {
    try {
        let query = db.collection('products')
            .where('isActive', '==', true)
            .where('isDeleted', '==', false);
        
        if (pincode) {
            query = query.where('availablePincodes', 'array-contains', pincode);
        }
        
        const snap = await query.limit(30).get();
        const products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.products = products;
        return products;
    } catch (e) {
        return [];
    }
}

async function getFlashDeals() {
    try {
        const snap = await db.collection('flashDeals')
            .where('status', '==', 'active')
            .get();
        const deals = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.flashDeals = deals;
        return deals;
    } catch (e) {
        return [];
    }
}

async function getCart(uid) {
    try {
        const doc = await db.collection('carts').doc(uid).get();
        if (doc.exists) return { id: doc.id, ...doc.data() };
        return null;
    } catch (e) { return null; }
}

async function getOrders(uid) {
    try {
        const snap = await db.collection('orders')
            .where('userId', '==', uid)
            .orderBy('createdAt', 'desc')
            .get();
        return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { return []; }
}

// GEOLOCATION & PINCODE
// ============================================================
function detectLocation() {
    if (!navigator.geolocation) {
        showToast('Geolocation not supported', 'error');
        return;
    }
    
    showToast('Detecting location...', 'info');
    navigator.geolocation.getCurrentPosition(
        async (pos) => {
            try {
                const mockPincode = '400001';
                state.pincode = mockPincode;
                if (state.user) {
                    await db.collection('users').doc(state.user.uid).update({
                        defaultPincode: mockPincode,
                        savedPincodes: firebase.firestore.FieldValue.arrayUnion(mockPincode)
                    });
                }
                showToast('Location detected: ' + mockPincode, 'success');
                renderPage('home');
            } catch (e) {
                showToast('Could not detect pincode', 'warning');
            }
        },
        () => {
            showToast('Unable to get location. Please enter pincode manually.', 'warning');
        }
    );
}

async function updatePincode() {
    const input = document.getElementById('pincodeInput');
    if (!input) return;
    const pincode = input.value.trim();
    if (pincode.length === 6 && /^\d+$/.test(pincode)) {
        state.pincode = pincode;
        if (state.user) {
            await db.collection('users').doc(state.user.uid).update({
                defaultPincode: pincode,
                savedPincodes: firebase.firestore.FieldValue.arrayUnion(pincode)
            });
        }
        showToast('Pincode updated!', 'success');
        renderPage('home');
    } else {
        showToast('Please enter a valid 6-digit pincode', 'error');
    }
}

// ============================================================
// AUTH STATE LISTENER
// ============================================================
auth.onAuthStateChanged(async (user) => {
    // Hide splash screen
    const splash = $('splashScreen');
    splash.classList.add('hidden');
    setTimeout(() => {
        splash.style.display = 'none';
        $('app').classList.add('active');
    }, 600);
    
    state.user = user;
    if (user) {
        try {
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists) {
                state.profile = { id: doc.id, ...doc.data() };
                state.wishlist = state.profile.wishlist || [];
                state.pincode = state.profile.defaultPincode || '';
                
                const token = await user.getIdTokenResult();
                const isAdmin = token.claims?.admin === true || state.profile.role === 'admin';
                state.isAdmin = isAdmin;
            }
            const cartData = await getCart(user.uid);
            state.cart = cartData?.items || [];
            state.orders = await getOrders(user.uid);
            await getFlashDeals();
        } catch (e) {
            console.error('Profile load error:', e);
        }
    } else {
        state.profile = null;
        state.isAdmin = false;
        state.cart = [];
        state.orders = [];
        state.wishlist = [];
        state.registeredUser = null;
        state.appliedCoupon = null;
    }
    renderAll();
});
