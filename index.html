<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Pawan Retail — Order Confirmation Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f6f8; --surface:#fff; --surface-2:#f0f2f5; --border:#e2e5ea;
  --text:#0d1117; --text-2:#5a6472; --text-3:#8b95a3;
  --primary:#FF5A1F; --primary-soft:#fff1ea;
  --success:#16a34a; --success-soft:#e8f5ee;
  --danger:#dc2626; --danger-soft:#fdeaea;
  --warning:#f59e0b; --warning-soft:#fef5e7;
  --info:#2563eb; --info-soft:#eaf1fe;
  --radius:10px; --radius-sm:8px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --surface-2:#1c232c; --border:#2a323d;
  --text:#e8ecf1; --text-2:#8b95a3; --text-3:#5a6472;
  --primary:#FF5A1F; --primary-soft:rgba(255,90,31,.14);
  --success:#22c55e; --success-soft:rgba(34,197,94,.14);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,.14);
  --warning:#f59e0b; --warning-soft:rgba(245,158,11,.14);
  --info:#3b82f6; --info-soft:rgba(59,130,246,.14);
}
html,body{background:var(--bg);color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{width:100%;padding:10px 12px;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;color:var(--text);
  font-size:14px;outline:none;transition:border-color .15s;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:42px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;
  border:1px solid transparent;transition:all .12s;white-space:nowrap;user-select:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text-2)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-sm{height:32px;padding:0 10px;font-size:12px}
.btn-block{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:8px;
  background:var(--surface-2);color:var(--text-2);display:inline-flex;
  align-items:center;justify-content:center}

.card{background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:14px;margin-bottom:10px}
.card-head{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:15px;font-weight:700}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warn{background:var(--warning-soft);color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-primary{background:var(--primary-soft);color:var(--primary)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:600px){.grid3{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;
  background:var(--primary)}
.stat-label{font-size:11px;color:var(--text-2);font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stat-value{font-size:20px;font-weight:800;letter-spacing:-.02em}

.platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.platform-card{padding:16px 12px;border:2px solid var(--border);
  border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;
  background:var(--surface)}
.platform-card:hover{border-color:var(--primary)}
.platform-card.on{border-color:var(--primary);background:var(--primary-soft)}
.platform-card .pc-icon{font-size:24px;margin-bottom:6px}
.platform-card .pc-name{font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em}

.empty{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty-icon{font-size:32px;opacity:.4;margin-bottom:10px}
.empty-title{font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.empty-sub{font-size:12px;color:var(--text-3);margin-bottom:16px}

.chip{display:inline-block;padding:6px 12px;border-radius:20px;
  border:1px solid var(--border);background:var(--surface);
  font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;
  white-space:nowrap;transition:all .12s}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;
  margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:flex-end;justify-content:center;z-index:1000}
@media(min-width:640px){.modal-mask{align-items:center;padding:20px}}
.modal{background:var(--surface);border-radius:16px 16px 0 0;
  padding:20px 16px calc(20px + var(--safe-b));width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:12px;padding-bottom:20px}}
.modal-head{display:flex;justify-content:space-between;
  align-items:flex-start;margin-bottom:16px}
.modal-head h3{font-size:17px;font-weight:700}
.modal-head p{font-size:13px;color:var(--text-2);margin-top:2px}
.modal-close{width:32px;height:32px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-3);background:none;font-size:22px;line-height:1}

.toast-container{position:fixed;top:70px;left:50%;transform:translateX(-50%);
  z-index:2000;display:flex;flex-direction:column;gap:6px;
  width:calc(100% - 24px);max-width:400px;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--primary);border-radius:8px;padding:10px 14px;
  font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.15);pointer-events:auto;
  animation:ti .2s ease}
.toast.ok{border-left-color:var(--success)}
.toast.err{border-left-color:var(--danger)}
@keyframes ti{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px 16px;
  background:radial-gradient(1000px 500px at 50% -10%,rgba(255,90,31,.06),transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:400px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:26px 22px;
  box-shadow:0 12px 32px rgba(0,0,0,.08)}
.auth-brand{display:flex;align-items:center;gap:10px;
  padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:20px}
.brand-mark{width:36px;height:36px;border-radius:9px;
  background:linear-gradient(135deg,#FF5A1F,#c94a17);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;flex-shrink:0}
.brand-title{font-size:14px;font-weight:700}
.brand-sub{font-size:11px;color:var(--text-3);text-transform:uppercase;
  letter-spacing:.03em;font-weight:500;margin-top:1px}
.auth-title{font-size:20px;font-weight:700;margin-bottom:4px;letter-spacing:-.02em}
.auth-desc{font-size:13px;color:var(--text-2);margin-bottom:18px}
.tabs{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:3px;margin-bottom:18px}
.tab{flex:1;padding:8px 6px;background:transparent;color:var(--text-3);
  font-size:12.5px;font-weight:600;border-radius:6px;transition:all .12s}
.tab.on{background:var(--surface);color:var(--text)}
.alert{padding:10px 12px;border-radius:8px;font-size:12.5px;
  margin-bottom:14px;border:1px solid;display:flex;gap:8px}
.alert-err{background:var(--danger-soft);border-color:rgba(239,68,68,.28);color:#FCA5A5}
.alert-ok{background:var(--success-soft);border-color:rgba(34,197,94,.28);color:#86EFAC}
.alert-info{background:var(--info-soft);border-color:rgba(59,130,246,.28);color:#93C5FD}

/* LAYOUT */
.app-shell{min-height:100vh;padding-bottom:calc(70px + var(--safe-b))}
.topbar{position:sticky;top:0;z-index:100;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:12px 16px;
  display:flex;align-items:center;gap:10px}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:-.01em}
.topbar-sub{font-size:10px;color:var(--text-3);text-transform:uppercase;
  letter-spacing:.03em;font-weight:600}
.topbar-spacer{flex:1}
.page{padding:16px;max-width:1000px;margin:0 auto}
.page-head{margin-bottom:16px}
.page-head h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
.page-head p{font-size:13px;color:var(--text-2);margin-top:2px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;
  height:calc(62px + var(--safe-b));padding-bottom:var(--safe-b);
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:flex;z-index:200}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--text-3);font-size:10px;
  font-weight:600;transition:color .12s;background:none}
.bnav-item.on{color:var(--primary)}
.bnav-item .icon{font-size:20px;line-height:1}

.order-card{background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;
  transition:border-color .12s}
.order-card:hover{border-color:var(--primary)}
.order-card-head{display:flex;justify-content:space-between;
  align-items:flex-start;margin-bottom:8px;gap:8px}
.order-card-title{font-size:14px;font-weight:600;word-break:break-word}
.order-card-sub{font-size:11.5px;color:var(--text-2);margin-top:2px}
.order-card-body{display:flex;justify-content:space-between;
  align-items:center;padding-top:8px;border-top:1px solid var(--border)}
.order-amount{font-size:18px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}

.msg-preview{background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:14px;white-space:pre-wrap;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;
  line-height:1.7;color:var(--text);word-break:break-word;
  max-height:400px;overflow-y:auto}
.vars{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.var-btn{padding:3px 8px;border-radius:6px;background:var(--primary-soft);
  color:var(--primary);font-size:11px;font-weight:600;
  font-family:ui-monospace,monospace;border:none}
.var-btn:hover{background:var(--primary);color:#fff}

.loading-block{text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;
  animation:sp .75s linear infinite}
.spinner-sm{width:14px;height:14px;border-width:2px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<script>
// ============================================================
// FIREBASE CONFIG — apna config yahan daalo

const firebaseConfig = {

try {

} catch(e){ console.error("Firebase init failed:", e); }

// ============================================================
// HELPERS
// ============================================================
const $  = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>[...p.querySelectorAll(s)];

function esc(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowTS(){ return firebase.firestore.FieldValue.serverTimestamp(); }

function fmtDateTime(iso){
  if(!iso) return '';
  try {
    const d = new Date(iso);
    if(isNaN(d)) return '';
    return d.toLocaleString('en-IN',{
      day:'2-digit', month:'long', year:'numeric',
      hour:'2-digit', minute:'2-digit', hour12:true
    });
  } catch { return ''; }
}
function toLocalInputValue(iso){
  if(!iso) return '';
  try {
    const d = new Date(iso);
    if(isNaN(d)) return '';
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch { return ''; }
}
function fromLocalInputValue(v){
  if(!v) return '';
  try {
    const d = new Date(v);
    if(isNaN(d)) return '';
    return d.toISOString();
  } catch { return ''; }
}
function currency(n){
  if(n==null || n==='') return '';
  const num = Number(n);
  if(isNaN(num)) return '';
  return `₹${num.toLocaleString('en-IN')}`;
}

function toast(msg, type='info', ms=3000){
  const c = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='ok'?'ok':type==='err'?'err':'');
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s';
    setTimeout(()=>el.remove(),300); }, ms);
}

function errMsg(e){
  const c = e?.code || '';
  const map = {
    'auth/invalid-email':'Invalid email.',
    'auth/user-not-found':'No account found.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/too-many-requests':'Too many attempts. Try later.',
    'auth/email-already-in-use':'Email already registered.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/network-request-failed':'Network error.',
    'permission-denied':'Permission denied.'
  };
  for(const k in map) if(c.includes(k)) return map[k];
  return e?.message || 'Something went wrong.';
}

function alertBox(msg, type='err'){
  const el = $('#auth-msg');
  if(!msg){ el.innerHTML=''; return; }
  const cls = type==='err'?'alert-err':type==='ok'?'alert-ok':'alert-info';
  el.innerHTML = `<div class="alert ${cls}">${esc(msg)}</div>`;
}

function userCol(name){

async function loadOrders(){
  const snap = await userCol('orders').get();
  state.orders = snap.docs.map(d => ({ id:d.id, ...d.data() }))
    .sort((a,b) => (b.createdAtMs||0) - (a.createdAtMs||0));

async function saveOrder(order){
  const id = order.id || uid();
  const now = Date.now();
  const payload = {
    ...order,
    id,
    createdAtMs: order.createdAtMs || now,
    updatedAtMs: now,
    updatedAt: nowTS()
  };
  delete payload.id;
  await userCol('orders').doc(id).set({
    ...payload,
    createdAt: order.createdAt || nowTS()
  }, { merge:true });
  return id;
}

async function removeOrder(id){
  await userCol('orders').doc(id).delete();
}

async function loadTemplates(){
  const snap = await userCol('templates').get();
  if(snap.empty){
    // seed default templates
    const batch = db.batch();
    DEFAULT_TEMPLATES.forEach(t => {
      const ref = userCol('templates').doc(t.id);
      batch.set(ref, { ...t, createdAt: nowTS() });
    });
    await batch.commit();
    state.templates = [...DEFAULT_TEMPLATES];
  } else {
    state.templates = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  }
}

  const id = tpl.id || uid();
  await userCol('templates').doc(id).set({
    ...tpl, id, updatedAt: nowTS()

// ============================================================
// MESSAGE GENERATOR
// ============================================================
function buildMessage(order, templateOverride){
  const settings = state.settings;
  const templates = state.templates;
  const template = templateOverride
    || templates.find(t => t.id === order.templateId)
    || templates.find(t => t.isDefault)
    || templates[0];

  const customerName = order.customerName || '';
  const platform = order.platform || '';
  const orderId = order.orderId || '';
  const restaurant = order.restaurant || '';
  const items = order.items || '';
  const paymentMethod = order.paymentMethod || '';
  const status = order.status || '';
  const address = order.address || '';
  const companyName = settings.companyName || 'Pawan Retail Limited';

  const finalAmount = order.finalAmount != null && order.finalAmount !== ''
    ? `₹${Number(order.finalAmount).toLocaleString('en-IN')}` : '';
  const regularAmount = order.regularAmount != null && order.regularAmount !== ''
    ? `₹${Number(order.regularAmount).toLocaleString('en-IN')}` : '';
  const savings = (order.regularAmount != null && order.finalAmount != null
    && order.regularAmount !== '' && order.finalAmount !== '')
    ? Math.max(0, Number(order.regularAmount) - Number(order.finalAmount)) : 0;
  const savingsStr = savings > 0 ? `₹${savings.toLocaleString('en-IN')}` : '';

  const orderTime = fmtDateTime(order.orderTime);
  const deliveryTime = order.deliveryTime ? fmtDateTime(order.deliveryTime) : '';

  let offerSection = '';
  if(order.offerEnabled && order.showOfferInMessage && order.offerProvider){
    const lines = [];
    if(regularAmount) lines.push(`Regular Order Value: ${regularAmount}`);
    lines.push(`Platform Offer: ${order.offerProvider}`);
    if(savingsStr) lines.push(`Savings: ${savingsStr}`);
    if(finalAmount) lines.push(`Final Payable Amount: ${finalAmount}`);
    lines.push('');
    lines.push(`The discount shown above is a promotional offer provided by ${order.offerProvider}. The order was placed using the available platform offer.`);
    offerSection = lines.join('\n');
  }

  let paymentInstruction = '';
  const pm = (paymentMethod || '').toLowerCase();
  if(pm.includes('cash') || pm.includes('cod')){
    paymentInstruction = `Please keep ${finalAmount || 'the amount'} cash ready at the time of delivery.`;
  } else if(pm.includes('prepaid')){
    paymentInstruction = '';
  } else if(pm.includes('upi')){
    paymentInstruction = `Payment received via UPI. Thank you.`;
  }

  const deliveryTimeLine = deliveryTime ? `Estimated Delivery: ${deliveryTime}` : '';

  const vars = {
    customer_name: customerName,
    platform: platform,
    order_id: orderId,
    restaurant: restaurant,
    items: items,
    regular_amount: regularAmount,
    offer_provider: order.offerProvider || '',
    savings: savingsStr,
    final_amount: finalAmount,
    payment_method: paymentMethod,
    order_time: orderTime,
    delivery_time: deliveryTime,
    address: address,
    status: status,
    company_name: companyName,
    offer_section: offerSection,
    payment_instruction: paymentInstruction,
    delivery_time_line: deliveryTimeLine
  };

  let msg = template.body;

  // Special handling: if offer_section is empty, remove the blank line
  // If delivery_time_line is empty, remove the whole line
  // If payment_instruction is empty, remove that too
  // Process multi-line placeholders first
  msg = msg.replace(/\{delivery_time_line\}/g, deliveryTimeLine);
  msg = msg.replace(/\{offer_section\}/g, offerSection);
  msg = msg.replace(/\{payment_instruction\}/g, paymentInstruction);

  // Now handle standard vars
  msg = msg.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : '');

  // Cleanup: remove empty lines around sections
  msg = msg
    .split('\n')
    .map(l => l.replace(/:\s*$/, ''))   // remove trailing "Label:" with no value
    .filter(l => l.trim() !== '' || l === '') // keep structure
    .join('\n');

  // Remove 3+ consecutive newlines
  msg = msg.replace(/\n{3,}/g, '\n\n').trim();

  return msg;
}

// ============================================================
// WHATSAPP / SMS
// ============================================================
function normalizePhone(phone){
  if(!phone) return '';
  let p = String(phone).replace(/\D/g,'');
  if(p.length === 10) p = '91' + p;
  if(p.length === 11 && p.startsWith('0')) p = '91' + p.slice(1);
  return p;
}

function sendWhatsApp(phone, message){
  const num = normalizePhone(phone);
  if(!num || num.length < 11){
    toast('Invalid mobile number. Enter a valid Indian number.', 'err');
    return false;
  }
  const url = `https://wa.me/${num}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
  toast('WhatsApp opened. Press Send in WhatsApp.', 'ok');
  return true;
}

function sendSMS(phone, message){
  const num = normalizePhone(phone);
  if(!num || num.length < 11){
    toast('Invalid mobile number. Enter a valid Indian number.', 'err');
    return false;
  }
  const url = `sms:${num}?body=${encodeURIComponent(message)}`;
  window.location.href = url;
  toast('SMS app opened. Press Send in your messaging app.', 'ok');
  return true;
}

async function copyToClipboard(text){
  try {
    await navigator.clipboard.writeText(text);
    toast('Message copied to clipboard.', 'ok');
    return true;
  } catch {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      toast('Message copied to clipboard.', 'ok');
      return true;
    } catch {
      toast('Could not copy message.', 'err');
      return false;
    } finally {
      ta.remove();
    }
  }
}

  // Custom fields

  ['in-name','in-mobile','in-address','in-orderid','in-restaurant','in-items',
   'in-regular','in-final','in-payment','in-time','in-delivery','in-status',
   'in-offer-provider','in-offer-desc'].forEach(id => {
    const el = $('#' + id);
    if(el) el.addEventListener('input', updatePreview);
    if(el) el.addEventListener('change', updatePreview);
  });

  $('#cancel-btn').onclick = () => {

    route('dashboard');

    copyToClipboard(msg);
  };

    $('#msg-preview').textContent = buildMessage(collectOrderFromForm(), null);
    toast('Template reset.', 'info');
  };

  $('#send-btn').onclick = () => saveCurrentOrder(true);

  updatePreview();

function renderCustomFields(){
  const el = $('#cf-list');
  if(!el) return;
  if(!state.customFields.length){
    el.innerHTML = '<div class="empty-sub" style="text-align:center;padding:12px">No custom fields yet</div>';
    return;
  }
  el.innerHTML = state.customFields.map((f, i) => `
    <div class="cf-item" data-i="${i}">
      <input data-k="name" placeholder="Field name" value="${esc(f.name||'')}">
      <input data-k="value" placeholder="Field value" value="${esc(f.value||'')}">
      <div class="cf-actions">
        <button class="btn-icon" data-act="up" ${i===0?'disabled':''}>↑</button>
        <button class="btn-icon" data-act="down" ${i===state.customFields.length-1?'disabled':''}>↓</button>
        <button class="btn-icon" data-act="del">✕</button>
      </div>
    </div>
  `).join('');

  el.querySelectorAll('.cf-item').forEach(row => {
    const i = Number(row.dataset.i);
    row.querySelectorAll('input').forEach(inp => {
      inp.oninput = () => {
        state.customFields[i][inp.dataset.k] = inp.value;
        updatePreview();
      };
    });
    row.querySelector('[data-act="up"]')?.addEventListener('click', () => {
      if(i === 0) return;
      [state.customFields[i-1], state.customFields[i]] = [state.customFields[i], state.customFields[i-1]];
      renderCustomFields();
      updatePreview();
    });
    row.querySelector('[data-act="down"]')?.addEventListener('click', () => {
      if(i === state.customFields.length-1) return;
      [state.customFields[i+1], state.customFields[i]] = [state.customFields[i], state.customFields[i+1]];
      renderCustomFields();
      updatePreview();
    });
    row.querySelector('[data-act="del"]')?.addEventListener('click', () => {
      state.customFields.splice(i, 1);
      renderCustomFields();
      updatePreview();
    });
  });
}

function collectOrderFromForm(){
  return {
    id: state.editingOrder?.id,
    isDemo: state.editingOrder?.isDemo,
    platform: state.activePlatform,
    customerName: $('#in-name').value.trim(),
    customerMobile: $('#in-mobile').value.trim(),
    address: $('#in-address').value.trim(),
    orderId: $('#in-orderid').value.trim(),
    restaurant: $('#in-restaurant').value.trim(),
    items: $('#in-items').value.trim(),
    regularAmount: $('#in-regular').value === '' ? '' : Number($('#in-regular').value),
    finalAmount: $('#in-final').value === '' ? '' : Number($('#in-final').value),
    paymentMethod: $('#in-payment').value,
    orderTime: fromLocalInputValue($('#in-time').value),
    deliveryTime: fromLocalInputValue($('#in-delivery').value),
    status: $('#in-status').value,
    offerEnabled: state.offerEnabled,
    offerProvider: $('#in-offer-provider')?.value || 'Swiggy',
    offerDescription: $('#in-offer-desc')?.value || '',
    showOfferInMessage: state.showOfferInMessage,
    customFields: state.customFields.slice(),
    templateId: state.editingOrder?.templateId || 'tpl-standard',
    createdAt: state.editingOrder?.createdAt,
    createdAtMs: state.editingOrder?.createdAtMs
  };
}

function updatePreview(){
  const o = collectOrderFromForm();
  const el = $('#msg-preview');
  if(el) el.textContent = buildMessage(o, null);
}

async function saveCurrentOrder(sendAfter){
  const o = collectOrderFromForm();

  // Validation
  if(!o.customerName) return toast('Customer name is required.', 'err');
  if(!o.address) return toast('Delivery address is required.', 'err');
  if(!o.orderId) return toast('Order ID is required.', 'err');
  if(!o.restaurant) return toast('Restaurant name is required.', 'err');
  if(o.finalAmount === '' || o.finalAmount == null || isNaN(o.finalAmount) || o.finalAmount < 0)
    return toast('Final payable amount is required.', 'err');
  if(o.offerEnabled && o.regularAmount !== '' && Number(o.regularAmount) < Number(o.finalAmount))
    return toast('Final amount cannot be greater than regular amount when offer is applied.', 'err');

  const btn = sendAfter ? $('#send-btn') : $('#save-btn');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.innerHTML = '<span class="spinner spinner-sm"></span> Saving';

  try {
    const id = await saveOrder(o);
    o.id = id;
    toast('Order saved.', 'ok');
    await loadOrders();
    state.editingOrder = null;
    if(sendAfter){
      openSendSheet(o);
    } else {
      route('dashboard');
    }
  } catch(e){
    toast(errMsg(e), 'err');
    btn.disabled = false; btn.textContent = orig;
  }
}

function renderOrders(){
  const main = $('#main');
  const f = state.filters;

  let list = state.orders.slice();
  if(f.platform !== 'all') list = list.filter(o => o.platform === f.platform);
  if(f.status !== 'all') list = list.filter(o => o.status === f.status);
  if(f.payment !== 'all') list = list.filter(o => o.paymentMethod === f.payment);
  if(f.search){
    const q = f.search.toLowerCase();
    list = list.filter(o =>
      (o.customerName||'').toLowerCase().includes(q) ||
      (o.customerMobile||'').toLowerCase().includes(q) ||
      (o.orderId||'').toLowerCase().includes(q) ||
      (o.restaurant||'').toLowerCase().includes(q)
    );
  }
  if(f.sort === 'newest') list.sort((a,b) => (b.createdAtMs||0) - (a.createdAtMs||0));
  else if(f.sort === 'oldest') list.sort((a,b) => (a.createdAtMs||0) - (b.createdAtMs||0));
  else if(f.sort === 'highest') list.sort((a,b) => (Number(b.finalAmount)||0) - (Number(a.finalAmount)||0));
  else if(f.sort === 'lowest') list.sort((a,b) => (Number(a.finalAmount)||0) - (Number(b.finalAmount)||0));

  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Orders</h1>
        <p>${state.orders.length} order${state.orders.length!==1?'s':''} total</p>
      </div>
      <button class="btn btn-primary btn-sm" onclick="route('new')">+ New Order</button>
    </div>

    <div class="field">
      <input id="search" placeholder="Search name, mobile, order ID, restaurant…" value="${esc(f.search)}">
    </div>

    <div class="chips" id="filter-platform">
      ${['all','Swiggy','Zomato',"Domino's",'Custom'].map(p =>
        `<div class="chip ${f.platform===p?'on':''}" data-k="platform" data-v="${p}">${p==='all'?'All Platforms':p}</div>`
      ).join('')}
    </div>

    <div class="chips" id="filter-status">
      ${['all','Successfully Placed','Preparing','Out for Delivery','Delivered','Cancelled'].map(s =>
        `<div class="chip ${f.status===s?'on':''}" data-k="status" data-v="${s}">${s==='all'?'All Status':s}</div>`
      ).join('')}
    </div>

    <div class="chips" id="filter-payment">
      ${['all','Cash on Delivery','Prepaid','UPI','Other'].map(p =>
        `<div class="chip ${f.payment===p?'on':''}" data-k="payment" data-v="${p}">${p==='all'?'All Payments':p}</div>`
      ).join('')}
    </div>

    <div class="chips" id="filter-sort">
      ${[['newest','Newest'],['oldest','Oldest'],['highest','Highest Amount'],['lowest','Lowest Amount']].map(([v,l]) =>
        `<div class="chip ${f.sort===v?'on':''}" data-k="sort" data-v="${v}">${l}</div>`
      ).join('')}
    </div>

    <div id="orders-list">
      ${list.length === 0 ? `
        <div class="empty">
          <div class="empty-icon">📋</div>
          <div class="empty-title">No orders yet</div>
          <div class="empty-sub">Create your first order</div>
          <button class="btn btn-primary" onclick="route('new')">Create Order</button>
        </div>
      ` : list.map(o => orderCardHTML(o)).join('')}
    </div>
  `;

  $('#search').oninput = e => { state.filters.search = e.target.value; renderOrders(); };
  $$('.chip').forEach(c => {
    c.onclick = () => {
      state.filters[c.dataset.k] = c.dataset.v;
      renderOrders();
    };
  });
  $$('.order-card').forEach(el => el.onclick = () => openOrder(el.dataset.id));
}

function openSendSheet(order, message){
  const msg = message || buildMessage(order, null);
  const mobile = order.customerMobile || '';

  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div>
          <h3>Send Confirmation</h3>
          <p>${mobile ? 'To ' + esc(mobile) : 'No mobile number saved'}</p>
        </div>
        <button class="modal-close" id="close">×</button>
      </div>

      ${!mobile ? `
        <div class="alert alert-err" style="margin-bottom:14px">
          <span>!</span>
          <span>Please add a mobile number to this order before sending.</span>
        </div>
      ` : ''}

      <div style="display:grid;gap:10px">
        <button class="btn btn-success btn-block" id="wa-btn" ${!mobile?'disabled':''}>
          <span style="font-size:18px">📱</span> WhatsApp
        </button>
        <button class="btn btn-outline btn-block" id="sms-btn" ${!mobile?'disabled':''}>
          <span style="font-size:18px">✉️</span> Message / SMS
        </button>
        <button class="btn btn-outline btn-block" id="copy-btn">
          <span style="font-size:18px">📋</span> Copy Message
        </button>
        <button class="btn btn-outline btn-block" id="cancel">
          Cancel
        </button>
      </div>

      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
        <div class="muted-sm" style="margin-bottom:8px">Preview</div>
        <div class="msg-preview" style="max-height:200px;font-size:11.5px">${esc(msg)}</div>
      </div>
    </div>
  `;

  document.body.appendChild(mask);
  const close = () => mask.remove();
  mask.addEventListener('click', e => { if(e.target === mask) close(); });
  mask.querySelector('#close').onclick = close;
  mask.querySelector('#cancel').onclick = close;

  mask.querySelector('#wa-btn').onclick = () => {
    if(sendWhatsApp(mobile, msg)) close();
  };
  mask.querySelector('#sms-btn').onclick = () => {
    if(sendSMS(mobile, msg)) close();
  };
  mask.querySelector('#copy-btn').onclick = async () => {
    await copyToClipboard(msg);
    close();
  };
}

function editTemplate(tpl){
  const isNew = !tpl?.id;
  const t = tpl || { id:null, name:'Custom Template', isDefault:false, body:'' };

  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div>
          <h3>${isNew ? 'New Template' : 'Edit Template'}</h3>
        </div>
        <button class="modal-close" id="close">×</button>
      </div>
      <div class="field">
        <label>Template Name</label>
        <input id="tpl-name" value="${esc(t.name)}">
      </div>
      <div class="field">
        <label>Message Body</label>
        <textarea id="tpl-body" rows="12" style="min-height:220px;font-family:ui-monospace,monospace;font-size:12.5px">${esc(t.body)}</textarea>
      </div>
      <div class="field">
        <label>Available Variables</label>
        <div class="vars" id="vars"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-outline" id="cancel" style="flex:1">Cancel</button>
        <button class="btn btn-primary" id="save" style="flex:2">Save Template</button>
      </div>
    </div>
  `;
  document.body.appendChild(mask);

  const varsEl = mask.querySelector('#vars');
  varsEl.innerHTML = VARIABLES.map(v => `<button class="var-btn" data-v="${v}">{${v}}</button>`).join('');
  varsEl.querySelectorAll('.var-btn').forEach(b => b.onclick = () => {
    const ta = mask.querySelector('#tpl-body');
    const start = ta.selectionStart;
    const text = ta.value;
    const insert = `{${b.dataset.v}}`;
    ta.value = text.slice(0, start) + insert + text.slice(start);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = start + insert.length;
  });

  mask.querySelector('#close').onclick = () => mask.remove();
  mask.querySelector('#cancel').onclick = () => mask.remove();
  mask.querySelector('#save').onclick = async () => {
    const name = mask.querySelector('#tpl-name').value.trim();
    const body = mask.querySelector('#tpl-body').value;
    if(!name) return toast('Template name required.','err');
    if(!body.trim()) return toast('Template body cannot be empty.','err');
    try {
      await saveTemplate({ ...t, name, body });
      await loadTemplates();
      toast('Template saved.','ok');
      mask.remove();
      renderTemplates();
    } catch(e){ toast(errMsg(e),'err'); }
  };
}

// ============================================================
// SETTINGS
// ============================================================
function renderSettings(){
  const main = $('#main');
  const s = state.settings;

  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Settings</h1>
        <p>Company & application settings</p>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div><h3>Company</h3></div></div>
      <div class="field"><label>Company Name</label>
        <input id="s-name" value="${esc(s.companyName)}"></div>
      <div class="field"><label>Phone</label>
        <input id="s-phone" value="${esc(s.phone||'')}" placeholder="Optional"></div>
      <div class="field"><label>Email</label>
        <input id="s-email" value="${esc(s.email||'')}" placeholder="Optional"></div>
      <div class="field"><label>Address</label>
        <textarea id="s-address">${esc(s.address||'')}</textarea></div>
      <div class="field"><label>Default Footer</label>
        <textarea id="s-footer">${esc(s.footer||'')}</textarea></div>
      <div class="field"><label>Default Payment Instruction</label>
        <textarea id="s-pay">${esc(s.defaultPaymentInstruction||'')}</textarea></div>
      <div class="field"><label>Default Offer Message</label>
        <textarea id="s-offer">${esc(s.defaultOfferMessage||'')}</textarea></div>
      <button class="btn btn-primary btn-block" id="s-save">Save Settings</button>
    </div>

    <div class="card">
      <div class="card-head"><div><h3>Appearance</h3></div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" style="flex:1" id="th-light">Light</button>
        <button class="btn btn-outline" style="flex:1" id="th-dark">Dark</button>
        <button class="btn btn-outline" style="flex:1" id="th-system">System</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div><h3>Data</h3><p>Local export / import (JSON)</p></div></div>
      <div style="display:grid;gap:8px">
        <button class="btn btn-outline btn-block" id="exp-btn">Export Data</button>
        <button class="btn btn-outline btn-block" id="imp-btn">Import Data</button>
        <button class="btn btn-outline btn-block" id="demo-btn">Clear Demo Data</button>
      </div>
      <input type="file" id="imp-file" accept="application/json" class="hidden">
    </div>

    <div class="card">
      <div class="card-head"><div><h3>Privacy</h3></div></div>
      <div class="muted-sm" style="line-height:1.6">
        This application is designed for order record management and message generation.
        It does not store platform passwords, OTPs, authentication tokens, card information, or UPI PINs.
        The user must complete the actual order on the relevant platform manually.
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div><h3>About</h3></div></div>
      <div class="muted-sm">
        <div><strong>Pawan Retail Limited</strong></div>
        <div style="margin-top:4px">Order Confirmation Manager</div>
        <div style="margin-top:4px">Version 1.0</div>
      </div>
    </div>
  `;

  $('#s-save').onclick = async () => {
    const btn = $('#s-save');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await saveSettings({
        companyName: $('#s-name').value.trim() || 'Pawan Retail Limited',
        phone: $('#s-phone').value.trim(),
        email: $('#s-email').value.trim(),
        address: $('#s-address').value.trim(),
        footer: $('#s-footer').value,
        defaultPaymentInstruction: $('#s-pay').value,
        defaultOfferMessage: $('#s-offer').value
      });
      toast('Settings saved.','ok');
    } catch(e){ toast(errMsg(e),'err'); }
    btn.disabled = false; btn.textContent = 'Save Settings';
  };

  $('#th-light').onclick = () => { document.documentElement.setAttribute('data-theme','light'); localStorage.setItem('pr_theme','light'); toast('Light mode','info'); };
  $('#th-dark').onclick = () => { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('pr_theme','dark'); toast('Dark mode','info'); };
  $('#th-system').onclick = () => {
    localStorage.removeItem('pr_theme');
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if(dark) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme','light');
    toast('System mode','info');
  };

  $('#exp-btn').onclick = () => {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      orders: state.orders,
      templates: state.templates,
      settings: state.settings
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pawan-retail-backup-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Data exported.','ok');
  };

  $('#imp-btn').onclick = () => $('#imp-file').click();
  $('#imp-file').onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    const text = await file.text();
    try {
      const data = JSON.parse(text);
      if(!confirm('This will merge orders and replace templates/settings. Continue?')) return;
      // Save orders
      if(Array.isArray(data.orders)){
        for(const o of data.orders){
          await saveOrder(o);
        }
      }
      if(Array.isArray(data.templates)){
        for(const t of data.templates){
          await saveTemplate(t);
        }
      }
      if(data.settings){
        await saveSettings(data.settings);
      }
      await reloadAll();
      toast('Data imported.','ok');
      renderSettings();
    } catch(err){
      toast('Invalid JSON file.', 'err');
    }
    e.target.value = '';
  };

  $('#demo-btn').onclick = async () => {
    if(!confirm('Remove demo order? This only removes the sample data.')) return;
    try {
      const demo = state.orders.filter(o => o.isDemo);
      for(const o of demo) await removeOrder(o.id);
      await loadOrders();
      toast('Demo data cleared.','ok');
      renderSettings();
    } catch(e){ toast(errMsg(e),'err'); }
  };
}

window.route = route;
window.go = route;

// ============================================================
// BOOT
// ============================================================
window.addEventListener('load', () => {
  if(!app){
    document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#eee;font-family:sans-serif;background:#0B0D10;min-height:100vh"><h2>Firebase failed</h2><p style="color:#999;margin-top:8px">Check config and reload</p></div>';
    return;
  }
  setTimeout(() => {
    if(!$('#boot').classList.contains('hidden') && !auth.currentUser){
      showAuth();
    }
  }, 3000);
});
</script>
</body>
