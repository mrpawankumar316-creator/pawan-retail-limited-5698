    const e=await loadEmailJS();
    if(!e) return {ok:false,reason:'EmailJS not loaded'};
    await e.send(EMAILJS_CONFIG.serviceId,tid,params);
    return {ok:true};
  }catch(err){
    console.warn('Email failed',err);
    return {ok:false,reason:err?.text||err?.message||String(err)};
  }
}

function fmtDate(ts){if(!ts)return'—';const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtDateShort(ts){if(!ts)return'—';const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function friendlyAuthError(code){const map={'auth/email-already-in-use':'This email is already registered. Try logging in.','auth/invalid-email':'Please enter a valid email address.','auth/weak-password':'Password must be at least 6 characters.','auth/user-not-found':'No account found with this email.','auth/wrong-password':'Incorrect password. Please try again.','auth/invalid-credential':'Invalid email or password.','auth/too-many-requests':'Too many attempts. Please try again later.','auth/network-request-failed':'Network error. Check your connection.','auth/missing-password':'Please enter your password.','permission-denied':'You do not have permission for this action.'};return map[code]||'Something went wrong. Please try again.';}
function genReferralCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const p=(n)=>{let s='';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s;};return 'PAWAN'+p(5);}
function genCouponCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return 'REF25-'+s;}
function genOrderId(){const d=new Date();const y=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return `PRL-${y}-${s}`;}
function validPhone(p){return /^[6-9]\d{9}$/.test(String(p||'').trim());}
function validPincode(p){return /^\d{6}$/.test(String(p||'').trim());}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim());}
function addrString(a){if(!a)return'';return [a.flat,a.street,a.sector,a.city,a.state,a.pincode].filter(Boolean).join(', ');}
function isCompanyOpen(c){
  if(!c) return true;
  if(c.autoOpenClose===false||!c.openTime||!c.closeTime) return true;
  const now=new Date();
  const cur=now.getHours()*60+now.getMinutes();
  const [oh,om]=String(c.openTime).split(':').map(Number);
  const [ch,cm]=String(c.closeTime).split(':').map(Number);
  const o=oh*60+(om||0), cl=ch*60+(cm||0);
  if(o===cl) return true;
  if(o<cl) return cur>=o && cur<cl;
  return cur>=o || cur<cl;
}
function hoursString(c){if(!c||!c.openTime||!c.closeTime)return'';return `${c.openTime} – ${c.closeTime}`;}
function initialLetter(n){return (n||'?').trim().charAt(0).toUpperCase();}

/* ============ REGISTER (FIXED: uses referralCodes public lookup) ============ */
window.__doRegister=async()=>{
  const name=$('r-name').value.trim();
  const phone=$('r-phone').value.trim();
  const email=$('r-email').value.trim();
  const pw=$('r-pw').value;
  const pw2=$('r-pw2').value;
  const refCode=$('r-ref').value.trim().toUpperCase();
  const address={
    flat:$('r-flat').value.trim(),
    street:$('r-street').value.trim(),
    sector:$('r-sector').value.trim(),
    city:$('r-city').value.trim(),
    state:$('r-state').value.trim(),
    pincode:$('r-pincode').value.trim(),
    landmark:''
  };
  let ok=true;
  if(!name){fieldErr('r-name',true);ok=false;}else fieldErr('r-name',false);
  if(!validPhone(phone)){fieldErr('r-phone',true);ok=false;}else fieldErr('r-phone',false);
  if(!validEmail(email)){fieldErr('r-email',true);ok=false;}else fieldErr('r-email',false);
  if(pw.length<6){fieldErr('r-pw',true);ok=false;}else fieldErr('r-pw',false);
  if(pw!==pw2){fieldErr('r-pw2',true);ok=false;}else fieldErr('r-pw2',false);
  if(!address.flat||!address.city||!validPincode(address.pincode)){toast('Please complete address (flat, city, 6-digit pincode)','error');ok=false;}
  if(!ok)return;

  const btn=$('r-btn');btn.disabled=true;btn.innerHTML='<div class="spinner"></div>Creating...';
  try{
    // 1) Lookup referrer via PUBLIC referralCodes collection (no rules conflict)
    let referrer=null;
    if(refCode){
      try{
        const rs=await getDoc(doc(db,'referralCodes',refCode));
        if(rs.exists()){
          const d=rs.data();
          referrer={id:d.uid,name:d.name};
        } else {
          toast('Referral code not found — continuing without it','info');
        }
      }catch(e){
        console.warn('Referral lookup failed:',e);
        toast('Referral code invalid — continuing without it','info');
      }
    }

    // 2) Create auth user
    const cred=await createUserWithEmailAndPassword(auth,email,pw);
    const uid=cred.user.uid;
    try{await updateProfile(cred.user,{displayName:name});}catch(e){}

    // 3) Generate unique referral code for this new user
    let referralCode=genReferralCode();
    // Ensure uniqueness (retry once if collision)
    try{
      const exist=await getDoc(doc(db,'referralCodes',referralCode));
      if(exist.exists()) referralCode=genReferralCode();
    }catch(e){}

    // 4) Write user doc
    const userDoc={
      name,email,phone,address,
      role:'customer',status:'active',
      referralCode,referralCount:0,
      referredBy:referrer?referrer.id:'',
      referredByName:referrer?referrer.name:'',
      myCoupons:[],
      createdAt:serverTimestamp()
    };
    await setDoc(doc(db,'users',uid),userDoc);

    // 5) Register public referral code
    try{
      await setDoc(doc(db,'referralCodes',referralCode),{
        code:referralCode,uid,name,createdAt:serverTimestamp()
      });
    }catch(e){console.warn('Could not register public referral code',e);}

    // 6) If referred: record in referrer's referrals subcollection (visible to referrer only)
    if(referrer){
      try{
        await setDoc(doc(db,'users',referrer.id,'referrals',uid),{
          name,email,joinedAt:serverTimestamp()
        });
      }catch(e){console.warn('Could not write referral backlink',e);}
      try{await notify(referrer.id,'New referral signup 🎉',`${name} joined using your referral code. Earn a 25% coupon when they place their first order!`);}catch(e){}
    }

    // 7) Welcome email (non-blocking)
    sendEmail(EMAILJS_CONFIG.welcomeTemplateId,{
      to_email:email,to_name:name,user_name:name,user_email:email,
      referral_code:referralCode,app_url:APP_URL
    });

    toast('Account created! Welcome 🎉','success');
    // onAuthStateChanged will redirect
  }catch(err){
    console.error(err);
    toast(friendlyAuthError(err.code)||err.message||'Registration failed','error');
    btn.disabled=false;btn.textContent='Create Account';
  }
};

/* ============ AUTH LISTENER ============ */
let authInitialized=false;
onAuthStateChanged(auth, async(user)=>{
  if(user){
    State.user=user;
    try{State.profile=await getUserDoc(user.uid);}catch(e){console.warn(e);State.profile=null;}
    if(State.profile?.status==='blocked'){
      toast('Your account has been blocked. Contact support.','error');
      try{await signOut(auth);}catch(e){}
      State.user=null;State.profile=null;
      authInitialized=true;navigate('login');return;
    }
    setupUserListeners();
    const target=State.profile?.role==='admin'?'admin':'home';
    if(!authInitialized||['login','register','forgot'].includes(State.route.name)){authInitialized=true;navigate(target);}
    else render();
  } else {
    State.user=null;State.profile=null;clearUnsubs();
    State.notifications=[];State.unreadCount=0;State.referredList=[];State.myOrdersCache=[];
    authInitialized=true;
    if(!['login','register','forgot','track'].includes(State.route.name))navigate('login');
    else render();
  }
});

function setupUserListeners(){
  if(!State.user)return;
  const uid=State.user.uid;
  // Notifications
  const nq=query(collection(db,'notifications'),where('userId','==',uid));
  State.unsubs.push(onSnapshot(nq,(snap)=>{
    const list=snap.docs.map(d=>({id:d.id,...d.data()}));
    list.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
    State.notifications=list;
    State.unreadCount=list.filter(n=>!n.read).length;
    renderNavBadge();
    // Only repaint notifications list if we're on that page (avoid full render)
    if(State.route.name==='notifications'){
      const el=$('notif-list');
      if(el) el.innerHTML = renderNotifItems(list);
    }
  },(e)=>console.warn('notif listener:',e)));

  // Referrals subcollection (referrer only)
  const rq=collection(db,'users',uid,'referrals');
  State.unsubs.push(onSnapshot(rq,(snap)=>{
    State.referredList=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(State.route.name==='refer'){
      const el=$('ref-list');
      if(el) el.innerHTML = renderReferredItems(State.referredList);
    }
  },(e)=>console.warn('ref listener:',e)));
}

async function attachCompanyRatings(){
  try{
    const rs=await getDocs(collection(db,'reviews'));
    const byCompany={};
    rs.forEach(d=>{
      const r=d.data();
      if(!r.companyId) return;
      if(!byCompany[r.companyId]) byCompany[r.companyId]={sum:0,n:0};
      byCompany[r.companyId].sum+=Number(r.rating)||0;
      byCompany[r.companyId].n++;
    });
    document.querySelectorAll('.stars[data-cid]').forEach(el=>{
      const cid=el.getAttribute('data-cid');
      const s=byCompany[cid];
      if(s&&s.n) el.innerHTML=`★ <span>${(s.sum/s.n).toFixed(1)}</span> <span style="color:#9ca3af;font-weight:600">(${s.n})</span>`;
    });
  }catch(e){}
}

async function loadBrowse(initialCat){
  const el=$('b-list');
  el.innerHTML=Array(4).fill('<div class="skel" style="height:86px;margin-bottom:11px"></div>').join('');
  const all=await getAllCompanies();

    chipEl.innerHTML=`<div class="chips">

  if(browseState.q) list=list.filter(c=>
    (c.name||'').toLowerCase().includes(browseState.q)||
    (c.category||'').toLowerCase().includes(browseState.q)||
    (c.description||'').toLowerCase().includes(browseState.q));

window.__addToCart=async(cid,pid)=>{
  const c=await getCompany(cid);
  if(!isCompanyOpen(c)){toast('Store is closed','error');return;}
  const products=await getProducts(cid);
  const p=products.find(x=>x.id===pid);
  if(!p) return;
  if(State.cart.companyId && State.cart.companyId!==cid){
    showModal(`
      <div class="modal-title">Replace cart?</div>
      <p style="color:var(--muted);font-size:14px;margin:0 0 16px">Your cart has items from <b>${esc(State.cart.companyName)}</b>. Adding from <b>${esc(c.name)}</b> will clear it.</p>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" onclick="__closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="__confirmReplaceCart('${esc(cid)}','${esc(pid)}')">Replace</button>
      </div>`);
    return;
  }
  addItemNow(cid,c.name,p);
};
function addItemNow(cid,cname,p){
  if(!State.cart.companyId){State.cart.companyId=cid;State.cart.companyName=cname;}
  const qty=State._pQty||1;
  const existing=State.cart.items.find(i=>i.productId===p.id);
  if(existing) existing.quantity+=qty;
  else State.cart.items.push({productId:p.id,name:p.name,imageUrl:p.imageUrl||'',price:Number(p.price),quantity:qty});
  saveCart();
  toast('Added to cart 🛒','success');
}
window.__confirmReplaceCart=async(cid,pid)=>{
  closeModal();
  State.cart={companyId:null,companyName:null,items:[]};
  const c=await getCompany(cid);
  const ps=await getProducts(cid);
  const p=ps.find(x=>x.id===pid);
  if(p) addItemNow(cid,c.name,p);
};

window.__cartQty=(idx,delta)=>{
  const it=State.cart.items[idx];if(!it)return;
  it.quantity+=delta;
  if(it.quantity<=0) State.cart.items.splice(idx,1);
  if(!State.cart.items.length){State.cart={companyId:null,companyName:null,items:[]};}
  saveCart();renderCart($('root'));
};
window.__cartRemove=(idx)=>{
  State.cart.items.splice(idx,1);
  if(!State.cart.items.length){State.cart={companyId:null,companyName:null,items:[]};}
  saveCart();renderCart($('root'));
};

async function renderCheckout(root){
  const cart=State.cart;
  if(!cart.items.length){navigate('cart');return;}
  const c=await getCompany(cart.companyId);
  if(!isCompanyOpen(c)){
    root.innerHTML=`${AppBar('Checkout',{showBack:true})}<div class="page"><div class="empty"><div class="ico">🚫</div><h3>Store is closed</h3><p>${esc(c?.closedMessage||'Please try again later')}</p></div></div>`;
    return;
  }
  // Preserve previous checkout state where possible
  const prev=State._checkout||{};
  const subtotal=cart.items.reduce((s,i)=>s+i.price*i.quantity,0);
  const user=State.profile;
  const addr=user?.address||{};
  let isFirstOrder=true;
  try{
    const oq=query(collection(db,'orders'),where('customerId','==',State.user.uid));
    const os=await getDocs(oq);
    isFirstOrder=os.empty;
  }catch(e){console.warn('first-order check failed',e);}

  State._checkout={
    isFirstOrder,
    subtotal,

window.__setPay=(v)=>{State._checkout.paymentMethod=v;renderCheckout($('root'));};
window.__setNumOpt=(v)=>{State._checkout.numberOption=v;renderCheckout($('root'));};
window.__setOwnNum=(v)=>{State._checkout.ownNumber=v;};
function calcTotals(){
  const k=State._checkout;
  const sub=k.subtotal;
  const delivery=k.isFirstOrder?0:k.delivery;
  const service=k.isFirstOrder?0:k.service;
  const number = k.company?.requiresNumber && k.numberOption==='company' ? Number(k.company.numberCharge||0) : 0;
  let disc=0;
  if(k.coupon){
    if(sub < Number(k.coupon.minOrder||0)){ disc=0; }
    else if(k.coupon.discountType==='flat') disc=Math.min(Number(k.coupon.discountValue||0),sub);
    else if(k.coupon.discountType==='percent'){
      disc=Math.round(sub*Number(k.coupon.discountValue||0)/100);
      if(k.coupon.maxDiscount) disc=Math.min(disc,Number(k.coupon.maxDiscount));
    }
  }
  const total=Math.max(0, sub + delivery + service + number - disc);
  return {sub,delivery,service,number,disc,total};
}
function paintBill(){
  const t=calcTotals();
  const el=$('bill');if(!el)return;
  el.innerHTML=`
    <div class="srow"><span>Subtotal</span><span>${money(t.sub)}</span></div>
    <div class="srow"><span>Delivery</span><span>${t.delivery===0?'<span style="color:var(--ok);font-weight:700">FREE</span>':money(t.delivery)}</span></div>
    <div class="srow"><span>Service</span><span>${t.service===0?'<span style="color:var(--ok);font-weight:700">FREE</span>':money(t.service)}</span></div>
    ${t.number>0?`<div class="srow"><span>Number charge</span><span>${money(t.number)}</span></div>`:''}
    ${t.disc>0?`<div class="srow disc"><span>Coupon (${esc(State._checkout.coupon?.code||'')})</span><span>−${money(t.disc)}</span></div>`:''}
    <div class="srow total"><span>Total</span><span>${money(t.total)}</span></div>`;
}
async function renderSuggestCoupons(){
  const el=$('c-suggest');if(!el)return;
  const personal=(State.profile?.myCoupons||[]).filter(c=>!c.used);
  let globals=[];
  try{
    const gs=await getDocs(collection(db,'coupons'));
    globals=gs.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.isActive!==false);
  }catch(e){}
  const all=[...personal.map(p=>({...p,isPersonal:true})),...globals];
  if(!all.length){el.innerHTML='';return;}
  el.innerHTML=`<div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px">AVAILABLE COUPONS</div>`+all.map(c=>`
    <div class="coupon" style="cursor:pointer" onclick="__applyCouponCode('${esc(c.code)}')">
      <div>
        <div class="code">${esc(c.code)} ${c.isPersonal?'<span style="font-size:10px;background:#92400e;color:#fff;padding:2px 6px;border-radius:6px">PERSONAL</span>':''}</div>
        <div class="desc">${c.discountType==='percent'?`${c.discountValue}% off`:`₹${c.discountValue} off`}${c.maxDiscount?` (max ₹${c.maxDiscount})`:''}${c.minOrder?` · min ₹${c.minOrder}`:''}</div>
      </div>
    </div>`).join('');
}
window.__applyCouponCode=async(code)=>{const c=$('c-code');if(c)c.value=code;await __applyCoupon();};
window.__applyCoupon=async()=>{
  const code=($('c-code')?.value||'').trim().toUpperCase();
  const msg=$('c-msg');
  if(!code){msg.innerHTML='<span style="color:var(--danger)">Enter a code</span>';return;}
  const personal=(State.profile?.myCoupons||[]).find(c=>c.code===code && !c.used);
  if(personal){
    State._checkout.coupon=personal;
    State._checkout.couponIsPersonal=true;
    msg.innerHTML='<span style="color:var(--ok)">✓ Personal coupon applied</span>';
    renderCheckout($('root'));return;
  }
  try{
    const gs=await getDocs(collection(db,'coupons'));
    const found=gs.docs.map(d=>({id:d.id,...d.data()})).find(c=>c.code===code && c.isActive!==false);
    if(!found){msg.innerHTML='<span style="color:var(--danger)">Invalid or expired coupon</span>';return;}
    State._checkout.coupon=found;
    State._checkout.couponIsPersonal=false;
    msg.innerHTML='<span style="color:var(--ok)">✓ Coupon applied</span>';
    renderCheckout($('root'));
  }catch(e){msg.innerHTML='<span style="color:var(--danger)">Could not verify coupon</span>';}
};
window.__removeCoupon=()=>{State._checkout.coupon=null;State._checkout.couponIsPersonal=false;renderCheckout($('root'));};

/* ============ PLACE ORDER (idempotent) ============ */
window.__placeOrder=async()=>{
  if(State._placingOrder) return; // idempotency guard
  const k=State._checkout;
  if(!k) return;
  if(!State.profile?.address || !addrString(State.profile.address)){toast('Please add a delivery address','error');return;}
  if(k.company?.requiresNumber && k.numberOption==='own' && !validPhone(k.ownNumber||'')){toast('Enter a valid 10-digit mobile number','error');return;}
  const t=calcTotals();
  const btn=$('place-btn');
  State._placingOrder=true;
  btn.disabled=true;btn.innerHTML='<div class="spinner"></div>Placing order...';
  try{
    const orderId=genOrderId();
    const notes=$('c-notes')?.value.trim()||'';
    const orderData={
      orderId,
      customerId:State.user.uid,
      customerName:State.profile.name,
      customerEmail:State.profile.email,
      customerPhone:State.profile.phone,
      address:State.profile.address,
      companyId:k.company.id,
      companyName:k.company.name,
      companyLogoUrl:k.company.logoUrl||'',
      items:State.cart.items.map(i=>({...i,lineTotal:i.price*i.quantity,unitPrice:i.price})),
      subtotal:t.sub,
      deliveryCharge:t.delivery,
      serviceCharge:t.service,
      numberCharge:t.number,
      couponCode:k.coupon?.code||'',
      couponDiscount:t.disc,
      couponIsPersonal:!!k.couponIsPersonal,
      total:t.total,
      paymentMethod:k.paymentMethod,
      paymentStatus:'pending',
      status:'pending',
      trackingUrl:'',
      notes,
      isFirstOrder:!!k.isFirstOrder,
      numberOption:k.company?.requiresNumber?k.numberOption:'',
      customerNumber:k.company?.requiresNumber && k.numberOption==='own'? k.ownNumber:'',
      hasReview:false,
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    };
    const batch=writeBatch(db);
    const orderRef=doc(db,'orders',orderId);
    batch.set(orderRef,orderData);
    const histRef=doc(collection(db,'orders',orderId,'statusHistory'));
    batch.set(histRef,{status:'pending',title:'Order placed',message:'Your order has been placed successfully.',createdAt:serverTimestamp()});

    // Mark personal coupon used
    if(k.couponIsPersonal && k.coupon){
      const coupons=(State.profile.myCoupons||[]).map(c=>c.code===k.coupon.code?{...c,used:true,usedAt:new Date().toISOString()}:c);
      batch.update(doc(db,'users',State.user.uid),{myCoupons:coupons});
    }

    // Referral bonus on first order
    if(k.isFirstOrder && State.profile.referredBy){
      try{
        const referrer=await getUserDoc(State.profile.referredBy);
        if(referrer){
          const newCoupon={
            code:genCouponCode(),
            discountType:'percent',
            discountValue:25,
            maxDiscount:500,
            minOrder:100,
            isPersonal:true,
            used:false,
            earnedFrom:State.profile.name,
            earnedAt:new Date().toISOString()
          };
          batch.update(doc(db,'users',referrer.id),{
            myCoupons:arrayUnion(newCoupon),
            referralCount:increment(1)
          });
          const notifRef=doc(collection(db,'notifications'));
          batch.set(notifRef,{
            userId:referrer.id,
            title:'🎁 Referral bonus unlocked!',
            body:`${State.profile.name} placed their first order. You earned a 25% off coupon: ${newCoupon.code}`,
            read:false,createdAt:serverTimestamp()
          });
        }
      }catch(e){console.warn('referral bonus',e);}
    }

    await batch.commit();

    // Notify customer (non-fatal if fails)
    try{await notify(State.user.uid,'Order placed ✅',`Order ${orderId} placed successfully. Total: ${money(t.total)}`);}catch(e){}

    // Order confirmation email (non-fatal)
    sendEmail(EMAILJS_CONFIG.orderSuccessTemplateId,{
      to_email:State.profile.email,to_name:State.profile.name,
      order_id:orderId,customer_name:State.profile.name,
      company_name:k.company.name,
      total:money(t.total),payment_method:k.paymentMethod.toUpperCase(),
      items_list:State.cart.items.map(i=>`${i.name} × ${i.quantity}`).join(', '),
      order_total:money(t.total),
      delivery_address:addrString(State.profile.address),
      app_url:APP_URL
    });

    State.cart={companyId:null,companyName:null,items:[]};
    saveCart();
    toast('Order placed successfully 🎉','success');
    navigate('order-details',{id:orderId});
  }catch(err){
    console.error(err);
    toast('Could not place order: '+(err.message||'Unknown error'),'error');
    btn.disabled=false;btn.textContent='Place Order';
  } finally {
    State._placingOrder=false;
  }
};

async function renderReview(root){

  const products=await getProducts(o.companyId);
  const productOptions=(o.items||[]).map(it=>products.find(p=>p.id===it.productId)).filter(Boolean);
  const firstProduct=productOptions[0];
  State._review={rating:0, productId:firstProduct?.id||'', orderId:oid, companyId:o.companyId};
  root.innerHTML=`
  ${AppBar('Rate & Review',{showBack:true})}
  <div class="page">
    <div class="card" style="text-align:center">
      <div style="font-size:16px;font-weight:800;margin-bottom:10px">How was your order?</div>
      <div style="color:var(--muted);font-size:13px;margin-bottom:14px">${esc(o.companyName)} · ${esc(o.orderId)}</div>
      <div class="star-picker" id="star-picker">
        ${[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="__setRating(${n})">★</span>`).join('')}
      </div>
      <div style="font-size:13px;color:var(--muted)" id="rating-label">Tap to rate</div>
    </div>
    ${productOptions.length>1?`
      <div class="card">
        <div style="font-weight:800;font-size:14px;margin-bottom:8px">Reviewing product</div>
        <select id="rv-product" onchange="State._review.productId=this.value" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:12px;outline:none">
          ${productOptions.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
        </select>
      </div>`:''}
    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label>Your review (optional)</label>
        <textarea id="rv-text" rows="4" placeholder="Share your experience..." style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:12px;outline:none;resize:none"></textarea>
      </div>
    </div>
    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label>Google Maps location (optional)</label>
        <input id="rv-maps" type="url" placeholder="https://maps.app.goo.gl/..."/>
        <div class="hint">Optional — share your delivery location</div>
      </div>
    </div>
    <button class="btn btn-primary" id="rv-btn" onclick="__submitReview()">Submit Review</button>
  </div>
  ${BottomNav('orders')}`;
}
const RLABELS=['','Poor 😞','Fair 😐','Good 🙂','Very Good 😊','Excellent 🤩'];
window.__setRating=(n)=>{
  State._review.rating=n;
  document.querySelectorAll('#star-picker span').forEach(s=>s.classList.toggle('on',Number(s.dataset.n)<=n));
  const lbl=$('rating-label');if(lbl)lbl.textContent=RLABELS[n];
};
window.__submitReview=async()=>{
  if(!State._review.rating){toast('Please select a rating','error');return;}
  const text=$('rv-text').value.trim();
  const maps=$('rv-maps').value.trim();
  if(maps && !/^https?:\/\/.+/.test(maps)){toast('Please enter a valid URL for Maps','error');return;}
  const btn=$('rv-btn');btn.disabled=true;btn.innerHTML='<div class="spinner"></div>Submitting...';
  try{
    await addDoc(collection(db,'reviews'),{
      orderId:State._review.orderId,
      productId:State._review.productId,
      companyId:State._review.companyId,
      customerId:State.user.uid,
      customerName:State.profile.name,
      customerEmail:State.profile.email,
      rating:State._review.rating,
      reviewText:text,
      mapsLink:maps,
      createdAt:serverTimestamp()
    });
    await updateDoc(doc(db,'orders',State._review.orderId),{hasReview:true,reviewedAt:serverTimestamp()});
    toast('Thanks for your review! ⭐','success');
    setTimeout(()=>navigate('order-details',{id:State._review.orderId}),700);
  }catch(e){
    toast('Could not submit review: '+e.message,'error');
    btn.disabled=false;btn.textContent='Submit Review';
  }
};

window.__doTrack=async()=>{
  const oid=$('t-oid').value.trim().toUpperCase();
  const email=$('t-email').value.trim().toLowerCase();
  if(!oid||!validEmail(email)){toast('Enter valid order ID and email','error');return;}
  const btn=$('t-btn');btn.disabled=true;btn.innerHTML='<div class="spinner"></div>Searching...';
  try{
    const snap=await getDoc(doc(db,'orders',oid));
    if(!snap.exists()||(snap.data().customerEmail||'').toLowerCase()!==email){
      $('t-result').innerHTML='<div style="background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px;font-size:13px;text-align:center">Order not found or email mismatch</div>';
      btn.disabled=false;btn.textContent='Track Order';return;
    }
    const o=snap.data();
    $('t-result').innerHTML=`
      <div style="background:#f9fafb;border-radius:12px;padding:14px">
        <div style="font-family:monospace;font-size:11.5px;color:var(--muted)">${esc(o.orderId)}</div>
        <div style="font-weight:800;margin-top:4px">${esc(o.companyName)}</div>
        <div style="margin-top:8px"><span class="status ${esc(o.status)}">${esc(o.status)}</span></div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px">Placed ${fmtDate(o.createdAt)}</div>
        <div style="font-weight:800;font-size:18px;color:var(--brand1);margin-top:8px">${money(o.total)}</div>
        ${o.trackingUrl&&o.status==='delivered'?`<button class="btn btn-primary" style="margin-top:12px" onclick="window.open('${esc(o.trackingUrl)}','_blank')">🚚 Track Delivery</button>`:''}
      </div>`;
    btn.disabled=false;btn.textContent='Track Order';
  }catch(e){
    toast('Error: '+e.message,'error');btn.disabled=false;btn.textContent='Track Order';
  }
};

function renderAdminSection(route){

/* Dashboard */
function adminDashboard(c){
  const unsub=onSnapshot(collection(db,'orders'),(snap)=>{
    const orders=snap.docs.map(d=>({id:d.id,...d.data()}));
    orders.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
    const stats={
      total:orders.length,
      pending:orders.filter(o=>o.status==='pending').length,
      processing:orders.filter(o=>o.status==='processing').length,
      delivered:orders.filter(o=>o.status==='delivered').length,
      rejected:orders.filter(o=>o.status==='rejected'||o.status==='cancelled').length
    };
    c.innerHTML=`
      <div class="stat-grid">
        <div class="stat-card"><div class="lbl">Total Orders</div><div class="val indigo">${stats.total}</div></div>
        <div class="stat-card"><div class="lbl">Pending</div><div class="val amber">${stats.pending}</div></div>
        <div class="stat-card"><div class="lbl">Processing</div><div class="val blue">${stats.processing}</div></div>
        <div class="stat-card"><div class="lbl">Delivered</div><div class="val green">${stats.delivered}</div></div>
        <div class="stat-card"><div class="lbl">Rejected</div><div class="val red">${stats.rejected}</div></div>
      </div>
      <div class="admin-header"><h2>Recent Orders</h2></div>
      <div class="table-wrap">

        <thead><tr><th>Order ID</th><th>Customer</th><th>Company</th><th>Total</th><th>Status</th><th>Date</th><th></th></tr></thead>
        <tbody>
        ${orders.slice(0,10).map(o=>`

            <td>${esc(o.customerName||'')}</td>

      <button class="btn btn-sm btn-primary" onclick="__adminCouponModal()">+ Add Coupon</button></div>
      <div class="table-wrap">
      <table class="dtable">
        <thead><tr><th>Code</th><th>Discount</th><th>Min</th><th>Max</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody>
        ${list.map(x=>`
          <tr>
            <td style="font-family:monospace;font-weight:700">${esc(x.code)}</td>
            <td>${x.discountType==='percent'?`${x.discountValue}%`:`₹${x.discountValue}`}</td>
            <td>${x.minOrder?money(x.minOrder):'—'}</td>
            <td>${x.maxDiscount?money(x.maxDiscount):'—'}</td>
            <td>${x.isActive!==false?'✅':'❌'}</td>
            <td>
              <button class="btn btn-sm btn-outline" onclick="__adminCouponModal('${esc(x.id)}')">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="__adminDeleteCoupon('${esc(x.id)}')">Del</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table></div>`;
  },(e)=>console.warn('coupons listener',e));
  State.unsubs.push(unsub);
}
window.__adminCouponModal=async(id)=>{
  let x={};
  if(id){
    const s=await getDoc(doc(db,'coupons',id));
    if(s.exists()) x={id:s.id,...s.data()};
  }
  showModal(`
    <div class="modal-title">${id?'Edit':'Add'} Coupon <button class="modal-close" onclick="__closeModal()">×</button></div>
    <div class="field"><label>Code *</label><input id="acp-code" value="${esc(x.code||'')}" style="text-transform:uppercase"/></div>
    <div class="row-2">
      <div class="field"><label>Type</label>
        <select id="acp-type" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:12px;outline:none">
          <option value="percent" ${x.discountType==='percent'?'selected':''}>Percent</option>
          <option value="flat" ${x.discountType==='flat'?'selected':''}>Flat ₹</option>
        </select>
      </div>
      <div class="field"><label>Value *</label><input id="acp-val" type="number" value="${x.discountValue||''}"/></div>
    </div>
    <div class="row-2">
      <div class="field"><label>Max discount ₹</label><input id="acp-max" type="number" value="${x.maxDiscount||''}"/></div>
      <div class="field"><label>Min order ₹</label><input id="acp-min" type="number" value="${x.minOrder||''}"/></div>
    </div>
    <label style="display:flex;gap:6px;align-items:center;font-size:13px;margin-bottom:14px"><input type="checkbox" id="acp-active" ${x.isActive!==false?'checked':''}/> Active</label>
    <button class="btn btn-primary" id="acp-btn" onclick="__adminSaveCoupon('${id||''}')">Save</button>`);
};
window.__adminSaveCoupon=async(id)=>{
  const data={
    code:$('acp-code').value.trim().toUpperCase(),
    discountType:$('acp-type').value,
    discountValue:Number($('acp-val').value)||0,
    maxDiscount:Number($('acp-max').value)||0,
    minOrder:Number($('acp-min').value)||0,
    isActive:$('acp-active').checked
  };
  if(!data.code||!data.discountValue){toast('Code and value required','error');return;}
  const btn=$('acp-btn');btn.disabled=true;btn.innerHTML='<div class="spinner"></div>Saving...';
  try{
    if(id) await updateDoc(doc(db,'coupons',id),data);
    else await addDoc(collection(db,'coupons'),{...data,createdAt:serverTimestamp()});
    toast('Saved','success');closeModal();
  }catch(e){toast('Error: '+e.message,'error');btn.disabled=false;btn.textContent='Save';}
};
window.__adminDeleteCoupon=async(id)=>{
  if(!confirm('Delete coupon?'))return;
  try{await deleteDoc(doc(db,'coupons',id));toast('Deleted','success');}catch(e){toast('Error: '+e.message,'error');}
};

/* Orders */
function adminOrders(c){
  const unsub=onSnapshot(collection(db,'orders'),(snap)=>{
    const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
    const filter=State._adminOrderFilter||'all';
    const filtered = filter==='all'? list : list.filter(o=>o.status===filter);
    c.innerHTML=`
      <div class="tabs" style="margin-bottom:14px">
        ${['all','pending','processing','successful','delivered','rejected'].map(f=>`<button class="tab ${f===filter?'active':''}" onclick="__adminOrderFilter('${f}')">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('')}
      </div>
      <div class="admin-header"><h2>${filtered.length} Orders</h2></div>
      <div class="table-wrap">
      <table class="dtable">
        <thead><tr><th>Order ID</th><th>Customer</th><th>Company</th><th>Total</th><th>Status</th><th>Payment</th><th>Date</th><th></th></tr></thead>
        <tbody>
        ${filtered.map(o=>`
          <tr>
            <td style="font-family:monospace;font-size:12px">${esc(o.orderId)}</td>
            <td>${esc(o.customerName||'')}<br><span style="font-size:11px;color:var(--muted)">${esc(o.customerEmail||'')}</span></td>
            <td>${esc(o.companyName||'')}</td>
            <td>${money(o.total)}</td>
            <td><span class="status ${esc(o.status)}">${esc(o.status)}</span></td>
            <td style="text-transform:uppercase;font-size:12px">${esc(o.paymentMethod||'')}<br><span style="font-size:11px;color:var(--muted)">${esc(o.paymentStatus||'')}</span></td>
            <td>${fmtDateShort(o.createdAt)}</td>
            <td><button class="btn btn-sm btn-primary" onclick="__adminManageOrder('${esc(o.orderId)}')">Manage</button></td>
          </tr>`).join('')}
        </tbody>
      </table></div>`;
  },(e)=>console.warn('admin orders listener',e));
  State.unsubs.push(unsub);
}
window.__adminOrderFilter=(f)=>{State._adminOrderFilter=f;renderAdminSection('orders');};
window.__adminManageOrder=async(orderId)=>{
  const s=await getDoc(doc(db,'orders',orderId));
  if(!s.exists()){toast('Order not found','error');return;}
  const o={id:s.id,...s.data()};
  State._adminOrder=o;
  const isTerminal=['delivered','rejected','cancelled'].includes(o.status);
  showModal(`
    <div class="modal-title">Order ${esc(o.orderId)} <button class="modal-close" onclick="__closeModal()">×</button></div>
    <div style="background:#f9fafb;border-radius:12px;padding:12px;font-size:13px;line-height:1.6;margin-bottom:14px">
      <div><b>${esc(o.customerName)}</b> · ${esc(o.customerPhone)}</div>
      <div style="color:var(--muted)">${esc(o.customerEmail)}</div>
      <div style="margin-top:6px">${esc(addrString(o.address))}</div>
      <div style="margin-top:8px"><b>${esc(o.companyName)}</b> · ${esc(o.items?.length||0)} item(s) · ${money(o.total)}</div>
      <div style="margin-top:6px">Payment: <b style="text-transform:uppercase">${esc(o.paymentMethod)}</b> · <span style="text-transform:capitalize">${esc(o.paymentStatus)}</span></div>
      <div style="margin-top:8px"><span class="status ${esc(o.status)}">${esc(o.status)}</span></div>
    </div>
    ${!isTerminal?`
    <div class="field"><label>Update status</label>
      <select id="ao-status" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:12px;outline:none">
        <option value="">Select...</option>
        <option value="processing">Processing</option>
        <option value="successful">Successful (requires tracking URL)</option>
        <option value="delivered">Delivered</option>
        <option value="rejected">Rejected</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <div class="field hidden" id="ao-reason-wrap"><label>Reason *</label><input id="ao-reason" placeholder="Reason for rejection"/></div>
    <div class="field hidden" id="ao-track-wrap"><label>Tracking URL *</label><input id="ao-track" type="url" placeholder="https://..."/></div>
    <div class="field"><label>Payment status</label>
      <select id="ao-pay" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:12px;outline:none">
        <option value="pending" ${o.paymentStatus==='pending'?'selected':''}>Pending</option>
        <option value="paid" ${o.paymentStatus==='paid'?'selected':''}>Paid</option>
        <option value="failed" ${o.paymentStatus==='failed'?'selected':''}>Failed</option>
      </select>
    </div>
    <button class="btn btn-primary" id="ao-btn" onclick="__adminUpdateOrder()">Update Order</button>
    `:`
    <div style="color:var(--muted);font-size:13px;text-align:center;padding:10px">Order is in terminal state (${esc(o.status)})</div>
    ${o.trackingUrl?`<button class="btn btn-outline" onclick="window.open('${esc(o.trackingUrl)}','_blank')">View Tracking</button>`:''}
    `}`);
  const sel=$('ao-status');
  if(sel) sel.addEventListener('change',()=>{
    const v=sel.value;
    $('ao-reason-wrap').classList.toggle('hidden',!['rejected','cancelled'].includes(v));
    $('ao-track-wrap').classList.toggle('hidden',v!=='successful');
  });
};
window.__adminUpdateOrder=async()=>{
  const o=State._adminOrder;
  if(!o){toast('No order selected','error');return;}
  const status=$('ao-status').value;
  if(!status){toast('Select a status','error');return;}
  const paymentStatus=$('ao-pay').value;
  const updates={status,paymentStatus,updatedAt:serverTimestamp()};
  if(['rejected','cancelled'].includes(status)){
    const reason=$('ao-reason').value.trim();
    if(!reason){toast('Reason required','error');return;}
    updates.rejectionReason=reason;
  }
  if(status==='successful'){
    const track=$('ao-track').value.trim();
    if(!track || !/^https?:\/\/.+/.test(track)){toast('Valid tracking URL required','error');return;}
    updates.trackingUrl=track;
    updates.status='delivered';
  }
  const btn=$('ao-btn');btn.disabled=true;btn.innerHTML='<div class="spinner"></div>Updating...';
  try{
    await updateDoc(doc(db,'orders',o.orderId),updates);
    await addDoc(collection(db,'orders',o.orderId,'statusHistory'),{
      status:updates.status,
      title:`Status: ${updates.status}`,
      message:updates.rejectionReason?`Reason: ${updates.rejectionReason}`:(updates.trackingUrl?`Tracking: ${updates.trackingUrl}`:''),
      createdAt:serverTimestamp()
    });
    const titles={
      processing:'Order processing 🛠️',
      delivered:'Order delivered ✅',
      successful:'Order successful ✅',
      rejected:'Order rejected ❌',
      cancelled:'Order cancelled ❌'
    };
    await notify(o.customerId,titles[updates.status]||'Order updated',`Order ${o.orderId}: ${updates.status}${updates.trackingUrl?' · Track: '+updates.trackingUrl:''}${updates.rejectionReason?' · '+updates.rejectionReason:''}`);
    if(updates.status==='delivered' || updates.status==='successful'){
      sendEmail(EMAILJS_CONFIG.orderDeliveredTemplateId,{
        to_email:o.customerEmail,to_name:o.customerName,
        order_id:o.orderId,customer_name:o.customerName,
        company_name:o.companyName,tracking_url:updates.trackingUrl||o.trackingUrl||'',
        order_total:money(o.total),app_url:APP_URL
      });
    }
    toast('Order updated','success');
    closeModal();
  }catch(e){toast('Error: '+e.message,'error');btn.disabled=false;btn.textContent='Update Order';}
};

      <div class="admin-header"><h2>Customers (${list.length})</h2></div>
      <div class="table-wrap">
      <table class="dtable">
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Referral</th><th>Ref count</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        ${list.map(u=>`
          <tr>
            <td><b>${esc(u.name||'')}</b></td>
            <td>${esc(u.email||'')}</td>

              <button class="btn btn-sm btn-danger" onclick="__adminBlock('${esc(u.id)}')">Block</button>

      </table></div>`;

}
window.__adminSuspend=(uid)=>{
  showModal(`
    <div class="modal-title">Suspend customer <button class="modal-close" onclick="__closeModal()">×</button></div>
    <div class="field"><label>Duration (days)</label><input id="as-days" type="number" value="7" min="1"/></div>
    <div class="field"><label>Reason</label><input id="as-reason"/></div>
    <button class="btn btn-primary" onclick="__doSuspend('${uid}')">Suspend</button>`);
};
window.__doSuspend=async(uid)=>{
  const days=Number($('as-days').value)||7;
  const reason=$('as-reason').value.trim()||'Policy violation';
  const until=new Date(Date.now()+days*86400000).toISOString();
  try{
    await updateDoc(doc(db,'users',uid),{status:'suspended',suspendedUntil:until,suspendReason:reason});
    toast('Suspended','success');closeModal();
  }catch(e){toast('Error: '+e.message,'error');}
};
window.__adminBlock=(uid)=>{
  showModal(`
    <div class="modal-title">Block customer <button class="modal-close" onclick="__closeModal()">×</button></div>
    <div class="field"><label>Reason</label><input id="ab-reason"/></div>
    <button class="btn btn-danger" onclick="__doBlock('${uid}')">Block</button>`);
};
window.__doBlock=async(uid)=>{
  const reason=$('ab-reason').value.trim()||'Blocked by admin';
  try{
    await updateDoc(doc(db,'users',uid),{status:'blocked',blockReason:reason});
    toast('Blocked','success');closeModal();
  }catch(e){toast('Error: '+e.message,'error');}
};
window.__adminUnblock=async(uid)=>{
  try{await updateDoc(doc(db,'users',uid),{status:'active',suspendedUntil:null,suspendReason:''});toast('Unblocked','success');}
  catch(e){toast('Error: '+e.message,'error');}
};
window.__adminDeleteUser=(uid,email)=>{
  showModal(`
    <div class="modal-title">Delete customer <button class="modal-close" onclick="__closeModal()">×</button></div>
    <p style="font-size:13.5px;color:var(--danger);margin:0 0 12px">This permanently deletes the user document. Type <b>${esc(email)}</b> to confirm.</p>
    <div class="field"><label>Type email to confirm</label><input id="ad-email" placeholder="${esc(email)}"/></div>
    <button class="btn btn-danger" onclick="__doDeleteUser('${uid}','${esc(email)}')">Delete</button>`);
};
window.__doDeleteUser=async(uid,email)=>{
  if($('ad-email').value.trim()!==email){toast('Email does not match','error');return;}
  try{await deleteDoc(doc(db,'users',uid));toast('Deleted','success');closeModal();}
  catch(e){toast('Error: '+e.message,'error');}
};

renderNavBadge();
const urlParams=new URLSearchParams(location.search);
if(urlParams.get('ref') && !State.user){
  setTimeout(()=>{ if(!State.user && State.route.name==='login') navigate('register'); },500);
}
window.State=State;
