<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0f14" />
<title>PRL Rate X Survivor</title>
<style>
:root {
  --bg: #0d0f14;
  --surface: #15181f;
  --surface-2: #1c2029;
  --surface-3: #232834;
  --border: #262b36;
  --border-2: #333a48;
  --text: #e8eaed;
  --text-2: #9aa3b2;
  --text-3: #6b7280;
  --accent: #3b82f6;
  --accent-press: #2563eb;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
  --radius: 10px;
  --radius-sm: 8px;
  --radius-lg: 14px;
  --header-h: 56px;
  --nav-h: 60px;
}
[data-theme="light"] {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eef0f4;
  --border: #e2e5ea;
  --border-2: #d3d7de;
  --text: #111418;
  --text-2: #5a6373;
  --text-3: #8b95a5;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; color: inherit; }
input, select { font-family: inherit; outline: none; }
.hidden { display: none !important; }

#appView { min-height: 100vh; display: flex; flex-direction: column; }

/* HEADER */
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 14px; display: flex; align-items: center; gap: 12px;
  padding-top: env(safe-area-inset-top);
  height: calc(var(--header-h) + env(safe-area-inset-top));
}
.header-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; letter-spacing: -.5px; flex-shrink: 0;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-text .b1 { font-size: 13px; font-weight: 800; letter-spacing: .2px; }
.brand-text .b2 { font-size: 9px; color: var(--text-3); font-weight: 600; letter-spacing: 1.2px; margin-top: 2px; }
.header-status { flex: 1; min-width: 0; display: flex; justify-content: center; }
.status-chip {
  font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
  padding: 4px 9px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2);
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.status-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
.status-chip.live { color: var(--success); border-color: rgba(34,197,94,.35); }
.status-chip.live .dot { background: var(--success); animation: pulse 2s infinite; }
.status-chip.closed { color: var(--warning); border-color: rgba(245,158,11,.35); }
.status-chip.closed .dot { background: var(--warning); }
.status-chip.done { color: var(--text-3); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.balance-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 9px;
  font-size: 12.5px; font-weight: 700;
}
.balance-pill .coin {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--warning); display: inline-block; flex-shrink: 0;
  position: relative;
}
.balance-pill .coin::after {
  content: '$'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 900; color: rgba(0,0,0,.55);
}
.balance-pill .val { font-variant-numeric: tabular-nums; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); transition: background .15s; flex-shrink: 0;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; stroke-width: 1.8; }

.app-main {
  flex: 1;
  padding: 14px 14px calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  max-width: 640px; width: 100%; margin: 0 auto;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  color: var(--text-3); font-size: 10px; font-weight: 600; letter-spacing: .2px;
  position: relative; transition: color .15s; min-width: 0;
}
.nav-item svg { width: 20px; height: 20px; stroke-width: 1.8; }
.nav-item.active { color: var(--accent); }
.nav-item.active::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 22px; height: 2px; background: var(--accent);
  border-radius: 0 0 2px 2px;
}

/* CARDS */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; gap: 8px;
}
.card-title { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--text-3); text-transform: uppercase; }
.card-title-lg { font-size: 15px; font-weight: 700; letter-spacing: -.2px; color: var(--text); }

.balance-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.balance-info .bl { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
.balance-info .bv { font-size: 26px; font-weight: 800; letter-spacing: -.8px; margin-top: 2px; font-variant-numeric: tabular-nums; color: var(--text); }
.balance-info .bn { font-size: 10px; color: var(--text-3); font-weight: 600; letter-spacing: .4px; margin-top: 4px; }
.balance-right { text-align: right; }
.balance-right .rate { font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
.balance-right .lbl { font-size: 10px; color: var(--text-3); letter-spacing: .6px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }

.status-panel { display: flex; gap: 8px; margin-bottom: 10px; }
.status-tile {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px; min-width: 0;
}
.status-tile .k { font-size: 10px; color: var(--text-3); font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
.status-tile .v { font-size: 15px; font-weight: 800; margin-top: 3px; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-tile .v.accent { color: var(--accent); }
.status-tile .v.success { color: var(--success); }
.status-tile .v.warning { color: var(--warning); }

.live-round {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
  position: relative; overflow: hidden;
}
.live-round::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--success);
}
.live-round.warn::before { background: var(--warning); }
.live-round.done::before { background: var(--text-3); }
.live-round .lr-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: rgba(34,197,94,.12); color: var(--success);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.live-round.warn .lr-icon { background: rgba(245,158,11,.12); color: var(--warning); }
.live-round.done .lr-icon { background: var(--surface-2); color: var(--text-3); }
.live-round .lr-icon svg { width: 20px; height: 20px; stroke-width: 2; }
.live-round .lr-info { flex: 1; min-width: 0; }
.live-round .lr-status { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--success); }
.live-round.warn .lr-status { color: var(--warning); }
.live-round.done .lr-status { color: var(--text-3); }
.live-round .lr-title { font-size: 15px; font-weight: 800; margin-top: 2px; letter-spacing: -.2px; }
.live-round .lr-sub { font-size: 11.5px; color: var(--text-3); margin-top: 2px; font-weight: 500; }

.timeline { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 4px; }
.tl-chip {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 2px 4px; text-align: center; min-width: 0;
}
.tl-chip .tln { font-size: 9px; font-weight: 800; letter-spacing: .3px; color: var(--text-3); line-height: 1; }
.tl-chip .tls { font-size: 9px; font-weight: 700; margin-top: 4px; letter-spacing: -.1px; line-height: 1; }
.tl-chip.live { border-color: var(--success); background: rgba(34,197,94,.08); }
.tl-chip.live .tls { color: var(--success); }
.tl-chip.live .tln { color: var(--success); }
.tl-chip.won-a { border-color: rgba(59,130,246,.4); }
.tl-chip.won-a .tls { color: var(--accent); }
.tl-chip.won-b { border-color: rgba(245,158,11,.4); }
.tl-chip.won-b .tls { color: var(--warning); }
.tl-chip.closed { border-color: var(--warning); background: rgba(245,158,11,.06); }
.tl-chip.closed .tls { color: var(--warning); }
.tl-chip.done { opacity: .55; }

.teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.team-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px;
  transition: border-color .15s, background .15s; position: relative;
}
.team-panel.selectable { cursor: pointer; }
.team-panel.selectable:active { background: var(--surface-2); }
.team-panel.selected-a { border-color: var(--accent); background: rgba(59,130,246,.05); }
.team-panel.selected-b { border-color: var(--warning); background: rgba(245,158,11,.05); }
.team-panel.dead { opacity: .55; }
.tp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 6px; }
.tp-name { font-size: 13px; font-weight: 800; letter-spacing: .3px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.tp-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.team-panel.team-B .tp-dot { background: var(--warning); }
.tp-badge {
  font-size: 9px; font-weight: 800; letter-spacing: .5px;
  padding: 2px 6px; border-radius: 4px;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border); white-space: nowrap;
}
.tp-badge.alive { color: var(--success); border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.08); }
.tp-badge.dead { color: var(--danger); border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08); }
.tp-stat { display: flex; justify-content: space-between; font-size: 11.5px; padding: 3px 0; }
.tp-stat .k { color: var(--text-3); font-weight: 600; }
.tp-stat .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.tp-rate {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border);
  display: flex; align-items: baseline; justify-content: space-between;
}
.tp-rate .lbl { font-size: 9px; color: var(--text-3); letter-spacing: .6px; font-weight: 800; text-transform: uppercase; }
.tp-rate .val { font-size: 18px; font-weight: 800; letter-spacing: -.5px; color: var(--accent); font-variant-numeric: tabular-nums; }
.team-panel.team-B .tp-rate .val { color: var(--warning); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 46px; padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14.5px; font-weight: 700; letter-spacing: .1px;
  background: var(--accent); color: #fff;
  transition: background .15s, opacity .15s;
}
.btn:active { background: var(--accent-press); }
.btn:disabled { opacity: .45; cursor: not-allowed; background: var(--surface-3); color: var(--text-3); }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:active { background: var(--surface-3); }
.btn-danger { background: var(--danger); }
.btn-success { background: var(--success); }
.btn-warning { background: var(--warning); color: #1a1a1a; }
.btn-sm { min-height: 36px; padding: 8px 12px; font-size: 13px; border-radius: var(--radius-sm); width: auto; }

.round-banner {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
}
.round-banner .rb-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(34,197,94,.1); color: var(--success);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.round-banner.warn .rb-icon { background: rgba(245,158,11,.1); color: var(--warning); }
.round-banner.done .rb-icon { background: var(--surface-2); color: var(--text-3); }
.round-banner .rb-icon svg { width: 20px; height: 20px; stroke-width: 2; }
.round-banner .rb-txt { flex: 1; min-width: 0; }
.round-banner .rb-k { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: var(--success); text-transform: uppercase; }
.round-banner.warn .rb-k { color: var(--warning); }
.round-banner.done .rb-k { color: var(--text-3); }
.round-banner .rb-t { font-size: 16px; font-weight: 800; margin-top: 2px; letter-spacing: -.2px; }
.round-banner .rb-s { font-size: 11.5px; color: var(--text-3); margin-top: 2px; font-weight: 500; }

.stake-input-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1.5px solid var(--border-2);
  border-radius: var(--radius); padding: 4px 4px 4px 14px;
  margin-bottom: 8px; transition: border-color .15s;
}
.stake-input-wrap:focus-within { border-color: var(--accent); }
.stake-input-wrap input {
  flex: 1; border: none; background: transparent;
  color: var(--text); font-size: 20px; font-weight: 800;
  font-variant-numeric: tabular-nums; letter-spacing: -.5px;
  width: 100%; min-width: 0; padding: 10px 0;
}
.stake-input-wrap input::placeholder { color: var(--text-3); font-weight: 600; }
.stake-input-wrap .unit {
  font-size: 12px; color: var(--text-3); font-weight: 700; letter-spacing: .3px;
  padding: 0 12px; border-left: 1px solid var(--border);
}

.preset-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
.preset-btn {
  padding: 8px 4px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 12px; font-weight: 700;
  font-variant-numeric: tabular-nums; transition: all .12s; min-height: 36px;
}
.preset-btn:active { background: var(--surface-3); }
.preset-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.summary-list {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 4px 14px; margin-bottom: 12px;
}
.summary-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 0; border-bottom: 1px solid var(--border);
  font-size: 13.5px; gap: 12px;
}
.summary-row:last-child { border-bottom: none; }
.summary-row .k { color: var(--text-3); font-weight: 600; }
.summary-row .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.summary-row .v.up { color: var(--success); }
.summary-row .v.down { color: var(--danger); }
.summary-row .v.accent { color: var(--accent); }

.available-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 4px 10px; font-size: 12px; color: var(--text-3); font-weight: 600;
}
.available-row b { color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }

.sticky-action {
  position: sticky; bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom));
  background: var(--bg); padding: 10px 14px 4px;
  margin: 0 -14px; z-index: 20;
}
.sticky-action::before {
  content: ''; position: absolute; left: 0; right: 0; top: -20px;
  height: 20px; background: linear-gradient(180deg, transparent, var(--bg));
  pointer-events: none;
}

.list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.list-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  transition: background .12s; min-width: 0;
}
.list-row:last-child { border-bottom: none; }
.list-row:active { background: var(--surface-2); }
.list-row .avatar {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface-3); color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; flex-shrink: 0; letter-spacing: -.3px;
}
.list-row .avatar.team-a { background: rgba(59,130,246,.15); color: var(--accent); }
.list-row .avatar.team-b { background: rgba(245,158,11,.15); color: var(--warning); }
.list-row .avatar.won { background: rgba(34,197,94,.15); color: var(--success); }
.list-row .avatar.lost { background: rgba(239,68,68,.15); color: var(--danger); }
.list-row .lr-body { flex: 1; min-width: 0; }
.list-row .lr-title {
  font-size: 14px; font-weight: 700; letter-spacing: -.1px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.list-row .lr-sub {
  font-size: 11.5px; color: var(--text-3); margin-top: 2px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.list-row .lr-right { text-align: right; flex-shrink: 0; }
.list-row .lr-amount { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.list-row .lr-amount.up { color: var(--success); }
.list-row .lr-amount.down { color: var(--danger); }
.list-row .lr-amount.pending { color: var(--warning); }
.list-row .lr-meta { font-size: 10.5px; color: var(--text-3); margin-top: 2px; font-weight: 600; letter-spacing: .3px; }

.badge {
  display: inline-block; font-size: 10px; font-weight: 800;
  letter-spacing: .5px; padding: 2px 7px; border-radius: 4px;
  text-transform: uppercase; white-space: nowrap;
}
.badge.live { color: var(--success); background: rgba(34,197,94,.12); }
.badge.open { color: var(--success); background: rgba(34,197,94,.12); }
.badge.closed { color: var(--warning); background: rgba(245,158,11,.12); }
.badge.done { color: var(--text-3); background: var(--surface-3); }
.badge.pending { color: var(--warning); background: rgba(245,158,11,.12); }
.badge.won { color: var(--success); background: rgba(34,197,94,.12); }
.badge.lost { color: var(--danger); background: rgba(239,68,68,.12); }
.badge.active { color: var(--success); background: rgba(34,197,94,.12); }
.badge.eliminated { color: var(--danger); background: rgba(239,68,68,.12); }
.badge.blocked { color: var(--danger); background: rgba(239,68,68,.12); }
.badge.admin { color: var(--warning); background: rgba(245,158,11,.12); }

.player-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--border); min-width: 0;
}
.player-row:last-child { border-bottom: none; }
.player-row .pr-name { flex: 1; font-size: 13.5px; font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-row .pr-sub { font-size: 10.5px; color: var(--text-3); font-weight: 600; margin-top: 1px; }

.team-summary {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
}
.team-summary .ts-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.team-summary .ts-name { font-size: 15px; font-weight: 800; letter-spacing: -.2px; display: flex; align-items: center; gap: 8px; }
.team-summary .ts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.team-summary .ts-cell { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.team-summary .ts-cell .k { font-size: 9.5px; color: var(--text-3); font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
.team-summary .ts-cell .v { font-size: 15px; font-weight: 800; margin-top: 2px; letter-spacing: -.2px; font-variant-numeric: tabular-nums; }

.profile-header {

.form-field { margin-bottom: 12px; }

.sheet-backdrop {
  position: fixed; inset: 0;

}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.sheet {
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  width: 100%; max-width: 640px; max-height: 90vh;

  animation: slideUp .22s cubic-bezier(.2,.9,.3,1);

}
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
.sheet-handle { width: 36px; height: 4px; background: var(--border-2); border-radius: 2px; margin: 10px auto 6px; }
.sheet-head {
  padding: 6px 16px 14px;

.sheet-close {
  width: 32px; height: 32px; border-radius: 50%;

}

.toast {
  position: fixed; left: 50%;
  bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(120px);
  background: var(--surface-3); color: var(--text);

  box-shadow: 0 8px 24px rgba(0,0,0,.35);

  transition: transform .25s cubic-bezier(.2,.9,.3,1.2);

}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok { border-color: rgba(34,197,94,.5); }
.toast.err { border-color: rgba(239,68,68,.5); }

.login-view {
  min-height: 100vh; display: flex; flex-direction: column;

}
.login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; margin-top: 12px; }
.login-brand .bm {

  display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: #fff; font-size: 15px; letter-spacing: -.5px;
}
.login-brand .bt .bt1 { font-size: 16px; font-weight: 800; letter-spacing: -.2px; }
.login-brand .bt .bt2 { font-size: 10px; color: var(--text-3); letter-spacing: 1.5px; font-weight: 600; margin-top: 2px; }
.login-title { font-size: 26px; font-weight: 800; letter-spacing: -.8px; margin-bottom: 6px; }

.login-form { max-width: 400px; width: 100%; margin: 0 auto; flex: 1; }
.login-footer { text-align: center; padding: 20px 0 12px; font-size: 13px; color: var(--text-3); font-weight: 500; }
.login-footer .link { color: var(--accent); font-weight: 700; margin-left: 4px; cursor: pointer; }
.login-legal { text-align: center; font-size: 10.5px; color: var(--text-3); letter-spacing: .4px; padding: 8px 0 4px; font-weight: 500; }

.row-flex { display: flex; align-items: center; gap: 8px; }
.row-flex.gap-lg { gap: 12px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }

.txt-2 { color: var(--text-2); }

.fw-7 { font-weight: 700; }

.search-wrap { position: relative; margin-bottom: 10px; }
.search-wrap input {
  width: 100%; padding: 11px 14px 11px 40px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 14px;
  min-height: 44px;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap svg {
  position: absolute; left: 13px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-3);
}

.match-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px; margin-bottom: 8px;
}
.match-card.active { border-color: var(--success); }
.match-card.finished { opacity: .75; }
.mc-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; gap: 8px;
}

.mc-team { flex: 1; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; text-align: center; }
.mc-team .t { font-size: 10px; color: var(--text-3); font-weight: 800; letter-spacing: .5px; }
.mc-team .n { font-size: 17px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }

/* CONFIRMATION SHEET */
.confirm-sheet-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: rgba(245,158,11,.12);
  color: var(--warning);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
  font-size: 24px;
}

  background: rgba(239,68,68,.12); color: var(--danger);
}

  text-align: center; font-size: 17px; font-weight: 800;
  margin-bottom: 6px; letter-spacing: -.2px;
}

  text-align: center; font-size: 13.5px; color: var(--text-3);
  margin-bottom: 18px; line-height: 1.6;
}

@media (min-width: 720px) {
  .app-main { padding-left: 20px; padding-right: 20px; }
  .bottom-nav { left: 50%; right: auto; transform: translateX(-50%); max-width: 640px; border-radius: 14px 14px 0 0; border: 1px solid var(--border); border-bottom: none; }
  .kpi-grid { grid-template-columns: repeat(4, 1fr); }
}

  .balance-pill { font-size: 11.5px; padding: 5px 7px; }

  .preset-grid { gap: 4px; }
  .preset-btn { font-size: 11px; }
}
</style>

<body>

<!-- LOGIN / REGISTER -->
<div id="loginView" class="login-view">
  <div class="login-brand">
    <div class="bm">PRL</div>
    <div class="bt">
      <div class="bt1">RATE X</div>
      <div class="bt2">PAWAN RETAIL LIMITED</div>
    </div>
  </div>

  <div id="loginForm" class="login-form">
    <h1 class="login-title">Welcome back</h1>
    <p class="login-sub">Sign in to continue</p>
    <div id="loginMsg"></div>
    <div class="form-field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="form-field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn" onclick="doLogin()" id="loginBtn">Sign In</button>
    <div class="login-footer">
      Don't have an account?
      <span class="link" onclick="showRegister()">Create account</span>
    </div>
    <div class="login-legal">DEMO POINTS • NO CASH VALUE</div>
  </div>

  <div id="registerForm" class="login-form hidden">
    <h1 class="login-title">Create your account</h1>
    <p class="login-sub">Get 1,000 demo points free</p>
    <div id="registerMsg"></div>
    <div class="form-field">
      <label>Name</label>
      <input type="text" id="regName" placeholder="Your name" maxlength="30" />
    </div>
    <div class="form-field">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="form-field">
      <label>Password (min 6)</label>
      <input type="password" id="regPass" placeholder="••••••••" autocomplete="new-password" />
    </div>
    <button class="btn" onclick="doRegister()" id="regBtn">Create Account</button>
    <div class="login-footer">
      Already have an account?
      <span class="link" onclick="showLogin()">Sign In</span>
    </div>
    <div class="login-legal">DEMO POINTS • NO CASH VALUE</div>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-mark">PRL</div>
      <div class="brand-text">
        <div class="b1">RATE X</div>
        <div class="b2">SURVIVOR</div>
      </div>
    </div>
    <div class="header-status">
      <div class="status-chip" id="statusChip">
        <span class="dot"></span>
        <span id="statusText">Loading…</span>
      </div>
    </div>
    <div class="header-right">
      <div class="balance-pill">
        <span class="coin"></span>
        <span class="val" id="balanceVal">0</span>
      </div>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path id="themeIcon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="app-main" id="appMain"></main>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp,
  limit }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1eo4ZH8b4D1kXV3fczZkiajNOU0cw2YE",
  authDomain: "pawan-retail-limited-934.firebaseapp.com",
  projectId: "pawan-retail-limited-934",
  storageBucket: "pawan-retail-limited-934.firebasestorage.app",
  messagingSenderId: "558728971353",
  appId: "1:558728971353:web:83b341e4e5952b45305d48",
  measurementId: "G-QYSKZ87FNM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* STATE */
const state = {
  user: null, profile: null, isAdmin: false,
  settings: null,
  matches: [], currentMatchId: null,
  rounds: [], players: [], predictions: [], users: [], history: [],
  currentPage: 'home', unsub: [],
  bet: { teamId: null, stake: 100 },
  adminTab: 'live' // 'live' | 'history' for admin home
};

function unsubAll() {
  state.unsub.forEach(fn => { try { fn(); } catch(e){} });
  state.unsub = [];
}

/* THEME */
const savedTheme = localStorage.getItem('prl-theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);

window.toggleTheme = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('prl-theme', next);
  updateThemeIcon();
  render();
};
function updateThemeIcon() {
  const cur = document.documentElement.getAttribute('data-theme');
  const icon = document.getElementById('themeIcon');
  if (!icon) return;
  icon.setAttribute('d', cur === 'dark'
    ? 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'
    : 'M12 3v1M12 20v1M4.22 4.22l.7.7M18.36 18.36l.7.7M1 12h1M22 12h1M4.22 19.78l.7-.7M18.36 5.64l.7-.7M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z');
}

/* TOAST */
let toastTimer;
window.toast = (msg, type='ok') => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type === 'err' ? 'err' : 'ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 3500);
};

/* AUTH UI */
window.showRegister = () => {
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.remove('hidden');
};
window.showLogin = () => {
  document.getElementById('registerForm').classList.add('hidden');
  document.getElementById('loginForm').classList.remove('hidden');
};
function loginMsg(text, type='err', which='login') {
  const el = document.getElementById(which === 'login' ? 'loginMsg' : 'registerMsg');
  if (!el) return;
  if (!text) { el.innerHTML = ''; return; }
  const bg = type === 'err' ? 'rgba(239,68,68,.12)' : 'rgba(34,197,94,.12)';
  const fg = type === 'err' ? '#fca5a5' : '#86efac';
  const bd = type === 'err' ? 'rgba(239,68,68,.35)' : 'rgba(34,197,94,.35)';
  el.innerHTML = `<div style="padding:10px 12px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:12px;background:${bg};color:${fg};border:1px solid ${bd}">${text}</div>`;
}

window.doLogin = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) return loginMsg('Enter email and password');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…'; loginMsg('');
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    loginMsg((e.message || '').replace('Firebase: ', '') || 'Sign in failed');
    btn.disabled = false; btn.textContent = 'Sign In';
  }
};

window.doRegister = async () => {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  if (!name) return loginMsg('Enter your name','err','reg');
  if (!email) return loginMsg('Enter email','err','reg');
  if (!pass || pass.length < 6) return loginMsg('Password min 6 chars','err','reg');
  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = 'Creating…'; loginMsg('','ok','reg');
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, 'users', cred.user.uid), {
      email, name, demoPoints: 1000, blocked: false,
      role: 'customer', createdAt: serverTimestamp()
    });
    toast('Welcome! 1,000 demo points added', 'ok');
  } catch (e) {
    loginMsg((e.message || '').replace('Firebase: ', '') || 'Registration failed','err','reg');
    btn.disabled = false; btn.textContent = 'Create Account';
  }
};

window.doLogout = async () => {
  if (!confirm('Sign out?')) return;
  unsubAll();
  await signOut(auth);
};

/* AUTH STATE */
onAuthStateChanged(auth, async (user) => {
  unsubAll();
  if (!user) {
    state.user = null; state.profile = null; state.isAdmin = false;
    state.matches = []; state.players = []; state.predictions = [];
    state.users = []; state.rounds = []; state.history = [];
    state.currentMatchId = null;
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('appView').classList.add('hidden');
    return;
  }
  state.user = user;

  let isAdmin = false;
  try {
    const adminSnap = await getDoc(doc(db, 'admins', user.uid));
    isAdmin = adminSnap.exists();
  } catch (e) {}
  state.isAdmin = isAdmin;

  const profRef = doc(db, 'users', user.uid);
  let profSnap = await getDoc(profRef);
  if (!profSnap.exists()) {
    try {
      await setDoc(profRef, {
        email: user.email,
        name: user.displayName || (user.email || '').split('@')[0],
        demoPoints: 1000, blocked: false, role: 'customer',
        createdAt: serverTimestamp()
      });
      profSnap = await getDoc(profRef);
    } catch (e) {}
  }
  if (profSnap.exists() && profSnap.data().blocked) {
    toast('Account blocked.', 'err');
    setTimeout(() => signOut(auth), 1500);
    return;
  }

  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  updateThemeIcon();

  attachProfileListener();
  attachSettingsListener();
  attachMatchesListener();
  attachPlayersListener();
  attachPredictionsListener();
  attachRoundsListener();
  if (isAdmin) attachUsersListener();
  attachHistoryListener();

  state.currentPage = isAdmin ? 'admin_home' : 'home';
  renderNav();
  render();
});

/* LISTENERS */
function attachProfileListener() {
  const un = onSnapshot(doc(db, 'users', state.user.uid), snap => {
    if (!snap.exists()) return;
    const d = snap.data();
    if (d.blocked) { toast('Account blocked', 'err'); setTimeout(() => signOut(auth), 1200); return; }
    state.profile = d; render();
  });
  state.unsub.push(un);
}

function attachSettingsListener() {
  const ref = doc(db, 'settings', 'app');
  const un = onSnapshot(ref, async snap => {
    if (!snap.exists()) {
      if (state.isAdmin) {
        try { await setDoc(ref, { baseWinRate: 25, baseRate: 2.00, maxRounds: 8, updatedAt: serverTimestamp() }); } catch(e){}
      } else { state.settings = { baseWinRate: 25, baseRate: 2.00, maxRounds: 8 }; }
      return;
    }
    state.settings = snap.data(); render();
  });
  state.unsub.push(un);
}

function attachMatchesListener() {
  const un = onSnapshot(collection(db, 'matches'), snap => {
    state.matches = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.matchNumber || 0) - (a.matchNumber || 0));
    // Auto-select a live/waiting match if none
    if (!state.currentMatchId || !state.matches.find(m => m.id === state.currentMatchId)) {
      const live = state.matches.find(m => m.status === 'LIVE' || m.status === 'WAITING');
      state.currentMatchId = live ? live.id : (state.matches[0]?.id || null);
    }
    render();
  });
  state.unsub.push(un);
}

function attachRoundsListener() {
  const un = onSnapshot(collection(db, 'rounds'), snap => {
    state.rounds = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.roundNumber || 0) - (b.roundNumber || 0));
    render();
  });
  state.unsub.push(un);
}

function attachPlayersListener() {
  const un = onSnapshot(collection(db, 'players'), snap => {
    state.players = snap.docs.map(d => ({ id: d.id, ...d.data() })); render();
  });
  state.unsub.push(un);
}

function attachPredictionsListener() {
  let q;
  if (state.isAdmin) {
    q = query(collection(db, 'predictions'), orderBy('createdAt', 'desc'), limit(300));
  } else {
    q = query(collection(db, 'predictions'), where('userId', '==', state.user.uid));
  }
  const un = onSnapshot(q, snap => {
    let list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!state.isAdmin) list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    state.predictions = list; render();
  });
  state.unsub.push(un);
}

function attachUsersListener() {
  const un = onSnapshot(collection(db, 'users'), snap => {
    state.users = snap.docs.map(d => ({ id: d.id, ...d.data() })); render();
  });
  state.unsub.push(un);
}

function attachHistoryListener() {
  const un = onSnapshot(collection(db, 'match_history'), snap => {
    state.history = snap.docs.map(d => ({ id: d.id, ...d.data() }))

}

/* ═══════════════════════════════════════════════════
   MATH  — MAX RATE = 100.00X
   ═══════════════════════════════════════════════════ */
function currentMatch() {
  if (!state.currentMatchId) return null;
  return state.matches.find(m => m.id === state.currentMatchId) || null;
}

function teamStats(teamId, matchId = null) {
  const s = state.settings || { baseWinRate: 25, baseRate: 2 };
  const mid = matchId || state.currentMatchId;
  const all = state.players.filter(p =>
    p.teamId === teamId && (!mid || !p.matchId || p.matchId === mid)
  );
  const alive = all.filter(p => p.status === 'ACTIVE').length;
  const dead = all.filter(p => p.status === 'ELIMINATED').length;

  const otherId = teamId === 'A' ? 'B' : 'A';
  const otherAlive = state.players.filter(p =>
    p.teamId === otherId &&
    (!mid || !p.matchId || p.matchId === mid) &&
    p.status === 'ACTIVE'
  ).length;
  const totalAlive = alive + otherAlive;
  const isDead = all.length > 0 && alive === 0;

  let winRate = 0;
  if (totalAlive > 0) winRate = (s.baseWinRate * alive) / totalAlive;

  let rate = s.baseRate;
  if (alive > 0 && totalAlive > 0) {
    rate = s.baseRate * (totalAlive / (2 * alive));
  }
  // 🔥 MAX RATE CAP = 100.00X
  rate = Math.min(100, Math.max(1.01, rate));

  return {
    teamId, activeCount: alive, eliminatedCount: dead,
    totalPlayers: all.length, totalAlive, winRate, rate, isDead
  };
}

function roundStatusForMatch(m) {
  if (!m) return { code: 'NO_MATCH', msg: 'No match' };
  if (m.status === 'FINISHED') return { code: 'FINISHED', msg: `Match #${m.matchNumber} finished`, winner: m.winner };
  if (m.status === 'WAITING') return { code: 'WAITING', msg: 'Match is starting soon' };

  const r = state.rounds.find(x =>
    x.roundNumber === m.currentRound && x.matchId === m.id);

  if (!r) return { code: 'NO_ROUND', msg: 'Waiting for next round' };
  if (r.status === 'OPEN') return { code: 'OPEN', msg: `Round ${r.roundNumber} — Betting open`, round: r };
  if (r.status === 'CLOSED') return { code: 'CLOSED', msg: `Round ${r.roundNumber} — Betting closed`, round: r };
  if (r.status === 'RESULT_DECLARED') {
    if (!r.eliminationDone) {
      return { code: 'ELIMINATING', msg: `Round ${r.roundNumber} — awaiting elimination`, round: r };
    }
    return { code: 'COMPLETED', msg: `Round ${r.roundNumber} — Team ${r.winner} won`, round: r };
  }
  return { code: 'UNKNOWN', msg: 'Unknown' };
}

function fmt(n, d = 2) { return Number(n || 0).toFixed(d); }
function fmtRate(n) { return fmt(n, 2) + 'X'; }

/* RENDER ROUTER */
function render() {
  if (!state.user || !state.profile) return;

  const bal = document.getElementById('balanceVal');
  if (bal) bal.textContent = (state.profile.demoPoints || 0).toLocaleString();

  const m = currentMatch();
  const rs = m ? roundStatusForMatch(m) : { code: 'NO_MATCH' };
  const chip = document.getElementById('statusChip');
  const txt = document.getElementById('statusText');
  if (chip && txt) {
    chip.className = 'status-chip';
    if (rs.code === 'OPEN') { chip.classList.add('live'); txt.textContent = `R${rs.round?.roundNumber || '?'} • Live`; }
    else if (rs.code === 'CLOSED') { chip.classList.add('closed'); txt.textContent = `R${rs.round?.roundNumber || '?'} • Closed`; }
    else if (rs.code === 'FINISHED') { chip.classList.add('done'); txt.textContent = `M#${m?.matchNumber || '?'} • Finished`; }
    else { txt.textContent = m ? `M#${m.matchNumber}` : 'No Match'; }
  }

  const root = document.getElementById('appMain');
  let html = '';
  switch (state.currentPage) {
    case 'home':           html = viewHome(); break;
    case 'teams':          html = viewTeams(); break;
    case 'predict':        html = viewPredict(); break;
    case 'history':        html = viewHistory(); break;
    case 'profile':        html = viewProfile(); break;
    case 'admin_home':     html = viewAdminHome(); break;
    case 'admin_users':    html = viewAdminUsers(); break;
    case 'admin_teams':    html = viewAdminTeams(); break;
    case 'admin_rounds':   html = viewAdminRounds(); break;
    case 'admin_history':  html = viewAdminHistory(); break;
    default:               html = state.isAdmin ? viewAdminHome() : viewHome();
  }
  root.innerHTML = html;
  if (state.currentPage === 'predict') bindPredictInputs();
}

function viewPredict() {
  const liveMatches = state.matches.filter(m =>
    m.status === 'LIVE' || m.status === 'WAITING'
  ).sort((a, b) => {
    const order = { LIVE: 0, WAITING: 1 };
    const aO = order[a.status] ?? 2;
    const bO = order[b.status] ?? 2;
    if (aO !== bO) return aO - bO;
    return (b.matchNumber || 0) - (a.matchNumber || 0);
  });

  const m = liveMatches.find(x => x.id === state.currentMatchId) || liveMatches[0] || null;

  if (!m) {
    return `
      <div class="card" style="text-align:center;padding:48px 20px">

        </div>
        <button class="btn btn-secondary" style="max-width:200px;margin:0 auto" onclick="nav('home')">
          Back to Home
        </button>
      </div>

  }

  const rs = roundStatusForMatch(m);
  const A = teamStats('A', m.id);
  const B = teamStats('B', m.id);
  const pts = state.profile.demoPoints || 0;
  const r = rs.round;
  const sel = state.bet.teamId;
  const selStats = sel ? teamStats(sel, m.id) : null;
  const stake = Number(state.bet.stake) || 0;
  const rate = selStats ? selStats.rate : 0;
  const ret = stake * rate;
  const profit = ret - stake;

  const alreadyBet = r && state.predictions.find(p =>
    p.roundNumber === r.roundNumber && p.matchId === m.id && p.status === 'PENDING');

  const canBet = rs.code === 'OPEN' && !alreadyBet;
  const canConfirm = canBet && sel && !selStats?.isDead && stake > 0 && stake <= pts;

  return `
    <div class="round-banner ${rs.code === 'CLOSED' || rs.code === 'ELIMINATING' ? 'warn' : rs.code === 'OPEN' ? '' : 'done'}">
      <div class="rb-icon">
        ${rs.code === 'OPEN' ? svgIcon('play') : (rs.code === 'CLOSED' || rs.code === 'ELIMINATING') ? svgIcon('clock') : svgIcon('check')}
      </div>
      <div class="rb-txt">
        <div class="rb-k">
          ${rs.code === 'OPEN' ? 'Betting Open'
            : (rs.code === 'CLOSED' || rs.code === 'ELIMINATING') ? 'Betting Closed'
            : rs.code === 'WAITING' ? 'Starting Soon'
            : 'Inactive'}
        </div>
        <div class="rb-t">Round ${r?.roundNumber || '—'} • Match #${m.matchNumber}</div>
        <div class="rb-s">
          ${alreadyBet ? `You already bet on Team ${alreadyBet.teamId}`
            : rs.code === 'OPEN' ? 'Select a team to place your bet'
            : rs.msg}
        </div>
      </div>
    </div>

    ${!canBet && !alreadyBet ? `
      <div class="empty" style="padding:60px 20px">
        <div class="ico">${rs.code === 'WAITING' ? '⏳' : (rs.code === 'CLOSED' || rs.code === 'ELIMINATING') ? '🔒' : '⏸️'}</div>
        ${rs.msg}
      </div>
    ` : alreadyBet ? `
      <div class="card">
        <div class="row-flex gap-lg" style="padding:8px 0">
          <div class="avatar ${alreadyBet.teamId === 'A' ? 'team-a' : 'team-b'}"
            style="width:48px;height:48px;border-radius:12px;font-size:16px;display:flex;align-items:center;justify-content:center;font-weight:800">T${alreadyBet.teamId}</div>
          <div style="flex:1">
            <div class="fw-8" style="font-size:15px">Bet placed</div>
            <div class="txt-sm txt-3" style="margin-top:2px">
              Team ${alreadyBet.teamId} • ${alreadyBet.stake} pts • ${fmtRate(alreadyBet.rate)}
            </div>
          </div>
          <span class="badge pending">Pending</span>
        </div>
      </div>
      <div class="empty">Wait for Round ${r.roundNumber} result</div>
    ` : `
      <div class="card-title" style="padding:0 2px 8px">Choose Team</div>
      <div class="teams-grid">
        <div onclick="${A.isDead ? '' : "selectTeam('A')"}"
          class="${['team-panel', A.isDead ? 'dead' : 'selectable', sel === 'A' ? 'selected-a' : ''].filter(Boolean).join(' ')}">
          <div class="tp-head">
            <div class="tp-name"><span class="tp-dot"></span>Team A</div>
            <div class="tp-badge ${A.isDead ? 'dead' : 'alive'}">${A.isDead ? 'DEAD' : 'LIVE'}</div>
          </div>
          <div class="tp-stat"><span class="k">Alive</span><span class="v">${A.activeCount}</span></div>
          <div class="tp-stat"><span class="k">Win %</span><span class="v">${fmt(A.winRate, 1)}%</span></div>
          <div class="tp-rate"><span class="lbl">Rate</span><span class="val">${fmtRate(A.rate)}</span></div>
        </div>
        <div onclick="${B.isDead ? '' : "selectTeam('B')"}"
          class="${['team-panel', 'team-B', B.isDead ? 'dead' : 'selectable', sel === 'B' ? 'selected-b' : ''].filter(Boolean).join(' ')}">
          <div class="tp-head">
            <div class="tp-name"><span class="tp-dot"></span>Team B</div>
            <div class="tp-badge ${B.isDead ? 'dead' : 'alive'}">${B.isDead ? 'DEAD' : 'LIVE'}</div>
          </div>
          <div class="tp-stat"><span class="k">Alive</span><span class="v">${B.activeCount}</span></div>
          <div class="tp-stat"><span class="k">Win %</span><span class="v">${fmt(B.winRate, 1)}%</span></div>
          <div class="tp-rate"><span class="lbl">Rate</span><span class="val">${fmtRate(B.rate)}</span></div>
        </div>
      </div>

      <div class="card-title" style="padding:8px 2px 8px">Enter Points</div>
      <div class="stake-input-wrap">
        <input id="stakeInput" type="number" min="1" value="${state.bet.stake}" placeholder="0" inputmode="numeric" />
        <span class="unit">PTS</span>
      </div>
      <div class="preset-grid">
        ${[100, 250, 500, 1000].map(v => `
          <button class="preset-btn ${stake === v ? 'active' : ''}" onclick="setStake(${v})">${v}</button>
        `).join('')}
        <button class="preset-btn" onclick="setStake(${pts})">MAX</button>
      </div>
      <div class="available-row">
        <span>Available</span>
        <b>${pts.toLocaleString()} pts</b>
      </div>

      ${sel ? `
        <div class="summary-list">
          <div class="summary-row"><span class="k">Selected</span><span class="v">Team ${sel}</span></div>
          <div class="summary-row"><span class="k">Stake</span><span class="v down">−${stake} pts</span></div>
          <div class="summary-row"><span class="k">Rate</span><span class="v accent">${fmtRate(rate)}</span></div>
          <div class="summary-row"><span class="k">Potential Return</span><span class="v up">+${fmt(ret, 2)} pts</span></div>
          <div class="summary-row"><span class="k">Potential Profit</span>
            <span class="v ${profit >= 0 ? 'up' : 'down'}">${profit >= 0 ? '+' : ''}${fmt(profit, 2)} pts</span></div>
        </div>
      ` : ''}

      <div class="sticky-action">
        <button class="btn" ${canConfirm ? '' : 'disabled'} onclick="confirmPrediction()">
          ${!sel ? 'Select a Team'
            : stake <= 0 ? 'Enter Amount'
            : stake > pts ? 'Insufficient Points'
            : 'Confirm Prediction'}
        </button>
      </div>
    `}
  `;
}

function bindPredictInputs() {
  const inp = document.getElementById('stakeInput');
  if (!inp) return;
  inp.oninput = e => {
    state.bet.stake = Math.max(0, Math.floor(Number(e.target.value) || 0));
    clearTimeout(bindPredictInputs._t);
    bindPredictInputs._t = setTimeout(() => {
      const pos = inp.selectionStart;
      render();
      const nInp = document.getElementById('stakeInput');
      if (nInp) { nInp.focus(); nInp.setSelectionRange(pos, pos); }
    }, 400);
  };
}

window.selectTeam = (tid) => { state.bet.teamId = tid; render(); };
window.setStake = (v) => { state.bet.stake = v; render(); };

window.confirmPrediction = async () => {
  const liveMatches = state.matches.filter(m => m.status === 'LIVE' || m.status === 'WAITING');
  const m = liveMatches.find(x => x.id === state.currentMatchId) || liveMatches[0] || null;
  if (!m) return toast('No match available', 'err');

  const rs = roundStatusForMatch(m);
  if (rs.code !== 'OPEN') return toast('Betting not open', 'err');
  const r = rs.round;
  const tid = state.bet.teamId;
  if (!tid) return toast('Select a team', 'err');
  const t = teamStats(tid, m.id);
  if (t.isDead) return toast('Team eliminated', 'err');

  const existing = state.predictions.find(p =>
    p.roundNumber === r.roundNumber && p.matchId === m.id && p.status === 'PENDING');
  if (existing) return toast('Already bet this round', 'err');

  const stake = Number(state.bet.stake) || 0;
  const pts = state.profile.demoPoints || 0;
  if (stake <= 0) return toast('Enter valid amount', 'err');
  if (stake > pts) return toast('Insufficient points', 'err');

  try {
    await updateDoc(doc(db, 'users', state.user.uid), { demoPoints: pts - stake });
    await addDoc(collection(db, 'predictions'), {
      userId: state.user.uid,
      userName: state.profile.name || state.profile.email,
      matchId: m.id,
      matchNumber: m.matchNumber || 1,
      roundNumber: r.roundNumber,
      teamId: tid,
      stake,
      rate: t.rate,
      winRate: t.winRate,
      potentialReturn: stake * t.rate,
      potentialProfit: stake * t.rate - stake,
      status: 'PENDING',
      createdAt: serverTimestamp()
    });
    toast(`Bet placed — ${stake} pts on Team ${tid}`, 'ok');
    state.bet.teamId = null;
    render();
  } catch (e) {
    console.error(e);
    toast('Bet failed', 'err');
  }
};

  return `

        <div class="lr-meta">${timeAgo(p.createdAt)}</div>

  `;
}

    </div>
    <button class="btn" onclick="createNewMatch()">Create Match</button>
  `);

window.createNewMatch = async () => {
  const num = Number(document.getElementById('newMatchNum').value) || 1;
  const rounds = Math.min(8, Math.max(6, Number(document.getElementById('newMatchRounds').value) || 8));
  try {
    for (const p of state.players) {
      await updateDoc(doc(db, 'players', p.id), {
        status: 'ACTIVE', eliminatedInRound: null, updatedAt: serverTimestamp()
      });
    }
    const ref = await addDoc(collection(db, 'matches'), {
      matchNumber: num,
      status: 'WAITING',
      currentRound: 0,
      maxRounds: rounds,
      teamARoundsWon: 0,
      teamBRoundsWon: 0,
      winner: null,
      createdAt: serverTimestamp()
    });
    state.currentMatchId = ref.id;
    closeSheet();
    toast('Match created', 'ok');
  } catch (e) {
    console.error(e);
    toast('Failed to create match', 'err');
  }
};

window.addPlayer = async () => {
  const name = document.getElementById('newPName').value.trim();
  const teamId = document.getElementById('newPTeam').value;
  if (!name) return toast('Enter name', 'err');
  if (state.players.filter(p => p.teamId === teamId).length >= 4) return toast(`Team ${teamId} full`, 'err');
  if (state.players.length >= 8) return toast('Max 8 players', 'err');
  try {
    await addDoc(collection(db, 'players'), {
      name, teamId, status: 'ACTIVE',
      matchId: state.currentMatchId,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
    toast(`"${name}" added`, 'ok');
    document.getElementById('newPName').value = '';
  } catch (e) { toast('Failed', 'err'); }
};
window.renamePlayer = async (id, name) => {
  name = String(name || '').trim();
  if (!name) return;
  try { await updateDoc(doc(db, 'players', id), { name, updatedAt: serverTimestamp() }); }
  catch (e) { toast('Rename failed', 'err'); }
};
window.movePlayer = async (id, teamId) => {
  const t = state.players.find(p => p.id === id);
  if (!t || t.teamId === teamId) return;
  if (state.players.filter(p => p.teamId === teamId).length >= 4) {
    toast(`Team ${teamId} full`, 'err'); render(); return;
  }
  try { await updateDoc(doc(db, 'players', id), { teamId, updatedAt: serverTimestamp() }); }
  catch (e) { toast('Move failed', 'err'); }
};
window.eliminate = async (id) => {
  try { await updateDoc(doc(db, 'players', id), { status: 'ELIMINATED', updatedAt: serverTimestamp() }); }
  catch (e) { toast('Failed', 'err'); }
};
window.restore = async (id) => {
  try { await updateDoc(doc(db, 'players', id), { status: 'ACTIVE', eliminatedInRound: null, updatedAt: serverTimestamp() }); }
  catch (e) { toast('Failed', 'err'); }
};
window.removePlayer = async (id) => {

  try { await deleteDoc(doc(db, 'players', id)); }

};

window.openRound = async (num) => {
  const m = currentMatch();
  if (!m) return;
  const A = teamStats('A', m.id), B = teamStats('B', m.id);
  if (A.activeCount === 0 || B.activeCount === 0) return toast('Both teams need alive players', 'err');
  if (num > (m.maxRounds || 8)) return toast('Max rounds reached', 'err');

  if (num > 1) {
    const prev = state.rounds.find(r => r.roundNumber === num - 1 && r.matchId === m.id);
    if (!prev || prev.status !== 'RESULT_DECLARED') {
      return toast('Previous round must be settled', 'err');
    }
    if (!prev.eliminationDone) {
      return toast('⚠️ Eliminate a player first', 'err');
    }
  }

  try {
    const roundRef = doc(collection(db, 'rounds'));
    await setDoc(roundRef, {
      matchId: m.id,
      roundNumber: num,
      status: 'OPEN',
      winner: null,
      teamARate: A.rate,
      teamBRate: B.rate,
      teamAAlive: A.activeCount,
      teamBAlive: B.activeCount,
      eliminationDone: false,
      startTime: serverTimestamp()
    });
    await updateDoc(doc(db, 'matches', m.id), {
      status: 'LIVE',
      currentRound: num
    });
    toast(`Round ${num} opened — A=${fmtRate(A.rate)} B=${fmtRate(B.rate)}`, 'ok');
  } catch (e) { console.error(e); toast('Failed', 'err'); }
};

window.closeRoundConfirm = () => {
  const r = currentRound();
  if (!r) return;
  openSheet('Close Round', `
    <div class="txt-sm txt-3 mb-12">Close betting for Round ${r.roundNumber}? No more bets will be accepted.</div>
    <button class="btn btn-warning" onclick="closeRoundDo()">Close Round ${r.roundNumber}</button>
  `);
};

window.closeRoundDo = async () => {
  const r = currentRound();
  if (!r) return;
  try {
    await updateDoc(doc(db, 'rounds', r.id), { status: 'CLOSED', closeTime: serverTimestamp() });
    closeSheet();
    toast(`Round ${r.roundNumber} closed`, 'ok');
  } catch (e) { toast('Failed', 'err'); }
};

window.declareRoundConfirm = (winner) => {
  const r = currentRound();
  if (!r) return;
  const pending = state.predictions.filter(p => p.status === 'PENDING' && p.roundNumber === r.roundNumber && p.matchId === currentMatch().id);
  openSheet('Declare Result', `
    <div class="txt-sm txt-3 mb-12">
      Declare <b>Team ${winner}</b> as winner of Round ${r.roundNumber}?<br/>
      ${pending.length} pending bet(s) will be settled.
    </div>
    <button class="btn ${winner === 'A' ? 'btn-success' : 'btn-warning'}" onclick="declareRoundDo('${winner}')">
      Confirm — Team ${winner} Won
    </button>
  `);
};

window.declareRoundDo = async (winner) => {
  const r = currentRound();
  const m = currentMatch();
  if (!r || !m) return;
  try {
    const pending = state.predictions.filter(p =>
      p.status === 'PENDING' && p.roundNumber === r.roundNumber && p.matchId === m.id);

    for (const p of pending) {
      const isWinner = p.teamId === winner;
      if (isWinner) {
        const uSnap = await getDoc(doc(db, 'users', p.userId));
        if (uSnap.exists()) {
          await updateDoc(doc(db, 'users', p.userId), {
            demoPoints: (uSnap.data().demoPoints || 0) + (p.potentialReturn || 0)
          });
        }
      }
      await updateDoc(doc(db, 'predictions', p.id), {
        status: isWinner ? 'WON' : 'LOST',
        returnAmount: isWinner ? (p.potentialReturn || 0) : 0,
        profitAmount: isWinner ? (p.potentialProfit || 0) : -p.stake,
        settledAt: serverTimestamp(),
        winnerTeam: winner
      });
    }

    await updateDoc(doc(db, 'rounds', r.id), {
      status: 'RESULT_DECLARED',
      winner,
      eliminationDone: false,
      resultTime: serverTimestamp()
    });

    const newAWins = (m.teamARoundsWon || 0) + (winner === 'A' ? 1 : 0);
    const newBWins = (m.teamBRoundsWon || 0) + (winner === 'B' ? 1 : 0);
    await updateDoc(doc(db, 'matches', m.id), {
      teamARoundsWon: newAWins,
      teamBRoundsWon: newBWins
    });

    closeSheet();
    toast(`Round ${r.roundNumber} — Team ${winner} won. Ab player eliminate karo.`, 'ok');
  } catch (e) {
    console.error(e);
    toast('Failed to declare result', 'err');
  }
};

window.eliminatePlayer = async (playerId, teamId) => {
  const m = currentMatch();
  const r = currentRound();
  if (!m || !r) return;

  const player = state.players.find(p => p.id === playerId);
  if (!player || player.status !== 'ACTIVE') {
    return toast('Player not available', 'err');
  }

  if (!confirm(`Eliminate "${player.name}" (Team ${teamId})?\n\nTeam rate will update.`)) return;

  try {
    await updateDoc(doc(db, 'players', playerId), {
      status: 'ELIMINATED',
      eliminatedInRound: r.roundNumber,
      updatedAt: serverTimestamp()
    });

    await updateDoc(doc(db, 'rounds', r.id), {
      eliminationDone: true,
      eliminatedPlayerId: playerId,
      eliminatedPlayerName: player.name,
      eliminatedPlayerTeam: teamId,
      eliminationTime: serverTimestamp()
    });

    // Recalculate for toast
    const newA = teamStats('A', m.id);
    const newB = teamStats('B', m.id);

    // Check if match should end
    if (newA.isDead && !newB.isDead) {
      await endMatchAuto('B');
      return;
    } else if (newB.isDead && !newA.isDead) {
      await endMatchAuto('A');
      return;
    } else if (newA.isDead && newB.isDead) {
      await endMatchAuto('DRAW');
      return;
    }

    toast(`✅ ${player.name} eliminated. A=${fmtRate(newA.rate)} B=${fmtRate(newB.rate)}`, 'ok');
  } catch (e) {
    console.error(e);
    toast('Failed to eliminate', 'err');
  }
};

window.endMatchByRounds = async () => {
  const m = currentMatch();
  if (!m) return;
  const aW = m.teamARoundsWon || 0, bW = m.teamBRoundsWon || 0;
  let winner = 'DRAW';
  if (aW > bW) winner = 'A';
  else if (bW > aW) winner = 'B';
  openSheet('End Match', `
    <div class="txt-sm txt-3 mb-12">
      Team A won <b>${aW}</b> rounds<br/>
      Team B won <b>${bW}</b> rounds<br/><br/>
      Winner: <b>${winner === 'DRAW' ? 'Draw' : 'Team ' + winner}</b>
    </div>
    <button class="btn btn-success" onclick="endMatchConfirm('${winner}')">End Match</button>
  `);
};

window.endMatchConfirm = async (winner) => {
  closeSheet();
  await endMatchAuto(winner);
};

/* ═══════════════════════════════════════════════════
   END MATCH → Save to history & mark as FINISHED
   ═══════════════════════════════════════════════════ */
window.endMatchAuto = async (winner) => {
  const m = currentMatch();
  if (!m) return;
  try {
    // Save to match_history
    const matchData = {
      matchNumber: m.matchNumber,
      winner,
      teamARoundsWon: m.teamARoundsWon || 0,
      teamBRoundsWon: m.teamBRoundsWon || 0,
      maxRounds: m.maxRounds,
      totalRounds: m.currentRound,
      startedAt: m.createdAt || null,
      finishedAt: serverTimestamp(),
      players: state.players
        .filter(p => !p.matchId || p.matchId === m.id)
        .map(p => ({
          name: p.name, teamId: p.teamId, status: p.status,
          eliminatedInRound: p.eliminatedInRound || null
        })),
      rounds: state.rounds
        .filter(r => r.matchId === m.id)
        .map(r => ({
          roundNumber: r.roundNumber,
          winner: r.winner,
          status: r.status,
          eliminatedPlayerName: r.eliminatedPlayerName || null,
          eliminatedPlayerTeam: r.eliminatedPlayerTeam || null
        }))
    };
    await addDoc(collection(db, 'match_history'), matchData);

    // Settle any remaining pending bets
    const pending = state.predictions.filter(p => p.status === 'PENDING' && p.matchId === m.id);
    for (const p of pending) {
      const isWinner = winner !== 'DRAW' && p.teamId === winner;
      if (isWinner) {
        const uSnap = await getDoc(doc(db, 'users', p.userId));
        if (uSnap.exists()) {
          await updateDoc(doc(db, 'users', p.userId), {
            demoPoints: (uSnap.data().demoPoints || 0) + (p.potentialReturn || 0)
          });
        }
      }
      await updateDoc(doc(db, 'predictions', p.id), {
        status: isWinner ? 'WON' : 'LOST',
        returnAmount: isWinner ? (p.potentialReturn || 0) : 0,
        profitAmount: isWinner ? (p.potentialProfit || 0) : -p.stake,
        settledAt: serverTimestamp(),
        winnerTeam: winner
      });
    }

    // 🔥 Mark match as FINISHED → it will disappear from live view and appear in history
    await updateDoc(doc(db, 'matches', m.id), {
      status: 'FINISHED',
      winner,
      finishedAt: serverTimestamp()
    });

    toast(`🏆 Match finished — ${winner === 'DRAW' ? 'Draw' : 'Team ' + winner + ' wins'}`, 'ok');
  } catch (e) {
    console.error(e);
    toast('Failed to finish match', 'err');
  }
};

   HELPERS

function currentRound() {
  const m = currentMatch();
  if (!m || !m.currentRound) return null;
  return state.rounds.find(r => r.roundNumber === m.currentRound && r.matchId === m.id) || null;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function timeAgo(ts) {
  if (!ts) return '—';
  const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h';
  return Math.floor(diff / 86400) + 'd';
}

setTimeout(updateThemeIcon, 100);
