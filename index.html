<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f513b">
<title>Pawan Retail — A Priya Electricals Venture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6f2;--surface:#ffffff;--surface-2:#eef1eb;--border:#dfe5da;--border-2:#c3cdbd;
  --text:#0b1220;--text-2:#475569;--text-3:#94a3b8;
  --primary:#1f513b;--primary-2:#173d2d;--primary-3:#3b7658;--primary-soft:#e7f0e8;--primary-grad:linear-gradient(135deg,#204f3a 0%,#47785a 100%);
  --accent:#719b79;--amber:#f59e0b;--amber-soft:#fef3c7;
  --success:#10b981;--success-soft:#ecfdf5;
  --danger:#ef4444;--danger-soft:#fef2f2;
  --warning:#f59e0b;--warning-soft:#fffbeb;
  --r:10px;--r-md:14px;--r-lg:18px;--r-xl:22px;--r-2xl:28px;
  --sh-xs:0 1px 2px rgba(11,18,32,.04);
  --sh-sm:0 1px 3px rgba(11,18,32,.06),0 1px 2px rgba(11,18,32,.04);
  --sh-md:0 4px 12px rgba(11,18,32,.08);
  --sh-lg:0 12px 32px rgba(11,18,32,.12);
  --sh-xl:0 24px 60px rgba(31,81,59,.18);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
html,body{font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:all .2s ease}
input,textarea,select{font:inherit;color:inherit}
img{max-width:100%;display:block}
a{color:var(--primary);text-decoration:none}
svg{display:block;flex-shrink:0}

/* Layout */
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.shell{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + var(--safe-bottom));position:relative}
.page{padding:16px 18px}

/* App Bar */
.appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.appbar-title{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.01em}
.appbar-back{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r);color:var(--text-2);background:var(--surface-2);transition:all .2s}
.appbar-back:hover{background:var(--primary-soft);color:var(--primary)}
.appbar-back svg{width:20px;height:20px}
.appbar-actions{display:flex;align-items:center;gap:8px}
.iconbtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r);color:var(--text-2);background:var(--surface-2);transition:all .2s}
.iconbtn:hover{background:var(--primary-soft);color:var(--primary)}
.iconbtn svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand-mark{width:38px;height:38px;background:var(--primary-grad);color:#fff;display:grid;place-items:center;border-radius:11px;font-size:18px;font-weight:800;box-shadow:0 8px 20px rgba(99,102,241,.3)}

/* Typography */
.section-title{font-size:12px;font-weight:800;color:var(--text-3);margin-bottom:12px;letter-spacing:.08em;text-transform:uppercase}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;margin-top:20px}
.section-header h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.section-header a{font-size:13px;font-weight:700;color:var(--primary)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-xs)}
.card+.card{margin-top:12px}
.card-elevated{box-shadow:var(--sh-md)}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s}
.card-row:last-child{border-bottom:0}
.card-row:hover{background:var(--primary-soft)}
.card-row svg{width:16px;height:16px;color:var(--text-3)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;font-size:13.5px;font-weight:700;border-radius:var(--r);border:1px solid transparent;white-space:nowrap;transition:all .2s;font-family:var(--font);line-height:1.2}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.28)}
.btn-primary:hover:not(:disabled){background:var(--primary-2);box-shadow:0 6px 18px rgba(79,70,229,.35);transform:translateY(-1px)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-2)}
.btn-secondary:hover:not(:disabled){background:var(--surface-2);border-color:var(--text-3)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:9px}
.btn-xs{padding:6px 10px;font-size:11.5px;border-radius:8px}
.btn-lg{padding:14px 22px;font-size:15px;border-radius:var(--r-md);font-weight:800}
.btn-ghost{background:transparent;color:var(--text-2)}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.form-input,.form-textarea,.form-select{width:100%;padding:12px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);font-size:14px;color:var(--text);transition:all .2s}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.form-textarea{min-height:80px;resize:vertical;font-family:var(--font)}
.input-wrap{position:relative}
.input-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);padding:6px 10px;font-size:11px;font-weight:800;color:var(--primary);border-radius:7px;background:var(--primary-soft);text-transform:uppercase;letter-spacing:.05em}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.checkbox-row input{accent-color:var(--primary);width:17px;height:17px;cursor:pointer}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;font-size:11px;font-weight:700;border-radius:999px;letter-spacing:.01em}
.badge-neutral{background:var(--surface-2);color:var(--text-2)}
.badge-info{background:var(--primary-soft);color:var(--primary-2)}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:#b45309}
.badge-danger{background:var(--danger-soft);color:var(--danger)}

/* Bottom Nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + var(--safe-bottom));z-index:30}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:var(--text-3);font-size:10px;font-weight:700;cursor:pointer;position:relative;transition:all .2s;letter-spacing:.02em}
.bnav-item svg{width:22px;height:22px;stroke-width:2}
.bnav-item.active{color:var(--primary)}
.bnav-item.active::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:28px;height:3px;background:var(--primary);border-radius:2px}
.bnav-badge{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;border-radius:999px;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.bnav-badge.show{display:flex}

/* AUTH */
.auth-shell{min-height:100vh;padding:24px 18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#06b6d4 100%);position:relative;overflow:hidden}
.auth-shell::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15) 0%,transparent 70%);top:-200px;right:-200px;pointer-events:none}
.auth-shell::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.2) 0%,transparent 70%);bottom:-100px;left:-100px;pointer-events:none}
.auth-box{width:100%;max-width:420px;position:relative;z-index:2;animation:slideUp .5s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.auth-logo-wrap{text-align:center;margin-bottom:20px}
.auth-logo{width:72px;height:72px;margin:0 auto 12px;background:#fff;border-radius:20px;display:grid;place-items:center;font-size:32px;font-weight:900;color:var(--primary);box-shadow:0 12px 32px rgba(0,0,0,.2);font-family:var(--font)}
.auth-brand{font-size:24px;font-weight:900;color:#fff;letter-spacing:-.02em;margin-bottom:2px}
.auth-tagline{font-size:12px;color:rgba(255,255,255,.85);font-weight:600;letter-spacing:.02em}
.auth-parent{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;font-weight:500}
.auth-card{background:#fff;border-radius:var(--r-2xl);padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.auth-card h1{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:-.02em}
.auth-sub{font-size:13px;color:var(--text-2);text-align:center;margin-bottom:22px}
.auth-foot{text-align:center;margin-top:16px;font-size:13px;color:var(--text-2)}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text-3);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* HERO */
.hero{background:var(--primary-grad);border-radius:var(--r-xl);padding:24px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;min-height:180px;display:flex;flex-direction:column;justify-content:flex-end}
.hero::before{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.12);top:-100px;right:-80px}
.hero::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);bottom:-60px;left:-40px}
.hero>*{position:relative;z-index:1}
.hero-tag{display:inline-block;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:5px 12px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;align-self:flex-start;border:1px solid rgba(255,255,255,.25)}
.hero h1{font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.02em;margin-bottom:6px}
.hero p{font-size:13px;opacity:.92;line-height:1.5;margin-bottom:16px;max-width:280px}
.hero-cta{background:#fff;color:var(--primary);padding:10px 18px;border-radius:11px;font-size:13px;font-weight:800;align-self:flex-start;box-shadow:0 8px 20px rgba(0,0,0,.15);border:0;cursor:pointer;transition:all .2s}
.hero-cta:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.2)}

/* Chips */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;font-size:12.5px;font-weight:700;background:var(--surface);border:1.5px solid var(--border);border-radius:999px;white-space:nowrap;cursor:pointer;color:var(--text-2);transition:all .2s}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(79,70,229,.25)}

/* Product Grid */
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;position:relative;cursor:pointer;transition:all .25s}
.product:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--primary-3)}
.product-img{aspect-ratio:1/1;width:100%;object-fit:cover;background:var(--surface-2)}
.product-body{padding:12px;display:flex;flex-direction:column;flex:1;gap:5px}
.product-cat{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--primary)}
.product-name{font-size:13.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-desc{font-size:11.5px;color:var(--text-2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-price{font-size:16px;font-weight:800;color:var(--primary);margin-top:4px;letter-spacing:-.01em}
.product-cta{margin-top:8px}
.product-cta .btn{width:100%;padding:8px 10px;font-size:12px}

/* Link / Deal card */
.deal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-xs);transition:all .25s;cursor:pointer;display:flex;flex-direction:column}
.deal-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--primary-3)}
.deal-img{width:100%;height:170px;object-fit:cover;background:linear-gradient(135deg,#6366f1,#06b6d4)}
.deal-body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.deal-tag{display:inline-block;background:var(--primary-soft);color:var(--primary-2);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;align-self:flex-start}
.deal-title{font-size:15px;font-weight:800;line-height:1.3;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.deal-desc{font-size:12.5px;color:var(--text-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.deal-price{font-size:18px;font-weight:900;color:var(--primary);letter-spacing:-.02em}
.deal-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.deal-actions .btn-open{flex:1;background:var(--primary);color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(79,70,229,.25);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.deal-actions .btn-open:hover{background:var(--primary-2);transform:translateY(-1px)}
.deal-actions .btn-open svg{width:15px;height:15px}
.deal-actions .btn-save{width:42px;height:42px;padding:0;background:var(--surface-2);border:1px solid var(--border);color:var(--text-3);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.deal-actions .btn-save:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.deal-actions .btn-save.saved{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.deal-actions .btn-save svg{width:18px;height:18px}

.deals-grid{display:grid;grid-template-columns:1fr;gap:14px}

/* Empty / Skeleton */
.empty{text-align:center;padding:50px 20px;color:var(--text-3);font-size:13px}
.empty svg{width:64px;height:64px;margin:0 auto 14px;opacity:.35}
.skeleton{background:linear-gradient(90deg,#eef2f9 25%,#e2e8f0 37%,#eef2f9 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--r);height:60px;margin-bottom:10px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* Loader */
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
.spin-dark{border-color:rgba(79,70,229,.2);border-top-color:var(--primary)}
@keyframes rot{to{transform:rotate(360deg)}}

/* Toast */
.toast-root{position:fixed;top:calc(70px + var(--safe-top));left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 32px);width:100%}
.toast{padding:12px 18px;background:#0b1220;color:#fff;border-radius:12px;font-size:13px;font-weight:700;animation:toastIn .3s;max-width:100%;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(11,18,32,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:500;overflow:auto}
.modal{background:#fff;border-radius:var(--r-xl);padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;letter-spacing:-.01em}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* Cart */
.cart-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.cart-item:last-child{border-bottom:0}
.cart-item img{width:64px;height:64px;border-radius:11px;object-fit:cover;background:var(--surface-2)}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13.5px;font-weight:700}
.cart-item-price{font-size:12px;color:var(--text-3);margin-top:2px}
.qty-ctrl{display:inline-flex;align-items:center;border:1.5px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
.qty-ctrl button{width:32px;height:32px;background:var(--surface);display:grid;place-items:center;font-weight:800;color:var(--primary);font-size:16px}
.qty-ctrl button:hover{background:var(--primary-soft)}
.qty-ctrl span{min-width:32px;text-align:center;font-size:13px;font-weight:800}

/* Radio rows */
.radio-row{display:flex;align-items:flex-start;gap:10px;padding:14px;border:1.5px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer;background:var(--surface);transition:all .2s}
.radio-row.selected{border-color:var(--primary);background:var(--primary-soft)}
.radio-row input{margin-top:3px;accent-color:var(--primary);width:17px;height:17px}
.radio-row-title{font-size:13.5px;font-weight:700}
.radio-row-desc{font-size:12px;color:var(--text-2);margin-top:2px}

/* Price rows */
.price-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13.5px}
.price-row.total{border-top:2px solid var(--border);margin-top:8px;padding-top:12px;font-weight:800;font-size:16px;color:var(--primary);letter-spacing:-.01em}
.price-row.discount span:last-child{color:var(--success);font-weight:700}

/* Order timeline */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:2px;background:var(--primary)}
.timeline-step{position:relative;padding:10px 0}
.timeline-step::before{content:"";position:absolute;left:-28px;top:12px;width:18px;height:18px;background:#fff;border:2.5px solid var(--border);border-radius:50%}
.timeline-step.done::before{background:var(--primary);border-color:var(--primary)}
.timeline-step.current::before{border-color:var(--accent);box-shadow:0 0 0 4px rgba(6,182,212,.2)}
.timeline-step .tl-label{font-size:13px;color:var(--text-3);font-weight:500}
.timeline-step.done .tl-label,.timeline-step.current .tl-label{color:var(--text);font-weight:700}
.timeline-step.current .tl-label{color:var(--primary)}

/* Blocked banner */
.blocked-banner{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;padding:28px;border-radius:var(--r-xl);text-align:center;margin-bottom:16px}
.blocked-banner .icon{font-size:48px;margin-bottom:12px}
.blocked-banner h2{font-size:20px;margin-bottom:8px;font-weight:800}
.blocked-banner p{font-size:13px;opacity:.95;line-height:1.6}
.blocked-reason{background:rgba(0,0,0,.28);border-radius:11px;padding:14px;margin-top:14px;text-align:left}
.blocked-reason .lbl{font-size:10.5px;text-transform:uppercase;opacity:.85;margin-bottom:6px;font-weight:800;letter-spacing:.06em}

/* Product detail */
.product-detail{background:#fff;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--border);box-shadow:var(--sh-md)}

.company-mini{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:all .2s}

/* Admin */
.admin-layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-xs);position:relative;overflow:hidden}

function isOpen(c){
  if (!c) return true;
  if (c.autoOpenClose !== true) return true;
  if (!c.openTime || !c.closeTime) return true;
  const now = new Date(), cur = now.getHours()*60 + now.getMinutes();
  const [oh,om] = c.openTime.split(":").map(Number);
  const [ch,cm] = c.closeTime.split(":").map(Number);
  const o = oh*60+om, cl = ch*60+cm;
  if (o === cl) return true;
  if (o < cl) return cur >= o && cur < cl;
  return cur >= o || cur < cl;
}


const hoursText = c => (!c?.openTime||!c?.closeTime) ? "" : `${c.openTime} – ${c.closeTime}`;
function storeNextEdge(c, now=new Date()){
  if(!c?.openTime||!c?.closeTime) return null;
  const [oh,om]=c.openTime.split(":").map(Number),[ch,cm]=c.closeTime.split(":").map(Number);
  const cur=now.getHours()*60+now.getMinutes(), o=oh*60+om, cl=ch*60+cm;
  const open=o===cl?true:(o<cl?cur>=o&&cur<cl:cur>=o||cur<cl);
  const edge=new Date(now);
  if(open){ edge.setHours(ch,cm,0,0); if(edge<=now) edge.setDate(edge.getDate()+1); return {open,edge:edge.getTime(),label:"Closes in"}; }
  edge.setHours(oh,om,0,0); if(edge<=now) edge.setDate(edge.getDate()+1);
  return {open,edge:edge.getTime(),label:"Opens in"};
}
function storeTimerMarkup(c){
  if(!c?.autoOpenClose||!c.openTime||!c.closeTime) return "";

  if(!q) return "";
  const remaining=q.edge-Date.now(), closingSoon=q.open&&remaining<=10*60*1000;
  return `<div class="store-timer ${q.open?(closingSoon?"store-closing-soon":"store-open-timer"):"store-closed-timer"}" data-store-timer data-open-time="${esc(c.openTime)}" data-close-time="${esc(c.closeTime)}" data-store-open="${q.open?"1":"0"}" data-store-edge="${q.edge}">

    ${closingSoon?'<span class="store-warning">Closing within 10 minutes</span>':""}
  </div>`;
}

function timeValue(v){ if(!v) return 0; const n = new Date(v).getTime(); return Number.isFinite(n)?n:0; }
function scheduleInfo(item){

  if(start && now<start) return {state:"upcoming",edge:start,label:"Starts in"};
  if(end && now>=end) return {state:"expired",edge:0,label:"Ended"};
  if(end) return {state:"active",edge:end,label:"Ends in"};
  return {state:"active",edge:0,label:"Available"};
}
function countdownText(ms){ if(ms<=0)return "00:00:00"; const sec=Math.floor(ms/1000), d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60; return d?`${d}d ${String(h).padStart(2,"0")}h`: `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }
function scheduleBadge(item, prefix=""){ const q=scheduleInfo(item); if(q.state==="expired")return `<div class="schedule-note">${esc(prefix)}Ended</div>`; if(q.state==="upcoming")return `<div class="countdown-pill" data-countdown="${q.edge}">${esc(prefix)}Starts in ${countdownText(q.edge-Date.now())}</div>`; if(q.edge)return `<div class="countdown-pill" data-countdown="${q.edge}">${esc(prefix)}Ends in ${countdownText(q.edge-Date.now())}</div>`; return ""; }
function startCountdownTicker(){ if(window.__prlCountdownTicker)return; window.__prlCountdownTicker=setInterval(()=>{ document.querySelectorAll("[data-countdown]").forEach(el=>{const end=Number(el.dataset.countdown); const left=end-Date.now(); if(left<=0){el.textContent="Updating…"; if(!window.__prlTimerRefresh){window.__prlTimerRefresh=true; setTimeout(()=>{window.__prlTimerRefresh=false; const active=document.querySelector(".screen.active")?.id; if(active==="scrDeals")renderDeals(); if(active==="scrHome")renderHome(); if(active==="scrCompany")openCompany(S.currentCompany?.id); if(active==="scrProductDetail"&&S.currentCompany&&S.currentProduct)paintProduct(S.currentCompany,S.currentProduct);},1000);} } else el.textContent=el.textContent.replace(/Starts in .*|Ends in .*/, m=>m.startsWith("Starts")?`Starts in ${countdownText(left)}`:`Ends in ${countdownText(left)}`);}); document.querySelectorAll("[data-store-close]").forEach(el=>{const left=Number(el.dataset.storeClose)-Date.now();el.textContent=left>0?`Closes in ${countdownText(left)}`:"Closing time reached";});

function calcDiscount(c, sub){
  if (!c) return 0;
  let d = c.discountType === "percent" ? sub * (c.discountValue/100) : c.discountValue;
  if (c.maxDiscount) d = Math.min(d, c.maxDiscount);
  return Math.min(d, sub);
}

async function validateCoupon(code, sub){
  if (!code) return {valid:false,error:"Enter code"};
  try {
    const snap = await getDocs(query(collection(db,"coupons"),where("code","==",code.toUpperCase().trim())));
    if (snap.empty) return {valid:false,error:"Invalid code"};
    const c = {id:snap.docs[0].id, ...snap.docs[0].data()};
    if (!c.isActive) return {valid:false,error:"Coupon inactive"};
    if (sub < (c.minOrder||0)) return {valid:false,error:`Min ${inr(c.minOrder)} required`};
    return {valid:true, coupon:c, discount:calcDiscount(c, sub)};
  } catch(e){ return {valid:false,error:"Check failed"}; }
}

function goTo(route){
  document.body.classList.toggle("premium-member", isPremiumMembershipActive(S.profile));
  if (route === "home")     { showScreen("scrHome"); renderHome(); }
  if (route === "products") { showScreen("scrCompanies"); renderBrowse(); }
  if (route === "deals")    { showScreen("scrDeals"); renderDeals(); }
  if (route === "cart")     { showScreen("scrCart"); renderCart(); }
  if (route === "orders")   { showScreen("scrOrders"); renderOrders(); }
  if (route === "account")  { showScreen("scrAccount"); renderAccount(); }
  $$(".bnav-item").forEach(el => el.classList.toggle("active", el.dataset.nav === route));
  updateCartBadge();
}
window.goTo = goTo;

function updateCartBadge(){
  const c = S.cart.items.reduce((s,i) => s + i.quantity, 0);
  $$("[data-cart-badge]").forEach(el => {
    if (c > 0) { el.textContent = c; el.classList.add("show"); }
    else el.classList.remove("show");
  });
  const p = $("#productCartBadge");
  if (p){ if (c > 0){ p.textContent = c; p.classList.add("show"); } else p.classList.remove("show"); }
}

/* ============ AUTH ============ */
async function handleLogin(e){
  e.preventDefault();
  const email = $("#loginEmail").value.trim().toLowerCase();
  const pass = $("#loginPassword").value;
  const remember = $("#loginRemember").checked;
  if (!email || !pass) return toast("Fill all fields", "error");
  const btn = $("#loginSubmit");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Signing in';
  try {
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, pass);
    toast("Welcome back!", "success");
  } catch(err){
    console.error("Login error:", err);
    if (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential"){
      try {
        const snap = await getDocs(query(collection(db,"users"), where("email","==",email)));
        const pending = snap.docs.find(d => d.data().status === "pending_password");
        if (pending){
          S.pendingUserDocId = pending.id;
          const u = pending.data();
          $("#cpEmail").value = email;
          $("#welcomeMsg").textContent = `👋 Hi ${u.name||""}! Please create your password to continue.`;
          document.getElementById("loginStep1").classList.add("hidden");
          document.getElementById("loginStep2").classList.remove("hidden");
          toast("Welcome! Please create your password.", "info");
          btn.disabled = false; btn.textContent = "Sign in";
          return;
        }
      } catch(_){}
    }
    toast(errMsg(err), "error");
  } finally {
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

async function handleCreatePassword(){
  const pass = $("#cpPass").value, pass2 = $("#cpPass2").value;
  if (!pass || !pass2) return toast("Fill both fields", "error");
  if (pass.length < 6) return toast("Password must be 6+ chars", "error");
  if (pass !== pass2) return toast("Passwords don't match", "error");
  const email = $("#cpEmail").value.trim().toLowerCase();
  const btn = $("#cpCreateBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Creating';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid = cred.user.uid;
    const old = await getDoc(doc(db,"users",S.pendingUserDocId));
    const od = old.exists() ? old.data() : {};
    await setDoc(doc(db,"users",uid), {
      name: od.name||"", email,
      phone: od.phone||"", address: od.address||"",
      role:"customer", status:"active",
      blockReason:"", suspendedUntil:null,
      createdBy: od.createdBy || "admin",
      passwordCreatedAt: serverTimestamp(),
      createdAt: od.createdAt || serverTimestamp()
    });
    try { await deleteDoc(doc(db,"users",S.pendingUserDocId)); } catch(_){}
    toast("✅ Password created! Welcome.", "success");
  } catch(err){
    toast(errMsg(err), "error");
  } finally {
    btn.disabled = false; btn.textContent = "Create Password";
  }
}

async function handleRegister(e){
  e.preventDefault();
  const name = $("#regName").value.trim();
  const phone = $("#regPhone").value.trim();
  const email = $("#regEmail").value.trim().toLowerCase();
  const preferredLanguage = $("#regLanguage")?.value || "en";
  const pass = $("#regPassword").value;
  const pass2 = $("#regPassword2").value;
  if (!name || !email || !pass) return toast("Fill all required fields", "error");
  if (!/^[0-9]{10}$/.test(phone)) return toast("Enter valid 10-digit phone", "error");
  if (pass.length < 6) return toast("Password 6+ chars", "error");
  if (pass !== pass2) return toast("Passwords don't match", "error");
  const btn = $("#regSubmit");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Creating';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db,"users",cred.user.uid), {
      name, email, phone, preferredLanguage,
      address:"", addressDetails:{street:"",sector:"",flat:"",landmark:"",city:"",state:"",pincode:""},
      role:"customer", status:"active",
      blockReason:"", suspendedUntil:null,
      createdBy:"self", createdAt: serverTimestamp()
    });
    try { localStorage.setItem("prl_language", preferredLanguage); } catch(_) {}
    toast(preferredLanguage === "hi" ? "✅ खाता बन गया!" : "✅ Account created!", "success");
  } catch(err){
    toast(errMsg(err), "error");
  } finally {
    btn.disabled = false; btn.textContent = "Create account";
  }
}

async function handleForgot(e){
  e.preventDefault();
  const email = $("#forgotEmail").value.trim();
  if (!email) return toast("Enter your email", "error");
  const btn = $("#forgotSubmit");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Sending';
  try {
    await sendPasswordResetEmail(auth, email);
    toast("Reset link sent! Check your email.", "success");
    showScreen("scrLogin");
  } catch(err){ toast(errMsg(err), "error"); }
  finally { btn.disabled = false; btn.textContent = "Send reset link"; }
}

async function logout(){
  try { await signOut(auth); } catch(_){}
  S.customerSubs.forEach(u => { try { u(); } catch(_){} });
  S.adminSubs.forEach(u => { try { u(); } catch(_){} });
  if (S.activeChatUnsub){ try { S.activeChatUnsub(); } catch(_){} S.activeChatUnsub = null; }
  S.customerSubs.clear(); S.adminSubs.clear();
  if (S.blockTimerInterval){ clearInterval(S.blockTimerInterval); S.blockTimerInterval = null; }
  S.user = null; S.profile = null; S.pendingUserDocId = null;
  S.savedLinkIds = new Set();
  clearCart();
  const s1 = document.getElementById("loginStep1");
  const s2 = document.getElementById("loginStep2");
  if (s1) s1.classList.remove("hidden");
  if (s2) s2.classList.add("hidden");
}
window.logout = logout;

async function onAuthChanged(user){
  if (!user){ S.user = null; S.profile = null; showScreen("scrLogin"); return; }
  S.user = user;
  try {
    const snap = await getDoc(doc(db,"users",user.uid));
    if (!snap.exists()){
      const profile = {
        name: user.displayName || (user.email||"").split("@")[0],
        email: user.email, phone:"", address:"",
        role:"customer", status:"active",
        blockReason:"", suspendedUntil:null,
        createdBy:"self", createdAt: serverTimestamp()
      };
      await setDoc(doc(db,"users",user.uid), profile);
      S.profile = {uid:user.uid, ...profile};
    } else {
      S.profile = {uid:user.uid, ...snap.data()};
    }
    if (S.profile.role === "admin") bootAdmin();
    else { await refreshServiceStatus(); if(__prlServiceStatus.maintenance) showMaintenanceScreen(); else { loadCart(); bootCustomer(); } }
  } catch(err){
    console.error("Profile load error:", err);
    toast(errMsg(err), "error");
  }
}

function bootCustomer(){
  goTo("home");
  watchOrders();
  watchSaved();
  checkFirstOrder();
  updateCartBadge();
}

function watchOrders(){
  const q = query(collection(db,"orders"), where("customerId","==",S.user.uid));
  const unsub = onSnapshot(q, snap => {
    S.cached.orders = snap.docs.map(d => ({id:d.id, ...d.data()})).sort(newest);
    if ($("#ordersList")) paintOrders();
  }, err => console.warn("Orders:", err?.code));
  S.customerSubs.add(unsub);
}

function watchSaved(){
  const unsub = onSnapshot(collection(db,"savedLinks",S.user.uid,"items"), snap => {
    S.savedLinkIds = new Set(snap.docs.map(d => d.id));
    S.cached.savedLinks = snap.docs.map(d => ({id:d.id, ...d.data()})).sort(newest);
    if ($("#savedLinksBody")) renderSavedLinks();
    if ($("#dealsList")) paintDeals();
  }, err => console.warn("Saved:", err?.code));
  S.customerSubs.add(unsub);
}

async function renderHome(){

  try {
    const snap = await getDocs(query(collection(db,"companies"), where("isActive","==",true)));

async function loadHomeDeals(){
  const el = $("#homeDeals");
  if (!el) return;
  try {
    const snap = await getDocs(collection(db,"links"));
    let links = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(l=>scheduleInfo(l).state!=="expired").sort(newest);

  const open = isOpen(c);
  return `<article class="product ${open?"":"closed"}" onclick="openCompany('${c.id}')">

      <div class="product-name">${esc(c.name || "")}</div>

    <div class="deal-body">

window.openLinkDetail = async (linkId) => {

  let link = S.cached.links.find(l => l.id === linkId);

function paintLinkDetail(link){
  const body = $("#linkDetailBody");
  if (!body) return;
  const img = validUrl(link.imageUrl) ? link.imageUrl : PLACEHOLDER_IMG;
  const saved = S.savedLinkIds.has(link.id);
  const saveBtn = $("#linkDetailSaveBtn");
  if (saveBtn){
    saveBtn.innerHTML = saved ? SVG.bookmarkFill : SVG.bookmark;
    if (saved){ saveBtn.style.background = "var(--primary-soft)"; saveBtn.style.color = "var(--primary)"; }
    else { saveBtn.style.background = ""; saveBtn.style.color = ""; }
    saveBtn.onclick = () => toggleSaveLink(link.id, true);
  }
  body.innerHTML = `
    <div class="product-detail">
      <img class="product-detail-img" src="${esc(img)}" onerror="this.src='${PLACEHOLDER_IMG}'">
      <div class="product-detail-body">
        ${link.companyName ? `<div class="product-detail-cat">${esc(link.companyName)}</div>` : (link.tag ? `<div class="product-detail-cat">${esc(link.tag)}</div>` : "")}
        <div class="product-detail-name">${esc(link.title || "")}</div>
        ${link.price ? `<div class="product-detail-price">${inr(link.price)}</div>` : ""}
        ${link.description ? `<div class="product-detail-desc">${esc(link.description)}</div>` : ""}
        ${scheduleBadge(link, "Deal · ")}
      </div>
    </div>
    <div class="card mt-3">
      <div class="section-title">Deal Link</div>
      <div class="text-xs text-soft" style="word-break:break-all;font-family:monospace;background:var(--surface-2);padding:10px;border-radius:8px">
        ${esc(link.url || "")}
      </div>
    </div>
    <div class="row mt-3" style="gap:10px">
      <button class="btn btn-secondary" style="flex:1" onclick="toggleSaveLink('${link.id}', true)">
        ${saved ? SVG.bookmarkFill : SVG.bookmark} ${saved ? "Saved" : "Save"}
      </button>
      <button class="btn btn-primary" style="flex:2" ${scheduleInfo(link).state!=="active"?"disabled":""} onclick="openExternalLink('${link.id}')">
        ${scheduleInfo(link).state==="upcoming"?"Coming Soon":scheduleInfo(link).state==="expired"?"Deal Ended":`${SVG.external} Open Deal`}
      </button>
    </div>`;
}

window.openExternalLink = async (linkId) => {
  let link = S.cached.links.find(l => l.id === linkId) || S.currentLink;
  if (!link || link.id !== linkId){
    try {
      const snap = await getDoc(doc(db,"links",linkId));
      if (snap.exists()) link = {id:snap.id, ...snap.data()};
    } catch(_){}
  }
  if (!link || !link.url) return toast("Link unavailable", "error");
  const dealState = scheduleInfo(link);
  if(dealState.state!=="active") return toast(dealState.state==="upcoming"?`Deal starts in ${countdownText(dealState.edge-Date.now())}`:"This deal has ended", "error");
  if (!validUrl(link.url)) return toast("Invalid URL", "error");
  try {
    if (S.user){
      await addDoc(collection(db,"linkClicks"), {
        linkId: link.id, linkTitle: link.title || "", url: link.url,
        userId: S.user.uid, userName: S.profile?.name || "", userEmail: S.profile?.email || "",
        clickedAt: serverTimestamp()
      });
    }
  } catch(e){ console.warn("Click log failed:", e); }
  window.open(link.url, "_blank", "noopener,noreferrer");
  toast("Opening link…", "info");
};

window.toggleSaveLink = async (linkId, fromDetail = false) => {
  if (!S.user) return toast("Sign in required", "error");
  const isSaved = S.savedLinkIds.has(linkId);
  try {
    if (isSaved){
      await deleteDoc(doc(db,"savedLinks",S.user.uid,"items",linkId));
      toast("Removed from saved", "info");
    } else {
      let link = S.cached.links.find(l => l.id === linkId);
      if (!link){
        const snap = await getDoc(doc(db,"links",linkId));
        if (snap.exists()) link = {id:snap.id, ...snap.data()};
      }
      if (!link) return toast("Link not found", "error");
      await setDoc(doc(db,"savedLinks",S.user.uid,"items",linkId), {
        linkId: link.id, title: link.title || "", description: link.description || "",
        imageUrl: link.imageUrl || "", price: link.price || 0, url: link.url || "",
        companyName: link.companyName || "", tag: link.tag || "",
        savedAt: serverTimestamp()
      });
      toast("✅ Saved", "success");
    }
    if (fromDetail && S.currentLink) paintLinkDetail(S.currentLink);
    paintDeals();
  } catch(err){ toast(errMsg(err), "error"); }
};

window.openCompany = async (companyId) => {

window.openProductDetail = async (companyId, productId) => {

        <div class="product-detail-price">${inr(product.price)}</div>
        <div class="product-detail-desc">${esc(product.description || "No description.")}</div>
        ${scheduleBadge(product, "Product · ")}

    <div class="company-mini mt-3" onclick="openCompany('${company.id}')">

      <div style="flex:1;min-width:0">

async function addProductToCartWithQty(productId, companyId, qty){
  const st = statusInfo();
  if (st.blocked) return toast(st.title+": "+st.message, "error");
  try {
    const cs = await getDoc(doc(db,"companies",companyId));
    if (!cs.exists()) return toast("Company not found", "error");
    const ps = await getDoc(doc(db,"companies",companyId,"products",productId));
    if (!ps.exists()) return toast("Product not found", "error");
    const company = {id:companyId, ...cs.data()};
    const product = {id:productId, ...ps.data()};
    if (!isOpen(company)) return toast(`${company.name} closed`, "error");
    if (product.isActive === false) return toast("Not available", "error");
    const sched = scheduleInfo(product);
    if(sched.state!=="active") return toast(sched.state==="upcoming"?"Product is not available yet":"Product availability has ended", "error");
    if (S.cart.companyId && S.cart.companyId !== companyId){
      return confirmDialog(`Cart has items from ${S.cart.companyName}. Clear it?`, () => {
        clearCart();
        addProductToCartWithQty(productId, companyId, qty);
      });
    }
    if (!S.cart.companyId){ S.cart.companyId = companyId; S.cart.companyName = company.name; }
    const ex = S.cart.items.find(i => i.productId === productId);
    if (ex) ex.quantity += qty;
    else S.cart.items.push({productId, name: product.name, imageUrl: product.imageUrl||"", price: Number(product.price)||0, quantity: qty});
    saveCart();
    updateCartBadge();
    toast(`${product.name} × ${qty} added`, "success");
  } catch(err){ console.error(err); toast("Failed to add", "error"); }
}

async function placeOrder({company, sub, delCh, svcCh, paymentMethod}){
  await refreshProfile();
  const st = statusInfo();
  if (st.blocked) return toast(st.title+": "+st.message, "error");
  if (!isOpen(company)) return toast(`${company.name} closed.`, "error");
  const phone = $("#coPhone").value.trim();
  const addressDetails = collectAddressParts("co");
  const addressError = validateAddressParts(addressDetails);
  const address = addressSummary(addressDetails);
  const notes = $("#coNotes").value.trim();
  if (!/^[0-9]{10}$/.test(phone)) return toast("Valid phone required", "error");
  if (addressError) return toast(addressError, "error");
  const codOn = company.codEnabled !== false;
  if (paymentMethod === "cod" && !codOn) return toast("COD not available", "error");
  const btn = $("#placeOrderBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Placing';
  try {
    const items = [];
    for (const it of S.cart.items){
      const ps = await getDoc(doc(db,"companies",company.id,"products",it.productId));
      if (!ps.exists()) throw new Error(`"${it.name}" unavailable`);
      const p = ps.data();
      if (p.isActive === false) throw new Error(`"${p.name}" not available`);
      items.push({
        productId: it.productId, name: p.name, imageUrl: p.imageUrl||"",
        unitPrice: Number(p.price)||0, quantity: it.quantity,
        lineTotal: (Number(p.price)||0) * it.quantity
      });
    }
    const finalSub = items.reduce((s,i) => s + i.lineTotal, 0);
    const cd = S.appliedCoupon?.discount || 0;
    const total = Math.max(0, finalSub + delCh + svcCh - cd);
    const orderId = genOrderId();
    const orderData = {
      orderId, customerId: S.user.uid,
      customerName: S.profile.name||"", customerEmail: S.profile.email||"",
      customerPhone: phone, address, addressDetails, notes,
      companyId: company.id, companyName: company.name, companyLogo: company.logoUrl||"",
      items, subtotal: finalSub, deliveryCharge: delCh, serviceCharge: svcCh,
      couponCode: S.appliedCoupon?.code||"", couponDiscount: cd,
      isFirstOrder: S.isFirstOrder, paymentMethod,
      grandTotal: total, status: "pending",
      isPremiumOrder: isPremiumMembershipActive(S.profile),
      premiumLateOrder: !!(S.profile?.premiumActive && (!S.profile.premiumUntil || new Date(S.profile.premiumUntil.toDate ? S.profile.premiumUntil.toDate() : S.profile.premiumUntil).getTime() > Date.now()) && !isOpen(company) && (new Date().getHours()*60 + new Date().getMinutes()) < (24*60)),
      trackingUrl: "", hasReview: false, hasComplaint: false,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    };
    const ref = await addDoc(collection(db,"orders"), orderData);
    try {
      await updateDoc(doc(db,"users",S.user.uid), {phone, address, addressDetails});
      S.profile = {...S.profile, phone, address, addressDetails};
    } catch(profileSaveError) { console.warn("Order placed; profile address could not be saved:", profileSaveError); }
    await addDoc(collection(db,"orders",ref.id,"statusHistory"), {
      status:"pending", note:"Order placed", changedBy: S.user.uid, createdAt: serverTimestamp()
    });
    clearCart();
    updateCartBadge();
    showOrderSuccess(orderId, total);
    showScreen("scrOrders"); renderOrders();
  } catch(err){
    console.error(err);
    toast(err.message || errMsg(err), "error");
  } finally {
    btn.disabled = false; btn.textContent = "Place Order →";
  }
}

window.openTrackingLink = (url) => {
  if (!url) return toast("No link", "error");
  if (!validUrl(url)) return toast("Invalid", "error");
  window.open(url, "_blank", "noopener,noreferrer");
};

window.openOrderDetail = async (orderId) => {
  showScreen("scrOrderDetail");
  const body = $("#orderDetailBody");
  body.innerHTML = `<div class="skeleton" style="height:120px"></div><div class="skeleton"></div>`;
  try {
    const snap = await getDoc(doc(db,"orders",orderId));
    if (!snap.exists()){ body.innerHTML = `<div class="empty">Not found</div>`; return; }
    const o = {id:snap.id, ...snap.data()};
    let review = null, complaint = null;
    try { const rs = await getDocs(query(collection(db,"reviews"), where("orderId","==",orderId))); if (!rs.empty) review = rs.docs[0].data(); } catch(_){}
    try { const cs = await getDocs(query(collection(db,"complaints"), where("orderId","==",orderId))); if (!cs.empty) complaint = {id:cs.docs[0].id, ...cs.docs[0].data()}; } catch(_){}
    paintOrderDetail(o, review, complaint);
  } catch(err){ body.innerHTML = `<div class="empty">Failed</div>`; }
};

function paintOrderDetail(o, review, complaint){
  const info = ORDER_ST[o.status] || {label:o.status, tone:"neutral"};
  const steps = ["pending","processing","successful"];
  const curIdx = steps.indexOf(o.status);
  const timeline = steps.map((s,i) => {
    let cls = "";
    if (o.status === "cancelled" || o.status === "rejected") cls = i === 0 ? "done" : "";
    else if (i < curIdx) cls = "done";
    else if (i === curIdx) cls = "current";
    return `<div class="timeline-step ${cls}"><div class="tl-label">${ORDER_ST[s].label}</div></div>`;
  }).join("");
  const isDel = o.status === "successful";
  const hasTrk = !!o.trackingUrl;
  const payLabel = o.paymentMethod === "cod" ? "Cash on Delivery" : "Online (UPI)";
  $("#orderDetailBody").innerHTML = `
    ${isDel && hasTrk ? `
      <div class="track-banner">
        <span style="font-size:34px">🚚</span>
        <div style="flex:1">
          <div style="font-weight:800;font-size:14px">On the way</div>
          <div style="font-size:12px;opacity:.94">Track your delivery</div>
        </div>
        <button class="btn" onclick="openTrackingLink('${esc(o.trackingUrl)}')">Track</button>
      </div>` : ""}
    <div class="card card-elevated">
      <div class="between mb-2">
        <div><div class="text-xs text-soft">Order ID</div>
          <div class="font-bold font-mono" style="font-size:15px;color:var(--primary)">#${esc(o.orderId || o.id)}</div></div>
        <span class="badge badge-${info.tone}">${info.label}</span>
      </div>
      <div class="text-sm text-muted">${esc(o.companyName || "")}</div>
      <div class="text-xs text-soft mt-1">${fdate(o.createdAt, true)}</div>
    </div>
    ${complaint ? `
      <div class="card" style="background:var(--warning-soft);border-color:#fcd34d">
        <div class="text-xs" style="color:#b45309;text-transform:uppercase;font-weight:800;margin-bottom:6px">⚠️ Complaint Filed</div>
        <div class="text-sm" style="color:#b45309;font-weight:700;margin-bottom:8px">${esc(complaint.complaintType || "")}</div>
        <button class="btn btn-warning btn-sm" onclick="openComplaintChat('${o.id}')" style="width:100%">💬 Open Chat</button>
      </div>` : ""}
    ${(o.status === "rejected" || o.status === "cancelled") && o.cancelReason ? `
      <div class="card" style="background:var(--danger-soft);border-color:#fecaca">
        <div class="text-xs" style="color:var(--danger);text-transform:uppercase;font-weight:800;margin-bottom:6px">Reason</div>
        <div class="text-sm" style="color:var(--danger);font-weight:700">${esc(o.cancelReason)}</div>
      </div>` : ""}
    ${isDel && review ? `
      <div class="card" style="background:var(--success-soft);border-color:#a7f3d0">
        <div class="text-xs" style="color:var(--success);text-transform:uppercase;font-weight:800;margin-bottom:6px">Your Review</div>
        <div style="margin-bottom:6px"><span style="color:var(--amber);font-size:15px">${[1,2,3,4,5].map(n => `<span style="${n<=review.rating?"":"opacity:.3"}">★</span>`).join("")}</span></div>
        ${review.reviewText ? `<div class="text-sm text-muted">"${esc(review.reviewText)}"</div>` : ""}
      </div>` : ""}
    <div class="card">
      <div class="section-title">Items</div>
      ${(o.items||[]).map(i => `
        <div class="row" style="padding:10px 0;border-bottom:1px solid var(--border)">
          <img src="${esc(validUrl(i.imageUrl) ? i.imageUrl : PLACEHOLDER_IMG)}" style="width:52px;height:52px;border-radius:11px;object-fit:cover" onerror="this.src='${PLACEHOLDER_IMG}'">
          <div style="flex:1;min-width:0">
            <div class="text-sm font-bold">${esc(i.name)}</div>
            <div class="text-xs text-soft mt-1">${i.quantity} × ${inr(i.unitPrice)}</div>
          </div>
          <div class="font-bold text-sm">${inr(i.lineTotal)}</div>
        </div>`).join("")}
    </div>
    <div class="card">
      <div class="section-title">Price</div>
      <div class="price-row"><span class="text-muted">Subtotal</span><span>${inr(o.subtotal)}</span></div>
      ${o.deliveryCharge > 0 ? `<div class="price-row"><span class="text-muted">Delivery</span><span>${inr(o.deliveryCharge)}</span></div>` : ""}
      ${o.serviceCharge > 0 ? `<div class="price-row"><span class="text-muted">Service</span><span>${inr(o.serviceCharge)}</span></div>` : ""}
      ${o.couponDiscount > 0 ? `<div class="price-row discount"><span class="text-muted">Coupon</span><span>- ${inr(o.couponDiscount)}</span></div>` : ""}
      <div class="price-row total"><span>Total</span><span>${inr(o.grandTotal)}</span></div>
      <div class="price-row" style="padding-top:8px"><span class="text-muted">Payment</span><span class="font-bold">${esc(payLabel)}</span></div>

    ${isDel && !review ? `<button class="btn btn-success btn-lg btn-block mt-3" onclick="openReviewForm('${o.id}')">⭐ Rate & Review</button>` : ""}
    ${isDel && !complaint ? `<button class="btn btn-lg btn-block mt-2" style="background:var(--warning-soft);color:#b45309;border:1px solid #fcd34d" onclick="openComplaintForm('${o.id}')">⚠️ Raise Complaint</button>` : ""}

}

window.openReviewForm = async (orderId) => {
  try {
    const rs = await getDocs(query(collection(db,"reviews"), where("orderId","==",orderId)));
    if (!rs.empty){ toast("Already reviewed", "info"); return; }
  } catch(_){}
  showScreen("scrReview");
  $("#reviewBody").innerHTML = `
    <div class="card card-elevated">
      <div class="section-title">Rate Your Experience</div>
      <div class="text-center mb-4">
        <div id="reviewStars" style="font-size:42px;display:inline-flex;gap:6px;cursor:pointer;user-select:none">
          ${[1,2,3,4,5].map(n => `<span data-n="${n}" style="color:#e5e7eb;transition:all .2s;line-height:1">★</span>`).join("")}
        </div>
      </div>
      <div class="form-group"><label class="form-label">Review (optional)</label>
        <textarea class="form-textarea" id="reviewText"></textarea></div>
      <div class="form-group"><label class="form-label">Maps link (optional)</label>
        <input class="form-input" id="reviewMaps" type="url"></div>
      <button class="btn btn-primary btn-lg btn-block" id="reviewSubmit">Submit Review</button>
    </div>`;
  let rating = 0;
  $$("#reviewStars span").forEach(s => s.onclick = () => {
    rating = +s.dataset.n;
    $$("#reviewStars span").forEach(x => x.style.color = (+x.dataset.n <= rating) ? "var(--amber)" : "#e5e7eb");
  });
  $("#reviewSubmit").onclick = async () => {
    if (!rating) return toast("Select rating", "error");
    const txt = $("#reviewText").value.trim();
    const maps = $("#reviewMaps").value.trim();
    if (maps && !validUrl(maps)) return toast("Invalid link", "error");
    const btn = $("#reviewSubmit");
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Submitting';
    try {
      await addDoc(collection(db,"reviews"), {
        orderId, customerId: S.user.uid,
        customerName: S.profile.name||"", customerEmail: S.profile.email||"",
        rating, reviewText: txt, mapsLink: maps, createdAt: serverTimestamp()
      });
      await updateDoc(doc(db,"orders",orderId), {hasReview:true, reviewedAt: serverTimestamp()});
      toast("Thanks!", "success");
      showScreen("scrOrders"); renderOrders();
    } catch(err){ toast(err.message || errMsg(err), "error"); }
    finally { btn.disabled = false; btn.textContent = "Submit Review"; }
  };
};

window.openComplaintForm = async (orderId) => {
  try {
    const cs = await getDocs(query(collection(db,"complaints"), where("orderId","==",orderId)));
    if (!cs.empty){ toast("Complaint already filed", "info"); setTimeout(() => openComplaintChat(orderId), 600); return; }
  } catch(_){}
  showScreen("scrComplaint");
  $("#complaintBody").innerHTML = `
    <div class="card card-elevated">
      <div class="section-title">Raise a Complaint</div>
      <div class="info-box mb-4">ℹ️ Please describe the issue. You can chat with our team after submitting.</div>
      <div class="form-group">
        <label class="form-label">What went wrong?</label>
        <select class="form-select" id="complaintType">
          <option value="Less quantity received">📦 Less quantity received</option>
          <option value="Quality issue">⭐ Quality issue</option>
          <option value="Damaged product">💔 Damaged product</option>
          <option value="Wrong item received">❌ Wrong item received</option>
          <option value="Missing items">🚫 Missing items</option>
          <option value="Late delivery">⏰ Late delivery</option>
          <option value="Other">📝 Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Describe your issue</label>
        <textarea class="form-textarea" id="complaintText" placeholder="Please explain in detail..." minlength="10"></textarea>
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="complaintSubmit">Submit & Open Chat</button>
    </div>`;
  $("#complaintSubmit").onclick = async () => {
    const type = $("#complaintType").value;
    const txt = $("#complaintText").value.trim();
    if (!txt || txt.length < 10) return toast("Describe issue (min 10 chars)", "error");
    const btn = $("#complaintSubmit");
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Submitting';
    try {
      const os = await getDoc(doc(db,"orders",orderId));
      const order = os.exists() ? os.data() : {};
      const ref = await addDoc(collection(db,"complaints"), {
        orderId, orderNumber: order.orderId || orderId,
        customerId: S.user.uid, customerName: S.profile.name||"",
        customerEmail: S.profile.email||"", customerPhone: S.profile.phone||"",
        companyId: order.companyId||"", companyName: order.companyName||"",
        complaintType: type, complaintText: txt, status:"pending",
        lastMessageAt: serverTimestamp(), createdAt: serverTimestamp()

        senderId: S.user.uid, senderName: S.profile.name||"Customer",

      toast("✅ Complaint submitted!", "success");
      setTimeout(() => openComplaintChat(orderId), 500);
    } catch(err){ console.error(err); toast(err.message || errMsg(err), "error"); }
    finally { btn.disabled = false; btn.textContent = "Submit & Open Chat"; }
  };
};

window.openComplaintChat = async (orderId) => {
  showScreen("scrChat");
  const container = $("#chatContainer");
  container.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-3)">
    <div class="spin spin-dark" style="width:24px;height:24px;border-width:3px;display:inline-block"></div>
    <div style="margin-top:12px">Loading chat…</div>
  </div>`;
  try {
    let complaint = null, cid = null;
    try {
      const os = await getDoc(doc(db,"orders",orderId));
      if (os.exists()){
        const od = os.data();
        if (od.complaintId){
          const cs = await getDoc(doc(db,"complaints",od.complaintId));
          if (cs.exists()){ cid = cs.id; complaint = cs.data(); }
        }
      }
    } catch(_){}
    if (!complaint){
      const cs = await getDocs(query(collection(db,"complaints"), where("orderId","==",orderId)));
      if (!cs.empty){ cid = cs.docs[0].id; complaint = cs.docs[0].data(); }
    }
    if (!complaint || !cid){
      container.innerHTML = `<div class="empty" style="padding:40px 20px">
        <div style="font-size:40px;margin-bottom:10px">📭</div>
        <div style="font-weight:700;margin-bottom:6px">No complaint found</div>
        <button class="btn btn-secondary mt-4" onclick="goTo('orders')">Back</button>
      </div>`;
      return;
    }
    S.activeComplaintId = cid;
    const isAdm = S.profile?.role === "admin";
    const sti = CMPL_ST[complaint.status] || CMPL_ST.pending;
    const resolved = complaint.status === "resolved";
    container.innerHTML = `
      <div style="background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px">
        <div style="width:38px;height:38px;border-radius:50%;background:var(--primary-grad);color:#fff;display:grid;place-items:center;font-weight:800">
          ${esc((complaint.customerName||"C")[0].toUpperCase())}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13.5px;font-weight:800">${isAdm ? esc(complaint.customerName||"Customer") : "Pawan Retail Support"}</div>
          <div style="font-size:11px;color:var(--text-3)">Order #${esc(complaint.orderNumber||orderId)} · <span class="badge badge-${sti.tone}" style="font-size:10px;padding:2px 6px">${sti.label}</span></div>
        </div>
        ${isAdm && !resolved ? `<button class="btn btn-success btn-xs" id="resolveChatBtn">✓ Resolve</button>` : ""}
      </div>
      <div style="margin:10px 16px 0;padding:12px;background:var(--warning-soft);border:1px solid #fcd34d;border-radius:10px;font-size:12px;color:#b45309">
        <strong>⚠️ Complaint:</strong> ${esc(complaint.complaintType || "")}
      </div>
      ${resolved ? `<div style="background:var(--success-soft);border:1.5px solid #a7f3d0;color:var(--success);padding:12px 16px;margin:10px 16px 0;border-radius:10px;text-align:center;font-size:12.5px;font-weight:700">✓ Resolved. Thank you!</div>` : ""}
      <div id="chatMessages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px"></div>
      ${!resolved ? `
        <div style="background:#fff;border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;align-items:flex-end">
          <textarea id="chatInput" placeholder="Type your message…" rows="1" style="flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:20px;resize:none;min-height:40px;max-height:100px;font-size:13.5px;background:var(--surface);font-family:var(--font)"></textarea>
          <button id="chatSendBtn" style="width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex-shrink:0">
            <span style="width:18px;height:18px;display:block">${SVG.send}</span>
          </button>
        </div>` : ""}
    `;
    const ta = $("#chatInput");
    if (ta){
      ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 100) + "px"; });
      ta.addEventListener("keypress", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMsg(); } });
    }
    const sb = $("#chatSendBtn");
    if (sb) sb.onclick = sendMsg;
    const rb = $("#resolveChatBtn");
    if (rb) rb.onclick = async () => {
      if (!confirm("Mark as resolved?")) return;
      rb.disabled = true; rb.innerHTML = '<span class="spin"></span>';
      try {
        await updateDoc(doc(db,"complaints",cid), {status:"resolved", resolvedAt: serverTimestamp(), resolvedBy: S.user.uid});
        await addDoc(collection(db,"complaints",cid,"messages"), {
          senderId: S.user.uid, senderName: S.profile?.name||"Admin", senderRole:"admin",
          text: "✅ This complaint has been marked as resolved. Thank you!", createdAt: serverTimestamp()
        });
        toast("Resolved", "success");
        setTimeout(() => openComplaintChat(orderId), 600);
      } catch(err){ toast(errMsg(err), "error"); rb.disabled = false; rb.textContent = "✓ Resolve"; }
    };
    if (S.activeChatUnsub){ try { S.activeChatUnsub(); } catch(_){} S.activeChatUnsub = null; }
    const ref = collection(db,"complaints",cid,"messages");
    S.activeChatUnsub = onSnapshot(ref, snap => {
      const msgs = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => ms(a.createdAt) - ms(b.createdAt));
      paintChat(msgs);
    }, err => { console.error(err); toast("Chat load failed", "error"); });
  } catch(err){
    console.error(err);
    container.innerHTML = `<div class="empty" style="padding:40px 20px"><div style="font-size:40px;margin-bottom:10px">⚠️</div><div style="color:var(--danger);font-weight:700">Failed to open chat</div></div>`;
  }
};

async function sendMsg(){
  const inp = $("#chatInput");
  if (!inp) return;
  const txt = inp.value.trim();
  if (!txt) return;
  if (!S.activeComplaintId) return toast("No active chat", "error");
  const btn = $("#chatSendBtn");
  btn.disabled = true; inp.disabled = true;
  try {
    const isAdm = S.profile?.role === "admin";
    await addDoc(collection(db,"complaints",S.activeComplaintId,"messages"), {
      senderId: S.user.uid, senderName: S.profile?.name || (isAdm ? "Admin" : "Customer"),
      senderRole: isAdm ? "admin" : "customer", text: txt, createdAt: serverTimestamp()
    });
    const upd = {lastMessageAt: serverTimestamp()};
    if (isAdm) upd.status = "in_progress";
    await updateDoc(doc(db,"complaints",S.activeComplaintId), upd);
    inp.value = "";
    inp.style.height = "auto";
    inp.focus();
  } catch(err){ console.error(err); toast(errMsg(err), "error"); }
  finally { btn.disabled = false; inp.disabled = false; }
}

function paintChat(msgs){
  const box = $("#chatMessages");
  if (!box) return;
  if (!msgs.length){
    box.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px"><div style="font-size:34px;margin-bottom:10px;opacity:.4">💬</div>No messages yet.</div>`;
    return;
  }
  box.innerHTML = msgs.map(m => {
    if (m.senderRole === "system"){
      return `<div style="align-self:center;background:var(--surface-2);color:var(--text-2);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;text-align:center;max-width:90%">${esc(m.text||"")}</div>`;
    }
    const cust = m.senderRole === "customer";
    return `<div style="max-width:78%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;word-wrap:break-word;box-shadow:0 1px 3px rgba(11,18,32,.06);${cust ? "align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px" : "align-self:flex-start;background:#fff;color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px"}">
      ${!cust ? `<div style="font-size:10px;font-weight:800;letter-spacing:.03em;margin-bottom:3px;opacity:.75;text-transform:uppercase">${esc(m.senderName||"Admin")}</div>` : ""}
      <div>${esc(m.text||"").replace(/\n/g,"<br>")}</div>
      <div style="font-size:10px;opacity:.65;margin-top:3px;${cust?"text-align:right":""}">${ftime(m.createdAt)}</div>
    </div>`;
  }).join("");
  setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
}

/* Structured delivery address helpers */
function readAddressParts(profile){
  const a=profile?.addressDetails && typeof profile.addressDetails==="object" ? profile.addressDetails : {};
  const legacy=typeof profile?.address==="string" ? profile.address : "";
  return {street:a.street||legacy,sector:a.sector||"",flat:a.flat||"",landmark:a.landmark||"",city:a.city||"",state:a.state||"",pincode:a.pincode||""};
}
function addressSummary(a){
  return [a.flat,a.street,a.sector,a.landmark,a.city,a.state,a.pincode].filter(Boolean).join(", ");
}
function addressFieldsHTML(prefix,a){
  return `<div class="form-group"><label class="form-label">Street / Road *</label><input class="form-input" id="${prefix}Street" value="${esc(a.street||"")}" autocomplete="address-line1" placeholder="House road / street" required></div>
  <div class="form-grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
  <div class="form-group"><label class="form-label">Sector / Area</label><input class="form-input" id="${prefix}Sector" value="${esc(a.sector||"")}" autocomplete="address-line2" placeholder="Sector / area"></div>
  <div class="form-group"><label class="form-label">Flat / House No. *</label><input class="form-input" id="${prefix}Flat" value="${esc(a.flat||"")}" placeholder="Flat / house no." required></div>
  </div>
  <div class="form-group"><label class="form-label">Landmark</label><input class="form-input" id="${prefix}Landmark" value="${esc(a.landmark||"")}" placeholder="Nearby landmark (optional)"></div>
  <div class="form-grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
  <div class="form-group"><label class="form-label">City / Town *</label><input class="form-input" id="${prefix}City" value="${esc(a.city||"")}" autocomplete="address-level2" placeholder="City / town" required></div>
  <div class="form-group"><label class="form-label">State *</label><input class="form-input" id="${prefix}State" value="${esc(a.state||"")}" autocomplete="address-level1" placeholder="State" required></div>
  </div>
  <div class="form-group"><label class="form-label">PIN Code *</label><input class="form-input" id="${prefix}Pincode" value="${esc(a.pincode||"")}" inputmode="numeric" autocomplete="postal-code" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit PIN code" required></div>`;
}
function collectAddressParts(prefix){
  const val=id=>document.getElementById(prefix+id)?.value.trim()||"";
  return {street:val("Street"),sector:val("Sector"),flat:val("Flat"),landmark:val("Landmark"),city:val("City"),state:val("State"),pincode:val("Pincode")};
}
function validateAddressParts(a){
  if(!a.street||!a.flat||!a.city||!a.state||!/^[0-9]{6}$/.test(a.pincode)) return "Enter street, flat/house number, city, state and valid 6-digit PIN code.";
  return "";
}

/* ============ ACCOUNT ============ */
function renderAccount(){
  const body = $("#accountBody");
  if (!body || !S.profile) return;

async function trackOrder(){
  const oid = ($("#trackOrderId").value || "").trim().toUpperCase();
  const email = ($("#trackEmail").value || "").trim().toLowerCase();
  const result = $("#trackResult");
  const btn = $("#trackBtn");
  if (!oid) return toast("Enter order ID", "error");
  if (!email) return toast("Enter email", "error");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Searching';
  result.innerHTML = `<div class="skeleton" style="height:140px"></div>`;
  try {
    const snap = await getDocs(query(collection(db,"orders"), where("orderId","==",oid)));
    if (snap.empty){
      result.innerHTML = `<div class="card" style="background:var(--danger-soft);border-color:#fecaca"><div class="text-sm" style="color:var(--danger);font-weight:700">No order found.</div></div>`;
      return;
    }
    const m = snap.docs.find(d => ((d.data().customerEmail || "").toLowerCase() === email));
    if (!m){
      result.innerHTML = `<div class="card" style="background:var(--danger-soft);border-color:#fecaca"><div class="text-sm" style="color:var(--danger);font-weight:700">Email mismatch.</div></div>`;
      return;
    }
    const o = {id:m.id, ...m.data()};
    const info = ORDER_ST[o.status] || {label:o.status, tone:"neutral"};
    result.innerHTML = `
      <div class="card" style="margin-top:14px;background:var(--success-soft);border-color:#a7f3d0">
        <div class="text-xs" style="color:var(--success);text-transform:uppercase;font-weight:800">✓ Order Found</div>
      </div>
      <div class="card card-elevated">
        <div class="between mb-2">
          <div><div class="text-xs text-soft">Order ID</div>
            <div class="font-bold font-mono" style="font-size:15px;color:var(--primary)">#${esc(o.orderId)}</div></div>
          <span class="badge badge-${info.tone}">${info.label}</span>
        </div>
        <div class="text-sm text-muted">${esc(o.companyName || "")}</div>
        <div class="text-xs text-soft mt-1">Placed ${fdate(o.createdAt, true)}</div>
        <div class="price-row total" style="margin-top:10px"><span>Total</span><span>${inr(o.grandTotal)}</span></div>
      </div>`;
  } catch(err){
    result.innerHTML = `<div class="card" style="background:var(--danger-soft);border-color:#fecaca"><div class="text-sm" style="color:var(--danger);font-weight:700">Failed to fetch.</div></div>`;
  } finally { btn.disabled = false; btn.textContent = "Track Order"; }
}

async function renderAdminPremiumRequests(){
  const el=$("#adminContent"); if(!el)return;
  el.innerHTML='<div class="card p-4"><h2 class="section-title">Premium payment requests</h2><p class="text-sm text-soft">Verify the ₹199 payment and UTR before approving. Approval activates 30 days of Premium.</p><div id="premiumRequestsList" class="mt-3">Loading requests…</div></div>';
  const list=$("#premiumRequestsList");
  try {
    const snap=await getDocs(query(collection(db,"premiumRequests")));
    const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)));
    if(!rows.length){list.innerHTML='<div class="empty">No Premium requests yet.</div>';return;}
    list.innerHTML=rows.map(r=>`<div class="card" style="margin:10px 0;padding:14px;border:1px solid var(--border)"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><strong>${esc(r.customerName||'Customer')}</strong><span class="badge">${esc(r.status||'pending')}</span></div><div class="text-xs text-soft" style="margin-top:5px">${esc(r.customerEmail||'')} · Request ID: ${esc(r.id)}</div><div style="margin-top:8px;font-size:13px">Amount: <b>₹${Number(r.amount)||199}</b></div><div style="margin-top:5px;font-size:13px;overflow-wrap:anywhere">UTR: <b>${esc(r.utr||'Not submitted yet')}</b></div><div style="margin-top:5px;font-size:12px">Payment: ${esc(r.paymentStatus||'unverified')}</div>${r.status==='pending'?`<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary" data-premium-approve="${esc(r.id)}" data-customer="${esc(r.customerId||'')}" style="flex:1">Approve & Activate</button><button class="btn btn-secondary" data-premium-reject="${esc(r.id)}" data-customer="${esc(r.customerId||'')}" style="flex:1">Reject</button></div>`:''}</div>`).join('');
    list.querySelectorAll('[data-premium-approve]').forEach(btn=>btn.onclick=async()=>{
      const rid=btn.dataset.premiumApprove, uid=btn.dataset.customer;
      if(!uid)return toast('Customer UID missing; cannot activate safely.','error');
      const currentRequest = rows.find(x => x.id === rid);
      if(Number(currentRequest?.expiresAt||0)>0 && Date.now()>=Number(currentRequest.expiresAt)) return toast('This Premium request expired after 20 minutes. Ask the customer to create a new request.','error');
      if(!currentRequest?.utr || String(currentRequest.utr).trim().length < 6) return toast('Customer must submit UTR before approval.','error');
      if(!confirm('Confirm you verified ₹199 payment and want to activate Premium for 30 days?'))return;
      btn.disabled=true;
      try{
        const until=new Date(Date.now()+30*24*60*60*1000);
        await updateDoc(doc(db,'users',uid),{premiumActive:true,premiumUntil:until,premiumRequestStatus:'approved',premiumRequestId:rid});
        await updateDoc(doc(db,'premiumRequests',rid),{status:'approved',paymentStatus:'verified',approvedBy:S.user.uid,approvedAt:serverTimestamp(),premiumUntil:until,updatedAt:serverTimestamp()});
        toast('Premium approved for 30 days.','success'); renderAdminPremiumRequests();
      }catch(e){console.error(e);toast('Approval failed. Check Firestore Rules.','error');btn.disabled=false;}
    });
    list.querySelectorAll('[data-premium-reject]').forEach(btn=>btn.onclick=async()=>{
      const rid=btn.dataset.premiumReject, uid=btn.dataset.customer;
      if(!confirm('Reject this Premium request?'))return;
      btn.disabled=true;
      try{await updateDoc(doc(db,'premiumRequests',rid),{status:'rejected',paymentStatus:'rejected',reviewedBy:S.user.uid,reviewedAt:serverTimestamp(),updatedAt:serverTimestamp()});if(uid)await updateDoc(doc(db,'users',uid),{premiumRequestStatus:'rejected'});toast('Premium request rejected.','success');renderAdminPremiumRequests();}
      catch(e){console.error(e);toast('Could not reject request. Check Firestore Rules.','error');btn.disabled=false;}
    });
  } catch(e){console.error(e);list.innerHTML='<div class="warn-box">Could not load Premium requests. Check Firestore Rules.</div>';}
}

    <div id="adminBannersList"><div class="empty">Loading banners…</div></div>`;
  const form=$("#bannerForm");
  const image=$("#bannerImageUrl");
  const updatePreview=()=>{
    const url=image.value.trim(), title=$("#bannerTitle").value.trim();
    const wrap=$("#bannerPreviewWrap");
    if(validUrl(url)){ $("#bannerPreview").src=url; $("#bannerPreviewTitle").textContent=title; wrap.classList.remove("hidden");}
    else {$("#bannerPreview").removeAttribute("src");wrap.classList.add("hidden");}
  };
  image.addEventListener("input",updatePreview);
  $("#bannerTitle").addEventListener("input",updatePreview);
  $("#bannerResetBtn").onclick=()=>resetBannerForm();
  $("#bannerRefreshBtn").onclick=()=>loadAdminBanners();

    const title=$("#bannerTitle").value.trim();
    const subtitle=$("#bannerSubtitle").value.trim();
    const imageUrl=$("#bannerImageUrl").value.trim();
    const linkUrl=$("#bannerLinkUrl").value.trim();
    const order=Number($("#bannerOrder").value)||0;
    const isActive=$("#bannerActive").checked;
    if(!title || !validUrl(imageUrl) || !/^https:\/\//i.test(imageUrl)){toast("Enter a title and a valid HTTPS image URL.","error");return;}

  };

}
function resetBannerForm(){

}
async function loadAdminBanners(){
  const el=$("#adminBannersList");if(!el)return;
  el.innerHTML='<div class="empty">Loading banners…</div>';
  try{
    const snap=await getDocs(collection(db,"banners"));
    const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
    if(!rows.length){el.innerHTML='<div class="empty">No banners yet. Add your first banner above.</div>';return;}
    el.innerHTML=rows.map(b=>`<article class="card" style="margin-bottom:12px">
      <div style="display:grid;grid-template-columns:minmax(100px,180px) minmax(0,1fr);gap:14px;align-items:start">
        <img src="${esc(validUrl(b.imageUrl)?b.imageUrl:"")}" alt="${esc(b.title||"Banner")}" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#eef1eb" onerror="this.style.display='none'">
        <div style="min-width:0"><div class="between" style="align-items:flex-start"><strong>${esc(b.title||"Untitled banner")}</strong><span class="badge ${b.isActive?"badge-success":"badge-neutral"}">${b.isActive?"Active":"Hidden"}</span></div>
        <p class="text-sm text-muted mt-2">${esc(b.subtitle||"No subtitle")}</p><p class="text-xs text-soft mt-2">Order: ${Number(b.order)||0}</p>
        ${b.linkUrl?`<p class="text-xs mt-2" style="overflow-wrap:anywhere">${esc(b.linkUrl)}</p>`:""}
        <div class="acts mt-3"><button class="btn btn-secondary btn-sm" data-banner-edit="${esc(b.id)}">Edit</button><button class="btn btn-secondary btn-sm" data-banner-toggle="${esc(b.id)}" data-active="${b.isActive?"1":"0"}">${b.isActive?"Hide":"Publish"}</button><button class="btn btn-danger btn-sm" data-banner-delete="${esc(b.id)}">Delete</button></div></div>
      </div></article>`).join("");
    $$("[data-banner-edit]",el).forEach(btn=>btn.onclick=()=>{
      const b=rows.find(x=>x.id===btn.dataset.bannerEdit);if(!b)return;
      $("#bannerEditId").value=b.id;$("#bannerTitle").value=b.title||"";$("#bannerSubtitle").value=b.subtitle||"";
      $("#bannerImageUrl").value=b.imageUrl||"";$("#bannerLinkUrl").value=b.linkUrl||"";$("#bannerOrder").value=Number(b.order)||0;
      $("#bannerActive").checked=b.isActive!==false;$("#bannerSaveBtn").textContent="Update Banner";
      $("#bannerImageUrl").dispatchEvent(new Event("input"));formScrollToTop();
    });
    $$("[data-banner-toggle]",el).forEach(btn=>btn.onclick=async()=>{
      try{await updateDoc(doc(db,"banners",btn.dataset.bannerToggle),{isActive:btn.dataset.active!=="1",updatedAt:serverTimestamp(),updatedBy:S.user?.uid||""});toast("Banner status updated","success");await loadAdminBanners();}
      catch(e){toast("Could not update banner: "+errMsg(e),"error");}
    });
    $$("[data-banner-delete]",el).forEach(btn=>btn.onclick=()=>confirmDialog("Delete this banner permanently?",async()=>{
      try{await deleteDoc(doc(db,"banners",btn.dataset.bannerDelete));toast("Banner deleted","success");await loadAdminBanners();}
      catch(e){toast("Could not delete banner: "+errMsg(e),"error");}
    }));
  }catch(e){console.error("Load banners failed",e);el.innerHTML=`<div class="warn-box">Could not load banners: ${esc(errMsg(e))}. Check Firestore rules.</div>`;}
}

async function renderAdminDash(){

function renderAdminLinks(){
  $("#adminContent").innerHTML = `
    <div class="mb-4" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
