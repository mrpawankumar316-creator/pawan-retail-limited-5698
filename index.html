<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0f14" />
<title>PRL Gaming Hub</title>
<style>
:root {
  --bg: #0d0f14;
  --surface: #15181f;
  --surface-2: #1c2029;
  --surface-3: #232834;
  --border: #262b36;
  --border-2: #333a48;
  --text: #e8eaed;
  --text-2: #9aa3b2;
  --text-3: #6b7280;
  --accent: #3b82f6;
  --accent-press: #2563eb;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
  --gold: #f59e0b;
  --radius: 10px;
  --radius-sm: 8px;
  --radius-lg: 14px;
  --header-h: 56px;
  --nav-h: 60px;
}
[data-theme="light"] {
  --bg: #f4f5f7; --surface: #fff; --surface-2: #f7f8fa; --surface-3: #eef0f4;
  --border: #e2e5ea; --border-2: #d3d7de; --text: #111418;
  --text-2: #5a6373; --text-3: #8b95a5;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; color: inherit; }
input, select { font-family: inherit; outline: none; }
.hidden { display: none !important; }

/* LOGIN */
.login-view {
  min-height: 100vh; display: flex; flex-direction: column;
  padding: 24px 20px; background: var(--bg);
}
.login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; margin-top: 12px; }
.login-brand .bm {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px; letter-spacing: -.5px;
}
.login-brand .bt .bt1 { font-size: 16px; font-weight: 800; letter-spacing: -.2px; }
.login-brand .bt .bt2 { font-size: 10px; color: var(--text-3); letter-spacing: 1.5px; font-weight: 600; margin-top: 2px; }
.login-title { font-size: 26px; font-weight: 800; letter-spacing: -.8px; margin-bottom: 6px; }
.login-sub { font-size: 14px; color: var(--text-3); margin-bottom: 26px; font-weight: 500; }
.login-form { max-width: 400px; width: 100%; margin: 0 auto; flex: 1; }
.login-footer { text-align: center; padding: 20px 0 12px; font-size: 13px; color: var(--text-3); font-weight: 500; }
.login-footer .link { color: var(--accent); font-weight: 700; margin-left: 4px; cursor: pointer; }
.login-legal { text-align: center; font-size: 10.5px; color: var(--text-3); letter-spacing: .4px; padding: 8px 0 4px; font-weight: 500; }

/* HEADER */
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 14px;
  display: flex; align-items: center; gap: 12px;
  padding-top: env(safe-area-inset-top);
  height: calc(var(--header-h) + env(safe-area-inset-top));
}
.header-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; cursor: pointer; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; letter-spacing: -.5px; flex-shrink: 0;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-text .b1 { font-size: 13px; font-weight: 800; letter-spacing: .2px; }
.brand-text .b2 { font-size: 9px; color: var(--text-3); font-weight: 600; letter-spacing: 1.2px; margin-top: 2px; }
.header-status { flex: 1; min-width: 0; display: flex; justify-content: center; }
.status-chip {
  font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
  padding: 4px 9px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2);
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.status-chip.live { color: var(--success); border-color: rgba(34,197,94,.35); }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.balance-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 9px;
  font-size: 12.5px; font-weight: 700; transition: transform .2s;
}
.balance-pill.bump { transform: scale(1.1); }
.balance-pill .coin {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--warning); display: inline-block; flex-shrink: 0;
  position: relative;
}
.balance-pill .coin::after {
  content: '$'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 900; color: rgba(0,0,0,.55);
}
.icon-btn {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); flex-shrink: 0;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; stroke-width: 1.8; }

.app-main {
  flex: 1;
  padding: 14px 14px calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  max-width: 640px; width: 100%; margin: 0 auto;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  color: var(--text-3); font-size: 10px; font-weight: 600; letter-spacing: .2px;
  position: relative; min-width: 0;
}
.nav-item svg { width: 20px; height: 20px; stroke-width: 1.8; }
.nav-item.active { color: var(--accent); }
.nav-item.active::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 22px; height: 2px; background: var(--accent);
  border-radius: 0 0 2px 2px;
}

/* CARDS */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; gap: 8px;
}
.card-title { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--text-3); text-transform: uppercase; }
.card-title-lg { font-size: 15px; font-weight: 700; letter-spacing: -.2px; color: var(--text); }

.balance-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.balance-info .bl { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
.balance-info .bv { font-size: 26px; font-weight: 800; letter-spacing: -.8px; margin-top: 2px; font-variant-numeric: tabular-nums; color: var(--text); }
.balance-info .bn { font-size: 10px; color: var(--text-3); font-weight: 600; letter-spacing: .4px; margin-top: 4px; }
.balance-right { text-align: right; }
.balance-right .rate { font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
.balance-right .lbl { font-size: 10px; color: var(--text-3); letter-spacing: .6px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }

/* GAME CARDS (Home) */
.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.game-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  cursor: pointer; transition: all .2s;
  display: flex; flex-direction: column; gap: 8px;
  min-height: 140px;
}
.game-card:active { transform: scale(.97); }
.game-card.gc-mines { border-color: rgba(245,158,11,.4); }
.game-card.gc-mines:active { background: rgba(245,158,11,.05); }
.game-card.gc-survivor { border-color: rgba(59,130,246,.4); }
.game-card.gc-survivor:active { background: rgba(59,130,246,.05); }
.game-card .gc-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.gc-mines .gc-icon { background: rgba(245,158,11,.15); }
.gc-survivor .gc-icon { background: rgba(59,130,246,.15); }
.game-card .gc-name { font-size: 15px; font-weight: 800; letter-spacing: -.2px; }
.game-card .gc-desc { font-size: 11px; color: var(--text-3); font-weight: 500; line-height: 1.4; }
.game-card .gc-play {
  font-size: 11px; color: var(--accent); font-weight: 800;
  letter-spacing: .5px; margin-top: auto;
}

/* BUTTONS */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 46px; padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14.5px; font-weight: 700;
  background: var(--accent); color: #fff;
  transition: background .15s, opacity .15s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; background: var(--surface-3); color: var(--text-3); }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--danger); }
.btn-success { background: var(--success); }
.btn-warning { background: var(--warning); color: #1a1a1a; }
.btn-gold { background: var(--gold); color: #1a1a1a; }
.btn-sm { min-height: 36px; padding: 8px 12px; font-size: 13px; border-radius: var(--radius-sm); width: auto; }

/* LIST */
.list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.list-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  min-width: 0; transition: background .12s;
}
.list-row:last-child { border-bottom: none; }
.list-row:active { background: var(--surface-2); }
.list-row .avatar {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface-3); color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; flex-shrink: 0;
}
.list-row .avatar.team-a { background: rgba(59,130,246,.15); color: var(--accent); }
.list-row .avatar.team-b { background: rgba(245,158,11,.15); color: var(--warning); }
.list-row .avatar.won { background: rgba(34,197,94,.15); color: var(--success); }
.list-row .avatar.lost { background: rgba(239,68,68,.15); color: var(--danger); }
.list-row .lr-body { flex: 1; min-width: 0; }
.list-row .lr-title {
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.list-row .lr-sub {
  font-size: 11.5px; color: var(--text-3); margin-top: 2px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.list-row .lr-right { text-align: right; flex-shrink: 0; }
.list-row .lr-amount { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.list-row .lr-amount.up { color: var(--success); }
.list-row .lr-amount.down { color: var(--danger); }
.list-row .lr-amount.pending { color: var(--warning); }
.list-row .lr-meta { font-size: 10.5px; color: var(--text-3); margin-top: 2px; font-weight: 600; }

/* BADGES */
.badge {
  display: inline-block; font-size: 10px; font-weight: 800;
  letter-spacing: .5px; padding: 2px 7px; border-radius: 4px;
  text-transform: uppercase; white-space: nowrap;
}
.badge.live, .badge.won, .badge.active { color: var(--success); background: rgba(34,197,94,.12); }
.badge.closed, .badge.pending { color: var(--warning); background: rgba(245,158,11,.12); }
.badge.done, .badge.cancelled { color: var(--text-3); background: var(--surface-3); }
.badge.lost, .badge.eliminated, .badge.blocked { color: var(--danger); background: rgba(239,68,68,.12); }
.badge.admin { color: var(--warning); background: rgba(245,158,11,.12); }

/* MINES BOARD */
.mines-board-wrap {
  position: relative; width: 100%; aspect-ratio: 1 / 1;
  margin: 14px 0;
}
.mines-board {
  display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
  gap: 6px; width: 100%; height: 100%;
}
.tile {
  position: relative;
  background: linear-gradient(180deg, var(--surface-3), var(--surface-2));
  border: 1px solid var(--border-2); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: transform .12s, background .2s, border-color .15s;
  user-select: none; -webkit-user-select: none;
}
.tile:not(.revealed):not(.disabled):active { transform: scale(.94); }
.tile.disabled { cursor: not-allowed; }
.tile .gem, .tile .bomb {
  width: 55%; height: 55%;
  opacity: 0; transform: scale(.5);
  transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.3);
}
.tile.revealed .gem, .tile.revealed .bomb { opacity: 1; transform: scale(1); }
.tile .gem { color: var(--gold); }
.tile .bomb { color: var(--danger); }
.tile.revealed.safe { background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.5); }
.tile.revealed.mine { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.6); }
.tile.revealed.mine.boom { animation: boom .5s ease-out; }
@keyframes boom {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); box-shadow: 0 0 20px rgba(239,68,68,.7); }
  100% { transform: scale(1); }
}
.tile .idx {
  position: absolute; top: 4px; left: 6px;
  font-size: 8px; color: var(--text-3); font-weight: 700; opacity: .5;
}

/* MULTIPLIER */
.multiplier-display {
  background: linear-gradient(135deg, rgba(245,158,11,.12), rgba(245,158,11,.03));
  border: 1px solid rgba(245,158,11,.3);
  border-radius: var(--radius); padding: 14px; text-align: center; margin-bottom: 10px;
}
.multiplier-display .lbl { font-size: 10px; color: var(--text-3); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.multiplier-display .val { font-size: 32px; font-weight: 900; letter-spacing: -1.5px; color: var(--gold); margin-top: 4px; }
.multiplier-display .potential { font-size: 12px; color: var(--text-3); font-weight: 700; margin-top: 4px; }

/* STATS */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.stat-cell { background: var(--surface-2); border-radius: 8px; padding: 10px; text-align: center; }
.stat-cell .k { font-size: 9px; color: var(--text-3); font-weight: 800; letter-spacing: .6px; text-transform: uppercase; }
.stat-cell .v { font-size: 15px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; }
.stat-cell .v.success { color: var(--success); }
.stat-cell .v.danger { color: var(--danger); }
.stat-cell .v.accent { color: var(--accent); }

/* MINES CHIPS */
.chip-row { display: grid; gap: 5px; }
.chip-row.mines { grid-template-columns: repeat(3, 1fr); }
.chip-row.stake { grid-template-columns: repeat(5, 1fr); }
.chip {
  padding: 8px 4px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); font-size: 12px; font-weight: 800;
  font-variant-numeric: tabular-nums; min-height: 36px; text-align: center;
}
.chip.active {
  background: var(--gold); border-color: var(--gold); color: #1a1a1a;
}
.stake-input {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 4px 12px; margin-top: 8px;
}
.stake-input:focus-within { border-color: var(--gold); }
.stake-input input {
  flex: 1; border: none; background: transparent; color: var(--text);
  font-size: 16px; font-weight: 800; padding: 8px 0; width: 100%; min-width: 0;
}
.stake-input .u { font-size: 11px; color: var(--text-3); font-weight: 800; letter-spacing: .5px; }

/* RESULT BANNER */
.result-banner { padding: 16px; border-radius: var(--radius); margin-bottom: 10px; text-align: center; animation: popIn .35s; }
.result-banner.win { background: linear-gradient(135deg, rgba(34,197,94,.15), rgba(34,197,94,.05)); border: 1px solid rgba(34,197,94,.4); }
.result-banner.loss { background: linear-gradient(135deg, rgba(239,68,68,.15), rgba(239,68,68,.05)); border: 1px solid rgba(239,68,68,.4); }
.result-banner .ico { font-size: 32px; margin-bottom: 6px; }
.result-banner .title { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
.result-banner .sub { font-size: 12.5px; color: var(--text-3); margin-top: 4px; font-weight: 600; }
.result-banner .amt { font-size: 22px; font-weight: 900; margin-top: 8px; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.result-banner.win .amt { color: var(--success); }
.result-banner.loss .amt { color: var(--danger); }
@keyframes popIn { 0% { opacity: 0; transform: scale(.9) } 100% { opacity: 1; transform: scale(1) } }

/* GAME ID BAR */
.gameid-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 10px; gap: 8px;
}
.gameid-bar .lbl { font-size: 10px; color: var(--text-3); font-weight: 800; letter-spacing: 1px; }
.gameid-bar .val { font-size: 12px; font-weight: 800; font-family: ui-monospace, monospace; }
.gameid-bar .copy { color: var(--gold); font-size: 11px; font-weight: 800; cursor: pointer; }

/* STICKY ACTION */
.sticky-action {
  position: sticky; bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom));
  background: var(--bg); padding: 10px 14px 4px; margin: 0 -14px; z-index: 20;
}

/* TEAM PANEL */
.teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.team-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px; transition: all .15s;
}
.team-panel.selectable { cursor: pointer; }
.team-panel.selectable:active { background: var(--surface-2); }
.team-panel.selected-a { border-color: var(--accent); background: rgba(59,130,246,.05); }
.team-panel.selected-b { border-color: var(--warning); background: rgba(245,158,11,.05); }
.team-panel.dead { opacity: .55; }
.tp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 6px; }
.tp-name { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; min-width: 0; }
.tp-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.team-panel.team-B .tp-dot { background: var(--warning); }
.tp-badge {
  font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
}
.tp-badge.alive { color: var(--success); border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.08); }
.tp-badge.dead { color: var(--danger); border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08); }
.tp-stat { display: flex; justify-content: space-between; font-size: 11.5px; padding: 3px 0; }
.tp-stat .k { color: var(--text-3); font-weight: 600; }
.tp-stat .v { font-weight: 700; }
.tp-rate {
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
  display: flex; align-items: baseline; justify-content: space-between;
}
.tp-rate .lbl { font-size: 9px; color: var(--text-3); font-weight: 800; text-transform: uppercase; }
.tp-rate .val { font-size: 18px; font-weight: 800; color: var(--accent); }
.team-panel.team-B .tp-rate .val { color: var(--warning); }

/* 404 */
.not-found {
  min-height: 60vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center;
}
.not-found .nf-code {
  font-size: 72px; font-weight: 900; letter-spacing: -3px;
  background: linear-gradient(135deg, var(--accent), var(--accent-press));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  line-height: 1;
}
.not-found .nf-title { font-size: 18px; font-weight: 800; margin-top: 12px; }
.not-found .nf-sub { font-size: 13px; color: var(--text-3); margin-top: 6px; max-width: 280px; }

/* SHEET */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn .18s;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.sheet {
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  width: 100%; max-width: 640px; max-height: 90vh;
  overflow-y: auto;
  animation: slideUp .22s cubic-bezier(.2,.9,.3,1);
  padding-bottom: calc(env(safe-area-inset-bottom) + 8px);
}
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
.sheet-handle { width: 36px; height: 4px; background: var(--border-2); border-radius: 2px; margin: 10px auto 6px; }
.sheet-head {
  padding: 6px 16px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); gap: 12px;
}
.sheet-head h3 { font-size: 16px; font-weight: 800; }
.sheet-body { padding: 16px; }
.sheet-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); flex-shrink: 0;
}
.sheet-close svg { width: 16px; height: 16px; }

/* FORM */
.form-field { margin-bottom: 12px; }
.form-field label {
  display: block; font-size: 11px; color: var(--text-3);
  font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
  margin-bottom: 6px;
}
.form-field input, .form-field select {
  width: 100%; padding: 12px 14px;
  background: var(--surface); border: 1.5px solid var(--border-2);
  color: var(--text); border-radius: var(--radius);
  font-size: 15px; min-height: 46px;
}
.form-field input:focus, .form-field select:focus { border-color: var(--accent); }

/* TOAST */
.toast {
  position: fixed; left: 50%;
  bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(120px);
  background: var(--surface-3); color: var(--text);
  border: 1px solid var(--border-2);
  padding: 12px 18px; border-radius: 10px;
  font-size: 13.5px; font-weight: 600;
  z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  max-width: calc(100% - 32px); text-align: center;
  transition: transform .25s cubic-bezier(.2,.9,.3,1.2);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.err { border-color: rgba(239,68,68,.5); }
.toast.ok { border-color: rgba(34,197,94,.5); }

/* KPI */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.kpi-card .kk { font-size: 10px; color: var(--text-3); font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
.kpi-card .kv { font-size: 22px; font-weight: 800; margin-top: 4px; letter-spacing: -.6px; }
.kpi-card .kv.accent { color: var(--accent); }
.kpi-card .kv.success { color: var(--success); }
.kpi-card .kv.warning { color: var(--warning); }

/* PROFILE */
.profile-header {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 14px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 14px;
}
.profile-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 20px; flex-shrink: 0;
}
.profile-info { flex: 1; min-width: 0; }
.profile-info .pi-name { font-size: 17px; font-weight: 800; }
.profile-info .pi-email { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.profile-info .pi-role { margin-top: 6px; }

/* SPINNER */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* EMPTY */
.empty { padding: 32px 20px; text-align: center; color: var(--text-3); font-size: 13px; }
.empty .ico { font-size: 28px; opacity: .4; margin-bottom: 8px; }

/* SEARCH */
.search-wrap { position: relative; margin-bottom: 10px; }
.search-wrap input {
  width: 100%; padding: 11px 14px 11px 40px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 14px;
  min-height: 44px;
}
.search-wrap svg {
  position: absolute; left: 13px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-3);
}

.row-flex { display: flex; align-items: center; gap: 8px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mb-12 { margin-bottom: 12px; }
.txt-3 { color: var(--text-3); }
.txt-sm { font-size: 12px; }
.txt-xs { font-size: 11px; }
.txt-center { text-align: center; }
.fw-8 { font-weight: 800; }

@media (min-width: 720px) {
  .kpi-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>

<body>

<!-- LOGIN VIEW -->

  <div id="loginForm" class="login-form">

    <div class="form-field"><label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" /></div>

    <div class="form-field"><label>Name</label>

    <div class="form-field"><label>Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" /></div>
    <div class="form-field"><label>Password (min 6)</label>
      <input type="password" id="regPass" placeholder="••••••••" autocomplete="new-password" /></div>
    <button class="btn" onclick="doRegister()" id="regBtn">Create Account</button>
    <div class="login-footer">
      Already registered? <span class="link" onclick="showLogin()">Sign In</span>
    </div>
    <div class="login-legal">DEMO POINTS • NO CASH VALUE</div>

</div>

<!-- APP VIEW -->
<div id="appView" class="hidden">

        <span class="dot"></span>

        <span class="coin"></span>
        <span id="balanceVal">0</span>
      </div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path id="themeIcon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

  </header>

  <main class="app-main" id="appMain"></main>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, addDoc, onSnapshot, query, where, orderBy, limit, getDocs,
  runTransaction, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1eo4ZH8b4D1kXV3fczZkiajNOU0cw2YE",
  authDomain: "pawan-retail-limited-934.firebaseapp.com",
  projectId: "pawan-retail-limited-934",
  storageBucket: "pawan-retail-limited-934.firebasestorage.app",
  messagingSenderId: "558728971353",
  appId: "1:558728971353:web:83b341e4e5952b45305d48",
  measurementId: "G-QYSKZ87FNM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ═══════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════ */
const state = {
  user: null, profile: null, isAdmin: false,
  settings: null,
  matches: [], currentMatchId: null,
  rounds: [], players: [], predictions: [], users: [], history: [],
  minesGames: [],
  currentPage: 'home', unsub: [],
  bet: { teamId: null, stake: 100 },
  // Mines state
  mines: {
    gameId: null, mineCount: 5, stake: 100, status: 'IDLE',
    revealedTiles: [], revealedSafe: [], minePositions: null,
    multiplier: 1, payout: 0, busy: false, view: 'game',
    historyFilter: 'ALL', history: [], historyLoading: false
  },
  // Route guard
  route404: null
};

function unsubAll() {
  state.unsub.forEach(fn => { try { fn(); } catch(e){} });
  state.unsub = [];
}

/* THEME */
const savedTheme = localStorage.getItem('prl-theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
window.toggleTheme = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('prl-theme', next);
  updateThemeIcon();
  render();
};
function updateThemeIcon() {
  const cur = document.documentElement.getAttribute('data-theme');
  const icon = document.getElementById('themeIcon');
  if (!icon) return;
  icon.setAttribute('d', cur === 'dark'
    ? 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'
    : 'M12 3v1M12 20v1M4.22 4.22l.7.7M18.36 18.36l.7.7M1 12h1M22 12h1M4.22 19.78l.7-.7M18.36 5.64l.7-.7M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z');
}

/* TOAST */
let toastTimer;
window.toast = (msg, type='ok') => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type === 'err' ? 'err' : 'ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 3200);
};

/* AUTH UI */
window.showRegister = () => {
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.remove('hidden');
};
window.showLogin = () => {
  document.getElementById('registerForm').classList.add('hidden');
  document.getElementById('loginForm').classList.remove('hidden');
};
function loginMsg(text, type='err', which='login') {
  const el = document.getElementById(which === 'login' ? 'loginMsg' : 'registerMsg');
  if (!el) return;
  if (!text) { el.innerHTML = ''; return; }
  const bg = type === 'err' ? 'rgba(239,68,68,.12)' : 'rgba(34,197,94,.12)';
  const fg = type === 'err' ? '#fca5a5' : '#86efac';
  const bd = type === 'err' ? 'rgba(239,68,68,.35)' : 'rgba(34,197,94,.35)';
  el.innerHTML = `<div style="padding:10px 12px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:12px;background:${bg};color:${fg};border:1px solid ${bd}">${text}</div>`;
}

window.doLogin = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) return loginMsg('Enter email and password');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…'; loginMsg('');
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    loginMsg((e.message||'').replace('Firebase: ','')||'Sign in failed');
    btn.disabled = false; btn.textContent = 'Sign In';
  }
};

window.doRegister = async () => {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  if (!name) return loginMsg('Enter name','err','reg');
  if (!email) return loginMsg('Enter email','err','reg');
  if (!pass || pass.length < 6) return loginMsg('Password min 6','err','reg');
  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, 'users', cred.user.uid), {
      email, name, demoPoints: 1000, blocked: false,
      role: 'customer', createdAt: serverTimestamp()
    });
    toast('Welcome! 1,000 demo points', 'ok');
  } catch (e) {
    loginMsg((e.message||'').replace('Firebase: ','')||'Registration failed','err','reg');
    btn.disabled = false; btn.textContent = 'Create Account';
  }
};

window.doLogout = async () => {
  if (!confirm('Sign out?')) return;
  unsubAll();
  await signOut(auth);
};

/* ═══════════════════════════════════════════════════
   AUTH OBSERVER
   ═══════════════════════════════════════════════════ */
onAuthStateChanged(auth, async (user) => {
  unsubAll();
  if (!user) {
    state.user = null; state.profile = null; state.isAdmin = false;
    state.matches = []; state.players = []; state.predictions = [];
    state.users = []; state.rounds = []; state.history = [];
    state.minesGames = []; state.currentMatchId = null;
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('appView').classList.add('hidden');
    return;
  }
  state.user = user;

  let isAdmin = false;
  try {
    const aSnap = await getDoc(doc(db, 'admins', user.uid));
    isAdmin = aSnap.exists();
  } catch(e) {}
  state.isAdmin = isAdmin;

  const profRef = doc(db, 'users', user.uid);
  let profSnap = await getDoc(profRef);
  if (!profSnap.exists()) {
    try {
      await setDoc(profRef, {
        email: user.email,
        name: user.displayName || (user.email||'').split('@')[0],
        demoPoints: 1000, blocked: false, role: 'customer',
        createdAt: serverTimestamp()
      });
      profSnap = await getDoc(profRef);
    } catch(e) {}
  }
  if (profSnap.exists() && profSnap.data().blocked) {
    toast('Account blocked.', 'err');
    setTimeout(() => signOut(auth), 1500);
    return;
  }

  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  updateThemeIcon();

  attachProfileListener();
  attachSettingsListener();
  attachMatchesListener();
  attachPlayersListener();
  attachPredictionsListener();
  attachRoundsListener();
  if (isAdmin) {
    attachUsersListener();
    attachHistoryListener();
  }

  state.currentPage = 'home';
  renderNav();
  render();
});

/* LISTENERS */
function attachProfileListener() {
  const un = onSnapshot(doc(db, 'users', state.user.uid), snap => {
    if (!snap.exists()) return;
    const d = snap.data();
    if (d.blocked) { toast('Account blocked', 'err'); setTimeout(() => signOut(auth), 1200); return; }
    const prev = state.profile?.demoPoints;
    state.profile = d; render();
    if (prev !== d.demoPoints) {
      const pill = document.getElementById('balancePill');
      if (pill) { pill.classList.add('bump'); setTimeout(()=>pill.classList.remove('bump'),200); }
    }
  });
  state.unsub.push(un);
}

function attachSettingsListener() {
  const ref = doc(db, 'settings', 'app');
  const un = onSnapshot(ref, async snap => {
    if (!snap.exists()) {
      if (state.isAdmin) {
        try { await setDoc(ref, { baseWinRate: 25, baseRate: 2.00, maxRounds: 8, updatedAt: serverTimestamp() }); } catch(e){}
      } else { state.settings = { baseWinRate: 25, baseRate: 2.00, maxRounds: 8 }; }
      return;
    }
    state.settings = snap.data(); render();
  });
  state.unsub.push(un);
}

function attachMatchesListener() {
  const un = onSnapshot(collection(db, 'matches'), snap => {
    state.matches = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.matchNumber||0) - (a.matchNumber||0));
    if (!state.currentMatchId || !state.matches.find(m => m.id === state.currentMatchId)) {
      const live = state.matches.find(m => m.status === 'LIVE' || m.status === 'WAITING');
      state.currentMatchId = live ? live.id : (state.matches[0]?.id || null);
    }
    render();
  });
  state.unsub.push(un);
}

function attachRoundsListener() {
  const un = onSnapshot(collection(db, 'rounds'), snap => {
    state.rounds = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (a.roundNumber||0) - (b.roundNumber||0));
    render();
  });
  state.unsub.push(un);
}

function attachPlayersListener() {
  const un = onSnapshot(collection(db, 'players'), snap => {
    state.players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  state.unsub.push(un);
}

function attachPredictionsListener() {
  let q;
  if (state.isAdmin) {
    q = query(collection(db, 'predictions'), orderBy('createdAt', 'desc'), limit(300));
  } else {
    q = query(collection(db, 'predictions'), where('userId', '==', state.user.uid));
  }
  const un = onSnapshot(q, snap => {
    let list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!state.isAdmin) list.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    state.predictions = list; render();
  });
  state.unsub.push(un);
}

function attachUsersListener() {
  const un = onSnapshot(collection(db, 'users'), snap => {
    state.users = snap.docs.map(d => ({ id: d.id, ...d.data() })); render();
  });
  state.unsub.push(un);
}

function attachHistoryListener() {
  const un = onSnapshot(collection(db, 'match_history'), snap => {
    state.history = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.finishedAt?.seconds||0) - (a.finishedAt?.seconds||0));
    render();
  });
  state.unsub.push(un);
}

/* ═══════════════════════════════════════════════════
   NAV — Customer & Admin
   ═══════════════════════════════════════════════════ */
const CUSTOMER_NAV = [
  { id: 'home',    label: 'Home',    icon: 'home' },
  { id: 'mines',   label: 'Mines',   icon: 'gem' },
  { id: 'survivor',label: 'Survivor',icon: 'target' },
  { id: 'history', label: 'History', icon: 'list' },
  { id: 'profile', label: 'Profile', icon: 'user' }
];
const ADMIN_NAV = [
  { id: 'admin_home',     label: 'Home',     icon: 'home' },
  { id: 'admin_users',    label: 'Users',    icon: 'users' },
  { id: 'admin_rounds',   label: 'Rounds',   icon: 'play' },
  { id: 'admin_mines',    label: 'Mines',    icon: 'gem' },
  { id: 'admin_settings', label: 'Settings', icon: 'cog' }
];

function navItems() { return state.isAdmin ? ADMIN_NAV : CUSTOMER_NAV; }

function svgIcon(name) {
  const icons = {
    home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/>',
    shield: '<path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6z"/>',
    play: '<polygon points="6 4 20 12 6 20 6 4"/>',

    close: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',

/* ═══════════════════════════════════════════════════
   MATH (Rate X Survivor)
   ═══════════════════════════════════════════════════ */
function currentMatch() {
  if (!state.currentMatchId) return null;
  return state.matches.find(m => m.id === state.currentMatchId) || null;
}

function teamStats(teamId, matchId = null) {
  const s = state.settings || { baseWinRate: 25, baseRate: 2 };
  const mid = matchId || state.currentMatchId;
  const all = state.players.filter(p =>
    p.teamId === teamId && (!mid || !p.matchId || p.matchId === mid));
  const alive = all.filter(p => p.status === 'ACTIVE').length;
  const dead = all.filter(p => p.status === 'ELIMINATED').length;
  const otherId = teamId === 'A' ? 'B' : 'A';
  const otherAlive = state.players.filter(p =>
    p.teamId === otherId && (!mid || !p.matchId || p.matchId === mid) && p.status === 'ACTIVE').length;
  const totalAlive = alive + otherAlive;
  const isDead = all.length > 0 && alive === 0;
  let winRate = 0;
  if (totalAlive > 0) winRate = (s.baseWinRate * alive) / totalAlive;
  let rate = s.baseRate;
  if (alive > 0 && totalAlive > 0) rate = s.baseRate * (totalAlive / (2 * alive));
  rate = Math.min(100, Math.max(1.01, rate));
  return { teamId, activeCount: alive, eliminatedCount: dead, totalPlayers: all.length, totalAlive, winRate, rate, isDead };
}

function roundStatusForMatch(m) {
  if (!m) return { code: 'NO_MATCH', msg: 'No match' };
  if (m.status === 'FINISHED') return { code: 'FINISHED', msg: `Match #${m.matchNumber} finished`, winner: m.winner };
  if (m.status === 'WAITING') return { code: 'WAITING', msg: 'Match starting soon' };
  const r = state.rounds.find(x => x.roundNumber === m.currentRound && x.matchId === m.id);
  if (!r) return { code: 'NO_ROUND', msg: 'Waiting for next round' };
  if (r.status === 'OPEN') return { code: 'OPEN', msg: `Round ${r.roundNumber} — Betting open`, round: r };
  if (r.status === 'CLOSED') return { code: 'CLOSED', msg: `Round ${r.roundNumber} — Betting closed`, round: r };
  if (r.status === 'RESULT_DECLARED') {
    if (!r.eliminationDone) return { code: 'ELIMINATING', msg: `Awaiting elimination`, round: r };
    return { code: 'COMPLETED', msg: `Team ${r.winner} won round ${r.roundNumber}`, round: r };
  }
  return { code: 'UNKNOWN', msg: 'Unknown' };
}

function fmt(n, d = 2) { return Number(n || 0).toFixed(d); }
function fmtInt(n) { return Math.floor(Number(n || 0)).toLocaleString(); }
function fmtRate(n) { return fmt(n, 2) + 'X'; }
function timeAgo(ts) {
  if (!ts) return '—';
  const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h';
  return Math.floor(diff / 86400) + 'd';
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function render() {
  if (!state.user || !state.profile) return;

    } else {
      const m = currentMatch();

      chip.className = 'status-chip';
      if (rs.code === 'OPEN') { chip.classList.add('live'); txt.textContent = `R${rs.round?.roundNumber || '?'} • Live`; }
      else if (rs.code === 'CLOSED') { chip.classList.add('closed'); txt.textContent = `R${rs.round?.roundNumber || '?'} • Closed`; }

      userId: state.user.uid,

      potentialReturn: stake * t.rate,

      createdAt: serverTimestamp()

};

/* ═══════════════════════════════════════════════════
   MINES GAME (embedded)
   ═══════════════════════════════════════════════════ */
function generateGameId() {
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  const rand = crypto.getRandomValues(new Uint8Array(4));
  const hex = Array.from(rand).map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase().slice(0,6);
  return `MINES-${yyyy}${mm}${dd}-${hex}`;
}
function secureRandomInt(max) {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] % max;
}
function pickMines(count) {
  const positions = [];
  const used = new Set();
  while (positions.length < count) {
    const v = secureRandomInt(25);
    if (!used.has(v)) { used.add(v); positions.push(v); }
  }
  return positions.sort((a,b)=>a-b);
}
function calcMultiplier(safeRevealed, mineCount) {
  const total = 25, safeTotal = total - mineCount;
  if (safeRevealed <= 0) return 1;
  let m = 1;
  for (let i = 0; i < safeRevealed; i++) m *= (total - i) / (safeTotal - i);
  return Math.max(1, m * 0.97);
}

function viewMines() {
  const mg = state.mines;
  if (mg.view === 'history') return renderMinesHistory();

  const pts = state.profile.demoPoints || 0;
  const isActive = mg.status === 'ACTIVE';

function renderMinesBoard() {
  const mg = state.mines;
  const tiles = [];
  for (let i = 0; i < 25; i++) {
    const isRevealed = mg.revealedTiles.includes(i);
    const isSafe = mg.revealedSafe.includes(i);
    const isMine = mg.minePositions && mg.minePositions.includes(i);
    const gameOver = mg.status !== 'ACTIVE' && mg.status !== 'IDLE';
    const isActive = mg.status === 'ACTIVE';

    let cls = 'tile';
    let content = '';
    if (isRevealed) {
      if (isSafe) {
        cls += ' revealed safe';
        content = `<svg class="gem" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>`;
      } else {
        cls += ' revealed mine';
        if (gameOver) cls += ' boom';
        content = `<svg class="bomb" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="14" r="7"/></svg>`;
      }
    } else if (gameOver && isMine) {
      cls += ' revealed mine';
      content = `<svg class="bomb" viewBox="0 0 24 24" fill="currentColor" opacity=".4"><circle cx="12" cy="14" r="7"/></svg>`;
    } else {
      content = `<span class="idx">${i}</span>`;
      if (!isActive) cls += ' disabled';
    }
    if (mg.busy) cls += ' disabled';
    tiles.push(`<div class="${cls}" data-idx="${i}" onclick="minesTileClick(${i})">${content}</div>`);
  }
  return tiles.join('');
}

window.minesSetMines = (m) => { if (state.mines.status === 'ACTIVE') return; state.mines.mineCount = m; render(); };
window.minesSetStake = (s) => { if (state.mines.status === 'ACTIVE') return; state.mines.stake = s; render(); };
window.minesSetView = (v) => { state.mines.view = v; if (v === 'history') loadMinesHistory(); render(); };
window.minesSetFilter = (f) => { state.mines.historyFilter = f; render(); };
window.minesNewRound = () => {
  Object.assign(state.mines, {
    gameId: null, status: 'IDLE', revealedTiles: [], revealedSafe: [],
    minePositions: null, multiplier: 1, payout: 0, busy: false, view: 'game'
  });
  render();
};

window.minesStartGame = async () => {
  const mg = state.mines;
  if (mg.busy) return;
  const pts = state.profile.demoPoints || 0;
  if (pts < mg.stake) return toast('Insufficient coins', 'err');
  mg.busy = true; render();

  try {
    const gameId = generateGameId();
    const minePositions = pickMines(mg.mineCount);
    const userRef = doc(db, 'users', state.user.uid);
    const gameRef = doc(db, 'minesGames', gameId);
    const privRef = doc(db, 'minesGamesPrivate', gameId);
    const lockRef = doc(db, 'activeGames', state.user.uid);

    const lockSnap = await getDoc(lockRef);
    if (lockSnap.exists()) {
      mg.busy = false;
      toast('You already have an active game', 'err');
      render();
      return;
    }

    await runTransaction(db, async (tx) => {
      const uSnap = await tx.get(userRef);
      if (!uSnap.exists()) throw new Error('User missing');
      const u = uSnap.data();
      if (u.blocked) throw new Error('Blocked');
      const bal = u.demoPoints || 0;
      if (bal < mg.stake) throw new Error('Insufficient');
      const newBal = bal - mg.stake;

      tx.update(userRef, { demoPoints: newBal });
      tx.set(gameRef, {
        gameId, uid: state.user.uid,
        userName: u.name || '',
        mineCount: mg.mineCount, stake: mg.stake,
        status: 'ACTIVE', revealedTiles: [], revealedSafe: [],
        result: null, payout: 0, multiplier: 1,
        createdAt: serverTimestamp(), completedAt: null
      });
      tx.set(privRef, {
        gameId, uid: state.user.uid,
        minePositions, createdAt: serverTimestamp()
      });
      tx.set(lockRef, { gameId, startedAt: serverTimestamp() });
      tx.set(doc(collection(db, 'coinTransactions')), {
        uid: state.user.uid, gameId,
        type: 'GAME_STAKE', amount: -mg.stake,
        previousBalance: bal, newBalance: newBal,
        timestamp: serverTimestamp()
      });
    });

    mg.gameId = gameId;
    mg.status = 'ACTIVE';
    mg.revealedTiles = [];
    mg.revealedSafe = [];
    mg.minePositions = minePositions;
    mg.multiplier = 1;
    mg.payout = 0;
    mg.busy = false;
    toast(`Game started · ${gameId}`, 'ok');
    render();
  } catch (e) {
    mg.busy = false;
    console.error(e);
    toast((e?.message||'Failed').replace('Firebase: ',''), 'err');
    render();
  }
};

window.minesTileClick = async (idx) => {
  const mg = state.mines;
  if (mg.status !== 'ACTIVE' || mg.busy) return;
  if (mg.revealedTiles.includes(idx)) return;
  if (!mg.gameId || !mg.minePositions) return;

  const isMine = mg.minePositions.includes(idx);
  const newRevealed = [...mg.revealedTiles, idx];
  mg.busy = true; render();

  try {
    const gameRef = doc(db, 'minesGames', mg.gameId);
    const lockRef = doc(db, 'activeGames', state.user.uid);
    const userRef = doc(db, 'users', state.user.uid);

    if (isMine) {
      await runTransaction(db, async (tx) => {
        const gSnap = await tx.get(gameRef);
        if (!gSnap.exists()) throw new Error('Game missing');
        if (gSnap.data().status !== 'ACTIVE') throw new Error('Not active');
        if (gSnap.data().revealedTiles.includes(idx)) throw new Error('Already revealed');
        tx.update(gameRef, {
          status: 'LOST', revealedTiles: newRevealed,
          result: 'MINE', payout: 0, multiplier: 0,
          completedAt: serverTimestamp()
        });
        tx.delete(lockRef);
        tx.set(doc(collection(db, 'coinTransactions')), {
          uid: state.user.uid, gameId: mg.gameId,
          type: 'GAME_LOSS', amount: 0,
          previousBalance: 0, newBalance: 0,
          timestamp: serverTimestamp()
        });
      });
      mg.status = 'LOST';
      mg.revealedTiles = newRevealed;
      mg.multiplier = 0;
      mg.busy = false;
      toast('💥 Mine hit!', 'err');
      if (navigator.vibrate) navigator.vibrate([100,50,100]);
      render();
      return;
    }

    // SAFE
    const newSafe = [...mg.revealedSafe, idx];
    const newMult = calcMultiplier(newSafe.length, mg.mineCount);
    const safeTotal = 25 - mg.mineCount;
    const autoWin = newSafe.length === safeTotal;
    const payout = autoWin ? Math.floor(mg.stake * newMult) : 0;

    await runTransaction(db, async (tx) => {
      const gSnap = await tx.get(gameRef);
      if (!gSnap.exists()) throw new Error('Missing');
      if (gSnap.data().status !== 'ACTIVE') throw new Error('Not active');
      if (gSnap.data().revealedTiles.includes(idx)) throw new Error('Already revealed');

      if (autoWin) {
        const uSnap = await tx.get(userRef);
        const bal = uSnap.data().demoPoints || 0;
        const newBal = bal + payout;
        tx.update(userRef, { demoPoints: newBal });
        tx.update(gameRef, {
          status: 'WON', revealedTiles: newRevealed,
          revealedSafe: newSafe, result: 'WIN',
          payout, multiplier: newMult,
          completedAt: serverTimestamp()
        });
        tx.delete(lockRef);
        tx.set(doc(collection(db, 'coinTransactions')), {
          uid: state.user.uid, gameId: mg.gameId,
          type: 'GAME_REWARD', amount: payout,
          previousBalance: bal, newBalance: newBal,
          timestamp: serverTimestamp()
        });
      } else {
        tx.update(gameRef, {
          revealedTiles: newRevealed,
          revealedSafe: newSafe,
          multiplier: newMult
        });
      }
    });

    mg.revealedTiles = newRevealed;
    mg.revealedSafe = newSafe;
    mg.multiplier = newMult;
    if (autoWin) {
      mg.status = 'WON'; mg.payout = payout;
      toast(`🎉 All safe! +🪙 ${fmtInt(payout)}`, 'ok');
    } else {
      if (navigator.vibrate) navigator.vibrate(20);
    }
    mg.busy = false;
    render();
  } catch (e) {
    mg.busy = false;
    console.error(e);
    toast((e?.message||'Failed').replace('Firebase: ',''), 'err');
    render();
  }
};

window.minesCashout = async () => {
  const mg = state.mines;
  if (mg.busy || mg.status !== 'ACTIVE') return;
  if (mg.revealedSafe.length === 0) return toast('Reveal at least 1 tile', 'err');
  mg.busy = true; render();

  try {
    const mult = calcMultiplier(mg.revealedSafe.length, mg.mineCount);
    const payout = Math.floor(mg.stake * mult);
    const gameRef = doc(db, 'minesGames', mg.gameId);
    const lockRef = doc(db, 'activeGames', state.user.uid);
    const userRef = doc(db, 'users', state.user.uid);

    await runTransaction(db, async (tx) => {
      const gSnap = await tx.get(gameRef);
      if (!gSnap.exists()) throw new Error('Missing');
      const g = gSnap.data();
      if (g.status !== 'ACTIVE') throw new Error('Not active');
      if ((g.revealedSafe||[]).length === 0) throw new Error('No safe tiles');
      const uSnap = await tx.get(userRef);
      const bal = uSnap.data().demoPoints || 0;
      const newBal = bal + payout;
      tx.update(userRef, { demoPoints: newBal });
      tx.update(gameRef, {
        status: 'WON', result: 'CASHOUT',
        payout, multiplier: mult,
        completedAt: serverTimestamp()
      });
      tx.delete(lockRef);
      tx.set(doc(collection(db, 'coinTransactions')), {
        uid: state.user.uid, gameId: mg.gameId,
        type: 'GAME_REWARD', amount: payout,
        previousBalance: bal, newBalance: newBal,
        timestamp: serverTimestamp()
      });
    });

    mg.status = 'WON';
    mg.payout = payout;
    mg.multiplier = mult;
    mg.busy = false;
    toast(`💰 Cashed out! +🪙 ${fmtInt(payout)}`, 'ok');
    render();
  } catch (e) {
    mg.busy = false;
    toast((e?.message||'Failed').replace('Firebase: ',''), 'err');
    render();
  }
};

window.minesAbandon = async () => {
  const mg = state.mines;
  if (mg.status !== 'ACTIVE') return;
  if (!confirm('Abandon? Stake will be lost.')) return;
  try {
    await updateDoc(doc(db, 'minesGames', mg.gameId), {
      status: 'LOST', result: 'ABANDONED',
      payout: 0, completedAt: serverTimestamp()
    });
    await deleteDoc(doc(db, 'activeGames', state.user.uid));
    mg.status = 'LOST';
    mg.payout = 0;
    toast('Abandoned', 'err');
    render();
  } catch(e) { toast('Failed', 'err'); }
};

async function loadMinesHistory() {
  const mg = state.mines;
  mg.historyLoading = true; render();
  try {
    const q = query(collection(db, 'minesGames'),
      where('uid', '==', state.user.uid),
      orderBy('createdAt', 'desc'), limit(50));
    const snap = await getDocs(q);
    mg.history = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { mg.history = []; }
  mg.historyLoading = false; render();
}

  `;

window.openRound = async (num) => {
  const m = currentMatch();
  if (!m) return;
  const A = teamStats('A', m.id), B = teamStats('B', m.id);
  if (A.activeCount===0 || B.activeCount===0) return toast('Need alive players in both teams', 'err');
  if (num > (m.maxRounds||8)) return toast('Max rounds', 'err');
  if (num > 1) {
    const prev = state.rounds.find(r => r.roundNumber===num-1 && r.matchId===m.id);
    if (!prev || prev.status !== 'RESULT_DECLARED') return toast('Settle previous round first', 'err');
    if (!prev.eliminationDone) return toast('Eliminate a player first', 'err');
  }
  try {
    await addDoc(collection(db, 'rounds'), {
      matchId: m.id, roundNumber: num, status: 'OPEN', winner: null,
      teamARate: A.rate, teamBRate: B.rate,
      teamAAlive: A.activeCount, teamBAlive: B.activeCount,
      eliminationDone: false, startTime: serverTimestamp()
    });
    await updateDoc(doc(db, 'matches', m.id), { status: 'LIVE', currentRound: num });
    toast(`Round ${num} opened`, 'ok');
  } catch(e) { toast('Failed', 'err'); }
};

window.closeRound = async () => {
  const r = currentRound();
  if (!r) return;
  try {
    await updateDoc(doc(db, 'rounds', r.id), { status: 'CLOSED', closeTime: serverTimestamp() });
    toast('Round closed', 'ok');
  } catch(e) { toast('Failed','err'); }
};

window.declareResult = (winner) => {
  const r = currentRound();
  if (!r) return;
  openSheet('Declare Result', `
    <div class="txt-sm txt-3 mb-12">Declare Team ${winner} as winner of Round ${r.roundNumber}?</div>
    <button class="btn ${winner==='A'?'btn-success':'btn-warning'}" onclick="declareResultDo('${winner}')">
      Confirm — Team ${winner} Won
    </button>
  `);
};

window.declareResultDo = async (winner) => {
  const r = currentRound();
  const m = currentMatch();
  if (!r || !m) return;
  try {
    const pending = state.predictions.filter(p => p.status==='PENDING' && p.roundNumber===r.roundNumber && p.matchId===m.id);
    for (const p of pending) {
      const isWin = p.teamId === winner;
      if (isWin) {
        const uSnap = await getDoc(doc(db, 'users', p.userId));
        if (uSnap.exists()) {
          await updateDoc(doc(db, 'users', p.userId), {
            demoPoints: (uSnap.data().demoPoints||0) + (p.potentialReturn||0)
          });
        }
      }
      await updateDoc(doc(db, 'predictions', p.id), {
        status: isWin?'WON':'LOST',
        returnAmount: isWin ? (p.potentialReturn||0) : 0,
        profitAmount: isWin ? (p.potentialProfit||0) : -p.stake,
        settledAt: serverTimestamp(),
        winnerTeam: winner
      });
    }
    await updateDoc(doc(db, 'rounds', r.id), {
      status: 'RESULT_DECLARED', winner, eliminationDone: false, resultTime: serverTimestamp()
    });
    const nA = (m.teamARoundsWon||0) + (winner==='A'?1:0);
    const nB = (m.teamBRoundsWon||0) + (winner==='B'?1:0);
    await updateDoc(doc(db, 'matches', m.id), { teamARoundsWon: nA, teamBRoundsWon: nB });
    closeSheet();
    toast(`Round ${r.roundNumber} — Team ${winner} won`, 'ok');
  } catch(e) { toast('Failed','err'); }
};

window.eliminatePlayer = async (pid, teamId) => {
  const m = currentMatch(); const r = currentRound();
  if (!m || !r) return;
  const player = state.players.find(p => p.id === pid);
  if (!player || player.status !== 'ACTIVE') return toast('Not available', 'err');
  if (!confirm(`Eliminate ${player.name}?`)) return;
  try {
    await updateDoc(doc(db, 'players', pid), {
      status: 'ELIMINATED', eliminatedInRound: r.roundNumber, updatedAt: serverTimestamp()
    });
    await updateDoc(doc(db, 'rounds', r.id), {
      eliminationDone: true,
      eliminatedPlayerId: pid,
      eliminatedPlayerName: player.name,
      eliminatedPlayerTeam: teamId,
      eliminationTime: serverTimestamp()
    });
    const nA = teamStats('A', m.id), nB = teamStats('B', m.id);
    if (nA.isDead && !nB.isDead) { await endMatchAuto('B'); return; }
    if (nB.isDead && !nA.isDead) { await endMatchAuto('A'); return; }
    if (nA.isDead && nB.isDead) { await endMatchAuto('DRAW'); return; }
    toast(`${player.name} eliminated. A=${fmtRate(nA.rate)} B=${fmtRate(nB.rate)}`, 'ok');
  } catch(e) { toast('Failed','err'); }
};

window.endMatchByRounds = async () => {
  const m = currentMatch();
  if (!m) return;
  const aW = m.teamARoundsWon||0, bW = m.teamBRoundsWon||0;
  let w = 'DRAW';
  if (aW > bW) w = 'A'; else if (bW > aW) w = 'B';
  if (!confirm(`End match? Winner: ${w==='DRAW'?'Draw':'Team '+w}`)) return;
  await endMatchAuto(w);
};

window.endMatchAuto = async (winner) => {
  const m = currentMatch();
  if (!m) return;
  try {
    await addDoc(collection(db, 'match_history'), {
      matchNumber: m.matchNumber, winner,
      teamARoundsWon: m.teamARoundsWon||0, teamBRoundsWon: m.teamBRoundsWon||0,
      maxRounds: m.maxRounds, totalRounds: m.currentRound,
      finishedAt: serverTimestamp(),
      players: state.players.map(p => ({ name: p.name, teamId: p.teamId, status: p.status })),
      rounds: state.rounds.filter(r => r.matchId===m.id).map(r => ({ roundNumber: r.roundNumber, winner: r.winner }))
    });
    const pending = state.predictions.filter(p => p.status==='PENDING' && p.matchId===m.id);
    for (const p of pending) {
      const isWin = winner !== 'DRAW' && p.teamId === winner;
      if (isWin) {
        const uSnap = await getDoc(doc(db, 'users', p.userId));
        if (uSnap.exists()) {
          await updateDoc(doc(db, 'users', p.userId), {
            demoPoints: (uSnap.data().demoPoints||0) + (p.potentialReturn||0)
          });
        }
      }
      await updateDoc(doc(db, 'predictions', p.id), {
        status: isWin?'WON':'LOST',
        returnAmount: isWin ? (p.potentialReturn||0) : 0,
        profitAmount: isWin ? (p.potentialProfit||0) : -p.stake,
        settledAt: serverTimestamp(), winnerTeam: winner
      });
    }
    await updateDoc(doc(db, 'matches', m.id), {
      status: 'FINISHED', winner, finishedAt: serverTimestamp()
    });
    toast(`🏆 Match finished — ${winner==='DRAW'?'Draw':'Team '+winner}`, 'ok');
  } catch(e) { toast('Failed','err'); }
};

window.createNewMatch = async () => {

let adminMinesSearch = '';
async function viewAdminMines() {
  if (!state.minesGames || state.minesGames.length === 0) {

      const snap = await getDocs(query(collection(db, 'minesGames'), orderBy('createdAt','desc'), limit(100)));

    } catch(e) { state.minesGames = []; }
  }
  const games = state.minesGames;
  const total = games.length;
  const active = games.filter(g => g.status === 'ACTIVE').length;
  const won = games.filter(g => g.status === 'WON').length;
  const lost = games.filter(g => g.status === 'LOST').length;

  return `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kk">Total Games</div><div class="kv">${total}</div></div>

      <div class="kpi-card"><div class="kk">Lost</div><div class="kv">${lost}</div></div>
    </div>

    <div class="search-wrap">
      ${svgIcon('search')}
      <input type="text" placeholder="Search Game ID (MINES-...)" value="${escapeHtml(adminMinesSearch)}"
        oninput="adminMinesSearch = this.value.toUpperCase(); render();" />
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title-lg">Mines Games</div>
        <button class="btn btn-sm btn-secondary" onclick="adminRefreshMines()">↻ Refresh</button>
      </div>
      <div class="list" style="margin:0 -14px -14px;border:none;background:transparent">
        ${games.filter(g => !adminMinesSearch || g.gameId.includes(adminMinesSearch) || (g.uid||'').includes(adminMinesSearch)).slice(0, 50).map(g => `
          <div class="list-row" style="cursor:pointer" onclick="adminOpenMines('${g.gameId}')">
            <div class="avatar ${g.status==='WON'?'won':g.status==='LOST'?'lost':'team-a'}">
              ${g.status==='WON'?'✓':g.status==='LOST'?'✗':'💎'}
            </div>
            <div class="lr-body">
              <div class="lr-title" style="font-family:ui-monospace,monospace;font-size:11px">
                ${escapeHtml(g.gameId)}
              </div>
              <div class="lr-sub">${escapeHtml(g.userName||g.uid?.slice(0,8))} • 💣${g.mineCount} • 🪙${g.stake} • ${(g.revealedSafe||[]).length} safe</div>
            </div>
            <div class="lr-right">
              <span class="badge ${g.status==='WON'?'won':g.status==='LOST'?'lost':'active'}">${g.status}</span>
              <div class="lr-meta">${timeAgo(g.createdAt)}</div>
            </div>
          </div>
        `).join('') || '<div class="empty">No games</div>'}
      </div>
    </div>
  `;
}

window.adminRefreshMines = async () => {
  state.minesGames = [];
  await viewAdminMines();
  render();
};

window.adminOpenMines = async (gameId) => {
  try {
    const gSnap = await getDoc(doc(db, 'minesGames', gameId));
    const pSnap = await getDoc(doc(db, 'minesGamesPrivate', gameId));
    if (!gSnap.exists()) return toast('Game not found', 'err');
    const g = gSnap.data();
    const mines = pSnap.exists() ? (pSnap.data().minePositions || []) : [];
    openSheet(`Game ${g.gameId}`, `
      <div style="font-family:ui-monospace,monospace;font-size:12px;font-weight:800;margin-bottom:10px;padding:10px;background:var(--surface-2);border-radius:8px">${g.gameId}</div>
      <div class="list">
        <div class="list-row"><div class="lr-body"><div class="lr-title">User</div></div><div class="lr-right"><div class="lr-amount">${escapeHtml(g.userName||'—')}</div></div></div>
        <div class="list-row"><div class="lr-body"><div class="lr-title">UID</div></div><div class="lr-right"><div class="lr-amount" style="font-size:10px">${g.uid}</div></div></div>
        <div class="list-row"><div class="lr-body"><div class="lr-title">Status</div></div><div class="lr-right"><span class="badge ${g.status==='WON'?'won':g.status==='LOST'?'lost':'active'}">${g.status}</span></div></div>
        <div class="list-row"><div class="lr-body"><div class="lr-title">Mines</div></div><div class="lr-right"><div class="lr-amount">${g.mineCount}</div></div></div>
        <div class="list-row"><div class="lr-body"><div class="lr-title">Stake</div></div><div class="lr-right"><div class="lr-amount">🪙 ${g.stake}</div></div></div>
        <div class="list-row"><div class="lr-body"><div class="lr-title">Payout</div></div><div class="lr-right"><div class="lr-amount up">🪙 ${g.payout||0}</div></div></div>
        <div class="list-row"><div class="lr-body"><div class="lr-title">Multiplier</div></div><div class="lr-right"><div class="lr-amount">${(g.multiplier||0).toFixed(2)}X</div></div></div>
        <div class="list-row"><div class="lr-body"><div class="lr-title">Safe Tiles</div></div><div class="lr-right"><div class="lr-amount" style="font-size:11px">${(g.revealedSafe||[]).join(', ')||'—'}</div></div></div>
        <div class="list-row"><div class="lr-body"><div class="lr-title">🎯 Mine Positions</div></div><div class="lr-right"><div class="lr-amount" style="font-size:11px;color:var(--danger)">${mines.join(', ')||'—'}</div></div></div>
        <div class="list-row"><div class="lr-body"><div class="lr-title">Created</div></div><div class="lr-right"><div class="lr-meta">${timeAgo(g.createdAt)}</div></div></div>
      </div>
    `);
  } catch(e) { toast('Failed','err'); }
};

/* SETTINGS */
function viewAdminSettings() {
  const s = state.settings || { baseWinRate: 25, baseRate: 2, maxRounds: 8 };
  return `
    <div class="card">
      <div class="card-head"><div class="card-title-lg">⚙️ Survivor Settings</div></div>
      <div class="form-field"><label>Base Win Rate (%)</label>
        <input id="setWin" type="number" min="0" max="100" value="${s.baseWinRate}" /></div>
      <div class="form-field"><label>Base Rate (X) — max 100</label>
        <input id="setRate" type="number" min="1.01" max="100" step="0.01" value="${s.baseRate}" /></div>
      <div class="form-field"><label>Max Rounds (6-8)</label>
        <input id="setMaxR" type="number" min="6" max="8" value="${s.maxRounds||8}" /></div>
      <button class="btn" onclick="saveSettings()">Save Settings</button>
    </div>

    <div class="card">
      <div class="card-head"><div class="card-title-lg">💎 Mines Settings</div></div>
      <div class="txt-sm txt-3">Mines game uses same balance. Config in-game by player.</div>
    </div>

    <div class="card">
      <div class="card-head"><div class="card-title-lg">About</div></div>
      <div class="txt-sm txt-3">PRL Pawan Retail Limited<br/>Demo Points • No Cash Value</div>
    </div>
  `;
}

window.saveSettings = async () => {
  const w = Math.max(0, Math.min(100, Number(document.getElementById('setWin').value)||0));
  const r = Math.max(1.01, Math.min(100, Number(document.getElementById('setRate').value)||2));
  const m = Math.max(6, Math.min(8, Number(document.getElementById('setMaxR').value)||8));
  try {
    await setDoc(doc(db, 'settings', 'app'), {
      baseWinRate: w, baseRate: r, maxRounds: m, updatedAt: serverTimestamp()
    }, { merge: true });
    toast('Saved', 'ok');
  } catch(e) { toast('Failed','err'); }
};

/* 404 */
function view404() {
  return `
    <div class="not-found">
      <div class="nf-code">404</div>
      <div class="nf-title">Page Not Found</div>
      <div class="nf-sub">The route <b>${escapeHtml(state.route404||'')}</b> doesn't exist in this app.</div>
      <button class="btn" style="max-width:220px;margin-top:20px" onclick="nav('home')">Go Home</button>
    </div>
  `;
}

/* SHEET */
window.openSheet = (title, body) => {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h3>${title}</h3>
          <button class="sheet-close" onclick="closeSheet()">${svgIcon('close')}</button>
        </div>
        <div class="sheet-body">${body}</div>
      </div>
    </div>
  `;
};
window.closeSheet = () => { document.getElementById('modalRoot').innerHTML = ''; };

/* currentRound */
function currentRound() {
  const m = currentMatch();
  if (!m || !m.currentRound) return null;
  return state.rounds.find(r => r.roundNumber === m.currentRound && r.matchId === m.id) || null;
}

setTimeout(updateThemeIcon, 100);
</script>
