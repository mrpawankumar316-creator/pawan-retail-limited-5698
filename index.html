<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pawan Retail Limited 🍔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #8b5cf6;
    --brand-light: #c4b5fd;
    --brand-dark: #5b21b6;
    --bg: #f8fafc;
    --card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --success: #10b981;
    --success-bg: #ecfdf5;
    --radius-sm: 12px;
    --radius-md: 20px;
    --radius-lg: 32px;
    --radius-pill: 999px;
    --shadow-sm: 0 2px 8px rgba(15,23,42,0.04);
    --shadow-lg: 0 12px 32px rgba(139,92,246,0.15);
    --shadow-glow: 0 0 20px rgba(139,92,246,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 90px;
    overflow-x: hidden;
  }
  
  /* Animations */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .animate-up { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .animate-pop { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

  /* Layout */
  .header {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 16px 20px;
    position: sticky; top: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; color: var(--brand-dark); display: flex; align-items: center; gap: 8px; }
  .logo span { background: var(--brand); color: #fff; padding: 2px 10px; border-radius: var(--radius-pill); font-size: 12px; letter-spacing: 0; }
  
  .main { padding: 24px 20px; max-width: 800px; margin: 0 auto; }
  .title { font-size: 28px; font-weight: 800; margin-bottom: 16px; letter-spacing: -0.5px; }
  
  /* Gen-Z Cards (Bento Style) */
  .card {
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid rgba(0,0,0,0.02);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

  /* Form Elements */
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .input-field {
    width: 100%; padding: 16px 20px; border-radius: var(--radius-sm);
    border: 2px solid #e2e8f0; font-family: inherit; font-size: 16px; font-weight: 500;
    background: #f8fafc; transition: all 0.2s; outline: none;
  }
  .input-field:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 4px var(--brand-light); }

  /* Buttons */
  .btn {
    display: inline-flex; justify-content: center; align-items: center;
    padding: 16px 24px; border-radius: var(--radius-pill);
    font-weight: 700; font-size: 16px; cursor: pointer; border: none;
    transition: all 0.2s; gap: 8px;
  }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(139,92,246,0.3); }
  .btn-primary:hover { background: var(--brand-dark); transform: scale(1.02); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary { background: var(--brand-light); color: var(--brand-dark); }
  .btn-secondary:hover { background: #a78bfa; }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 10px 16px; font-size: 14px; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

  /* Restaurant Grid */
  .bento-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media(min-width: 600px) { .bento-grid { grid-template-columns: 1fr 1fr; } }
  
  .rest-card {
    background: #fff; border-radius: var(--radius-md); overflow: hidden;
    box-shadow: var(--shadow-sm); cursor: pointer; position: relative;
  }
  .rest-img-box { height: 160px; background: var(--brand-light); position: relative; overflow: hidden; }
  .rest-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
  .rest-card:hover .rest-img { transform: scale(1.05); }
  .rest-info { padding: 16px; }
  .rest-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .rest-desc { font-size: 14px; color: var(--text-muted); }

  /* Food Items */
  .food-item {
    display: flex; gap: 16px; padding: 16px; background: #fff;
    border-radius: var(--radius-md); margin-bottom: 12px; box-shadow: var(--shadow-sm);
  }
  .food-img-box { width: 90px; height: 90px; border-radius: var(--radius-sm); background: var(--brand-light); overflow: hidden; flex-shrink: 0; }
  .food-img { width: 100%; height: 100%; object-fit: cover; }
  .food-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .food-name { font-size: 16px; font-weight: 800; }
  .food-price { font-size: 16px; font-weight: 800; color: var(--brand-dark); }

  /* Qty Pill */
  .qty-pill {
    display: inline-flex; align-items: center; background: var(--brand-light);
    border-radius: var(--radius-pill); overflow: hidden;
  }
  .qty-btn { width: 36px; height: 36px; font-size: 20px; color: var(--brand-dark); font-weight: 800; display: flex; justify-content: center; align-items: center; cursor: pointer; }
  .qty-num { width: 28px; text-align: center; font-weight: 800; color: var(--brand-dark); }

  /* Bottom Nav */
  .bottom-nav {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
    padding: 10px 20px; border-radius: var(--radius-pill);
    display: flex; gap: 24px; z-index: 100; box-shadow: var(--shadow-lg);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: #94a3b8; font-size: 11px; font-weight: 700; cursor: pointer; transition: color 0.2s;
  }
  .nav-item.active { color: var(--brand-light); }
  .nav-icon { font-size: 22px; }
  .nav-badge {
    position: absolute; top: -6px; right: -10px; background: var(--danger); color: #fff;
    font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #0f172a;
  }
  .nav-item-wrap { position: relative; }

  /* Modals */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: flex-end; z-index: 200; }
  @media(min-width: 600px) { .modal-bg { align-items: center; } }
  .modal-sheet {
    background: #fff; width: 100%; max-width: 500px; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 24px; max-height: 90vh; overflow-y: auto; animation: fadeUp 0.3s ease;
  }
  @media(min-width: 600px) { .modal-sheet { border-radius: var(--radius-lg); } }

  /* Toast */
  #toast-root { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 300; width: 90%; max-width: 400px; }
  .toast { background: #0f172a; color: #fff; padding: 14px 20px; border-radius: var(--radius-pill); font-weight: 600; margin-bottom: 8px; text-align: center; box-shadow: var(--shadow-lg); animation: popIn 0.3s; }
  .toast.err { background: var(--danger); }
  .toast.succ { background: var(--success); }

  /* Penalty Box */
  .penalty-box { background: var(--danger-bg); border: 2px dashed var(--danger); padding: 16px; border-radius: var(--radius-sm); margin-bottom: 16px; color: var(--danger); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

  /* Utilities */
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .mb-2 { margin-bottom: 8px; } .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }
  .text-muted { color: var(--text-muted); font-size: 14px; }
  .hidden { display: none !important; }
  .divider { height: 1px; background: #e2e8f0; margin: 16px 0; }
</style>
</head>
<body>

<div id="app"></div>
<div id="nav-root"></div>
<div id="toast-root"></div>
<div id="modal-root"></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
  signOut, sendPasswordResetEmail, onAuthStateChanged, updateProfile 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, 
  query, where, onSnapshot, getDocs, serverTimestamp, deleteDoc, runTransaction, orderBy 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZy_JeQH7Ofvqru2DME1EsH59Yh5JtRjs",
  authDomain: "pawan-retail-limited07.firebaseapp.com",
  projectId: "pawan-retail-limited07",
  storageBucket: "pawan-retail-limited07.firebasestorage.app",
  messagingSenderId: "595261097611",
  appId: "1:595261097611:web:88a136d144129b142b368e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const state = {
  user: null, profile: null, view: 'home', cart: {}, addresses: [],
  restId: null, addressId: null, unsubs: {}, adminTab: 'orders'
};

// --- HELPERS ---
const $ = id => document.getElementById(id);
const money = p => '₹' + (Number(p||0)/100).toFixed(0);
const esc = s => String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate = ts => ts ? (ts.toDate ? ts.toDate() : new Date(ts)).toLocaleString('en-IN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
const saveCart = () => localStorage.setItem('genz_cart', JSON.stringify(state.cart));
const cartCount = () => Object.values(state.cart).reduce((s,i) => s+i.qty, 0);
const cartSub = () => Object.values(state.cart).reduce((s,i) => s+(i.price*i.qty), 0);
const penalty = () => state.profile?.penaltyBalance || 0;
const cartTotal = () => cartSub() + penalty();

function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='error'?'err':type==='success'?'succ':'');
  el.textContent = msg;
  $('toast-root').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function modal(html) {
  $('modal-root').innerHTML = `<div class="modal-bg" id="mb"><div class="modal-sheet">${html}</div></div>`;
  $('mb').onclick = e => { if(e.target.id==='mb') closeModal(); };
}
function closeModal() { $('modal-root').innerHTML = ''; }

function navigate(v, id=null) {
  state.view = v;
  if(id) state.restId = id;
  render();
  window.scrollTo(0,0);
}

// --- AUTH ---
function renderAuth() {
  $('app').innerHTML = `
    <div style="min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:24px; background:linear-gradient(135deg, #f8fafc, #ede9fe);">
      <div style="text-align:center; margin-bottom:32px;">
        <div style="font-size:64px; animation:float 3s infinite;">🍔</div>
        <h1 style="font-size:32px; font-weight:900; letter-spacing:-1px; margin-top:16px;">Pawan Retail</h1>
        <p class="text-muted">Hot food. Fast delivery.</p>
      </div>
      
      <div class="card animate-up">
        <div class="flex-between mb-6" style="background:#f1f5f9; padding:6px; border-radius:var(--radius-pill);">
          <button class="btn btn-sm btn-primary" style="flex:1; border-radius:var(--radius-pill);" onclick="switchAuth('login')" id="tab-login">Login</button>
          <button class="btn btn-sm" style="flex:1; border-radius:var(--radius-pill);" onclick="switchAuth('reg')" id="tab-reg">Sign Up</button>
        </div>
        <div id="auth-form"></div>
      </div>
    </div>
  `;
  switchAuth('login');
}

window.switchAuth = (type) => {
  const isLogin = type === 'login';
  $('tab-login').className = isLogin ? 'btn btn-sm btn-primary' : 'btn btn-sm';
  $('tab-login').style = 'flex:1; border-radius:var(--radius-pill);';
  $('tab-reg').className = !isLogin ? 'btn btn-sm btn-primary' : 'btn btn-sm';
  $('tab-reg').style = 'flex:1; border-radius:var(--radius-pill);';
  
  $('auth-form').innerHTML = `
    ${!isLogin ? `<div class="input-group"><label>Full Name</label><input type="text" id="auth-name" class="input-field" placeholder="John Doe"></div>` : ''}
    <div class="input-group"><label>Email</label><input type="email" id="auth-email" class="input-field" placeholder="you@example.com"></div>
    ${!isLogin ? `<div class="input-group"><label>Phone</label><input type="tel" id="auth-phone" class="input-field" placeholder="+91 90000 00000"></div>` : ''}
    <div class="input-group"><label>Password</label><input type="password" id="auth-pass" class="input-field" placeholder="••••••••"></div>
    <button class="btn btn-primary btn-block" onclick="handleAuth(${isLogin})">${isLogin ? 'Login' : 'Create Account'}</button>
    ${isLogin ? `<div style="text-align:center; margin-top:16px;"><a href="#" onclick="resetPass(event)" style="color:var(--brand); font-weight:700; font-size:14px;">Forgot Password?</a></div>` : ''}
  `;
};

window.handleAuth = async (isLogin) => {
  const email = $('auth-email').value.trim();
  const pass = $('auth-pass').value;
  if(!email || !pass) return toast('Fill all fields', 'error');
  
  const btn = event.target; btn.disabled = true; btn.textContent = 'Please wait...';
  try {
    if(isLogin) {
      await signInWithEmailAndPassword(auth, email, pass);
    } else {
      const name = $('auth-name').value.trim();
      const phone = $('auth-phone').value.trim();
      if(!name || !phone) throw new Error('Name and phone required');
      
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, 'users', cred.user.uid), {
        uid: cred.user.uid, name, email, phone, role: 'customer', penaltyBalance: 0, createdAt: serverTimestamp()
      });
    }
  } catch(e) {
    toast(e.message.replace('Firebase: ', ''), 'error');
    btn.disabled = false; btn.textContent = isLogin ? 'Login' : 'Create Account';
  }
};

window.resetPass = async (e) => {
  e.preventDefault();
  const email = $('auth-email').value.trim();
  if(!email) return toast('Enter email first', 'error');
  try {
    await sendPasswordResetEmail(auth, email);
    toast('Reset link sent!', 'success');
  } catch(e) { toast(e.message, 'error'); }
};

window.logout = async () => { await signOut(auth); toast('Logged out'); };

// --- NAV ---
function renderNav() {
  if(!state.user) { $('nav-root').innerHTML = ''; return; }
  const cart = cartCount();
  const pen = penalty();
  const isAdmin = state.profile?.role === 'admin';
  
  const items = [
    { id:'home', icon:'🏠', label:'Home' },
    { id:'orders', icon:'📦', label:'Orders' },
    { id:'cart', icon:'🛒', label:'Cart', badge:cart },
    { id:'profile', icon:'👤', label:'Profile', badge: pen > 0 ? '!' : null }
  ];
  if(isAdmin) items.push({ id:'admin', icon:'⚙️', label:'Admin' });

  $('nav-root').innerHTML = `
    <div class="bottom-nav">
      ${items.map(i => `
        <div class="nav-item-wrap" onclick="navigate('${i.id}')">
          <div class="nav-item ${state.view === i.id ? 'active' : ''}">
            <div class="nav-icon">${i.icon}</div>
            <div>${i.label}</div>
            ${i.badge ? `<div class="nav-badge" ${i.badge==='!'?'style="background:var(--danger)"':''}>${i.badge}</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// --- RENDER CORE ---
function render() {
  if(!state.user) { renderAuth(); return; }
  renderNav();
  
  $('app').innerHTML = `
    <div class="header">
      <div class="logo" onclick="navigate('home')">Pawan Retail <span>Beta</span></div>
      ${penalty() > 0 ? `<div style="color:var(--danger); font-weight:800; font-size:14px;" onclick="navigate('profile')">⚠️ ${money(penalty())}</div>` : ''}
    </div>
    <div class="main" id="main-view"></div>
  `;
  
  if(state.view === 'home') renderHome();
  else if(state.view === 'restaurant') renderRestaurant();
  else if(state.view === 'cart') renderCart();
  else if(state.view === 'checkout') renderCheckout();
  else if(state.view === 'orders') renderOrders();
  else if(state.view === 'profile') renderProfile();
  else if(state.view === 'admin') renderAdmin();
}

// --- VIEWS ---
async function renderHome() {
  $('main-view').innerHTML = `
    <h1 class="title animate-up">What's the vibe today? 😋</h1>
    <div class="input-group animate-up">
      <input type="text" class="input-field" placeholder="Search restaurants, cuisines..." oninput="filterRests(this.value)">
    </div>
    <div id="rest-grid" class="bento-grid"></div>
  `;

  const snap = await getDocs(query(collection(db, 'restaurants'), where('active', '==', true)));
  const rests = [];
  snap.forEach(d => rests.push({ id: d.id, ...d.data() }));
  
  window.filterRests = (q) => {
    const f = q ? rests.filter(r => r.name.toLowerCase().includes(q.toLowerCase()) || (r.category||'').toLowerCase().includes(q.toLowerCase())) : rests;
    $('rest-grid').innerHTML = f.map((r, i) => `
      <div class="rest-card animate-up" style="animation-delay:${i*0.05}s" onclick="navigate('restaurant', '${r.id}')">
        <div class="rest-img-box">
          ${r.imageUrl ? `<img src="${esc(r.imageUrl)}" class="rest-img" onerror="this.style.display='none'">` : `<div style="display:flex;justify-content:center;align-items:center;height:100%;font-size:48px;">🍽️</div>`}
        </div>
        <div class="rest-info">
          <div class="rest-name">${esc(r.name)}</div>
          <div class="rest-desc">${esc(r.description || r.category || 'Delicious food')}</div>
        </div>
      </div>
    `).join('') || `<p class="text-muted">No restaurants found.</p>`;
  };
  filterRests('');
}

let menuUnsub = null;
async function renderRestaurant() {
  if(menuUnsub) menuUnsub();
  $('main-view').innerHTML = `
    <button class="btn btn-sm btn-secondary mb-4" onclick="navigate('home')">← Back</button>
    <div id="rest-header" class="animate-up"></div>
    <div id="menu-list" class="animate-up" style="animation-delay:0.1s"></div>
  `;

  const rDoc = await getDoc(doc(db, 'restaurants', state.restId));
  if(!rDoc.exists()) return navigate('home');
  const r = rDoc.data();
  
  $('rest-header').innerHTML = `
    <div class="card mb-6" style="padding:0; overflow:hidden;">
      ${r.imageUrl ? `<img src="${esc(r.imageUrl)}" style="width:100%;height:180px;object-fit:cover;">` : ''}
      <div style="padding:20px;">
        <h2 style="font-size:24px; font-weight:900; margin-bottom:4px;">${esc(r.name)}</h2>
        <p class="text-muted">${esc(r.description||'')}</p>
      </div>
    </div>
    <h3 class="mb-2">Menu 🔥</h3>
  `;

  menuUnsub = onSnapshot(collection(db, 'restaurants', state.restId, 'menu'), snap => {
    const items = [];
    snap.forEach(d => items.push({ id: d.id, ...d.data() }));
    
    $('menu-list').innerHTML = items.map((item, i) => {
      const q = state.cart[item.id]?.qty || 0;
      const avail = item.available !== false;
      return `
        <div class="food-item animate-up" style="animation-delay:${i*0.05}s; ${!avail?'opacity:0.5;':''}">
          <div class="food-img-box">
            ${item.imageUrl ? `<img src="${esc(item.imageUrl)}" class="food-img" onerror="this.style.display='none'">` : `<div style="display:flex;justify-content:center;align-items:center;height:100%;font-size:28px;">🍲</div>`}
          </div>
          <div class="food-details">
            <div>
              <div class="food-name">${esc(item.name)}</div>
              <div class="text-muted" style="font-size:13px; margin-top:2px;">${esc(item.description||'')}</div>
            </div>
            <div class="flex-between" style="margin-top:8px;">
              <div class="food-price">${money(item.price)}</div>
              ${!avail ? `<span style="color:var(--danger); font-size:12px; font-weight:800;">Sold Out</span>` : 
                q > 0 ? `
                  <div class="qty-pill">
                    <div class="qty-btn" onclick="updateQty('${item.id}', -1)">−</div>
                    <div class="qty-num">${q}</div>
                    <div class="qty-btn" onclick="updateQty('${item.id}', 1)">+</div>
                  </div>
                ` : `
                  <button class="btn btn-sm btn-secondary" onclick="updateQty('${item.id}', 1)">Add</button>
                `
              }
            </div>
          </div>
        </div>
      `;
    }).join('') || `<p class="text-muted">Menu is empty.</p>`;
  });
}

window.updateQty = async (itemId, delta) => {
  const current = state.cart[itemId];
  
  if(!current && delta > 0) {
    if(Object.keys(state.cart).length > 0 && state.cart[Object.keys(state.cart)[0]].restId !== state.restId) {
      if(!confirm('Start new cart? Items from previous restaurant will be removed.')) return;
      state.cart = {};
    }
    const snap = await getDoc(doc(db, 'restaurants', state.restId, 'menu', itemId));
    if(!snap.exists()) return;
    const d = snap.data();
    state.cart[itemId] = { itemId, restId: state.restId, name: d.name, price: d.price, qty: 1 };
  } else if (current) {
    current.qty += delta;
    if(current.qty <= 0) delete state.cart[itemId];
  }
  saveCart(); renderNav(); render();
};

window.placeOrder = async () => {
  const addr = state.addresses.find(a => a.id === state.addressId);
  if(!addr) return toast('Select address', 'error');
  
  const btn = $('btn-place'); btn.disabled = true; btn.textContent = 'Placing...';
  
  try {
    const items = Object.values(state.cart);
    const restId = items[0].restId;
    const restSnap = await getDoc(doc(db, 'restaurants', restId));
    if(!restSnap.data().active) throw new Error('Restaurant is closed');

    const orderId = doc(collection(db, 'foodOrders')).id;
    const orderItems = items.map(i => ({ itemId: i.itemId, name: i.name, price: i.price, qty: i.qty, lineTotal: i.price * i.qty }));
    const sub = cartSub();
    
    await runTransaction(db, async tx => {
      const uRef = doc(db, 'users', state.user.uid);
      const uDoc = await tx.get(uRef);
      const pen = uDoc.data().penaltyBalance || 0;
      const total = sub + pen;

      tx.set(doc(db, 'foodOrders', orderId), {
        orderId, customerUid: state.user.uid, customerName: uDoc.data().name,
        restaurantId: restId, restaurantName: restSnap.data().name,
        items: orderItems, subtotal: sub, penaltyApplied: pen, total: total,
        status: 'Placed', deliveryAddress: addr, createdAt: serverTimestamp(), penaltyStatus: pen > 0 ? 'cleared' : 'none'
      });

      if(pen > 0) {
        tx.update(uRef, { penaltyBalance: 0 });
        tx.set(doc(collection(db, 'penaltyHistory')), {
          customerUid: state.user.uid, orderId, type: 'cleared', amount: -pen, balanceBefore: pen, balanceAfter: 0, reason: 'Auto-cleared with order', createdAt: serverTimestamp()
        });
      }
    });

    state.cart = {}; saveCart();
    toast('Order placed! 🎉', 'success');
    navigate('orders');
  } catch(e) {
    toast(e.message, 'error');
    btn.disabled = false; btn.textContent = 'Place Order';
  }
};

window.doCancel = async (id) => {
  const reason = $('c-reason').value.trim() || 'No reason';
  const btn = $('btn-cancel-conf'); btn.disabled = true; btn.textContent = 'Wait...';
  
  try {
    await runTransaction(db, async tx => {
      const oRef = doc(db, 'foodOrders', id);
      const oDoc = await tx.get(oRef);
      if(!['Placed','Accepted'].includes(oDoc.data().status)) throw new Error('Cannot cancel now');
      
      const uRef = doc(db, 'users', state.user.uid);
      const uDoc = await tx.get(uRef);
      const bal = uDoc.data().penaltyBalance || 0;
      const pen = oDoc.data().total;
      
      tx.update(oRef, { status: 'Cancelled', cancelledBy: 'customer', cancellationReason: reason, cancelledAt: serverTimestamp(), penaltyAmount: pen });
      tx.update(uRef, { penaltyBalance: bal + pen });
      tx.set(doc(collection(db, 'penaltyHistory')), {
        customerUid: state.user.uid, orderId: id, type: 'penalty', amount: pen, balanceBefore: bal, balanceAfter: bal + pen, reason, createdBy: 'customer', createdAt: serverTimestamp()
      });
    });
    
    closeModal();
    toast('Cancelled. Penalty applied.', 'success');
    
    setTimeout(() => modal(`
      <div style="text-align:center; padding:20px;">
        <div style="font-size:60px; margin-bottom:16px;">😢</div>
        <h2 style="font-size:24px; font-weight:900; margin-bottom:8px;">Penalty Added</h2>
        <p class="text-muted mb-6">A penalty has been added to your account. It will auto-adjust on your next order.</p>
        <button class="btn btn-primary btn-block" onclick="closeModal()">OK</button>
      </div>
    `), 300);
  } catch(e) {
    toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Confirm';
  }
};

window.savePen = async (uid) => {
  const amt = Number($('p-amt').value) * 100;
  const type = $('p-type').value;
  const reason = $('p-reason').value.trim() || 'Admin adjustment';
  if(!amt || amt <= 0) return toast('Enter valid amount', 'error');
  
  try {
    await runTransaction(db, async tx => {
      const uRef = doc(db, 'users', uid);
      const uDoc = await tx.get(uRef);
      const bal = uDoc.data().penaltyBalance || 0;
      const newBal = type === 'add' ? bal + amt : Math.max(0, bal - amt);
      
      tx.update(uRef, { penaltyBalance: newBal });
      tx.set(doc(collection(db, 'penaltyHistory')), {
        customerUid: uid, type: type==='add'?'penalty':'waive', amount: type==='add'?amt:-amt, balanceBefore: bal, balanceAfter: newBal, reason, createdBy: state.user.uid, createdAt: serverTimestamp()
      });
    });
    closeModal(); toast('Updated', 'success'); aCustomers();
  } catch(e) { toast(e.message, 'error'); }
};

async function aRestaurants() {
  $('a-content').innerHTML = `<div class="skeleton" style="height:200px;border-radius:20px;"></div>`;
  const snap = await getDocs(collection(db, 'restaurants'));
  const rests = [];
  snap.forEach(d => rests.push({ id: d.id, ...d.data() }));
  
  $('a-content').innerHTML = `
    <button class="btn btn-primary btn-block mb-4" onclick="editRest()">+ Add Restaurant</button>
    ${rests.map(r => `
      <div class="card mb-2 flex-between">
        <div>
          <div style="font-weight:800;">${esc(r.name)}</div>
          <div style="font-size:12px; color:${r.active?'var(--success)':'var(--danger)'};">${r.active?'Active':'Inactive'}</div>
        </div>
        <button class="btn btn-sm btn-secondary" onclick='editRest(${JSON.stringify(r).replace(/'/g, "&#39;")})'>Edit</button>
      </div>
    `).join('')}
  `;
}

window.editRest = (r = null) => {
  modal(`
    <h2 style="font-size:24px; font-weight:900; margin-bottom:16px;">${r?'Edit':'Add'} Restaurant</h2>
    <div class="input-group"><label>Name</label><input type="text" id="r-name" class="input-field" value="${r?esc(r.name):''}"></div>
    <div class="input-group"><label>Description</label><input type="text" id="r-desc" class="input-field" value="${r?esc(r.description||''):''}"></div>
    <div class="input-group"><label>Image URL</label><input type="url" id="r-img" class="input-field" value="${r?esc(r.imageUrl||''):''}"></div>
    <div class="input-group"><label><input type="checkbox" id="r-act" ${!r||r.active?'checked':''}> Active</label></div>
    <button class="btn btn-primary btn-block" onclick="saveRest('${r?r.id:''}')">Save</button>
  `);
};

window.saveRest = async (id) => {
  const data = { name: $('r-name').value.trim(), description: $('r-desc').value.trim(), imageUrl: $('r-img').value.trim(), active: $('r-act').checked };
  if(!data.name) return toast('Name required', 'error');
  try {
    if(id) await updateDoc(doc(db, 'restaurants', id), data);
    else await addDoc(collection(db, 'restaurants'), { ...data, createdAt: serverTimestamp() });
    closeModal(); toast('Saved', 'success'); aRestaurants();
  } catch(e) { toast(e.message, 'error'); }
};

// --- INIT ---
onAuthStateChanged(auth, async user => {
  if(user) {
    state.user = user;
    const snap = await getDoc(doc(db, 'users', user.uid));
    state.profile = snap.exists() ? snap.data() : { role: 'customer', penaltyBalance: 0 };
    state.cart = JSON.parse(localStorage.getItem('genz_cart') || '{}');
    
    if(state.unsubs.user) state.unsubs.user();
    state.unsubs.user = onSnapshot(doc(db, 'users', user.uid), s => {
      if(s.exists()) { state.profile = s.data(); renderNav(); if(state.view==='profile') renderProfile(); }
    });
    
    navigate('home');
  } else {
    state.user = null; state.profile = null; state.cart = {};
    Object.values(state.unsubs).forEach(u => u && u());
    state.unsubs = {};
    renderAuth();
  }
});
</script>
</body>
</html>
