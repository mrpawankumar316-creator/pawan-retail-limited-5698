  <label style="display:block;margin-top:12px">Email subject<input id="tplSubject" class="input"></label>
  <label style="display:block;margin-top:12px">HTML template<textarea id="tplHtml" class="input" rows="10" style="width:100%;font-family:monospace"></textarea></label>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn btn-primary" id="tplGenerate">Generate HTML Automatically</button><button class="btn btn-secondary" id="tplPreview">Preview</button><button class="btn btn-secondary" id="tplSave">Save Template</button><button class="btn btn-secondary" id="tplCopy">Copy HTML</button></div>
  <div id="tplPreviewBox" style="margin-top:16px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff"><div style="padding:8px 12px;background:#f3f5f0;font-size:12px;font-weight:700">EMAIL PREVIEW</div><iframe id="tplFrame" title="Email template preview" sandbox style="width:100%;height:320px;border:0;background:white"></iframe></div>
  <p class="text-sm text-muted" style="margin-top:12px">Brand line used across templates: <b>Priya Electricals — Sales & Service</b>, a venture of <b>Pawan Retail Limited</b>.</p></div>`;
  const setStatus=t=>$("#ejStatus").textContent=t;
  const load=async()=>{
    try{
      const [c,t]=await Promise.all([getDoc(doc(db,EMAIL_SETTINGS_DOC)),getDoc(doc(db,EMAIL_TEMPLATES_DOC))]);
      const cfg=c.exists()?c.data():{};
      $("#ejPublic").value=cfg.publicKey||"";$("#ejService").value=cfg.serviceId||"";
      $("#ejWelcome").value=cfg.welcomeTemplateId||"";$("#ejOrder").value=cfg.orderTemplateId||"";$("#ejOtp").value=cfg.otpTemplateId||"";
      const saved=t.exists()?t.data():{};
      window.__prlEmailTemplates={...DEFAULT_EMAIL_TEMPLATES,...saved};
      updateTemplateEditor();
    }catch(e){setStatus("Could not load settings. Check Firestore rules: "+(e.message||e));}
  };
  const current=()=>window.__prlEmailTemplates[$("#tplType").value]||DEFAULT_EMAIL_TEMPLATES[$("#tplType").value];
  function updateTemplateEditor(){const x=current();$("#tplSubject").value=x.subject;$("#tplHtml").value=x.html;previewTemplate();}
  function previewTemplate(){const html=$("#tplHtml").value.replaceAll("{{to_name}}","Customer").replaceAll("{{order_id}}","PRL-1001").replaceAll("{{product_list}}","Sample product × 1").replaceAll("{{total}}","₹499.00").replaceAll("{{otp_code}}","123456").replaceAll("{{expiry_time}}","5 minutes");$("#tplFrame").srcdoc=html;}

  $("#tplHtml").oninput=()=>{const x=current();x.html=$("#tplHtml").value;};
  $("#tplGenerate").onclick=()=>{const type=$("#tplType").value;const d=DEFAULT_EMAIL_TEMPLATES[type];$("#tplSubject").value=d.subject;$("#tplHtml").value=d.html;current().subject=d.subject;current().html=d.html;previewTemplate();toast("HTML template generated","success");};

  $("#tplCopy").onclick=async()=>{try{await navigator.clipboard.writeText($("#tplHtml").value);toast("HTML copied","success");}catch(e){toast("Clipboard unavailable; select and copy the HTML manually","error");}};
  $("#ejSave").onclick=async()=>{try{const cfg={publicKey:$("#ejPublic").value.trim(),serviceId:$("#ejService").value.trim(),welcomeTemplateId:$("#ejWelcome").value.trim(),orderTemplateId:$("#ejOrder").value.trim(),otpTemplateId:$("#ejOtp").value.trim(),updatedAt:serverTimestamp(),updatedBy:S.profile?.email||""};await setDoc(doc(db,EMAIL_SETTINGS_DOC),cfg,{merge:true});setStatus("Saved. EmailJS credentials are stored in Firestore. Make sure only admins can read/write this document.");toast("EmailJS configuration saved","success");}catch(e){setStatus("Save failed: "+(e.message||e));}};
  $("#ejTest").onclick=()=>{const k=$("#ejPublic").value.trim(),sv=$("#ejService").value.trim();if(!k||!sv){setStatus("Enter Public Key and Service ID first.");return;}if(!window.emailjs){setStatus("EmailJS SDK could not load. Check your internet connection.");return;}try{window.emailjs.init({publicKey:k});setStatus("EmailJS SDK initialized. To test actual delivery, send a test template from EmailJS or use a configured template ID.");}catch(e){setStatus("Initialization failed: "+(e.message||e));}};
  load();
}

async function renderAdminDash(){
  $("#adminContent").innerHTML = `<div class="stats-grid" id="statsGrid"></div><div id="recentOrders"></div>`;
  const [os, cs, ls] = await Promise.all([
    getDocs(collection(db,"orders")),
    getDocs(collection(db,"complaints")),
    getDocs(collection(db,"linkClicks"))
  ]);
  const orders = os.docs.map(d => d.data());
  const complaints = cs.docs.map(d => d.data());
  const clicks = ls.docs.map(d => d.data());
  const stats = [
    {label:"Total Orders", value: orders.length},
    {label:"Pending", value: orders.filter(o => o.status==="pending").length},
    {label:"Delivered", value: orders.filter(o => o.status==="successful").length},
    {label:"Open Complaints", value: complaints.filter(c => c.status!=="resolved").length},
    {label:"Link Clicks", value: clicks.length}
  ];
  $("#statsGrid").innerHTML = stats.map(s => `<div class="stat"><div class="stat-label">${esc(s.label)}</div><div class="stat-value">${s.value}</div></div>`).join("");
  const recent = orders.map((o,i) => ({id:os.docs[i].id, ...o})).sort(newest).slice(0,10);
  $("#recentOrders").innerHTML = `
    <div class="section-header"><h2>Recent Orders</h2></div>
    <div class="table-wrap scroll"><table class="table">
      <thead><tr><th>Order</th><th>Customer</th><th>Company</th><th>Total</th><th>Status</th><th></th></tr></thead>
      <tbody>${recent.length ? recent.map(o => {
        const info = ORDER_ST[o.status] || {label:o.status, tone:"neutral"};
        return `<tr>
          <td class="font-mono text-xs">#${esc(o.orderId || o.id)}</td>
          <td>${esc(o.customerName||"")}</td>
          <td>${esc(o.companyName||"")}</td>
          <td class="font-bold">${inr(o.grandTotal)}</td>

          <td><button class="btn btn-secondary btn-xs" onclick="adminOpenOrder('${o.id}')">Open</button></td>
        </tr>`;
      }).join("") : '<tr><td colspan="6" class="text-soft" style="text-align:center">No orders</td></tr>'}
      </tbody></table></div>`;
}

window.adminOpenOrder = async (orderId) => {
  const snap = await getDoc(doc(db,"orders",orderId));
  if (!snap.exists()) return toast("Not found", "error");
  const o = {id:snap.id, ...snap.data()};
  const info = ORDER_ST[o.status] || {label:o.status, tone:"neutral"};
  const payLbl = o.paymentMethod === "cod" ? "Cash on Delivery" : "Online (UPI)";
  openModal(`
    <div class="modal-title">Order #${esc(o.orderId || o.id)}</div>
    <div class="mb-3" style="text-align:center"><span class="badge badge-${info.tone}">${info.label}</span></div>
    <div class="section-title">Customer</div>
    <div class="text-sm font-semibold">${esc(o.customerName||"")}</div>
    <div class="text-sm text-muted">${esc(o.customerPhone||"")}</div>
    <div class="text-sm text-muted">${esc(o.customerEmail||"")}</div>
    <div class="section-title mt-4">Company</div>
    <div class="text-sm font-semibold">${esc(o.companyName||"")}</div>
    <div class="section-title mt-4">Items</div>
    ${(o.items||[]).map(i => `<div class="row" style="padding:8px 0">
      <img src="${esc(validUrl(i.imageUrl) ? i.imageUrl : PLACEHOLDER_IMG)}" style="width:44px;height:44px;border-radius:10px;object-fit:cover" onerror="this.src='${PLACEHOLDER_IMG}'">
      <div style="flex:1"><div class="text-sm font-semibold">${esc(i.name)}</div><div class="text-xs text-soft">${i.quantity} × ${inr(i.unitPrice)}</div></div>
    </div>`).join("")}
    <div class="price-row total"><span>Total</span><span>${inr(o.grandTotal)}</span></div>
    <div class="price-row"><span class="text-muted">Payment</span><span class="font-bold">${esc(payLbl)}</span></div>
    <div class="section-title mt-4">Update Status</div>
    <select class="form-select mb-2" id="admStatus">
      ${Object.keys(ORDER_ST).map(k => `<option value="${k}" ${o.status===k?"selected":""}>${ORDER_ST[k].label}</option>`).join("")}
    </select>
    <button class="btn btn-primary btn-block" id="admUpdateStatus">Update Status</button>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`);
  $("#admUpdateStatus").onclick = async () => {
    const ns = $("#admStatus").value;
    if (ns === o.status) return toast("Unchanged", "info");
    if (ns === "successful"){
      openModal(`<div class="modal-title">Tracking URL</div>
        <div class="form-group"><input class="form-input" id="trackUrlInput" type="url" value="${esc(o.trackingUrl||"")}" placeholder="https://..."></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="adminOpenOrder('${o.id}')">Back</button>
          <button class="btn btn-success" id="trackConfirm">Mark Delivered</button>
        </div>`);
      $("#trackConfirm").onclick = async () => {
        const url = $("#trackUrlInput").value.trim();
        if (!url) return toast("URL required", "error");
        if (!validUrl(url)) return toast("Invalid URL", "error");
        try {
          await updateDoc(doc(db,"orders",o.id), {status:"successful", trackingUrl:url, deliveredAt: serverTimestamp(), updatedAt: serverTimestamp()});
          await addDoc(collection(db,"orders",o.id,"statusHistory"), {status:"successful", note:"Delivered", changedBy: S.user.uid, createdAt: serverTimestamp()});
          toast("Delivered!", "success"); closeModal();
        } catch(err){ toast(errMsg(err), "error"); }
      };
      return;
    }
    try {
      await updateDoc(doc(db,"orders",o.id), {status:ns, updatedAt: serverTimestamp()});
      await addDoc(collection(db,"orders",o.id,"statusHistory"), {status:ns, note:"", changedBy: S.user.uid, createdAt: serverTimestamp()});
      toast("Updated", "success"); closeModal();
    } catch(err){ toast(errMsg(err), "error"); }
  };
};

      <select class="form-select" id="suspendDuration">
        <option value="1">1 hour</option><option value="6">6 hours</option>
        <option value="24" selected>24 hours</option><option value="72">3 days</option>
        <option value="168">7 days</option>
      </select></div>
    <div class="form-group"><label class="form-label">Reason</label><textarea class="form-textarea" id="suspendReason"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="suspendConfirm">Suspend</button>
    </div>`);
  $("#suspendConfirm").onclick = async () => {
    const r = $("#suspendReason").value.trim();
    const h = parseInt($("#suspendDuration").value, 10);
    if (!r) return toast("Reason required", "error");
    const until = new Date(Date.now() + h * 60 * 60 * 1000);
    try {
      await updateDoc(doc(db,"users",userId), {status:"suspended", blockReason:r, suspendedUntil:until, suspendedAt: serverTimestamp(), suspendedBy: S.user.uid});
      toast("Suspended", "success"); closeModal(); renderAdminCustomers();
    } catch(err){ toast(errMsg(err), "error"); }
  };
};

window.adminUnblockUser = (userId) => {
  confirmDialog("Unblock user?", async () => {
    try {
      await updateDoc(doc(db,"users",userId), {status:"active", blockReason:"", suspendedUntil:null, unblockedAt: serverTimestamp(), unblockedBy: S.user.uid});
      toast("Unblocked", "success"); renderAdminCustomers();
    } catch(err){ toast(errMsg(err), "error"); }
  });
};

/* ============ INIT ============ */
try {
  mount();
  console.log("✅ Mounted");
} catch(e){
  console.error("Mount error:", e);
  $("#root").innerHTML = `<div style="padding:24px;background:#fee2e2;min-height:100vh;color:#991b1b;font-family:sans-serif"><h2>⚠️ Mount Error</h2><p>${e.message || 'Unknown'}</p></div>`;
}

try {
  onAuthStateChanged(auth, onAuthChanged);
} catch(e){ console.error("Auth init error:", e); }
</script>
</body>
</html>
