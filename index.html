<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pawan Finance - Premium Loan Management</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    
    <style>
        /* ============================================================
           PREMIUM FIN TECH STYLES
           ============================================================ */
        :root {
            --primary: #0A1628;
            --primary-dark: #060d1a;
            --primary-light: #1a2d4a;
            --secondary: #1a3a5c;
            --accent: #00d4ff;
            --accent-dark: #0099cc;
            --success: #00c853;
            --danger: #ff1744;
            --warning: #ff9100;
            --info: #2979ff;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
            --shadow-xl: 0 20px 60px rgba(0,0,0,0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--gray-100);
            color: var(--gray-900);
            min-height: 100vh;
        }
        
        /* ----- SPLASH SCREEN ----- */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        #splashScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #splashScreen .logo {
            font-size: 42px;
            font-weight: 800;
            color: var(--white);
            animation: splashLogo 1s ease;
        }
        #splashScreen .logo span { color: var(--accent); }
        #splashScreen .tagline {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            margin-top: 8px;
            animation: splashFade 1.2s ease;
        }
        #splashScreen .loader {
            margin-top: 30px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes splashLogo {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes splashFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ----- AUTH PAGES ----- */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }
        .auth-box {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-xl);
        }
        .auth-box .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .auth-box .logo span { color: var(--accent); }
        .auth-box .subtitle {
            text-align: center;
            color: var(--gray-500);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .auth-box .form-group {
            margin-bottom: 16px;
        }
        .auth-box .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--gray-700);
        }
        .auth-box .form-group input,
        .auth-box .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 14px;
            transition: var(--transition);
            background: var(--gray-50);
        }
        .auth-box .form-group input:focus,
        .auth-box .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(0,212,255,0.1);
        }
        .auth-box .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .auth-box .btn-primary {
            background: var(--primary);
            color: var(--white);
        }
        .auth-box .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        .auth-box .btn-accent {
            background: var(--accent);
            color: var(--white);
        }
        .auth-box .btn-accent:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }
        .auth-box .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .auth-box .link {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-box .text-center { text-align: center; }
        .auth-box .mt-12 { margin-top: 12px; }
        .auth-box .text-muted { color: var(--gray-500); font-size: 13px; }
        .auth-box .error-msg {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .auth-box .error-msg.show { display: block; }
        
        /* ----- APP SHELL ----- */
        .app-shell {
            display: none;
            min-height: 100vh;
            background: var(--gray-100);
        }
        .app-shell.active { display: block; }
        
        /* ----- HEADER ----- */
        .app-header {
            background: var(--primary);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 16px rgba(0,0,0,0.2);
        }
        .app-header .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--white);
            cursor: pointer;
        }
        .app-header .logo span { color: var(--accent); }
        .app-header .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .app-header .header-actions .notification-btn {
            background: none;
            border: none;
            color: var(--white);
            font-size: 18px;
            cursor: pointer;
            position: relative;
            padding: 4px;
        }
        .app-header .header-actions .notification-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: var(--white);
            font-size: 9px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
        }
        .app-header .header-actions .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            cursor: pointer;
        }
        .app-header .header-actions .logout-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--white);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .app-header .header-actions .logout-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        /* ----- MAIN CONTENT ----- */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 16px 100px;
        }
        
        /* ----- BOTTOM NAV ----- */
        .bottom-nav {
            background: var(--white);
            border-top: 1px solid var(--gray-200);
            display: none;
            justify-content: space-around;
            align-items: center;
            padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.05);
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            transition: var(--transition);
            min-width: 48px;
            color: var(--gray-500);
        }
        .bottom-nav .nav-item i {
            font-size: 18px;
            transition: var(--transition);
        }
        .bottom-nav .nav-item span {
            font-size: 9px;
            font-weight: 600;
            transition: var(--transition);
        }
        .bottom-nav .nav-item.active {
            color: var(--accent);
        }
        .bottom-nav .nav-item.active i {
            transform: translateY(-2px);
        }
        
        /* ----- PAGES ----- */
        .page {
            display: none;
            animation: fadeUp 0.4s ease;
        }
        .page.active { display: block; }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ----- CARDS ----- */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            margin-bottom: 16px;
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .card .card-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-800);
        }
        .card .card-header .badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-primary { background: #e0e7ff; color: #3730a3; }
        .badge-accent { background: #cffafe; color: #0e7490; }
        .badge-gray { background: var(--gray-200); color: var(--gray-700); }
        
        /* ----- STATS GRID ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stats-grid .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: var(--transition);
        }
        .stats-grid .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .stats-grid .stat-card .icon {
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .stats-grid .stat-card .num {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }
        .stats-grid .stat-card .label {
            font-size: 12px;
            color: var(--gray-500);
            font-weight: 500;
        }
        
        /* ----- TIMELINE ----- */
        .timeline {
            position: relative;
            padding: 16px 0;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 16px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--gray-200);
        }
        .timeline-item {
            display: flex;
            gap: 16px;
            padding: 8px 0;
            position: relative;
        }
        .timeline-item .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--gray-300);
            border: 3px solid var(--white);
            flex-shrink: 0;
            margin-top: 4px;
            z-index: 1;
        }
        .timeline-item .dot.done {
            background: var(--success);
        }
        .timeline-item .dot.active {
            background: var(--accent);
            box-shadow: 0 0 0 4px rgba(0,212,255,0.2);
        }
        .timeline-item .dot.rejected {
            background: var(--danger);
        }
        .timeline-item .content {
            flex: 1;
        }
        .timeline-item .content .title {
            font-weight: 600;
            font-size: 14px;
            color: var(--gray-800);
        }
        .timeline-item .content .sub {
            font-size: 12px;
            color: var(--gray-500);
        }
        .timeline-item .content .date {
            font-size: 11px;
            color: var(--gray-400);
        }
        
        /* ----- KYC FORM - PREMIUM ----- */
        .kyc-container {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }
        .kyc-step {
            display: none;
        }
        .kyc-step.active { display: block; }
        .kyc-progress {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .kyc-progress .step {
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: var(--gray-200);
            transition: var(--transition);
        }
        .kyc-progress .step.done { background: var(--success); }
        .kyc-progress .step.active { background: var(--accent); }
        .kyc-progress .step.error { background: var(--danger); }
        
        .kyc-step-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 4px;
        }
        .kyc-step-subtitle {
            font-size: 13px;
            color: var(--gray-500);
            margin-bottom: 20px;
        }
        .kyc-form-group {
            margin-bottom: 16px;
        }
        .kyc-form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--gray-700);
        }
        .kyc-form-group input,
        .kyc-form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 14px;
            transition: var(--transition);
            background: var(--gray-50);
        }
        .kyc-form-group input:focus,
        .kyc-form-group select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(0,212,255,0.1);
        }
        .kyc-form-group input.error {
            border-color: var(--danger);
        }
        .kyc-form-group .error-text {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .kyc-form-group .error-text.show { display: block; }
        .kyc-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .kyc-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .kyc-btn-group .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .kyc-btn-group .btn-primary {
            background: var(--primary);
            color: var(--white);
        }
        .kyc-btn-group .btn-primary:hover { background: var(--primary-dark); }
        .kyc-btn-group .btn-accent {
            background: var(--accent);
            color: var(--white);
        }
        .kyc-btn-group .btn-accent:hover { background: var(--accent-dark); }
        .kyc-btn-group .btn-success {
            background: var(--success);
            color: var(--white);
        }
        .kyc-btn-group .btn-success:hover { background: #16a34a; }
        .kyc-btn-group .btn-ghost {
            background: transparent;
            color: var(--gray-600);
            border: 1px solid var(--gray-200);
        }
        .kyc-btn-group .btn-ghost:hover { background: var(--gray-50); }
        .kyc-btn-group .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* ----- KYC COMPLETED ----- */
        .kyc-completed {
            text-align: center;
            padding: 30px 0;
        }
        .kyc-completed .icon {
            font-size: 72px;
            color: var(--success);
            margin-bottom: 16px;
        }
        .kyc-completed h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 4px;
        }
        .kyc-completed p {
            color: var(--gray-500);
            font-size: 14px;
        }
        .kyc-completed .details {
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin: 16px 0;
            text-align: left;
        }
        .kyc-completed .details .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--gray-200);
            font-size: 13px;
        }
        .kyc-completed .details .row:last-child { border-bottom: none; }
        .kyc-completed .details .label { color: var(--gray-500); font-weight: 500; }
        .kyc-completed .details .value { font-weight: 600; color: var(--gray-800); }
        
        /* ----- TABLES ----- */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .table th {
            text-align: left;
            padding: 10px 12px;
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 2px solid var(--gray-200);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--gray-200);
        }
        .table tr:hover td { background: var(--gray-50); }
        .table .status-badge {
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }
        .table .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin: 2px;
        }
        .table .action-btn:hover { opacity: 0.8; transform: scale(0.95); }
        .table .action-btn.view { background: #dbeafe; color: #1e40af; }
        .table .action-btn.approve { background: #dcfce7; color: #166534; }
        .table .action-btn.reject { background: #fee2e2; color: #991b1b; }
        .table .action-btn.info { background: #fef3c7; color: #92400e; }
        .table .action-btn.disburse { background: #cffafe; color: #0e7490; }
        
        /* ----- MODAL ----- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            max-width: 540px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.35s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal .modal-header h3 { font-size: 18px; }
        .modal .modal-header .close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray-500);
        }
        .modal .modal-header .close:hover { color: var(--gray-900); }
        .modal .form-group {
            margin-bottom: 12px;
        }
        .modal .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 3px;
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 13px;
            transition: var(--transition);
            font-family: inherit;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .modal .form-group textarea { min-height: 60px; resize: vertical; }
        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .modal .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

<script>
// ================================================================
// FIREBASE CONFIG
// ================================================================
const firebaseConfig = {

    authDomain: "pawan-retail-limited-8fee7.firebaseapp.com",

};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

// ================================================================
// STATE
// ================================================================
const state = {
    user: null,
    profile: null,
    currentPage: 'dashboard',
    isAdmin: false,
    applications: [],
    notifications: [],
    allUsers: [],
    allApplications: [],
    allKYCs: [],
    unreadCount: 0,
    kycStep: 1,
    kycData: {},
    kycSubmitted: false
};

// ================================================================
// UTILITY
// ================================================================
function $(id) { return document.getElementById(id); }
function qs(sel, ctx = document) { return ctx.querySelector(sel); }
function qsa(sel, ctx = document) { return ctx.querySelectorAll(sel); }

function formatCurrency(amt) { return '₹' + Number(amt).toFixed(2); }
function formatDate(ts) {
    if (!ts) return 'N/A';
    const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function formatDateTime(ts) {
    if (!ts) return 'N/A';
    const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
    return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function getTS() { return firebase.firestore.FieldValue.serverTimestamp(); }
function generateId(prefix) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let id = '';
    for (let i = 0; i < 6; i++) {
        id += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return prefix + '-' + Date.now().toString(36).toUpperCase() + '-' + id;
}

function showToast(message, type = 'info') {
    const container = $('toastContainer');
    const toast = document.createElement('div');
    const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
        <span><i class="fas ${icons[type] || icons.info}"></i></span>
        <span>${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
    `;
    container.appendChild(toast);
    setTimeout(() => {
        if (toast.parentElement) toast.remove();
    }, 4000);
    return toast;
}

function openModal(title, html) {
    $('modalTitle').textContent = title;
    $('modalBody').innerHTML = html;
    $('modalOverlay').classList.add('active');
}
function closeModal() { $('modalOverlay').classList.remove('active'); }

$('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// ================================================================
// AUTH FUNCTIONS
// ================================================================
async function registerUser(email, password, name, mobile) {
    try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const userData = {
            uid: cred.user.uid,
            email: email,
            name: name,
            mobile: mobile,
            role: 'user',
            status: 'active',
            createdAt: getTS(),
            lastLoginAt: getTS(),
            profileComplete: false,
            kycStatus: 'pending',
            kycCompleted: false,
            loanStatus: 'none',
            kycData: null
        };
        await db.collection('users').doc(cred.user.uid).set(userData);
        
        await db.collection('notifications').add({
            userId: cred.user.uid,
            title: 'Welcome to Pawan Finance!',
            message: 'Complete your KYC to start your loan application.',
            type: 'info',
            isRead: false,
            createdAt: getTS()
        });
        
        return { success: true, user: userData };
    } catch (e) {
        return { success: false, error: e.message };
    }
}

async function loginUser(email, password) {
    try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const doc = await db.collection('users').doc(cred.user.uid).get();
        if (!doc.exists) throw new Error('User profile not found');
        const userData = doc.data();
        if (userData.status === 'blocked' || userData.status === 'suspended') {
            await auth.signOut();
            throw new Error(`Account ${userData.status}. Contact support.`);
        }
        await db.collection('users').doc(cred.user.uid).update({
            lastLoginAt: getTS()
        });
        return { success: true, user: userData };
    } catch (e) {
        return { success: false, error: e.message };
    }
}

async function logoutUser() {
    await auth.signOut();
    state.user = null;
    state.profile = null;
    state.isAdmin = false;
    state.applications = [];
    state.notifications = [];
    showToast('Logged out successfully', 'info');
    showAuthPage('login');
}

// ================================================================
// AUTH PAGES
// ================================================================
function showAuthPage(page) {
    $('appShell').classList.remove('active');
    $('authContainer').style.display = 'flex';
    const box = $('authBox');
    
    const pages = {
        login: `
            <div class="logo">Pawan <span>Finance</span></div>
            <div class="subtitle">Login to your account</div>
            <div class="error-msg" id="authError"></div>
            <form onsubmit="event.preventDefault();handleLogin()">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            <div class="text-center mt-12">
                <span class="text-muted">Don't have an account? </span>
                <span class="link" onclick="showAuthPage('register')">Register</span>
                <br />
                <span class="link" onclick="showAuthPage('forgot')" style="font-size:13px;">Forgot password?</span>
            </div>
        `,
        
        register: `
            <div class="logo">Pawan <span>Finance</span></div>
            <div class="subtitle">Create your account</div>
            <div class="error-msg" id="authError"></div>
            <form onsubmit="event.preventDefault();handleRegister()">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="John Doe" required />
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="regMobile" placeholder="9876543210" required />
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="your@email.com" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6" />
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regConfirm" placeholder="Confirm password" required minlength="6" />
                </div>
                <button type="submit" class="btn btn-accent" id="registerBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
            <div class="text-center mt-12">
                <span class="text-muted">Already have an account? </span>
                <span class="link" onclick="showAuthPage('login')">Login</span>
            </div>
        `,
        
        forgot: `
            <div class="logo">Pawan <span>Finance</span></div>
            <div class="subtitle">Reset your password</div>
            <div class="error-msg" id="authError"></div>
            <form onsubmit="event.preventDefault();handleForgotPassword()">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="resetEmail" placeholder="your@email.com" required />
                </div>
                <button type="submit" class="btn btn-primary" id="resetBtn">
                    <i class="fas fa-envelope"></i> Send Reset Link
                </button>
            </form>
            <div class="text-center mt-12">
                <span class="link" onclick="showAuthPage('login')">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </span>
            </div>
        `
    };
    
    box.innerHTML = pages[page] || pages.login;
}

async function handleLogin() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const error = document.getElementById('authError');
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
    error.classList.remove('show');
    
    const result = await loginUser(email, password);
    if (result.success) {
        showToast('Login successful!', 'success');
        showApp();
    } else {
        error.textContent = result.error || 'Login failed. Please try again.';
        error.classList.add('show');
        showToast(result.error, 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
}

async function handleRegister() {
    const name = document.getElementById('regName').value.trim();
    const mobile = document.getElementById('regMobile').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    const btn = document.getElementById('registerBtn');
    const error = document.getElementById('authError');
    
    error.classList.remove('show');
    
    if (!name) { showToast('Please enter your full name', 'error'); return; }
    if (!mobile || mobile.length < 10) { showToast('Please enter a valid mobile number', 'error'); return; }
    if (!email) { showToast('Please enter your email', 'error'); return; }
    if (password.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
    if (password !== confirm) { showToast('Passwords do not match', 'error'); return; }
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
    
    const result = await registerUser(email, password, name, mobile);
    if (result.success) {
        showToast('Account created successfully!', 'success');
        showApp();
    } else {
        error.textContent = result.error || 'Registration failed. Please try again.';
        error.classList.add('show');
        showToast(result.error, 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
}

async function handleForgotPassword() {
    const email = document.getElementById('resetEmail').value;
    const btn = document.getElementById('resetBtn');
    const error = document.getElementById('authError');
    
    error.classList.remove('show');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
    
    try {
        await auth.sendPasswordResetEmail(email);
        showToast('Password reset email sent!', 'success');
        showAuthPage('login');
    } catch (e) {
        error.textContent = e.message || 'Failed to send reset email.';
        error.classList.add('show');
        showToast(e.message, 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-envelope"></i> Send Reset Link';
}

// ================================================================
// APP
// ================================================================
function showApp() {
    $('authContainer').style.display = 'none';
    $('appShell').classList.add('active');
    loadUserData();
}

function loadUserData() {
    const user = auth.currentUser;
    if (!user) { showAuthPage('login'); return; }
    
    db.collection('users').doc(user.uid).get().then(doc => {
        if (doc.exists) {
            state.profile = { id: doc.id, ...doc.data() };
            state.isAdmin = state.profile?.role === 'admin';
            state.kycSubmitted = state.profile?.kycCompleted || false;
            updateHeader();
            loadApplications();
            loadNotifications();
            renderAll();
        }
    }).catch((err) => {
        console.error('Error loading profile:', err);
        showToast('Error loading profile', 'error');
    });
}

function updateHeader() {
    const avatar = $('headerAvatar');
    if (state.profile?.name) {
        avatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(state.profile.name)}&background=00d4ff&color=0A1628&size=64`;
    }
}

function renderAll() {
    renderPage(state.currentPage);
}

// ================================================================
// NAVIGATION
// ================================================================
function navigateTo(page) {
    state.currentPage = page;
    qsa('.bottom-nav .nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
    });
    renderPage(page);
}

// ================================================================
// PAGE RENDERER
// ================================================================
function renderPage(page) {
    const container = $('mainContent');
    const pages = {
        'dashboard': renderDashboard,
        'kyc': renderKYC,
        'loan': renderLoanApplication,
        'applications': renderApplications,
        'profile': renderProfile,
        'notifications': renderNotifications,
        'admin': renderAdmin
    };
    if (pages[page]) pages[page]();
}

                    <button class="btn btn-accent" onclick="navigateTo('kyc')" style="padding:10px;font-size:12px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:var(--white);font-weight:700;cursor:pointer;">
                        <i class="fas fa-id-card"></i> Complete KYC
                    </button>
                `}

function saveKYCPersonal() {
    const name = document.getElementById('kycName').value.trim();
    const dob = document.getElementById('kycDob').value;
    const gender = document.getElementById('kycGender').value;
    const mobile = document.getElementById('kycMobile').value.trim();
    
    let valid = true;
    
    if (!name) { showError('kycNameError'); valid = false; }
    if (!dob) { showError('kycDobError'); valid = false; }
    if (!gender) { showError('kycGenderError'); valid = false; }
    if (!mobile || mobile.length < 10) { showError('kycMobileError'); valid = false; }
    
    if (!valid) { showToast('Please fill all required fields', 'error'); return; }
    
    state.kycData = { ...state.kycData, name, dob, gender, mobile };
    state.kycStep = 2;
    renderKYC();
}

function saveKYCAddress() {
    const address = document.getElementById('kycAddress').value.trim();
    const city = document.getElementById('kycCity').value.trim();
    const district = document.getElementById('kycDistrict').value.trim();
    const state = document.getElementById('kycState').value.trim();
    const pincode = document.getElementById('kycPincode').value.trim();
    
    let valid = true;
    
    if (!address) { showError('kycAddressError'); valid = false; }
    if (!city) { showError('kycCityError'); valid = false; }
    if (!district) { showError('kycDistrictError'); valid = false; }
    if (!state) { showError('kycStateError'); valid = false; }
    if (!pincode || pincode.length !== 6) { showError('kycPincodeError'); valid = false; }
    
    if (!valid) { showToast('Please fill all required fields', 'error'); return; }
    
    state.kycData = { ...state.kycData, address, city, district, state, pincode };
    state.kycStep = 3;
    renderKYC();
}

function saveKYCIdentity() {
    const aadhaar = document.getElementById('kycAadhaar').value.trim().replace(/-/g, '');
    const pan = document.getElementById('kycPan').value.trim().toUpperCase();
    
    let valid = true;
    
    if (!aadhaar || aadhaar.length < 12) { showError('kycAadhaarError'); valid = false; }
    if (!pan || pan.length < 10) { showError('kycPanError'); valid = false; }
    
    if (!valid) { showToast('Please enter valid Aadhaar and PAN', 'error'); return; }
    
    state.kycData = { ...state.kycData, aadhaar, pan };
    state.kycStep = 4;
    renderKYC();
}

function showError(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('show');
}

function hideErrors() {
    document.querySelectorAll('.error-text').forEach(el => el.classList.remove('show'));
}

async function submitKYC() {
    const bankName = document.getElementById('kycBankName').value.trim();
    const bank = document.getElementById('kycBank').value.trim();
    const account = document.getElementById('kycAccount').value.trim();
    const ifsc = document.getElementById('kycIfsc').value.trim().toUpperCase();
    
    let valid = true;
    
    if (!bankName) { showError('kycBankNameError'); valid = false; }
    if (!bank) { showError('kycBankError'); valid = false; }
    if (!account || account.length < 9) { showError('kycAccountError'); valid = false; }
    if (!ifsc || ifsc.length < 10) { showError('kycIfscError'); valid = false; }
    
    if (!valid) { showToast('Please fill all bank details', 'error'); return; }
    
    const kycData = { ...state.kycData, bankName, bank, account, ifsc };
    
    try {
        const user = auth.currentUser;
        if (!user) { showToast('Please login again', 'error'); return; }
        
        const btn = document.getElementById('kycSubmitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
        
        await db.collection('users').doc(user.uid).update({
            kycStatus: 'submitted',
            kycCompleted: true,
            kycData: kycData,
            updatedAt: getTS()
        });
        
        await db.collection('notifications').add({
            userId: user.uid,
            title: 'KYC Submitted',
            message: 'Your KYC documents have been submitted for verification.',
            type: 'info',
            isRead: false,
            createdAt: getTS()
        });
        
        showToast('KYC submitted successfully! 🎉', 'success');
        state.profile.kycStatus = 'submitted';
        state.profile.kycCompleted = true;
        state.kycSubmitted = true;
        state.kycStep = 1;
        navigateTo('dashboard');
    } catch (e) {
        showToast(e.message, 'error');
        const btn = document.getElementById('kycSubmitBtn');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> Submit KYC';
    }
}

function updateLoanSummary() {
    const amount = parseInt(document.getElementById('loanAmount').value) || 0;
    const tenure = document.getElementById('loanTenure').value;
    const fee = amount * 0.02;
    const interest = amount * 0.12 * (tenure / 12);
    const total = amount + fee + interest;
    
    document.getElementById('summaryAmount').textContent = formatCurrency(amount);
    document.getElementById('summaryTenure').textContent = tenure ? tenure + ' months' : '-';
    document.getElementById('summaryFee').textContent = formatCurrency(fee);
    document.getElementById('summaryTotal').textContent = formatCurrency(total);
}

    if (!employment) { showToast('Please select employment type', 'error'); return; }
    
    const user = auth.currentUser;
    if (!user) { showToast('Please login again', 'error'); return; }
    
    const applicationId = generateId('LN');
    
    try {

function viewApplicationStatus(appId) {
    const app = state.applications.find(a => a.id === appId);
    if (!app) { showToast('Application not found', 'error'); return; }
    
    const statusFlow = [
        { status: 'submitted', label: 'Application Submitted' },
        { status: 'kyc_verification', label: 'KYC Verification' },
        { status: 'under_review', label: 'Loan Review' },
        { status: 'approved', label: 'Approved' },
        { status: 'disbursed', label: 'Disbursed' }
    ];
    
    const currentIndex = statusFlow.findIndex(s => s.status === app.status);
    const isRejected = app.status === 'rejected';
    
    openModal('Application Status', `
        <div style="margin-bottom:16px;">
            <div style="display:flex;justify-content:space-between;">
                <div><strong>Application ID:</strong> ${app.applicationId || app.id.slice(0,8)}</div>
                <span class="badge badge-${app.status === 'approved' ? 'success' : app.status === 'rejected' ? 'danger' : app.status === 'disbursed' ? 'accent' : 'warning'}">${app.status.toUpperCase()}</span>
            </div>
            <div style="font-size:13px;color:var(--gray-500);margin-top:4px;">
                Applied: ${formatDate(app.createdAt)} | Updated: ${formatDate(app.updatedAt)}
            </div>
        </div>
        
        <div class="timeline">
            ${statusFlow.map((step, i) => {
                const isDone = i <= currentIndex && !isRejected;
                const isActive = i === currentIndex && !isRejected;
                return `
                    <div class="timeline-item">
                        <div class="dot ${isRejected && i === currentIndex ? 'rejected' : isDone ? 'done' : isActive ? 'active' : ''}"></div>
                        <div class="content">
                            <div class="title" style="${isRejected && i === currentIndex ? 'color:var(--danger);' : ''}">
                                ${isRejected && i === currentIndex ? '❌ Rejected' : step.label}
                            </div>
                            ${isDone || isActive ? `<div class="date">${formatDate(app.updatedAt)}</div>` : ''}
                            ${isRejected && i === currentIndex ? `<div class="sub" style="color:var(--danger);">${app.adminRemarks?.join(', ') || 'No reason provided'}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
        
        ${app.status === 'disbursed' ? `
            <div style="margin-top:12px;padding:12px;background:#cffafe;border-radius:var(--radius-sm);">
                <i class="fas fa-money-bill-wave" style="color:var(--accent);"></i>
                <strong>Disbursed Amount:</strong> ${formatCurrency(app.amount)}
                <div style="font-size:12px;color:var(--gray-500);">Ref: ${app.disbursementRef || 'N/A'}</div>
            </div>
        ` : ''}
        
        <button class="btn btn-primary" onclick="closeModal()" style="margin-top:12px;width:100%;padding:10px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:var(--white);font-weight:700;cursor:pointer;">Close</button>
    `);
}

            </div>
        ` : state.notifications.map(n => `
            <div class="card" style="${n.isRead ? 'opacity:0.7;' : 'border-left:4px solid var(--accent);'}">

                    <div style="flex:1;">

                        <div style="font-size:13px;color:var(--gray-500);margin-top:2px;">${n.message}</div>
                        <div style="font-size:11px;color:var(--gray-400);margin-top:4px;">${formatRelativeTime(n.createdAt)}</div>
                    </div>
                    ${!n.isRead ? `
                        <button class="btn btn-sm btn-primary" onclick="markNotificationRead('${n.id}')" style="padding:2px 12px;font-size:10px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:var(--white);font-weight:600;cursor:pointer;">
                            Mark Read
                        </button>
                    ` : ''}
                </div>
            </div>
        `).join('')}

}

function formatRelativeTime(ts) {
    if (!ts) return 'Just now';
    const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'Just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
    return formatDate(d);
}

async function markNotificationRead(id) {
    try {
        await db.collection('notifications').doc(id).update({ isRead: true });
        loadNotifications();
        renderNotifications();
    } catch (e) {

}

            return { id: d.id, ...data, userName: user?.name || 'N/A' };

        const kycsSnap = await db.collection('users').where('kycCompleted', '==', true).get();
        adminData.kycs = kycsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

async function approveLoan(appId) {
    const reason = prompt('Add verification remarks (optional):');
    try {
        const app = adminData.applications.find(a => a.id === appId);
        if (!app) { showToast('Application not found', 'error'); return; }
        
        await db.collection('loanApplications').doc(appId).update({
            status: 'approved',
            adminRemarks: [...(app.adminRemarks || []), reason || 'Approved by admin'],
            updatedAt: getTS(),
            statusHistory: [...(app.statusHistory || []), {
                status: 'approved',
                timestamp: new Date().toISOString(),
                note: reason || 'Approved by admin'
            }]
        });
        
        await db.collection('users').doc(app.userId).update({
            loanStatus: 'approved',
            updatedAt: getTS()
        });
        
        await db.collection('notifications').add({
            userId: app.userId,
            title: 'Loan Approved',
            message: `Your loan application ${app.applicationId} has been approved!`,
            type: 'success',
            isRead: false,
            createdAt: getTS()
        });
        
        showToast('Loan approved successfully!', 'success');
        closeModal();
        loadAdminData();
        renderAdmin();
    } catch (e) {
        showToast(e.message, 'error');
    }
}

async function rejectLoan(appId) {
    const reason = prompt('Reason for rejection (mandatory):');
    if (!reason) { showToast('Reason is required', 'error'); return; }
    
    try {
        const app = adminData.applications.find(a => a.id === appId);
        if (!app) { showToast('Application not found', 'error'); return; }
        
        await db.collection('loanApplications').doc(appId).update({
            status: 'rejected',
            adminRemarks: [...(app.adminRemarks || []), reason],
            updatedAt: getTS(),
            statusHistory: [...(app.statusHistory || []), {
                status: 'rejected',

        await db.collection('users').doc(app.userId).update({

        showToast('Loan rejected', 'error');

}

async function requestInfo(appId) {

    if (!message) { showToast('Message is required', 'error'); return; }

async function disburseLoan(appId) {
    if (!confirm('Confirm disbursement for this loan?')) return;
    
    try {
        const app = adminData.applications.find(a => a.id === appId);
        if (!app) { showToast('Application not found', 'error'); return; }
        
        const refId = 'TXN' + Date.now().toString(36).toUpperCase();
        
        await db.collection('loanApplications').doc(appId).update({
            status: 'disbursed',
            disbursementRef: refId,
            disbursementDate: getTS(),
            updatedAt: getTS(),
            statusHistory: [...(app.statusHistory || []), {
                status: 'disbursed',
                timestamp: new Date().toISOString(),
                note: `Disbursed - Ref: ${refId}`
            }]
        });
        
        await db.collection('users').doc(app.userId).update({
            loanStatus: 'disbursed',
            updatedAt: getTS()
        });
        
        await db.collection('notifications').add({
            userId: app.userId,
            title: 'Loan Disbursed',
            message: `Your loan ${app.applicationId} has been disbursed. Ref: ${refId}`,
            type: 'success',
            isRead: false,
            createdAt: getTS()
        });
        
        showToast('Loan disbursed!', 'success');
        closeModal();
        loadAdminData();
        renderAdmin();
    } catch (e) {
        showToast(e.message, 'error');
    }
}
