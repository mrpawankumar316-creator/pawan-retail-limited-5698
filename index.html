<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pawan Retail Limited — Food Ordering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-900:#1e1b4b;
    --brand-800:#312e81;
    --brand-700:#3730a3;
    --brand-600:#4338ca;
    --brand-500:#4f46e5;
    --brand-100:#e0e7ff;
    --brand-50:#eef2ff;

    --ink-900:#0f172a;
    --ink-800:#1e293b;
    --ink-700:#334155;
    --ink-600:#475569;
    --ink-500:#64748b;
    --ink-400:#94a3b8;
    --ink-300:#cbd5e1;
    --ink-200:#e2e8f0;
    --ink-100:#f1f5f9;
    --ink-50:#f8fafc;

    --success:#059669;
    --success-bg:#ecfdf5;
    --success-border:#a7f3d0;

    --danger:#dc2626;
    --danger-bg:#fef2f2;
    --danger-border:#fecaca;

    --warning:#d97706;
    --warning-bg:#fffbeb;

    --radius:8px;
    --radius-lg:12px;
    --radius-xl:16px;

    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow:0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
    --shadow-md:0 4px 12px rgba(15,23,42,.08);
    --shadow-lg:0 10px 32px rgba(15,23,42,.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Inter','IBM Plex Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--ink-50);
    color:var(--ink-800);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
    line-height:1.5;
  }
  h1,h2,h3,h4{letter-spacing:-.01em; font-weight:700; color:var(--ink-900);}
  h1{font-size:24px; line-height:1.25;}
  h2{font-size:18px; line-height:1.35;}
  h3{font-size:15px; line-height:1.4;}
  p{line-height:1.6;}
  .muted{color:var(--ink-500); font-size:13px;}

  /* ============ APP SHELL ============ */
  .app-shell{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:76px; /* space for bottom nav */
  }

  /* ============ TOPBAR ============ */
  .topbar{
    background:#fff;
    border-bottom:1px solid var(--ink-200);
    position:sticky; top:0; z-index:50;
  }
  .topbar-inner{
    max-width:1200px;
    margin:0 auto;
    padding:14px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:36px; height:36px;
    border-radius:8px;
    background:var(--brand-700);
    color:white;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px;
    letter-spacing:-.02em;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.2;}
  .brand-text .name{font-size:15px; font-weight:700; color:var(--ink-900);}
  .brand-text .tag{font-size:11px; color:var(--ink-500); font-weight:500;}
  .topbar-actions{
    display:flex; align-items:center; gap:10px;
  }
  .penalty-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--danger-bg);
    color:var(--danger);
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    border:1px solid var(--danger-border);
    cursor:pointer;
    transition:background .15s;
  }
  .penalty-chip:hover{background:#fee2e2;}
  .penalty-chip::before{content:'!'; display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; background:var(--danger); color:white; font-size:10px; font-weight:700;}

  /* ============ MAIN ============ */
  .main{
    flex:1;
    max-width:1200px;
    margin:0 auto;
    width:100%;
    padding:24px;
  }

  /* ============ BOTTOM NAV ============ */
  .bottom-nav{
    position:fixed;
    bottom:0; left:0; right:0;
    background:#fff;
    border-top:1px solid var(--ink-200);
    z-index:100;
    box-shadow:0 -4px 16px rgba(15,23,42,.06);
  }
  .bottom-nav-inner{
    max-width:720px;
    margin:0 auto;
    display:flex;
    justify-content:space-around;
    padding:6px 8px;
  }
  .nav-item{
    flex:1;
    background:transparent;
    border:none;
    padding:8px 4px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink-500);
    font-size:11px;
    font-weight:600;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    border-radius:8px;
    transition:all .15s;
    position:relative;
    max-width:120px;
  }
  .nav-item .icon{font-size:20px; line-height:1;}
  .nav-item:hover{background:var(--ink-100); color:var(--ink-700);}
  .nav-item.active{color:var(--brand-700);}
  .nav-item.active .icon{color:var(--brand-700);}
  .nav-item .badge{
    position:absolute;
    top:4px; right:calc(50% - 24px);
    background:var(--danger);
    color:white;
    font-size:9px;
    font-weight:700;
    padding:2px 6px;
    border-radius:10px;
    min-width:16px;
    text-align:center;
  }
  .nav-item.admin-tab .icon{color:var(--brand-700);}

  /* ============ CARDS ============ */
  .card{
    background:#fff;
    border-radius:var(--radius-lg);
    border:1px solid var(--ink-200);
    padding:20px;
  }
  .card.elevated{box-shadow:var(--shadow-sm);}

  /* ============ BUTTONS ============ */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--brand-700);
    color:white;
    border:none;
    padding:9px 16px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    transition:background .15s;
    white-space:nowrap;
    line-height:1.4;
  }
  .btn:hover{background:var(--brand-800);}
  .btn:active{background:var(--brand-900);}
  .btn:disabled{opacity:.5; cursor:not-allowed; background:var(--brand-700);}
  .btn.secondary{
    background:#fff;
    color:var(--ink-700);
    border:1px solid var(--ink-300);
  }
  .btn.secondary:hover{background:var(--ink-50); border-color:var(--ink-400);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#b91c1c;}
  .btn.ghost{background:transparent; color:var(--ink-600); border:none;}
  .btn.ghost:hover{background:var(--ink-100);}
  .btn.sm{padding:6px 12px; font-size:12px;}
  .btn.block{width:100%;}

  /* ============ FORMS ============ */
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-700);
    margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:9px 12px;
    border:1px solid var(--ink-300);
    border-radius:var(--radius);
    font-size:14px;
    font-family:inherit;
    color:var(--ink-900);
    background:#fff;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--brand-500);
    box-shadow:0 0 0 3px var(--brand-100);
  }
  .field input:disabled{background:var(--ink-100); color:var(--ink-500); cursor:not-allowed;}
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  /* ============ SEARCH ============ */
  .search-bar{
    background:#fff;
    border:1px solid var(--ink-300);
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    margin-bottom:20px;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-bar:focus-within{border-color:var(--brand-500); box-shadow:0 0 0 3px var(--brand-100);}
  .search-bar .icon{font-size:16px; color:var(--ink-400);}
  .search-bar input{
    flex:1;
    border:none;
    background:transparent;
    padding:11px 0;
    font-size:14px;
    outline:none;
    font-family:inherit;
  }

  /* ============ RESTAURANT CARDS ============ */
  .restaurant-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:16px;
  }
  .restaurant-card{
    background:#fff;
    border:1px solid var(--ink-200);
    border-radius:var(--radius-lg);
    overflow:hidden;
    cursor:pointer;
    transition:border-color .15s, box-shadow .15s;
    display:flex;
    flex-direction:column;
  }
  .restaurant-card:hover{
    border-color:var(--brand-500);
    box-shadow:var(--shadow-md);
  }
  .restaurant-banner{
    height:100px;
    background:var(--brand-700);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:40px;
    font-weight:700;
  }
  .restaurant-body{padding:14px 16px;}
  .restaurant-body h3{font-size:15px; margin-bottom:4px;}
  .restaurant-cat{
    display:inline-block;
    font-size:10.5px;
    font-weight:600;
    color:var(--brand-700);
    background:var(--brand-50);
    padding:2px 8px;
    border-radius:4px;
    text-transform:uppercase;
    letter-spacing:.03em;
    margin-bottom:6px;
  }
  .restaurant-desc{font-size:12.5px; color:var(--ink-500); line-height:1.5;}

  /* ============ FOOD ITEMS ============ */
  .food-list{display:flex; flex-direction:column; gap:8px;}
  .food-item{
    background:#fff;
    border:1px solid var(--ink-200);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    transition:border-color .15s;
  }
  .food-item:hover{border-color:var(--ink-300);}
  .food-item.disabled{opacity:.6; background:var(--ink-100);}
  .food-info{flex:1; min-width:0;}
  .food-name{font-weight:600; font-size:14px; color:var(--ink-900); margin-bottom:2px;}
  .food-desc{font-size:12.5px; color:var(--ink-500); margin-bottom:6px;}
  .food-price{font-weight:700; color:var(--brand-700); font-size:14px;}

  .qty-control{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--ink-100);
    padding:3px;
    border-radius:var(--radius);
  }
  .qty-control button{
    width:28px; height:28px;
    border-radius:5px;
    border:none;
    background:#fff;
    color:var(--brand-700);
    cursor:pointer;
    font-weight:700;
    font-size:15px;
    font-family:inherit;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s;
    box-shadow:var(--shadow-sm);
  }
  .qty-control button:hover{background:var(--brand-700); color:white;}
  .qty-control span{
    font-weight:600;
    min-width:20px;
    text-align:center;
    font-size:13px;
  }

  /* ============ CART ============ */
  .cart-layout{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:20px;
    align-items:start;
  }
  .cart-items-card{background:#fff; border:1px solid var(--ink-200); border-radius:var(--radius-lg); overflow:hidden;}
  .cart-item-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    border-bottom:1px solid var(--ink-100);
    gap:14px;
  }
  .cart-item-row:last-child{border-bottom:none;}
  .cart-item-info{flex:1; min-width:0;}
  .cart-item-name{font-weight:600; font-size:14px;}
  .cart-item-price{font-size:12.5px; color:var(--ink-500); margin-top:1px;}
  .cart-item-total{font-weight:700; color:var(--brand-700); font-size:14px; min-width:70px; text-align:right;}

  .cart-summary{
    background:#fff;
    border:1px solid var(--ink-200);
    border-radius:var(--radius-lg);
    padding:20px;
    position:sticky;
    top:80px;
  }
  .summary-line{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    font-size:13.5px;
    color:var(--ink-700);
  }
  .summary-line.total{
    border-top:1px solid var(--ink-200);
    margin-top:8px;
    padding-top:14px;
    font-size:16px;
    font-weight:700;
    color:var(--ink-900);
  }
  .penalty-line{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    font-size:13.5px;
    color:var(--danger);
    font-weight:600;
    border-top:1px dashed var(--danger-border);
    border-bottom:1px dashed var(--danger-border);
    margin:8px 0;
  }

  /* ============ ADDRESS PICKER ============ */
  .address-list{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .address-card{
    background:#fff;
    border:1px solid var(--ink-300);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    cursor:pointer;
    transition:all .15s;
    position:relative;
  }
  .address-card:hover{border-color:var(--brand-500);}
  .address-card.selected{
    border-color:var(--brand-600);
    background:var(--brand-50);
    box-shadow:0 0 0 3px var(--brand-100);
  }
  .address-radio{
    width:16px; height:16px;
    border-radius:50%;
    border:2px solid var(--ink-400);
    flex-shrink:0;
    margin-top:3px;
    position:relative;
    transition:all .15s;
  }
  .address-card.selected .address-radio{border-color:var(--brand-700); background:var(--brand-700);}
  .address-card.selected .address-radio::after{
    content:'';
    position:absolute;
    inset:2px;
    border-radius:50%;
    background:#fff;
  }
  .address-content{flex:1; min-width:0;}
  .address-label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    color:var(--ink-900);
    margin-bottom:3px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .address-badge{
    background:var(--brand-700);
    color:white;
    font-size:9px;
    font-weight:700;
    padding:2px 6px;
    border-radius:4px;
    letter-spacing:.04em;
  }
  .address-text{
    font-size:13px;
    color:var(--ink-600);
    line-height:1.5;
  }
  .address-text strong{color:var(--ink-800); font-weight:600;}
  .address-actions{display:flex; gap:4px; flex-shrink:0;}
  .address-actions button{
    background:transparent;
    border:none;
    color:var(--ink-500);
    cursor:pointer;
    font-size:14px;
    padding:4px;
    border-radius:4px;
    transition:all .15s;
  }
  .address-actions button:hover{background:var(--ink-100); color:var(--ink-800);}

  .add-address-btn{
    width:100%;
    padding:12px;
    border:1.5px dashed var(--ink-300);
    background:#fff;
    border-radius:var(--radius);
    cursor:pointer;
    color:var(--ink-600);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    transition:all .15s;
  }
  .add-address-btn:hover{
    border-color:var(--brand-500);
    color:var(--brand-700);
    background:var(--brand-50);
  }

  /* ============ ORDERS ============ */
  .order-card{
    background:#fff;
    border:1px solid var(--ink-200);
    border-radius:var(--radius-lg);
    margin-bottom:12px;
    overflow:hidden;
  }
  .order-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    background:var(--ink-50);
    border-bottom:1px solid var(--ink-200);
    gap:12px;
    flex-wrap:wrap;
  }
  .order-id{font-weight:700; color:var(--ink-900); font-size:14px;}
  .order-meta{font-size:12px; color:var(--ink-500); margin-top:2px;}
  .order-body{
    padding:14px 18px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:16px;
    align-items:center;
  }
  .order-items-list{font-size:13px; color:var(--ink-600); line-height:1.7;}
  .order-total-label{font-size:11px; color:var(--ink-500); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .order-total-value{font-size:18px; font-weight:700; color:var(--brand-700);}

  /* ============ STATUS ============ */
  .status-badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:20px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .status-Placed{background:#dbeafe; color:#1e40af;}
  .status-Accepted{background:#e0e7ff; color:#3730a3;}
  .status-Preparing{background:#fef3c7; color:#92400e;}
  .status-Ready{background:#fed7aa; color:#9a3412;}
  .status-OutforDelivery{background:#cffafe; color:#155e75;}
  .status-Delivered{background:#dcfce7; color:#166534;}
  .status-Cancelled{background:#fee2e2; color:#991b1b;}

  .order-steps{
    display:flex;
    gap:4px;
    padding:12px 18px;
    background:var(--ink-50);
    border-top:1px solid var(--ink-200);
    flex-wrap:wrap;
    align-items:center;
  }
  .order-steps span{
    padding:3px 8px;
    border-radius:4px;
    background:#fff;
    border:1px solid var(--ink-200);
    color:var(--ink-400);
    font-size:10.5px;
    font-weight:600;
  }
  .order-steps span.done{background:var(--success-bg); color:var(--success); border-color:var(--success-border);}
  .order-steps span.current{background:var(--brand-700); color:white; border-color:var(--brand-700);}

  /* ============ ADMIN TABS ============ */
  .admin-tabs{
    display:flex;
    gap:4px;
    margin-bottom:18px;
    background:#fff;
    padding:4px;
    border-radius:var(--radius);
    border:1px solid var(--ink-200);
    width:fit-content;
  }
  .admin-tabs button{
    background:transparent;
    border:none;
    padding:7px 14px;
    border-radius:6px;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-500);
    cursor:pointer;
    transition:all .15s;
  }
  .admin-tabs button:hover{background:var(--ink-100); color:var(--ink-800);}
  .admin-tabs button.active{background:var(--brand-700); color:white;}

  /* ============ TABLES ============ */
  .data-table{
    background:#fff;
    border:1px solid var(--ink-200);
    border-radius:var(--radius-lg);
    overflow:hidden;
  }
  .data-table table{width:100%; border-collapse:collapse; font-size:13px;}
  .data-table th{
    text-align:left;
    padding:11px 16px;
    background:var(--ink-50);
    color:var(--ink-600);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    border-bottom:1px solid var(--ink-200);
  }
  .data-table td{
    padding:12px 16px;
    border-bottom:1px solid var(--ink-100);
    vertical-align:middle;
  }
  .data-table tr:last-child td{border-bottom:none;}
  .data-table tr:hover td{background:var(--ink-50);}
  .data-table .actions{display:flex; gap:5px; justify-content:flex-end;}

  /* ============ STATS ============ */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    margin-bottom:20px;
  }
  .stat-card{
    background:#fff;
    border:1px solid var(--ink-200);
    border-radius:var(--radius-lg);
    padding:16px;
  }
  .stat-label{
    font-size:11px;
    font-weight:600;
    color:var(--ink-500);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .stat-value{
    font-size:22px;
    font-weight:700;
    color:var(--ink-900);
    letter-spacing:-.02em;
  }

  /* ============ PROFILE ============ */
  .profile-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    align-items:start;
  }

  /* ============ AUTH ============ */
  .auth-shell{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:var(--ink-50);
  }
  .auth-card{
    background:#fff;
    border-radius:var(--radius-lg);
    border:1px solid var(--ink-200);
    box-shadow:var(--shadow-md);
    padding:32px;
    width:100%;
    max-width:400px;
  }
  .auth-logo{
    width:48px; height:48px;
    border-radius:10px;
    background:var(--brand-700);
    color:white;
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
    font-weight:700;
    margin:0 auto 16px;
  }
  .auth-card h1{text-align:center; font-size:20px; margin-bottom:4px;}
  .auth-sub{text-align:center; color:var(--ink-500); font-size:13px; margin-bottom:24px;}
  .auth-tabs{
    display:flex;
    background:var(--ink-100);
    padding:4px;
    border-radius:var(--radius);
    margin-bottom:20px;
  }
  .auth-tabs button{
    flex:1;
    background:transparent;
    border:none;
    padding:8px;
    border-radius:6px;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--ink-500);
    cursor:pointer;
    transition:all .15s;
  }
  .auth-tabs button.active{background:#fff; color:var(--brand-700); box-shadow:var(--shadow-sm);}

  /* ============ CART BAR ============ */
  .cart-bar{
    position:fixed;
    bottom:76px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink-900);
    color:white;
    padding:12px 20px;
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    gap:16px;
    cursor:pointer;
    z-index:60;
    box-shadow:var(--shadow-lg);
    font-size:13px;
    font-weight:600;
    transition:transform .15s;
    max-width:calc(100% - 32px);
  }
  .cart-bar:hover{transform:translateX(-50%) translateY(-2px);}
  .cart-bar .count{
    background:var(--brand-500);
    color:white;
    padding:2px 8px;
    border-radius:4px;
    font-size:12px;
    font-weight:700;
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed;
    top:80px;
    right:20px;
    background:var(--ink-900);
    color:white;
    padding:12px 18px;
    border-radius:var(--radius);
    font-size:13px;
    font-weight:500;
    z-index:1000;
    box-shadow:var(--shadow-lg);
    max-width:340px;
    animation:slideIn .2s ease;
    border-left:3px solid var(--brand-500);
  }
  .toast.success{border-left-color:var(--success);}
  .toast.error{border-left-color:var(--danger);}
  @keyframes slideIn{from{transform:translateX(120%); opacity:0;} to{transform:translateX(0); opacity:1;}}

  /* ============ SPINNER / LOADING ============ */
  .spinner{
    width:14px; height:14px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:white;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:inline-block;
  }
  .spinner.dark{border-color:var(--ink-200); border-top-color:var(--brand-700);}
  @keyframes spin{to{transform:rotate(360deg);}}

  .loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
    gap:12px;
  }
  .loading .spinner{width:28px; height:28px; border-width:3px; border-color:var(--ink-200); border-top-color:var(--brand-700);}
  .loading p{color:var(--ink-500); font-size:13px; font-weight:500;}

  .skeleton{
    background:linear-gradient(90deg, var(--ink-100) 25%, var(--ink-200) 50%, var(--ink-100) 75%);
    background-size:200% 100%;
    animation:shimmer 1.5s infinite;
    border-radius:var(--radius);
  }
  @keyframes shimmer{to{background-position:-200% 0;}}

  /* ============ MODAL ============ */
  .modal-bg{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:16px;
    animation:fadeIn .15s;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{
    background:#fff;
    border-radius:var(--radius-lg);
    padding:24px;
    max-width:480px;
    width:100%;
    max-height:90vh;
    overflow-y:auto;
    box-shadow:var(--shadow-lg);
    animation:scaleIn .2s ease;
  }
  @keyframes scaleIn{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}
  .modal h3{margin-bottom:16px; font-size:16px;}

  /* ============ EMPTY ============ */
  .empty{
    text-align:center;
    padding:48px 20px;
    color:var(--ink-500);
  }
  .empty .icon{font-size:40px; margin-bottom:12px; opacity:.4;}
  .empty h3{color:var(--ink-700); margin-bottom:4px; font-size:15px;}
  .empty p{font-size:13px;}

  /* ============ PENALTY BOX ============ */
  .penalty-box{
    background:var(--danger-bg);
    border:1px solid var(--danger-border);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }
  .penalty-box-label{
    font-size:13px;
    font-weight:600;
    color:var(--danger);
  }
  .penalty-box-sub{font-size:12px; color:#b91c1c; margin-top:2px;}
  .penalty-box-value{font-size:18px; font-weight:700; color:var(--danger);}

  /* ============ HELPERS ============ */
  .flex-between{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .divider{height:1px; background:var(--ink-200); margin:12px 0;}

  /* ============ RESPONSIVE ============ */
  @media (max-width:860px){
    .main{padding:16px;}
    .topbar-inner{padding:12px 16px;}
    .brand-text .name{font-size:14px;}
    .cart-layout{grid-template-columns:1fr;}
    .cart-summary{position:static;}
    .profile-grid{grid-template-columns:1fr;}
    .stats-row{grid-template-columns:repeat(2, 1fr);}
    .order-body{grid-template-columns:1fr;}
    .data-table{overflow-x:auto;}
    .data-table table{min-width:600px;}
    .restaurant-grid{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .cart-bar{bottom:72px;}
    .toast{top:70px; right:12px; left:12px; max-width:none;}
    .modal{padding:20px;}
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="cart-root"></div>
<div id="toast-root"></div>
<div id="modal-root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, sendPasswordResetEmail, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc,
  query, where, onSnapshot, getDocs, serverTimestamp,
  deleteDoc, runTransaction, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZy_JeQH7Ofvqru2DME1EsH59Yh5JtRjs",
  authDomain: "pawan-retail-limited07.firebaseapp.com",
  projectId: "pawan-retail-limited07",
  storageBucket: "pawan-retail-limited07.firebasestorage.app",
  messagingSenderId: "595261097611",
  appId: "1:595261097611:web:88a136d144129b142b368e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ============ STATE ============ */
const state = {
  user: null,
  profile: null,
  addresses: [],
  view: 'home',
  cart: JSON.parse(localStorage.getItem('cart') || '{}'),
  currentRestaurant: null,
  checkoutAddressId: null,
  adminTab: 'restaurants',
  unsubs: {},
};

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const money = n => '₹' + Number(n||0).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
};
const saveCart = () => localStorage.setItem('cart', JSON.stringify(state.cart));
const cartSubtotal = () => Object.values(state.cart).reduce((s,i)=>s+i.qty*i.price,0);
const cartItemCount = () => Object.values(state.cart).reduce((s,i)=>s+i.qty,0);
const currentPenalty = () => Number(state.profile?.penaltyBalance || 0);
const cartGrandTotal = () => cartSubtotal() + currentPenalty();
const clearCart = () => { state.cart = {}; saveCart(); };
const loadingHTML = (msg='Loading…') => `<div class="loading"><div class="spinner"></div><p>${msg}</p></div>`;

function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toast-root').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}
function openModal(html, onMount) {
  $('modal-root').innerHTML = `<div class="modal-bg" id="mb"><div class="modal">${html}</div></div>`;
  $('mb').onclick = e => { if (e.target.id === 'mb') closeModal(); };
  if (onMount) onMount();
}
function closeModal() { $('modal-root').innerHTML = ''; }

const formatAddress = a => {
  if (!a) return '';
  const parts = [a.street, a.sector, a.landmark, a.city, a.state, a.pincode].filter(Boolean);
  return parts.join(', ');
};

/* ============ NAV / SHELL ============ */
const NAV_ITEMS = [
  { id:'home', label:'Home', icon:'⌂' },
  { id:'orders', label:'Orders', icon:'▤' },
  { id:'cart', label:'Cart', icon:'▣' },
  { id:'profile', label:'Profile', icon:'◉' },
  { id:'admin', label:'Admin', icon:'⚙', admin:true },
];

function renderShell() {
  const isAdmin = state.profile?.role === 'admin';
  const penalty = currentPenalty();

  $('app').innerHTML = `
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="brand-mark">P</div>
            <div class="brand-text">
              <span class="name">Pawan Retail Limited</span>
              <span class="tag">Food Ordering</span>
            </div>
          </div>
          <div class="topbar-actions">
            ${penalty > 0 ? `<button class="penalty-chip" id="penalty-chip">Penalty ${money(penalty)}</button>` : ''}
          </div>
        </div>
      </header>

      <main class="main" id="root"></main>

      <nav class="bottom-nav">
        <div class="bottom-nav-inner" id="bottom-nav"></div>
      </nav>
    </div>
  `;
  renderBottomNav();
  const pc = $('penalty-chip');
  if (pc) pc.onclick = () => navigate('profile');
}

function renderBottomNav() {
  const nav = $('bottom-nav');
  if (!nav) return;
  const isAdmin = state.profile?.role === 'admin';
  const items = NAV_ITEMS.filter(n => !n.admin || isAdmin);
  const cartCount = cartItemCount();
  nav.innerHTML = items.map(item => {
    const isActive = state.view === item.id || (state.view === 'restaurant' && item.id === 'home');
    let badge = '';
    if (item.id === 'cart' && cartCount > 0) badge = `<span class="badge">${cartCount}</span>`;
    return `
      <button class="nav-item ${isActive?'active':''} ${item.admin?'admin-tab':''}" data-nav="${item.id}">
        <span class="icon">${item.icon}</span>
        <span>${item.label}</span>
        ${badge}
      </button>
    `;
  }).join('');
  nav.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navigate(b.dataset.nav));
}

function navigate(view) {
  state.view = view;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ============ AUTH ============ */
function renderAuth() {
  $('app').innerHTML = `
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-logo">P</div>
        <h1>Pawan Retail Limited</h1>
        <p class="auth-sub">Sign in to order food</p>
        <div class="auth-tabs">
          <button class="active" id="tab-login">Sign In</button>
          <button id="tab-reg">Register</button>
        </div>
        <div id="auth-form"></div>
      </div>
    </div>
  `;
  $('tab-login').onclick = showLogin;
  $('tab-reg').onclick = showRegister;
  showLogin();
}

function showLogin() {
  $('tab-login').classList.add('active'); $('tab-reg').classList.remove('active');
  $('auth-form').innerHTML = `
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com" /></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••" /></div>
    <button class="btn block" id="do-login" style="margin-top:4px">Sign In</button>
    <p style="text-align:center;margin-top:16px">
      <a href="#" id="forgot" style="color:var(--brand-700); font-size:12.5px; font-weight:600; text-decoration:none">Forgot password?</a>
    </p>
  `;
  $('do-login').onclick = doLogin;
  $('forgot').onclick = async e => {
    e.preventDefault();
    const email = $('email').value.trim();
    if (!email) return toast('Enter your email first','error');
    try { await sendPasswordResetEmail(auth, email); toast('Reset email sent','success'); }
    catch (err) { toast(err.message,'error'); }
  };
}

function showRegister() {
  $('tab-reg').classList.add('active'); $('tab-login').classList.remove('active');
  $('auth-form').innerHTML = `
    <div class="field"><label>Full Name</label><input id="r-name" placeholder="Your name" /></div>
    <div class="field"><label>Email</label><input id="r-email" type="email" placeholder="you@example.com" /></div>
    <div class="field"><label>Password</label><input id="r-pass" type="password" placeholder="Min 6 characters" /></div>
    <div class="field"><label>Phone</label><input id="r-phone" placeholder="+91 90000 00000" /></div>
    <button class="btn block" id="do-reg" style="margin-top:4px">Create Account</button>
  `;
  $('do-reg').onclick = doRegister;
}

async function doLogin() {
  const email = $('email').value.trim(), pass = $('password').value;
  if (!email || !pass) return toast('Fill all fields','error');
  const btn = $('do-login'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';
  try { await signInWithEmailAndPassword(auth, email, pass); toast('Welcome back','success'); }
  catch (e) { toast(e.message,'error'); btn.disabled = false; btn.textContent = 'Sign In'; }
}

async function doRegister() {
  const name = $('r-name').value.trim(), email = $('r-email').value.trim();
  const pass = $('r-pass').value, phone = $('r-phone').value.trim();
  if (!name || !email || !pass || !phone) return toast('Fill all fields','error');
  if (pass.length < 6) return toast('Password must be 6+ characters','error');
  const btn = $('do-reg'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating…';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db,'users',cred.user.uid), {
      uid: cred.user.uid, name, email, phone,
      role: 'customer', penaltyBalance: 0,
      createdAt: serverTimestamp()
    });
    toast('Account created','success');
  } catch (e) { toast(e.message,'error'); btn.disabled = false; btn.textContent = 'Create Account'; }
}

/* ============ HOME ============ */
async function renderHome() {
  const root = $('root');
  const penalty = currentPenalty();
  root.innerHTML = `
    <div class="page">
      <div style="margin-bottom:20px">
        <h1>Discover Restaurants</h1>
        <p class="muted" style="margin-top:4px">Order from the best places near you</p>
      </div>
      ${penalty > 0 ? `
        <div class="penalty-box">
          <div>
            <div class="penalty-box-label">Outstanding penalty: ${money(penalty)}</div>
            <div class="penalty-box-sub">This will be automatically added to your next order.</div>
          </div>
        </div>
      ` : ''}
      <div class="search-bar">
        <span class="icon">⌕</span>
        <input id="search" placeholder="Search restaurants or cuisines…" />
      </div>
      <div id="rgrid">${loadingHTML()}</div>
    </div>
  `;
  const snap = await getDocs(query(collection(db,'restaurants'), where('active','==',true)));
  const list = [];
  snap.forEach(d => list.push({ id: d.id, ...d.data() }));
  const paint = (filter='') => {
    const f = filter.toLowerCase();
    const filtered = list.filter(r =>
      (r.name||'').toLowerCase().includes(f) || (r.category||'').toLowerCase().includes(f)
    );
    $('rgrid').innerHTML = filtered.length ? `
      <div class="restaurant-grid">
        ${filtered.map(r => `
          <div class="restaurant-card" data-rid="${r.id}">
            <div class="restaurant-banner">${esc(r.emoji||'R')}</div>
            <div class="restaurant-body">
              <span class="restaurant-cat">${esc(r.category||'Restaurant')}</span>
              <h3>${esc(r.name)}</h3>
              <p class="restaurant-desc">${esc(r.description||'')}</p>
            </div>
          </div>
        `).join('')}
      </div>
    ` : `<div class="empty"><div class="icon">⌕</div><h3>No restaurants found</h3><p>Try a different search</p></div>`;
    document.querySelectorAll('[data-rid]').forEach(c => c.onclick = () => {
      state.currentRestaurant = c.dataset.rid;
      navigate('restaurant');
    });
  };
  paint();
  $('search').oninput = e => paint(e.target.value);
}

/* ============ RESTAURANT ============ */
async function renderRestaurant() {
  if (state.unsubs.menu) { state.unsubs.menu(); state.unsubs.menu = null; }
  if (!state.currentRestaurant) return navigate('home');
  const rDoc = await getDoc(doc(db,'restaurants',state.currentRestaurant));
  if (!rDoc.exists()) { toast('Restaurant not found','error'); return navigate('home'); }
  const r = rDoc.data();
  $('root').innerHTML = `
    <div class="page">
      <button class="btn ghost sm" id="back" style="margin-bottom:16px">← Back</button>
      <div class="card" style="margin-bottom:16px; background:var(--brand-700); border-color:var(--brand-700); color:white">
        <div style="display:flex; align-items:center; gap:16px">
          <div style="width:60px; height:60px; background:rgba(255,255,255,.15); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; flex-shrink:0">${esc(r.emoji||'R')}</div>
          <div style="min-width:0">
            <h1 style="color:white; font-size:22px; margin-bottom:4px">${esc(r.name)}</h1>
            <p style="opacity:.85; font-size:13px">${esc(r.category||'')} · ${esc(r.description||'')}</p>
          </div>
        </div>
      </div>
      <h2 style="font-size:16px; margin-bottom:12px">Menu</h2>
      <div id="menu">${loadingHTML()}</div>
    </div>
  `;
  $('back').onclick = () => navigate('home');

  state.unsubs.menu = onSnapshot(collection(db,'restaurants',state.currentRestaurant,'menu'), snap => {
    const items = [];
    snap.forEach(d => items.push({ id:d.id, ...d.data() }));
    const el = $('menu'); if (!el) return;
    if (!items.length) {
      el.innerHTML = `<div class="empty"><div class="icon">▤</div><h3>No items yet</h3></div>`;
      return;
    }
    el.innerHTML = `<div class="food-list">${items.map(it => {
      const cartItem = state.cart[it.id];
      const qty = cartItem?.qty || 0;
      const otherRest = cartItem && cartItem.restaurantId !== state.currentRestaurant;
      return `
        <div class="food-item ${it.available===false?'disabled':''}">
          <div class="food-info">
            <div class="food-name">${esc(it.name)}</div>
            <div class="food-desc">${esc(it.description||'')}</div>
            <div class="food-price">${money(it.price)} ${it.available===false?'<span class="muted">· Unavailable</span>':''}</div>
          </div>
          ${it.available===false || otherRest ? '' : qty > 0 ? `
            <div class="qty-control">
              <button data-act="dec" data-id="${it.id}">−</button>
              <span>${qty}</span>
              <button data-act="inc" data-id="${it.id}" data-name="${esc(it.name)}" data-price="${it.price}" data-rid="${state.currentRestaurant}">+</button>
            </div>` : `
            <button class="btn sm" data-act="inc" data-id="${it.id}" data-name="${esc(it.name)}" data-price="${it.price}" data-rid="${state.currentRestaurant}">Add</button>
          `}
        </div>
      `;
    }).join('')}</div>`;
    el.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
      const { act, id, name, price, rid } = btn.dataset;
      if (act === 'inc') {
        if (Object.values(state.cart).some(c => c.restaurantId !== rid))
          return toast('Clear cart from another restaurant first','error');
        if (!state.cart[id]) state.cart[id] = { itemId: id, name, price: Number(price), qty: 0, restaurantId: rid };
        state.cart[id].qty++;
      } else {
        if (state.cart[id]) { state.cart[id].qty--; if (state.cart[id].qty <= 0) delete state.cart[id]; }
      }
      saveCart(); renderBottomNav(); renderCartBar(); renderRestaurant();
    });
  });
}

/* ============ CART BAR ============ */
function renderCartBar() {
  const root = $('cart-root');
  const n = cartItemCount();
  if (!n) { root.innerHTML = ''; return; }
  root.innerHTML = `
    <div class="cart-bar" id="cartbar">
      <span>Cart</span>
      <span class="count">${n}</span>
      <span>${money(cartGrandTotal())}</span>
    </div>`;
  $('cartbar').onclick = () => navigate('cart');
}

/* ============ ADDRESS HELPERS ============ */
function loadAddresses() {
  if (state.unsubs.addresses) state.unsubs.addresses();
  const q = query(collection(db,'users',state.user.uid,'addresses'));
  state.unsubs.addresses = onSnapshot(q, snap => {
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    list.sort((a,b) => (b.isDefault?1:0) - (a.isDefault?1:0));
    state.addresses = list;
    if (!state.checkoutAddressId || !list.find(x => x.id === state.checkoutAddressId)) {
      const def = list.find(a => a.isDefault) || list[0];
      state.checkoutAddressId = def ? def.id : null;
    }
    if (state.view === 'cart' || state.view === 'profile' || state.view === 'checkout') {
      render();
    }
  });
}

function addressFormHTML(a = {}) {
  return `
    <div class="field-row">
      <div class="field"><label>Label</label>
        <input id="a-label" value="${esc(a.label||'')}" placeholder="Home, Office…" /></div>
      <div class="field"><label>Phone</label>
        <input id="a-phone" value="${esc(a.phone||'')}" placeholder="+91 90000 00000" /></div>
    </div>
    <div class="field"><label>Street / House No.</label>
      <input id="a-street" value="${esc(a.street||'')}" placeholder="Flat / House / Building" /></div>
    <div class="field-row">
      <div class="field"><label>Sector / Area</label>
        <input id="a-sector" value="${esc(a.sector||'')}" /></div>

function readAddressForm() {
  return {
    label: $('a-label').value.trim(),
    phone: $('a-phone').value.trim(),
    street: $('a-street').value.trim(),
    sector: $('a-sector').value.trim(),
    landmark: $('a-landmark').value.trim(),
    city: $('a-city').value.trim(),
    state: $('a-state').value.trim(),
    pincode: $('a-pincode').value.trim(),
    isDefault: $('a-default').checked,
  };
}
function validateAddress(a) {
  if (!a.label) return 'Label is required';
  if (!a.phone) return 'Phone is required';
  if (!a.street) return 'Street is required';
  if (!a.city) return 'City is required';
  if (!a.state) return 'State is required';
  if (!a.pincode || a.pincode.length < 4) return 'Valid pincode required';
  return null;
}

async function saveAddress(addrId, data) {
  const ref = addrId
    ? doc(db,'users',state.user.uid,'addresses',addrId)
    : doc(collection(db,'users',state.user.uid,'addresses'));

  // If setting as default, unset other defaults first
  if (data.isDefault) {
    await Promise.all(state.addresses.filter(a => a.isDefault && a.id !== addrId).map(a =>
      updateDoc(doc(db,'users',state.user.uid,'addresses',a.id), { isDefault: false })
    ));
  }

  const payload = { ...data, updatedAt: serverTimestamp() };
  if (addrId) {
    await updateDoc(ref, payload);
  } else {
    payload.createdAt = serverTimestamp();
    await setDoc(ref, payload);
    state.checkoutAddressId = ref.id;
  }
}

async function deleteAddress(addrId) {
  if (!confirm('Delete this address?')) return;
  await deleteDoc(doc(db,'users',state.user.uid,'addresses',addrId));
  toast('Address deleted','success');
}

function openAddressModal(addr = null) {

/* ============ PLACE ORDER ============ */
async function placeOrder() {
  const items = Object.values(state.cart);
  const addr = state.addresses.find(a => a.id === state.checkoutAddressId);
  if (!addr) return toast('Select a delivery address','error');
  const notes = $('d-notes')?.value.trim() || '';

  const restaurantId = items[0].restaurantId;
  const btn = $('place'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Placing…';

  try {
    const restSnap = await getDoc(doc(db,'restaurants',restaurantId));
    if (!restSnap.exists() || restSnap.data().active === false)
      throw new Error('Restaurant is currently closed');

    let subtotal = 0;
    const orderItems = [];
    for (const it of items) {
      const mSnap = await getDoc(doc(db,'restaurants',restaurantId,'menu',it.itemId));
      if (!mSnap.exists()) throw new Error(`Item not found: ${it.name}`);
      const m = mSnap.data();
      if (m.available === false) throw new Error(`${m.name} is unavailable`);
      if (!Number.isInteger(it.qty) || it.qty <= 0 || it.qty > 99) throw new Error('Invalid quantity');
      const lineTotal = Number(m.price) * it.qty;
      subtotal += lineTotal;
      orderItems.push({ itemId: it.itemId, name: m.name, price: Number(m.price), qty: it.qty, lineTotal });
    }
    subtotal = Math.round(subtotal * 100) / 100;

    const orderId = doc(collection(db,'foodOrders')).id;
    const customerRef = doc(db,'users',state.user.uid);

    const result = await runTransaction(db, async tx => {
      const userSnap = await tx.get(customerRef);
      if (!userSnap.exists()) throw new Error('Profile missing');
      const penalty = Number(userSnap.data().penaltyBalance || 0);
      const grandTotal = Math.round((subtotal + penalty) * 100) / 100;

      tx.set(doc(db,'foodOrders',orderId), {
        orderId, customerUid: state.user.uid, customerName: userSnap.data().name || '',
        restaurantId, restaurantName: restSnap.data().name,
        items: orderItems, subtotal, penaltyApplied: penalty, total: grandTotal,
        status: 'Placed',
        deliveryAddress: formatAddress(addr),
        deliveryAddressDetail: {
          label: addr.label, street: addr.street, sector: addr.sector,
          landmark: addr.landmark, city: addr.city, state: addr.state,
          pincode: addr.pincode, phone: addr.phone,
        },
        phone: addr.phone, notes,
        penaltyAmount: 0, penaltyStatus: 'none', refundStatus: 'n/a',
        cancelledBy: null, cancellationReason: null, cancelledAt: null,
        createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
      });

      if (penalty > 0) {
        tx.update(customerRef, { penaltyBalance: 0 });
        tx.set(doc(collection(db,'penaltyHistory')), {
          customerUid: state.user.uid, orderId, type: 'cleared', amount: -penalty,
          balanceBefore: penalty, balanceAfter: 0,
          reason: `Cleared in order #${orderId.slice(-8).toUpperCase()}`,
          createdBy: 'system', createdAt: serverTimestamp(),
        });
      }
      return { grandTotal, penalty };
    });

    if (state.profile) state.profile.penaltyBalance = 0;
    toast(`Order placed. Total: ${money(result.grandTotal)}${result.penalty > 0 ? `. Penalty of ${money(result.penalty)} cleared.` : ''}`,'success');
    clearCart();
    navigate('orders');
  } catch (e) {
    toast(e.message || 'Order failed','error');
    btn.disabled = false; btn.textContent = 'Place Order · ' + money(cartGrandTotal());
  }
}

function confirmCancel(orderId) {
  openModal(`
    <h3>Cancel Order?</h3>
    <p class="muted" style="margin-bottom:16px">100% of the order value will be added as a penalty to your account and auto-cleared on your next order.</p>
    <div class="field"><label>Reason for cancellation</label><input id="cr" placeholder="Why are you cancelling?" /></div>
    <div style="display:flex; gap:8px; margin-top:8px">
      <button class="btn secondary" id="no" style="flex:1">Keep Order</button>
      <button class="btn danger" id="yes" style="flex:1">Confirm Cancel</button>
    </div>
  `, () => {
    $('no').onclick = closeModal;
    $('yes').onclick = () => doCancel(orderId, $('cr').value.trim() || 'No reason given');
  });
}

async function doCancel(orderId, reason) {
  const btn = $('yes'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Cancelling…';
  try {
    const customerRef = doc(db,'users',state.user.uid);
    const orderRef = doc(db,'foodOrders',orderId);
    const CANCELLABLE = ['Placed','Accepted'];

    const result = await runTransaction(db, async tx => {
      const oSnap = await tx.get(orderRef);
      if (!oSnap.exists()) throw new Error('Order not found');
      const o = oSnap.data();
      if (o.customerUid !== state.user.uid) throw new Error('Not your order');
      if (o.status === 'Cancelled') throw new Error('Order already cancelled');
      if (!CANCELLABLE.includes(o.status)) throw new Error(`Cannot cancel at status: ${o.status}`);

      const penaltyAmount = Math.round(o.total * 100) / 100;
      const uSnap = await tx.get(customerRef);
      const prevBal = uSnap.data()?.penaltyBalance || 0;
      const newBal = Math.round((prevBal + penaltyAmount) * 100) / 100;

      tx.update(orderRef, {
        status: 'Cancelled', cancelledBy: 'customer', cancellationReason: reason,
        cancelledAt: serverTimestamp(), penaltyAmount, penaltyStatus: 'applied',
        updatedAt: serverTimestamp(),
      });
      tx.update(customerRef, { penaltyBalance: newBal });
      tx.set(doc(collection(db,'penaltyHistory')), {
        customerUid: state.user.uid, orderId, type: 'penalty', amount: penaltyAmount,
        balanceBefore: prevBal, balanceAfter: newBal,
        reason: `Order cancellation: ${reason}`, createdBy: 'customer', createdAt: serverTimestamp(),
      });
      return { penaltyAmount, newBal };
    });

    if (state.profile) state.profile.penaltyBalance = result.newBal;
    toast(`Order cancelled. Penalty: ${money(result.penaltyAmount)}`,'success');
    closeModal();
  } catch (e) {
    toast(e.message || 'Cancel failed','error');
    btn.disabled = false; btn.textContent = 'Confirm Cancel';
  }
}

  $('root').innerHTML = `
    <div class="page">
      <h1 style="margin-bottom:16px">Admin Dashboard</h1>
      <div class="stats-row" id="admin-stats">${loadingHTML()}</div>
      <div class="admin-tabs">
        <button data-atab="restaurants" class="${state.adminTab==='restaurants'?'active':''}">Restaurants</button>
        <button data-atab="orders" class="${state.adminTab==='orders'?'active':''}">Orders</button>
        <button data-atab="customers" class="${state.adminTab==='customers'?'active':''}">Customers</button>
      </div>
      <div id="admin-body">${loadingHTML()}</div>
    </div>
  `;
  loadAdminStats();
  document.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => {
    state.adminTab = b.dataset.atab;
    document.querySelectorAll('[data-atab]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    renderAdminTab(b.dataset.atab);
  });
  renderAdminTab(state.adminTab);
}

async function loadAdminStats() {
  try {
    const [rSnap, oSnap] = await Promise.all([
      getDocs(collection(db,'restaurants')),
      getDocs(collection(db,'foodOrders')),
    ]);
    let totalRevenue = 0, activeOrders = 0;
    oSnap.forEach(d => {
      const o = d.data();
      if (o.status !== 'Cancelled') totalRevenue += (o.total || 0);
      if (!['Delivered','Cancelled'].includes(o.status)) activeOrders++;
    });
    const el = $('admin-stats');
    if (!el) return;
    el.innerHTML = `
      <div class="stat-card"><div class="stat-label">Restaurants</div><div class="stat-value">${rSnap.size}</div></div>
      <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value">${oSnap.size}</div></div>
      <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value">${money(totalRevenue)}</div></div>
      <div class="stat-card"><div class="stat-label">Active Orders</div><div class="stat-value">${activeOrders}</div></div>
    `;
  } catch (e) { /* silently */ }
}

async function renderAdminTab(tab) {
  if (tab === 'restaurants') return adminRestaurants();
  if (tab === 'orders') return adminOrders();
  if (tab === 'customers') return adminCustomers();
}

async function adminRestaurants() {
  const el = $('admin-body');
  el.innerHTML = `
    <div class="flex-between" style="margin-bottom:14px">
      <p class="muted">Manage all restaurants</p>
      <button class="btn" id="add">+ Add Restaurant</button>
    </div>
    <div id="rl">${loadingHTML()}</div>
  `;
  $('add').onclick = () => editRestaurant(null);
  const snap = await getDocs(collection(db,'restaurants'));
  const list = [];
  snap.forEach(d => list.push({ id:d.id, ...d.data() }));
  const rl = $('rl');
  if (!list.length) { rl.innerHTML = `<div class="empty"><div class="icon">▤</div><h3>No restaurants yet</h3></div>`; return; }
  rl.innerHTML = `
    <div class="data-table">
      <table>
        <thead><tr><th>Restaurant</th><th>Category</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody>
          ${list.map(r => `
            <tr>
              <td><b>${esc(r.emoji||'R')} ${esc(r.name)}</b></td>
              <td>${esc(r.category||'—')}</td>
              <td>${r.active ? '<span class="status-badge status-Delivered">Active</span>' : '<span class="status-badge status-Cancelled">Inactive</span>'}</td>
              <td class="actions">
                <button class="btn sm secondary" data-edit="${r.id}">Edit</button>
                <button class="btn sm secondary" data-menu="${r.id}">Menu</button>
                <button class="btn sm ${r.active ? 'danger' : 'secondary'}" data-toggle="${r.id}">${r.active ? 'Deactivate' : 'Activate'}</button>
                <button class="btn sm danger" data-del="${r.id}">Delete</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
  rl.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editRestaurant(list.find(x => x.id === b.dataset.edit)));
  rl.querySelectorAll('[data-menu]').forEach(b => b.onclick = () => adminMenu(b.dataset.menu));
  rl.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const r = list.find(x => x.id === b.dataset.toggle);
    await updateDoc(doc(db,'restaurants',r.id), { active: !r.active });
    toast('Updated','success'); adminRestaurants();
  });
  rl.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this restaurant?')) return;
    await deleteDoc(doc(db,'restaurants',b.dataset.del));
    toast('Deleted','success'); adminRestaurants();
  });
}

function editRestaurant(r) {
  openModal(`
    <h3>${r ? 'Edit' : 'Add'} Restaurant</h3>
    <div class="field"><label>Name</label><input id="rn" value="${esc(r?.name||'')}" /></div>
    <div class="field"><label>Category</label><input id="rc" value="${esc(r?.category||'')}" placeholder="Indian, Chinese…" /></div>
    <div class="field"><label>Emoji / Initial</label><input id="re" value="${esc(r?.emoji||'R')}" maxlength="2" /></div>
    <div class="field"><label>Description</label><textarea id="rd" rows="2">${esc(r?.description||'')}</textarea></div>
    <button class="btn block" id="save">Save</button>
  `, () => {
    $('save').onclick = async () => {
      const data = {
        name: $('rn').value.trim(), category: $('rc').value.trim(),
        emoji: $('re').value.trim() || 'R', description: $('rd').value.trim(),
        active: r ? r.active : true,
      };
      if (!data.name) return toast('Name required','error');
      try {
        if (r) await updateDoc(doc(db,'restaurants',r.id), data);
        else await addDoc(collection(db,'restaurants'), { ...data, createdAt: serverTimestamp() });
        toast('Saved','success'); closeModal(); adminRestaurants();
      } catch (e) { toast(e.message,'error'); }
    };
  });
}

async function adminMenu(rid) {
  const rDoc = await getDoc(doc(db,'restaurants',rid));
  const rName = rDoc.data()?.name || 'Restaurant';
  $('admin-body').innerHTML = `
    <button class="btn ghost sm" id="back" style="margin-bottom:12px">← Back to Restaurants</button>
    <div class="flex-between" style="margin-bottom:14px">
      <h3 style="margin:0">${esc(rName)} — Menu</h3>
      <button class="btn" id="add">+ Add Item</button>
    </div>
    <div id="ml">${loadingHTML()}</div>
  `;
  $('back').onclick = () => adminRestaurants();
  $('add').onclick = () => editMenuItem(rid, null);
  const snap = await getDocs(collection(db,'restaurants',rid,'menu'));
  const items = [];
  snap.forEach(d => items.push({ id:d.id, ...d.data() }));
  const ml = $('ml');
  if (!items.length) { ml.innerHTML = `<div class="empty"><div class="icon">▤</div><h3>No items yet</h3></div>`; return; }
  ml.innerHTML = `
    <div class="data-table">
      <table>
        <thead><tr><th>Item</th><th>Price</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody>
          ${items.map(it => `
            <tr>
              <td><b>${esc(it.name)}</b><div class="muted">${esc(it.description||'')}</div></td>
              <td><b>${money(it.price)}</b></td>
              <td>${it.available ? '<span class="status-badge status-Delivered">Available</span>' : '<span class="status-badge status-Cancelled">Unavailable</span>'}</td>
              <td class="actions">
                <button class="btn sm secondary" data-edit="${it.id}">Edit</button>
                <button class="btn sm danger" data-del="${it.id}">Delete</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
  ml.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editMenuItem(rid, items.find(x => x.id === b.dataset.edit)));
  ml.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete item?')) return;
    await deleteDoc(doc(db,'restaurants',rid,'menu',b.dataset.del));
    adminMenu(rid);
  });
}

function editMenuItem(rid, item) {
  openModal(`
    <h3>${item ? 'Edit' : 'Add'} Menu Item</h3>
    <div class="field"><label>Name</label><input id="mn" value="${esc(item?.name||'')}" /></div>
    <div class="field"><label>Description</label><textarea id="md" rows="2">${esc(item?.description||'')}</textarea></div>
    <div class="field"><label>Price (₹)</label><input id="mp" type="number" min="0" step="0.01" value="${item?.price||''}" /></div>
    <div class="field"><label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;font-weight:500;cursor:pointer"><input type="checkbox" id="ma" ${item?.available!==false?'checked':''} style="width:auto;margin:0" /> Available</label></div>
    <button class="btn block" id="save">Save</button>
  `, () => {
    $('save').onclick = async () => {
      const data = {
        name: $('mn').value.trim(), description: $('md').value.trim(),
        price: Number($('mp').value), available: $('ma').checked,
      };
      if (!data.name || isNaN(data.price) || data.price < 0) return toast('Invalid data','error');
      try {
        if (item) await updateDoc(doc(db,'restaurants',rid,'menu',item.id), data);
        else await addDoc(collection(db,'restaurants',rid,'menu'), data);
        toast('Saved','success'); closeModal(); adminMenu(rid);
      } catch (e) { toast(e.message,'error'); }
    };
  });
}

async function adminOrders() {
  const el = $('admin-body');
  el.innerHTML = `<div id="ol">${loadingHTML()}</div>`;
  const snap = await getDocs(collection(db,'foodOrders'));
  const orders = [];
  snap.forEach(d => orders.push({ id:d.id, ...d.data() }));
  orders.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  const ol = $('ol');
  if (!orders.length) { ol.innerHTML = `<div class="empty"><div class="icon">▤</div><h3>No orders yet</h3></div>`; return; }
  const statuses = ['Placed','Accepted','Preparing','Ready','Out for Delivery','Delivered'];
  ol.innerHTML = `
    <div class="data-table">
      <table>
        <thead><tr><th>Order</th><th>Customer</th><th>Restaurant</th><th>Total</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody>
          ${orders.map(o => `
            <tr>
              <td><b>#${esc(o.orderId.slice(-8).toUpperCase())}</b><div class="muted">${fmtDate(o.createdAt)}</div></td>
              <td>${esc(o.customerName||'—')}<div class="muted">${esc(o.phone||'')}</div></td>
              <td>${esc(o.restaurantName||'—')}</td>
              <td><b>${money(o.total)}</b>${o.penaltyApplied > 0 ? `<div class="muted" style="color:var(--danger)">+${money(o.penaltyApplied)} penalty</div>` : ''}</td>
              <td><span class="status-badge status-${o.status.replace(/\s/g,'')}">${esc(o.status)}</span></td>
              <td class="actions">
                ${o.status !== 'Cancelled' ? `
                  <select data-status="${o.id}" style="width:auto;padding:6px 8px;font-size:12px;border-radius:6px;border:1px solid var(--ink-300)">
                    ${statuses.map(s => `<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
                  </select>
                  <button class="btn sm danger" data-ccancel="${o.id}">Cancel</button>
                ` : `<span class="muted">by ${esc(o.cancelledBy||'—')}</span>`}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
  ol.querySelectorAll('[data-status]').forEach(sel => sel.onchange = async () => {
    const orderId = sel.dataset.status, newStatus = sel.value;
    try {
      await updateDoc(doc(db,'foodOrders',orderId), { status: newStatus, updatedAt: serverTimestamp() });
      await addDoc(collection(db,'adminAuditLogs'), {
        action: 'updateOrderStatus', orderId, toStatus: newStatus,
        adminUid: state.user.uid, createdAt: serverTimestamp(),
      });
      toast('Status updated','success');
    } catch (e) { toast(e.message,'error'); adminOrders(); }
  });
  ol.querySelectorAll('[data-ccancel]').forEach(b => b.onclick = () => {
    openModal(`
      <h3>Cancel Order (Company)</h3>
      <p class="muted" style="margin-bottom:16px">No penalty will be applied to the customer.</p>
      <div class="field"><label>Reason</label><input id="cr" /></div>
      <div style="display:flex; gap:8px">
        <button class="btn secondary" id="no" style="flex:1">Cancel</button>
        <button class="btn danger" id="ok" style="flex:1">Confirm Cancel</button>
      </div>
    `, () => {
      $('no').onclick = closeModal;
      $('ok').onclick = async () => {
        const reason = $('cr').value.trim() || 'Company cancelled';
        try {
          await updateDoc(doc(db,'foodOrders',b.dataset.ccancel), {
            status: 'Cancelled', cancelledBy: 'company', cancellationReason: reason,
            cancelledAt: serverTimestamp(), penaltyAmount: 0, penaltyStatus: 'none',
            updatedAt: serverTimestamp(),
          });
          await addDoc(collection(db,'adminAuditLogs'), {
            action: 'companyCancel', orderId: b.dataset.ccancel, reason,
            adminUid: state.user.uid, createdAt: serverTimestamp(),
          });
          toast('Order cancelled (no penalty)','success'); closeModal(); adminOrders();
        } catch (e) { toast(e.message,'error'); }
      };
    });
  });
}

async function adminCustomers() {
  const el = $('admin-body');
  el.innerHTML = `
    <div class="card" style="margin-bottom:14px;padding:6px">
      <input id="cs" placeholder="Search by UID or email…" style="border:none;padding:9px 12px;width:100%;outline:none;font-family:inherit" />
    </div>
    <div id="cl">${loadingHTML()}</div>
  `;
  const run = async (term='') => {
    const snap = await getDocs(collection(db,'users'));
    const users = [];
    snap.forEach(d => users.push({ id:d.id, ...d.data() }));
    const filtered = term ? users.filter(u => u.id.includes(term) || (u.email||'').toLowerCase().includes(term.toLowerCase())) : users;
    const cl = $('cl');
    if (!filtered.length) { cl.innerHTML = `<div class="empty"><div class="icon">▤</div><h3>No customers found</h3></div>`; return; }
    cl.innerHTML = `
      <div class="data-table">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>UID</th><th>Penalty</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody>
            ${filtered.map(u => `
              <tr>
                <td><b>${esc(u.name||'Unnamed')}</b> ${u.role==='admin'?'<span class="status-badge status-Accepted" style="margin-left:6px">ADMIN</span>':''}</td>
                <td>${esc(u.email||'—')}</td>
                <td><code style="font-size:11.5px">${esc(u.id)}</code></td>
                <td>${u.penaltyBalance > 0 ? `<b style="color:var(--danger)">${money(u.penaltyBalance)}</b>` : '<span class="muted">—</span>'}</td>
                <td class="actions"><button class="btn sm" data-adjust="${u.id}" data-bal="${u.penaltyBalance||0}">Adjust Penalty</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
    cl.querySelectorAll('[data-adjust]').forEach(b => b.onclick = () => adjustPenalty(b.dataset.adjust, b.dataset.bal));
  };
  $('cs').oninput = e => run(e.target.value);
  run();
}

function adjustPenalty(uid, currentBal) {
  openModal(`
    <h3>Adjust Penalty</h3>
    <p class="muted" style="margin-bottom:16px">Current balance: <b>${money(currentBal)}</b></p>
    <div class="field"><label>Type</label>
      <select id="at"><option value="add">Add Penalty</option><option value="waive">Waive / Remove</option></select>
    </div>
    <div class="field"><label>Amount (₹)</label><input id="aa" type="number" min="0" step="0.01" /></div>
    <div class="field"><label>Reason (required)</label><input id="ar" /></div>
    <button class="btn block" id="ok">Apply</button>
  `, () => {
    $('ok').onclick = async () => {
      const type = $('at').value, amt = Number($('aa').value), reason = $('ar').value.trim();
      if (!amt || amt <= 0) return toast('Enter positive amount','error');
      if (!reason) return toast('Reason required','error');
      const btn = $('ok'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Applying…';
      try {
        const customerRef = doc(db,'users',uid);
        await runTransaction(db, async tx => {
          const s = await tx.get(customerRef);
          if (!s.exists()) throw new Error('User not found');
          const prev = s.data().penaltyBalance || 0;
          const delta = type === 'add' ? amt : -amt;
          let next = Math.round((prev + delta) * 100) / 100;
          if (next < 0) next = 0;
          tx.update(customerRef, { penaltyBalance: next });
          tx.set(doc(collection(db,'penaltyHistory')), {
            customerUid: uid, type: type === 'add' ? 'penalty' : 'waive',
            amount: delta, balanceBefore: prev, balanceAfter: next,
            reason, createdBy: state.user.uid, createdAt: serverTimestamp(),
          });
          tx.set(doc(collection(db,'adminAuditLogs')), {
            action: 'adjustPenalty', customerUid: uid, type, amount: delta,
            balanceBefore: prev, balanceAfter: next, reason,
            adminUid: state.user.uid, createdAt: serverTimestamp(),
          });
        });
        toast('Adjusted successfully','success'); closeModal(); adminCustomers(); loadAdminStats();
      } catch (e) { toast(e.message,'error'); btn.disabled = false; btn.textContent = 'Apply'; }
    };
  });
}

/* ============ MAIN RENDER ============ */
function render() {
  if (!state.user) { renderAuth(); return; }
  renderShell();
  renderCartBar();
  switch (state.view) {
    case 'home': return renderHome();
    case 'restaurant': return renderRestaurant();
    case 'cart': return renderCart();
    case 'orders': return renderOrders();
    case 'profile': return renderProfile();
    case 'admin': return renderAdmin();
    default: return renderHome();
  }
}

/* ============ AUTH STATE ============ */
onAuthStateChanged(auth, async user => {
  state.user = user;
  if (user) {
    try {
      const pSnap = await getDoc(doc(db,'users',user.uid));
      state.profile = pSnap.exists() ? pSnap.data() : { role: 'customer', penaltyBalance: 0 };
    } catch { state.profile = { role: 'customer', penaltyBalance: 0 }; }

    // Profile listener
    if (state.unsubs.profile) state.unsubs.profile();
    state.unsubs.profile = onSnapshot(doc(db,'users',user.uid), s => {
      if (s.exists()) {
        state.profile = s.data();
        renderShell();
        if (state.view === 'profile' || state.view === 'cart') render();
      }
    });

    // Addresses listener
    loadAddresses();

    navigate('home');
  } else {
    state.profile = null;
    state.addresses = [];
    state.checkoutAddressId = null;
    Object.values(state.unsubs).forEach(u => u && u());
    state.unsubs = {};
    render();
  }
});
</script>
