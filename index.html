<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pawan Retail - Premium E-Commerce</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    
    <style>
        /* ============================================================
           PREMIUM DESIGN SYSTEM
           ============================================================ */
        :root {
            --primary-forest: #243B35;
            --primary-forest-light: #2d4d45;
            --background-cream: #F6F1E8;
            --almond: #D6BD98;
            --sage: #78917C;
            --cta: #C86B4A;
            --cta-hover: #b85d3d;
            --white: #FFFFFF;
            --dark-text: #17201D;
            --muted-text: #6B756F;
            --light-border: #E4DED2;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 40px rgba(0,0,0,0.1);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xl: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-height: 64px;
            --bottom-nav-height: 68px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--background-cream);
            color: var(--dark-text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* ============================================================
           SPLASH SCREEN
           ============================================================ */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        #splashScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #splashScreen .logo {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary-forest);
            animation: splashLogo 1s ease;
        }
        #splashScreen .logo span { color: var(--cta); }
        #splashScreen .tagline {
            font-size: 16px;
            color: var(--muted-text);
            margin-top: 8px;
            animation: splashFade 1.2s ease;
        }
        #splashScreen .loader {
            margin-top: 30px;
            width: 40px;
            height: 40px;
            border: 3px solid var(--light-border);
            border-top-color: var(--cta);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes splashLogo {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes splashFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ============================================================
           APP SHELL
           ============================================================ */
        .app-shell {
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--background-cream);
            display: none;
            flex-direction: column;
            position: relative;
        }
        .app-shell.active { display: flex; }
        
        /* ============================================================
           HEADER
           ============================================================ */
        .app-header {
            background: var(--primary-forest);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: var(--nav-height);
        }
        .app-header .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .app-header .logo span { color: var(--almond); }
        .app-header .header-actions {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .app-header .header-actions button {
            background: none;
            border: none;
            color: var(--white);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            position: relative;
            transition: var(--transition);
        }
        .app-header .header-actions button:hover { opacity: 0.8; }
        .app-header .header-actions .badge-dot {
            position: absolute;
            top: -2px;
            right: -4px;
            width: 8px;
            height: 8px;
            background: var(--cta);
            border-radius: 50%;
            border: 2px solid var(--primary-forest);
        }
        .app-header .header-actions .badge-count {
            position: absolute;
            top: -6px;
            right: -8px;
            background: var(--cta);
            color: var(--white);
            font-size: 9px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .user-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--almond);
            cursor: pointer;
            transition: var(--transition);
        }
        .user-avatar-small:hover { transform: scale(1.05); }
        
        /* ============================================================
           SEARCH BAR (Header)
           ============================================================ */
        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.12);
            border-radius: 50px;
            padding: 4px 14px;
            flex: 1;
            max-width: 400px;
            transition: var(--transition);
        }
        .search-bar:focus-within {
            background: rgba(255,255,255,0.2);
        }
        .search-bar input {
            background: none;
            border: none;
            color: var(--white);
            padding: 8px 10px;
            font-size: 14px;
            width: 100%;
            outline: none;
        }
        .search-bar input::placeholder { color: rgba(255,255,255,0.6); }
        .search-bar button {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            opacity: 0.7;
        }
        
        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 80px;
            -webkit-overflow-scrolling: touch;
        }
        .main-content::-webkit-scrollbar { width: 0; display: none; }
        
        /* ============================================================
           BOTTOM NAVIGATION
           ============================================================ */
        .bottom-nav {
            background: var(--white);
            border-top: 1px solid var(--light-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
            height: var(--bottom-nav-height);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.04);
            z-index: 200;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 12px;
            transition: var(--transition);
            position: relative;
            min-width: 48px;
        }
        .bottom-nav .nav-item i {
            font-size: 20px;
            color: var(--muted-text);
            transition: var(--transition);
        }
        .bottom-nav .nav-item span {
            font-size: 9px;
            font-weight: 600;
            color: var(--muted-text);
            transition: var(--transition);
        }
        .bottom-nav .nav-item.active i {
            color: var(--primary-forest);
            transform: translateY(-2px);
        }
        .bottom-nav .nav-item.active span {
            color: var(--primary-forest);
        }
        .bottom-nav .nav-item .nav-badge {
            position: absolute;
            top: -4px;
            right: 0;
            background: var(--cta);
            color: var(--white);
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        
        /* ============================================================
           PAGES
           ============================================================ */
        .page {
            display: none;
            animation: fadeUp 0.4s ease;
            padding-top: 12px;
        }
        .page.active { display: block; }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* ============================================================
           COMPONENTS
           ============================================================ */
        
        /* Cards */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-hover); }
        .card:active { transform: scale(0.99); }
        
        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: var(--primary-forest);
            color: var(--white);
        }
        .btn-primary:hover { background: var(--primary-forest-light); }
        .btn-cta {
            background: var(--cta);
            color: var(--white);
        }
        .btn-cta:hover { background: var(--cta-hover); }
        .btn-outline {
            background: transparent;
            color: var(--primary-forest);
            border: 2px solid var(--primary-forest);
        }
        .btn-outline:hover {
            background: var(--primary-forest);
            color: var(--white);
        }
        .btn-ghost {
            background: transparent;
            color: var(--muted-text);
            border: 1px solid var(--light-border);
        }
        .btn-ghost:hover {
            background: var(--background-cream);
        }
        .btn-sm { padding: 8px 16px; font-size: 12px; min-height: 36px; }
        .btn-block { width: 100%; justify-content: center; }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--dark-text);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--light-border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--white);
            transition: var(--transition);
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--sage);
            box-shadow: 0 0 0 4px rgba(120,145,124,0.1);
        }
        .form-group input.error,
        .form-group select.error,
        .form-group textarea.error {
            border-color: var(--cta);
        }
        .form-group .error-text {
            color: var(--cta);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .form-group .error-text.show { display: block; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 8px;
        }
        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .product-card:active { transform: scale(0.97); }
        .product-card .img-wrap {
            position: relative;
            padding-top: 100%;
            background: var(--background-cream);
        }
        .product-card .img-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-card .img-wrap .discount-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--cta);
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 50px;
        }
        .product-card .img-wrap .wishlist-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted-text);
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .product-card .img-wrap .wishlist-btn:hover { transform: scale(1.1); }
        .product-card .img-wrap .wishlist-btn.liked { color: var(--cta); }
        .product-card .img-wrap .stock-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            color: var(--white);
            font-size: 9px;
            padding: 2px 10px;
            border-radius: 50px;
        }
        .product-card .info {
            padding: 12px 14px 14px;
        }
        .product-card .info .name {
            font-size: 13px;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 36px;
            line-height: 1.3;
        }
        .product-card .info .rating {
            font-size: 12px;
            color: var(--sage);
            margin-top: 2px;
        }
        .product-card .info .rating i { margin-right: 2px; }
        .product-card .info .price-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .product-card .info .price-row .current {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-forest);
        }
        .product-card .info .price-row .original {
            font-size: 13px;
            color: var(--muted-text);
            text-decoration: line-through;
        }
        .product-card .info .add-btn {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary-forest);
            color: var(--white);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .product-card .info .add-btn:hover { background: var(--primary-forest-light); }
        .product-card .info .add-btn:active { transform: scale(0.96); }
        .product-card .info .add-btn.in-cart {
            background: var(--sage);
        }
        .product-card .info .add-btn.out-of-stock {
            background: var(--muted-text);
            cursor: not-allowed;
        }
        
        /* Hero Banner */
        .hero-banner {
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            background: linear-gradient(135deg, var(--primary-forest), var(--sage));
            min-height: 180px;
            display: flex;
            align-items: center;
            padding: 24px 28px;
        }
        .hero-banner .content { flex: 1; z-index: 2; }
        .hero-banner .content .badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            color: var(--white);
            display: inline-block;
            margin-bottom: 6px;
        }
        .hero-banner .content h2 {
            color: var(--white);
            font-size: 24px;
            font-weight: 800;
            line-height: 1.2;
        }
        .hero-banner .content p {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin: 4px 0 12px;
        }
        .hero-banner .content .btn {
            background: var(--cta);
            color: var(--white);
            padding: 8px 24px;
            font-size: 13px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .hero-banner .content .btn:hover { background: var(--cta-hover); }
        .hero-banner .art {
            position: absolute;
            right: -10px;
            bottom: -20px;
            font-size: 100px;
            opacity: 0.08;
            z-index: 1;
            color: var(--white);
        }
        .hero-banner .dots {
            position: absolute;
            bottom: 12px;
            right: 16px;
            display: flex;
            gap: 6px;
            z-index: 3;
        }
        .hero-banner .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: var(--transition);
            cursor: pointer;
        }
        .hero-banner .dots span.active {
            background: var(--white);
            width: 18px;
            border-radius: 4px;
        }
        
        /* Categories */
        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0 12px;
            -webkit-overflow-scrolling: touch;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        .category-pill {
            flex-shrink: 0;
            padding: 8px 20px;
            border-radius: 50px;
            background: var(--white);
            border: 1.5px solid var(--light-border);
            font-size: 13px;
            font-weight: 600;
            color: var(--muted-text);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .category-pill:hover {
            border-color: var(--sage);
            color: var(--dark-text);
        }
        .category-pill.active {
            background: var(--primary-forest);
            color: var(--white);
            border-color: var(--primary-forest);
        }
        .category-pill:active { transform: scale(0.95); }
        
        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 8px;
        }
        .section-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--dark-text);
        }
        .section-header .see-all {
            font-size: 13px;
            color: var(--cta);
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .section-header .see-all:hover { opacity: 0.7; }
        
        /* Flash Deals */
        .flash-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 0 12px;
            -webkit-overflow-scrolling: touch;
        }
        .flash-scroll::-webkit-scrollbar { display: none; }
        .flash-card {
            flex-shrink: 0;
            width: 200px;
            background: var(--white);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--cta);
            transition: var(--transition);
        }
        .flash-card:hover { box-shadow: var(--shadow-hover); }
        .flash-card .flash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .flash-card .flash-header .tag {
            background: var(--cta);
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 50px;
        }
        .flash-card .flash-header .countdown {
            font-size: 16px;
            font-weight: 700;
            color: var(--cta);
            font-variant-numeric: tabular-nums;
        }
        .flash-card .flash-name {
            font-weight: 600;
            font-size: 14px;
        }
        .flash-card .flash-discount {
            font-size: 22px;
            font-weight: 800;
            color: var(--cta);
            margin-top: 2px;
        }
        
        /* Order Item */
        .order-item {
            background: var(--white);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .order-item:hover { box-shadow: var(--shadow-hover); }
        .order-item .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .order-item .order-id {
            font-weight: 600;
            font-size: 13px;
            color: var(--dark-text);
        }
        .order-item .order-status {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 50px;
        }
        .order-item .order-status.processing { background: #fef3c7; color: #92400e; }
        .order-item .order-status.shipped { background: #dbeafe; color: #1e40af; }
        .order-item .order-status.delivered { background: #dcfce7; color: #166534; }
        .order-item .order-status.cancelled { background: #fee2e2; color: #991b1b; }
        .order-item .order-status.cancellation_requested { background: #fef3c7; color: #92400e; }
        .order-item .order-items {
            font-size: 13px;
            color: var(--muted-text);
        }
        .order-item .order-total {
            font-weight: 700;
            font-size: 17px;
            color: var(--primary-forest);
            margin-top: 2px;
        }
        .order-item .order-tracking {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }
        .order-item .order-tracking .step {
            flex: 1;
            text-align: center;

// ============================================================
// UTILITY
// ============================================================
function $(id) { return document.getElementById(id); }
function qs(sel, ctx = document) { return ctx.querySelector(sel); }
function qsa(sel, ctx = document) { return ctx.querySelectorAll(sel); }

function formatCurrency(amt) { return '₹' + Number(amt).toFixed(2); }
function getTS() { return firebase.firestore.FieldValue.serverTimestamp(); }
function generateOrderId() { return 'ORD' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substring(2, 5).toUpperCase(); }
function formatDate(ts) {
    if (!ts) return 'N/A';
    const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function formatDateTime(ts) {
    if (!ts) return 'N/A';
    const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
    return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function formatRelativeTime(ts) {
    if (!ts) return 'N/A';
    const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'Just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
    return formatDate(d);
}

// Toast System
function showToast(message, type = 'info', duration = 3000) {
    const container = $('toastContainer');
    const toast = document.createElement('div');
    const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
        <span class="toast-icon"><i class="fas ${icons[type] || icons.info}"></i></span>
        <span>${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
    `;
    container.appendChild(toast);
    setTimeout(() => {
        if (toast.parentElement) toast.remove();
    }, duration);
    return toast;
}

// Modal System

    $('modalBody').innerHTML = html;
    $('modalOverlay').classList.add('active');
}
function closeModal() { 
    $('modalOverlay').classList.remove('active'); 
}

$('modalOverlay').addEventListener('click', function(e) {

});

// Loading State
function setLoading(loading) {
    state.isLoading = loading;
    const btn = document.querySelector('.btn-loading');

        btn.disabled = loading;
        btn.innerHTML = loading ? '<i class="fas fa-spinner fa-spin"></i> Loading...' : btn.dataset.originalText || btn.textContent;
    }
}

// ============================================================
function navigateTo(page) {
    state.currentPage = page;
    // Update bottom nav
    qsa('.bottom-nav .nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
    });
    renderPage(page);
    $('mainContent').scrollTop = 0;
}

// ============================================================
// RENDER ENGINE
// ============================================================
function renderAll() {
    updateHeader();
    renderPage(state.currentPage);
    updateCartBadge();
}

function updateHeader() {
    const avatar = $('headerAvatar');
    if (state.profile?.avatar) {
        avatar.src = state.profile.avatar;
    } else if (state.user) {
        avatar.src = state.avatars[0];
    } else {
        avatar.src = 'https://ui-avatars.com/api/?name=Guest&background=D6BD98&color=243B35&size=64';

function updateCartBadge() {
    const count = state.cart?.length || 0;
    const badge = $('cartBadge');

        badge.textContent = count;
        badge.style.display = 'flex';
        navBadge.textContent = count;
        navBadge.style.display = 'flex';
    } else {
        badge.style.display = 'none';
        navBadge.style.display = 'none';
    }

        'register': renderRegister,

    const newArrivals = products.slice(0, 4);

function productCardHtml(p) {
    const inWishlist = state.wishlist.includes(p.id);
    const inCart = state.cart?.some(i => i.productId === p.id);
    const discount = p.basePrice && p.currentPrice ? Math.round((1 - p.currentPrice/p.basePrice) * 100) : 0;
    const isOutOfStock = (p.stockQuantity || 0) <= 0;
    const rating = p.rating || 0;
    const starHtml = '★'.repeat(Math.floor(rating)) + '☆'.repeat(5 - Math.floor(rating));
    
    return `
        <div class="product-card" data-id="${p.id}" data-name="${p.name.toLowerCase()}" onclick="viewProduct('${p.id}')">
            <div class="img-wrap">
                <img src="${p.images?.[0]?.url || 'https://via.placeholder.com/400x400?text=No+Image'}" 
                     alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x400?text=No+Image'" />
                ${discount > 0 ? `<span class="discount-badge">${discount}%</span>` : ''}
                ${isOutOfStock ? `<span class="stock-badge">Out of Stock</span>` : ''}
                <button class="wishlist-btn ${inWishlist ? 'liked' : ''}" onclick="event.stopPropagation();toggleWishlist('${p.id}')">
                    <i class="fas fa-heart"></i>
                </button>
            </div>
            <div class="info">
                <div class="name">${p.name}</div>
                ${rating > 0 ? `<div class="rating">${starHtml} ${rating}</div>` : ''}
                <div class="price-row">
                    <span class="current">${formatCurrency(p.currentPrice || p.basePrice)}</span>
                    ${p.basePrice && p.currentPrice < p.basePrice ? `<span class="original">${formatCurrency(p.basePrice)}</span>` : ''}
                </div>
                <button class="add-btn ${inCart ? 'in-cart' : ''} ${isOutOfStock ? 'out-of-stock' : ''}" 
                        onclick="event.stopPropagation();addToCart('${p.id}')"
                        ${isOutOfStock ? 'disabled' : ''}>
                    ${isOutOfStock ? 'Out of Stock' : (inCart ? '✓ In Cart' : 'Add to Cart')}
                </button>
            </div>
        </div>
    `;
}

async function renderSearch() {
    const container = $('mainContent');
    const query = state.searchQuery || '';
    let results = [];
    
    if (query.length >= 2) {
        const products = await getProducts(state.pincode);
        results = products.filter(p => 
            p.name.toLowerCase().includes(query.toLowerCase()) || 
            (p.sku && p.sku.toLowerCase().includes(query.toLowerCase())) ||
            (p.category && p.category.toLowerCase().includes(query.toLowerCase()))
        );
        state.searchResults = results;
    }
    
    container.innerHTML = `
        <div style="padding:4px 0 8px;">
            <h2 style="font-size:20px;font-weight:800;color:var(--dark-text);">
                <i class="fas fa-search" style="color:var(--sage);"></i> Search
            </h2>
            <div style="display:flex;gap:8px;margin-top:8px;">
                <input type="text" id="searchPageInput" placeholder="Search products..." 
                       value="${query}" style="flex:1;padding:10px 14px;border:2px solid var(--light-border);border-radius:var(--radius-sm);font-size:14px;" />
                <button class="btn btn-primary" onclick="performPageSearch()" style="padding:10px 20px;width:auto;">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
                ${['Popular', 'Newest', 'Price: Low-High', 'Price: High-Low', 'Rating'].map(s => `
                    <button class="category-pill" onclick="sortSearch('${s}')" style="font-size:11px;padding:4px 14px;">
                        ${s}
                    </button>
                `).join('')}
            </div>
        </div>
        ${results.length === 0 && query.length >= 2 ? `
            <div class="empty-state">
                <i class="fas fa-search"></i>
                <h4>No results found</h4>
                <p>Try searching with different keywords</p>
            </div>
        ` : results.length > 0 ? `
            <div class="product-grid">
                ${results.map(p => productCardHtml(p)).join('')}
            </div>
        ` : `
            <div class="empty-state">
                <i class="fas fa-search"></i>
                <h4>Search for products</h4>
                <p>Enter keywords to find what you're looking for</p>
            </div>
        `}
    `;
    
    // Auto-search on input
    const input = document.getElementById('searchPageInput');
    if (input) {
        input.addEventListener('input', function() {
            state.searchQuery = this.value;
            renderSearch();
        });
        input.focus();
    }
}

function performPageSearch() {
    const input = document.getElementById('searchPageInput');
    if (input) {
        state.searchQuery = input.value;
        renderSearch();
    }
}

function sortSearch(sortType) {
    const results = [...state.searchResults];
    switch(sortType) {
        case 'Popular': results.sort((a, b) => (b.soldCount || 0) - (a.soldCount || 0)); break;
        case 'Newest': results.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)); break;
        case 'Price: Low-High': results.sort((a, b) => (a.currentPrice || a.basePrice) - (b.currentPrice || b.basePrice)); break;
        case 'Price: High-Low': results.sort((a, b) => (b.currentPrice || b.basePrice) - (a.currentPrice || a.basePrice)); break;
        case 'Rating': results.sort((a, b) => (b.rating || 0) - (a.rating || 0)); break;
    }
    state.searchResults = results;
    renderSearch();
}

function showSearchModal() {
    navigateTo('search');
}

function performSearch() {
    const input = document.getElementById('searchInput');
    if (input) {
        state.searchQuery = input.value;
        navigateTo('search');

async function updateCartQty(productId, change) {
    if (!state.user) return;
    try {
        const cartRef = db.collection('carts').doc(state.user.uid);
        const cartDoc = await cartRef.get();
        if (!cartDoc.exists) return;
        let items = cartDoc.data().items || [];
        const idx = items.findIndex(i => i.productId === productId);
        if (idx === -1) return;
        
        items[idx].quantity += change;
        if (items[idx].quantity <= 0) {
            items.splice(idx, 1);
        }
        await cartRef.set({ items }, { merge: true });
        state.cart = items;
        updateCartBadge();
        renderCart();
    } catch (e) {
        showToast(e.message, 'error');
    }
}

function applyCoupon() {
    const input = document.getElementById('couponInput');
    if (!input) return;
    const code = input.value.trim().toUpperCase();
    if (!code) { showToast('Enter a coupon code', 'warning'); return; }
    
    // Check against coupons in Firestore
    db.collection('coupons')
        .where('code', '==', code)
        .where('isActive', '==', true)
        .get()
        .then(snap => {
            if (!snap.empty) {
                const coupon = snap.docs[0].data();
                const now = new Date();
                if (coupon.validFrom && coupon.validUntil) {
                    if (now < coupon.validFrom.toDate()) {
                        showToast('Coupon not yet active', 'error');
                        return;
                    }
                    if (now > coupon.validUntil.toDate()) {
                        showToast('Coupon expired', 'error');
                        return;
                    }
                }
                state.appliedCoupon = code;
                showToast('Coupon applied!', 'success');
                renderCart();
            } else {
                showToast('Invalid coupon code', 'error');
            }
        })
        .catch(() => {
            showToast('Error validating coupon', 'error');
        });
}

function goToCheckout() {
    if (state.cart.length === 0) {
        showToast('Cart is empty', 'error');
        return;
    }
    if (!state.pincode) {
        showToast('Please set your pincode first', 'warning');
        return;
    }
    navigateTo('checkout');
}

async function placeOrder() {
    if (!state.user) { showToast('Please login', 'error'); return; }
    if (state.cart.length === 0) { showToast('Cart is empty', 'error'); return; }
    if (!state.checkoutAddress) { showToast('Please provide shipping address', 'error'); return; }
    
    const items = state.cart;
    const subtotal = items.reduce((s, i) => s + i.priceAtAdd * i.quantity, 0);
    const deliveryCharge = 50;
    const tax = subtotal * 0.12;
    let discount = 0;
    if (state.appliedCoupon) {
        discount = subtotal * 0.10;
    }
    const total = subtotal + deliveryCharge + tax - discount;
    
    showToast('Processing order...', 'info', 2000);
    
    try {
        // Check stock for each item
        for (const item of items) {
            const prodSnap = await db.collection('products').doc(item.productId).get();
            if (!prodSnap.exists) {
                showToast(`Product ${item.name} not found`, 'error');
                return;
            }
            const prodData = prodSnap.data();
            if ((prodData.stockQuantity || 0) < item.quantity) {
                showToast(`Insufficient stock for ${item.name}`, 'error');
                return;
            }
        }
        
        // Create order
        const orderId = generateOrderId();
        const orderData = {
            orderId: orderId,
            userId: state.user.uid,
            items: items,
            pricing: {
                subtotal: subtotal,
                totalDiscount: discount,
                taxAmount: tax,
                deliveryCharge: deliveryCharge,
                grandTotal: total,
                appliedDiscount: state.appliedCoupon ? { type: 'coupon', value: discount, referenceId: state.appliedCoupon } : null
            },
            payment: {
                method: document.querySelector('input[name="payment"]:checked')?.value || 'cod',
                transactionId: 'TXN' + Date.now(),
                paymentStatus: 'pending',
                amount: total
            },
            shipping: {
                address: state.checkoutAddress,
                deliveryMethod: document.querySelector('input[name="delivery"]:checked')?.value || 'standard',
                estimatedDelivery: new Date(Date.now() + 7*86400000).toISOString()
            },
            status: 'processing',
            statusHistory: [{ status: 'processing', timestamp: new Date().toISOString(), note: 'Order placed' }],
            tracking: {
                steps: [
                    { status: 'Order Placed', timestamp: new Date().toISOString(), done: true },
                    { status: 'Confirmed', timestamp: '', done: false },
                    { status: 'Processing', timestamp: '', done: false },
                    { status: 'Shipped', timestamp: '', done: false },
                    { status: 'Out for Delivery', timestamp: '', done: false },
                    { status: 'Delivered', timestamp: '', done: false }
                ]
            },
            createdAt: getTS()
        };
        
        const orderRef = await db.collection('orders').add(orderData);
        
        // Update stock
        for (const item of items) {
            const prodRef = db.collection('products').doc(item.productId);
            await prodRef.update({
                stockQuantity: firebase.firestore.FieldValue.increment(-item.quantity),
                soldCount: firebase.firestore.FieldValue.increment(item.quantity)
            });
        }
        
        // Clear cart
        await db.collection('carts').doc(state.user.uid).set({ items: [] });
        state.cart = [];
        state.appliedCoupon = null;
        updateCartBadge();
        state.lastOrderId = orderRef.id;
        
        showToast('Order placed successfully! 🎉', 'success');
        navigateTo('order-success');
        
    } catch (e) {
        showToast('Order failed: ' + e.message, 'error');
    }
}

// ============================================================
// AUTH FUNCTIONS (Firebase)
// ============================================================
async function registerUser(email, password, name) {
    try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const defaultAvatar = state.avatars[0];
        
        const userData = {
            uid: cred.user.uid,
            email: email,
            username: name,
            displayName: name,
            avatar: defaultAvatar,
            status: 'active',
            suspensionReason: null,
            wallet: { pCoins: 0, pCash: 0, totalLifetimePCoins: 0, totalLifetimePCash: 0 },
            wishlist: [],
            defaultPincode: state.pincode || '',
            savedPincodes: state.pincode ? [state.pincode] : [],
            role: 'user',
            createdAt: getTS(),
            lastLoginAt: getTS()
        };
        await db.collection('users').doc(cred.user.uid).set(userData);
        state.registeredUser = userData;
        state.user = cred.user;
        state.profile = userData;
        return { success: true, user: userData };
    } catch (e) {
        return { success: false, error: e.message };
    }
}

async function loginUser(email, password) {
    try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const doc = await db.collection('users').doc(cred.user.uid).get();
        if (!doc.exists) throw new Error('User profile not found');
        const userData = doc.data();
        
        if (userData.status === 'blocked' || userData.status === 'suspended') {
            await auth.signOut();
            throw new Error(`Account ${userData.status}. ${userData.suspensionReason || 'Contact support.'}`);
        }
        
        const token = await cred.user.getIdTokenResult();
        const isAdmin = token.claims?.admin === true || userData.role === 'admin';
        state.isAdmin = isAdmin;
        state.user = cred.user;
        state.profile = userData;
        
        return { success: true, user: userData, isAdmin };
    } catch (e) {
        return { success: false, error: e.message };
    }
}

async function logoutUser() {
    await auth.signOut();
    state.user = null;
    state.profile = null;
    state.isAdmin = false;
    state.cart = [];
    state.orders = [];
    state.wishlist = [];
    state.registeredUser = null;
    state.appliedCoupon = null;
    showToast('Logged out successfully', 'info');
    renderAll();
}

async function submitCancel(orderId) {
    const method = document.getElementById('cancelMethod').value;
    let details = {};
    
    if (method === 'upi') {
        const upi = document.getElementById('cancelUpi').value.trim();
        if (!upi) { showToast('UPI ID is required', 'error'); return; }
        details = { type: 'upi', upiId: upi };
    } else {
        const acc = document.getElementById('cancelBankAcc').value.trim();
        const ifsc = document.getElementById('cancelIfsc').value.trim();
        const holder = document.getElementById('cancelHolder').value.trim();
        if (!acc || !ifsc || !holder) { showToast('All bank fields are required', 'error'); return; }
        details = { type: 'bank', bankAccount: { accountNumber: acc, ifsc, accountHolder: holder } };
    }
    
    try {
        await db.collection('orders').doc(orderId).update({
            status: 'cancellation_requested',
            cancellation: {
                requestedAt: new Date().toISOString(),
                refundDetails: details
            },
            'statusHistory': firebase.firestore.FieldValue.arrayUnion({
                status: 'cancellation_requested',
                timestamp: new Date().toISOString(),
                note: 'Cancellation requested by user'
            })
        });
        closeModal();
        showToast('Cancellation request submitted!', 'success');
        renderPage('orders');
    } catch (e) {
        showToast(e.message, 'error');
    }
}

async function addToCart(productId) {
    if (!state.user) {
        showToast('Please login first', 'error');
        showLoginModal();
        return;
    }
    
    try {
        const p = await db.collection('products').doc(productId).get();
        if (!p.exists) { showToast('Product not found', 'error'); return; }
        const data = p.data();
        if (data.stockQuantity <= 0) { showToast('Out of stock', 'error'); return; }
        
        const cartRef = db.collection('carts').doc(state.user.uid);
        const cartDoc = await cartRef.get();
        let items = cartDoc.exists ? cartDoc.data().items || [] : [];
        
        const existing = items.find(i => i.productId === productId);
        if (existing) {
            existing.quantity += 1;
        } else {
            items.push({
                productId: productId,
                name: data.name,
                quantity: 1,
                priceAtAdd: data.currentPrice || data.basePrice,
                imageUrl: data.images?.[0]?.url || '',
                sku: data.sku || ''
            });
        }
        
        await cartRef.set({ userId: state.user.uid, items, updatedAt: getTS() }, { merge: true });
        state.cart = items;
        updateCartBadge();
        showToast('Added to cart!', 'success');
        renderPage(state.currentPage);
    } catch (e) {
        showToast(e.message, 'error');
    }
}

async function removeFromCart(productId) {
    if (!state.user) return;
    try {
        const cartRef = db.collection('carts').doc(state.user.uid);
        const cartDoc = await cartRef.get();
        if (!cartDoc.exists) return;
        let items = cartDoc.data().items || [];
        items = items.filter(i => i.productId !== productId);
        await cartRef.set({ items }, { merge: true });
        state.cart = items;
        updateCartBadge();
        showToast('Removed from cart', 'info');
        renderPage(state.currentPage);
    } catch (e) {
        showToast(e.message, 'error');
    }
}

async function toggleWishlist(productId) {
    if (!state.user) {
        showToast('Please login first', 'error');
        showLoginModal();
        return;
    }
    
    const idx = state.wishlist.indexOf(productId);
    if (idx > -1) {
        state.wishlist.splice(idx, 1);
        showToast('Removed from wishlist', 'info');
    } else {
        state.wishlist.push(productId);
        showToast('Added to wishlist ❤️', 'success');
    }
    
    try {
        await db.collection('users').doc(state.user.uid).update({
            wishlist: state.wishlist
        });
    } catch (e) {}
    
    renderPage(state.currentPage);
}

function startCountdown(elementId, endTime) {
    const el = document.getElementById(elementId);
    if (!el) return;
    
    const end = endTime.seconds ? endTime.seconds * 1000 : new Date(endTime).getTime();
    
    function update() {
        const now = Date.now();
        const diff = Math.max(0, end - now);
        const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
        const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
        const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
        el.textContent = `${h}:${m}:${s}`;
        if (diff <= 0) el.textContent = '00:00:00';
    }
    update();
    setInterval(update, 1000);
}

async function viewDeal(dealId) {
    const deal = await db.collection('flashDeals').doc(dealId).get();
    if (!deal.exists) return;
    const d = deal.data();
    const products = [];
    for (const pid of (d.productIds || [])) {
        const p = await db.collection('products').doc(pid).get();
        if (p.exists) products.push({ id: p.id, ...p.data() });

    openModal(`

        <p class="text-muted">${d.discountPercentage}% OFF</p>
        ${products.length === 0 ? `<p class="text-muted">No products in this deal</p>` : 
        products.map(p => `

                <img src="${p.images?.[0]?.url || 'https://via.placeholder.com/40x40'}" 
                     style="width:40px;height:40px;object-fit:cover;border-radius:6px;" />
                <div style="flex:1;font-weight:600;font-size:13px;">${p.name}</div>
                <div style="font-weight:700;color:var(--primary-forest);">${formatCurrency(p.currentPrice)}</div>

}

function detectLocation() {
    if (!navigator.geolocation) {
        showToast('Geolocation not supported', 'error');
        return;
    }
    
    showToast('Detecting location...', 'info');
    navigator.geolocation.getCurrentPosition(
        async (pos) => {
            try {
                // Using reverse geocoding service (free)
                const response = await fetch(`https://api.zippopotam.us/in/${pos.coords.latitude},${pos.coords.longitude}`);
                // For demo, using mock pincode
                const mockPincode = '400001';
                state.pincode = mockPincode;
                if (state.user) {
                    await db.collection('users').doc(state.user.uid).update({
                        defaultPincode: mockPincode,
                        savedPincodes: firebase.firestore.FieldValue.arrayUnion(mockPincode)
                    });
                }
                showToast('Location detected: ' + mockPincode, 'success');
                renderPage('home');
            } catch (e) {
                // Fallback to manual
                showToast('Could not detect pincode. Please enter manually.', 'warning');
            }
        },
        () => {
            showToast('Unable to get location. Please enter pincode manually.', 'warning');
        }
    );
}

async function updatePincode() {
    const input = document.getElementById('pincodeInput');
    if (!input) return;
    const pincode = input.value.trim();
    if (pincode.length === 6 && /^\d+$/.test(pincode)) {
        state.pincode = pincode;
        if (state.user) {

        }

    }
}

                        <span style="font-size:9px;background:var(--cta);color:white;padding:2px 8px;border-radius:50px;margin-left:6px;">Cancellation Requested</span>
                    </div>
                    <span style="font-weight:700;">${formatCurrency(o.pricing?.grandTotal || 0)}</span>
                </div>
                <div style="font-size:12px;color:var(--muted-text);margin:4px 0;">
                    ${o.cancellation?.refundDetails?.type === 'upi' ? 
                        'UPI: ' + o.cancellation.refundDetails.upiId : 
                        'Bank: ' + o.cancellation?.refundDetails?.bankAccount?.accountNumber || ''}
                </div>
                <div style="display:flex;gap:6px;margin-top:6px;">
                    <input type="text" id="utr_${o.id}" placeholder="Bank UTR / Ref ID" 
                           style="flex:1;padding:6px 10px;border:2px solid var(--light-border);border-radius:4px;font-size:12px;" />
                    <button class="btn btn-sm btn-primary" style="width:auto;padding:6px 16px;font-size:12px;" onclick="approveRefund('${o.id}')">
                        <i class="fas fa-check"></i> Approve
                    </button>
                </div>
            </div>
        `).join('')}
        <button class="btn btn-primary mt-12" onclick="closeModal()">Close</button>
    `);
}

async function approveRefund(orderId) {
    const utr = document.getElementById('utr_' + orderId).value.trim();
    if (!utr) { showToast('Bank UTR is required', 'error'); return; }
    
    try {
        await db.collection('orders').doc(orderId).update({
            status: 'cancelled',
            'cancellation.adminApprovedAt': new Date().toISOString(),
            'cancellation.adminUTRNNumber': utr,
            'statusHistory': firebase.firestore.FieldValue.arrayUnion({
                status: 'cancelled',
                timestamp: new Date().toISOString(),
                note: `Cancellation approved. UTR: ${utr}`
            })
        });
        showToast('Refund approved!', 'success');
        closeModal();
        renderPage('admin');
    } catch (e) {
        showToast(e.message, 'error');
    }
}

function showWalletAdjustForm(userId) {
    openModal(`
        <h3>Adjust Wallet</h3>
        <form onsubmit="event.preventDefault();adjustWallet('${userId}')">
            <div class="form-group">
                <label>Wallet Type</label>
                <select id="walletType" style="width:100%;padding:8px 12px;border:2px solid var(--light-border);border-radius:6px;">
                    <option value="pcoin">P-Coins</option>
                    <option value="pcash">P-Cash</option>
                </select>
            </div>
            <div class="form-group">
                <label>Transaction Type</label>
                <select id="txnType" style="width:100%;padding:8px 12px;border:2px solid var(--light-border);border-radius:6px;">
                    <option value="credit">Credit (+)</option>
                    <option value="debit">Debit (-)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Amount *</label>
                <input type="number" id="walletAmount" step="0.01" required />
            </div>
            <div class="form-group">
                <label>Reason * (mandatory)</label>
                <input type="text" id="walletReason" placeholder="e.g., Bonus, Adjustment" required />
            </div>
            <button type="submit" class="btn btn-primary">Apply Adjustment</button>
        </form>
    `);
}

async function adjustWallet(userId) {
    const walletType = document.getElementById('walletType').value;
    const txnType = document.getElementById('txnType').value;
    const amount = parseFloat(document.getElementById('walletAmount').value);
    const reason = document.getElementById('walletReason').value.trim();
    
    if (!amount || amount <= 0) { showToast('Valid amount required', 'error'); return; }
    if (!reason) { showToast('Reason is mandatory', 'error'); return; }
    
    try {
        const userRef = db.collection('users').doc(userId);
        const userSnap = await userRef.get();
        if (!userSnap.exists) { showToast('User not found', 'error'); return; }
        const userData = userSnap.data();
        
        const field = walletType === 'pcoin' ? 'wallet.pCoins' : 'wallet.pCash';
        const currentBalance = walletType === 'pcoin' ? (userData.wallet?.pCoins || 0) : (userData.wallet?.pCash || 0);
        const newBalance = txnType === 'credit' ? currentBalance + amount : currentBalance - amount;
        
        if (newBalance < 0) { showToast('Insufficient balance', 'error'); return; }
        
        await userRef.update({
            [field]: newBalance,
            updatedAt: getTS()
        });
        
        await db.collection('walletTransactions').add({
            userId: userId,
            type: txnType,
            walletType: walletType,
            amount: amount,
            balanceAfter: newBalance,
            source: 'admin_adjustment',
            adminId: state.user?.uid,
            reason: reason,
            createdAt: getTS()
        });
        
        closeModal();
        showToast(`Wallet adjusted! ${txnType === 'credit' ? '+' : '-'} ${amount} ${walletType}`, 'success');
        renderPage('admin');
    } catch (e) {
        showToast(e.message, 'error');
    }
}

function refreshAdminData() {
    showToast('Refreshing data...', 'info');
    renderPage('admin');
}

// AUTH STATE LISTENER
// ============================================================
auth.onAuthStateChanged(async (user) => {
    // Hide splash screen
    if (state.isSplashVisible) {
        state.isSplashVisible = false;
        setTimeout(hideSplash, 1500);
    }
    
    state.user = user;
    if (user) {
        try {
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists) {
                state.profile = { id: doc.id, ...doc.data() };
                state.wishlist = state.profile.wishlist || [];
                state.pincode = state.profile.defaultPincode || '';
                
                const token = await user.getIdTokenResult();
                const isAdmin = token.claims?.admin === true || state.profile.role === 'admin';
                state.isAdmin = isAdmin;
            }
            const cartData = await getCart(user.uid);
            state.cart = cartData?.items || [];
            state.orders = await getOrders(user.uid);
            await getFlashDeals();
        } catch (e) {
            console.error('Profile load error:', e);
        }
    } else {
        state.profile = null;
        state.isAdmin = false;
        state.cart = [];
        state.orders = [];
        state.wishlist = [];
        state.registeredUser = null;
        state.appliedCoupon = null;
    }
    renderAll();
});
