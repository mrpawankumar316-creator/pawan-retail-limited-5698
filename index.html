<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0f14" />
<title>PRL Gaming Hub</title>
<style>
:root {
  --bg: #0d0f14; --surface: #15181f; --surface-2: #1c2029; --surface-3: #232834;
  --border: #262b36; --border-2: #333a48;
  --text: #e8eaed; --text-2: #9aa3b2; --text-3: #6b7280;
  --accent: #3b82f6; --accent-press: #2563eb;
  --gold: #f59e0b; --gold-press: #d97706;
  --success: #22c55e; --danger: #ef4444; --warning: #f59e0b;
  --radius: 10px; --radius-sm: 8px; --radius-lg: 14px;
  --header-h: 56px; --nav-h: 60px;
}
[data-theme="light"] {
  --bg: #f4f5f7; --surface: #fff; --surface-2: #f7f8fa; --surface-3: #eef0f4;
  --border: #e2e5ea; --border-2: #d3d7de; --text: #111418;
  --text-2: #5a6373; --text-3: #8b95a5;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; color: inherit; }
input, select { font-family: inherit; outline: none; }
.hidden { display: none !important; }

/* LOGIN */
.login-view { min-height: 100vh; display: flex; flex-direction: column; padding: 24px 20px; background: var(--bg); }
.login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; margin-top: 12px; }
.login-brand .bm {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px;
}
.login-brand .bt .bt1 { font-size: 16px; font-weight: 800; }
.login-brand .bt .bt2 { font-size: 10px; color: var(--text-3); letter-spacing: 1.5px; font-weight: 600; margin-top: 2px; }
.login-title { font-size: 26px; font-weight: 800; letter-spacing: -.8px; margin-bottom: 6px; }
.login-sub { font-size: 14px; color: var(--text-3); margin-bottom: 26px; font-weight: 500; }
.login-form { max-width: 400px; width: 100%; margin: 0 auto; flex: 1; }
.login-footer { text-align: center; padding: 20px 0 12px; font-size: 13px; color: var(--text-3); font-weight: 500; }
.login-footer .link { color: var(--accent); font-weight: 700; margin-left: 4px; cursor: pointer; }
.login-legal { text-align: center; font-size: 10.5px; color: var(--text-3); padding: 8px 0 4px; }

/* HEADER */
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 14px;
  display: flex; align-items: center; gap: 12px;
  padding-top: env(safe-area-inset-top);
  height: calc(var(--header-h) + env(safe-area-inset-top));
}
.header-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; cursor: pointer; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-text .b1 { font-size: 13px; font-weight: 800; }
.brand-text .b2 { font-size: 9px; color: var(--text-3); font-weight: 600; letter-spacing: 1.2px; margin-top: 2px; }
.header-status { flex: 1; min-width: 0; display: flex; justify-content: center; }
.status-chip {
  font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2);
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.status-chip.live { color: var(--success); border-color: rgba(34,197,94,.35); }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.balance-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 9px;
  font-size: 12.5px; font-weight: 700;
  transition: transform .2s;
}
.balance-pill.bump { transform: scale(1.1); }
.balance-pill .coin {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--warning); display: inline-block;
  position: relative;
}
.balance-pill .coin::after {
  content: '$'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 900; color: rgba(0,0,0,.55);
}
.icon-btn {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; stroke-width: 1.8; }

.app-main {
  flex: 1;
  padding: 14px 14px calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  max-width: 640px; width: 100%; margin: 0 auto;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  color: var(--text-3); font-size: 10px; font-weight: 600;
  position: relative; min-width: 0;
}
.nav-item svg { width: 20px; height: 20px; stroke-width: 1.8; }
.nav-item.active { color: var(--accent); }
.nav-item.active::before {
  content: ''; position: absolute; top: 0; left: 50%;
  transform: translateX(-50%); width: 22px; height: 2px;
  background: var(--accent); border-radius: 0 0 2px 2px;
}

/* CARDS */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
.card-title { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--text-3); text-transform: uppercase; }
.card-title-lg { font-size: 15px; font-weight: 700; }
.balance-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.balance-info .bl { font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; }
.balance-info .bv { font-size: 26px; font-weight: 800; letter-spacing: -.8px; margin-top: 2px; }
.balance-info .bn { font-size: 10px; color: var(--text-3); font-weight: 600; margin-top: 4px; }
.balance-right { text-align: right; }
.balance-right .rate { font-size: 20px; font-weight: 800; color: var(--accent); }
.balance-right .lbl { font-size: 10px; color: var(--text-3); font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }

/* GAME CARDS */
.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.game-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  cursor: pointer; transition: all .2s;
  display: flex; flex-direction: column; gap: 8px;
  min-height: 140px;
}
.game-card:active { transform: scale(.97); }
.game-card.gc-mines { border-color: rgba(245,158,11,.4); }
.game-card.gc-mines:active { background: rgba(245,158,11,.05); }
.game-card.gc-survivor { border-color: rgba(59,130,246,.4); }
.game-card.gc-survivor:active { background: rgba(59,130,246,.05); }
.game-card .gc-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.gc-mines .gc-icon { background: rgba(245,158,11,.15); }
.gc-survivor .gc-icon { background: rgba(59,130,246,.15); }
.game-card .gc-name { font-size: 15px; font-weight: 800; }
.game-card .gc-desc { font-size: 11px; color: var(--text-3); font-weight: 500; line-height: 1.4; }
.game-card .gc-play { font-size: 11px; color: var(--accent); font-weight: 800; letter-spacing: .5px; margin-top: auto; }

/* BUTTONS */
.btn {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; width: 100%; min-height: 46px; padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14.5px; font-weight: 700;
  background: var(--accent); color: #fff;
  transition: all .15s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; background: var(--surface-3); color: var(--text-3); }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-warning { background: var(--warning); color: #1a1a1a; }
.btn-gold { background: var(--gold); color: #1a1a1a; }
.btn-sm { min-height: 36px; padding: 8px 12px; font-size: 13px; width: auto; border-radius: 8px; }

/* LISTS */
.list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.list-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  min-width: 0;
}
.list-row:last-child { border-bottom: none; }
.list-row:active { background: var(--surface-2); }
.list-row .avatar {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface-3); color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; flex-shrink: 0;
}
.list-row .avatar.team-a { background: rgba(59,130,246,.15); color: var(--accent); }
.list-row .avatar.team-b { background: rgba(245,158,11,.15); color: var(--warning); }
.list-row .avatar.won { background: rgba(34,197,94,.15); color: var(--success); }
.list-row .avatar.lost { background: rgba(239,68,68,.15); color: var(--danger); }
.list-row .lr-body { flex: 1; min-width: 0; }
.list-row .lr-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.list-row .lr-sub {
  font-size: 11.5px; color: var(--text-3); margin-top: 2px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.list-row .lr-right { text-align: right; flex-shrink: 0; }
.list-row .lr-amount { font-size: 14px; font-weight: 800; }
.list-row .lr-amount.up { color: var(--success); }
.list-row .lr-amount.down { color: var(--danger); }
.list-row .lr-amount.pending { color: var(--warning); }
.list-row .lr-meta { font-size: 10.5px; color: var(--text-3); margin-top: 2px; font-weight: 600; }

/* BADGES */
.badge {
  display: inline-block; font-size: 10px; font-weight: 800;
  letter-spacing: .5px; padding: 2px 7px; border-radius: 4px;
  text-transform: uppercase;
}
.badge.won, .badge.active, .badge.live { color: var(--success); background: rgba(34,197,94,.12); }
.badge.lost, .badge.eliminated, .badge.blocked { color: var(--danger); background: rgba(239,68,68,.12); }
.badge.pending, .badge.closed, .badge.refund { color: var(--warning); background: rgba(245,158,11,.12); }
.badge.cancelled, .badge.done { color: var(--text-3); background: var(--surface-3); }
.badge.admin { color: var(--warning); background: rgba(245,158,11,.12); }
.badge.error { color: var(--danger); background: rgba(239,68,68,.2); border: 1px solid var(--danger); }

/* MINES BOARD */
.mines-board-wrap { position: relative; width: 100%; aspect-ratio: 1/1; margin: 14px 0; }
.mines-board {
  display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
  gap: 6px; width: 100%; height: 100%;
}
.tile {
  position: relative;
  background: linear-gradient(180deg, var(--surface-3), var(--surface-2));
  border: 1px solid var(--border-2); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .15s;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
.tile:not(.revealed):not(.disabled):active { transform: scale(.94); }
.tile.disabled { cursor: not-allowed; opacity: .8; }
.tile .gem, .tile .bomb {
  width: 55%; height: 55%; opacity: 0; transform: scale(.5);
  transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.3);
}
.tile.revealed .gem, .tile.revealed .bomb { opacity: 1; transform: scale(1); }
.tile .gem { color: var(--gold); }
.tile .bomb { color: var(--danger); }
.tile.revealed.safe { background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.5); }
.tile.revealed.mine { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.6); }
.tile.revealed.mine.boom { animation: boom .5s ease-out; }
@keyframes boom {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); box-shadow: 0 0 20px rgba(239,68,68,.7); }
  100% { transform: scale(1); }
}
.tile .idx { position: absolute; top: 4px; left: 6px; font-size: 8px; color: var(--text-3); font-weight: 700; opacity: .5; }

.multiplier-display {
  background: linear-gradient(135deg, rgba(245,158,11,.12), rgba(245,158,11,.03));
  border: 1px solid rgba(245,158,11,.3); border-radius: var(--radius);
  padding: 14px; text-align: center; margin-bottom: 10px;
}
.multiplier-display .lbl { font-size: 10px; color: var(--text-3); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.multiplier-display .val { font-size: 32px; font-weight: 900; letter-spacing: -1.5px; color: var(--gold); margin-top: 4px; }
.multiplier-display .potential { font-size: 12px; color: var(--text-3); font-weight: 700; margin-top: 4px; }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.stat-cell { background: var(--surface-2); border-radius: 8px; padding: 10px; text-align: center; }
.stat-cell .k { font-size: 9px; color: var(--text-3); font-weight: 800; letter-spacing: .6px; text-transform: uppercase; }
.stat-cell .v { font-size: 15px; font-weight: 800; margin-top: 3px; }
.stat-cell .v.success { color: var(--success); }
.stat-cell .v.danger { color: var(--danger); }
.stat-cell .v.accent { color: var(--accent); }

/* CHIPS */
.chip-row { display: grid; gap: 5px; }
.chip-row.mines { grid-template-columns: repeat(4, 1fr); }
.chip-row.stake { grid-template-columns: repeat(5, 1fr); }
.chip {
  padding: 8px 4px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); font-size: 12px; font-weight: 800;
  min-height: 36px; text-align: center;
}
.chip.active { background: var(--gold); border-color: var(--gold); color: #1a1a1a; }
.chip .rate {
  display: block; font-size: 9px; font-weight: 700;
  color: var(--text-3); margin-top: 2px;
}
.chip.active .rate { color: rgba(0,0,0,.6); }

.stake-input {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 4px 12px; margin-top: 8px;
}
.stake-input:focus-within { border-color: var(--gold); }
.stake-input input {
  flex: 1; border: none; background: transparent; color: var(--text);
  font-size: 16px; font-weight: 800; padding: 8px 0; width: 100%; min-width: 0;
}
.stake-input .u { font-size: 11px; color: var(--text-3); font-weight: 800; }

/* RESULT */
.result-banner { padding: 16px; border-radius: var(--radius); margin-bottom: 10px; text-align: center; animation: popIn .35s; }
.result-banner.win { background: linear-gradient(135deg, rgba(34,197,94,.15), rgba(34,197,94,.05)); border: 1px solid rgba(34,197,94,.4); }
.result-banner.loss { background: linear-gradient(135deg, rgba(239,68,68,.15), rgba(239,68,68,.05)); border: 1px solid rgba(239,68,68,.4); }
.result-banner.refund { background: linear-gradient(135deg, rgba(245,158,11,.15), rgba(245,158,11,.05)); border: 1px solid rgba(245,158,11,.4); }
.result-banner .ico { font-size: 32px; margin-bottom: 6px; }
.result-banner .title { font-size: 18px; font-weight: 800; }
.result-banner .sub { font-size: 12.5px; color: var(--text-3); margin-top: 4px; font-weight: 600; }
.result-banner .amt { font-size: 22px; font-weight: 900; margin-top: 8px; }
.result-banner.win .amt { color: var(--success); }
.result-banner.loss .amt { color: var(--danger); }
.result-banner.refund .amt { color: var(--warning); }
@keyframes popIn { 0% { opacity: 0; transform: scale(.9) } 100% { opacity: 1; transform: scale(1) } }

/* TEAM PANEL */
.teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.team-panel {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 12px; transition: all .15s;
}
.team-panel.selectable { cursor: pointer; }
.team-panel.selectable:active { background: var(--surface-2); }
.team-panel.selected-a { border-color: var(--accent); background: rgba(59,130,246,.05); }
.team-panel.selected-b { border-color: var(--warning); background: rgba(245,158,11,.05); }
.team-panel.dead { opacity: .55; }
.tp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.tp-name { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.tp-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.team-panel.team-B .tp-dot { background: var(--warning); }
.tp-badge {
  font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
}
.tp-badge.alive { color: var(--success); border-color: rgba(34,197,94,.35); }
.tp-badge.dead { color: var(--danger); border-color: rgba(239,68,68,.35); }
.tp-stat { display: flex; justify-content: space-between; font-size: 11.5px; padding: 3px 0; }
.tp-stat .k { color: var(--text-3); font-weight: 600; }
.tp-stat .v { font-weight: 700; }
.tp-rate { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
.tp-rate .lbl { font-size: 9px; color: var(--text-3); font-weight: 800; text-transform: uppercase; }
.tp-rate .val { font-size: 18px; font-weight: 800; color: var(--accent); }
.team-panel.team-B .tp-rate .val { color: var(--warning); }

/* STICKY */
.sticky-action {
  position: sticky; bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom));
  background: var(--bg); padding: 10px 14px 4px; margin: 0 -14px; z-index: 20;
}

/* PROFILE */
.profile-header {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 14px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 14px;
}
.profile-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 20px;
}
.profile-info { flex: 1; min-width: 0; }
.profile-info .pi-name { font-size: 17px; font-weight: 800; }
.profile-info .pi-email { font-size: 12px; color: var(--text-3); margin-top: 2px; }

.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.kpi-card .kk { font-size: 10px; color: var(--text-3); font-weight: 700; text-transform: uppercase; }
.kpi-card .kv { font-size: 22px; font-weight: 800; margin-top: 4px; }
.kpi-card .kv.accent { color: var(--accent); }
.kpi-card .kv.success { color: var(--success); }
.kpi-card .kv.warning { color: var(--warning); }
.kpi-card .kv.danger { color: var(--danger); }

/* FORM */
.form-field { margin-bottom: 12px; }
.form-field label {
  display: block; font-size: 11px; color: var(--text-3);
  font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
  margin-bottom: 6px;
}
.form-field input, .form-field select {
  width: 100%; padding: 12px 14px;
  background: var(--surface); border: 1.5px solid var(--border-2);
  color: var(--text); border-radius: var(--radius); font-size: 15px; min-height: 46px;
}
.form-field input:focus, .form-field select:focus { border-color: var(--accent); }

/* SHEET */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn .18s;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.sheet {
  background: var(--surface); border-radius: 16px 16px 0 0;
  width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto;
  animation: slideUp .22s;
  padding-bottom: calc(env(safe-area-inset-bottom) + 8px);
}
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
.sheet-handle { width: 36px; height: 4px; background: var(--border-2); border-radius: 2px; margin: 10px auto 6px; }
.sheet-head {
  padding: 6px 16px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); gap: 12px;
}
.sheet-head h3 { font-size: 16px; font-weight: 800; }
.sheet-body { padding: 16px; }
.sheet-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
}

/* TOAST */
.toast {
  position: fixed; left: 50%;
  bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(120px);
  background: var(--surface-3); color: var(--text);
  border: 1px solid var(--border-2);
  padding: 12px 18px; border-radius: 10px;
  font-size: 13.5px; font-weight: 600;
  z-index: 200; max-width: calc(100% - 32px);
  text-align: center; pointer-events: none;
  transition: transform .25s cubic-bezier(.2,.9,.3,1.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.err { border-color: rgba(239,68,68,.5); }
.toast.ok { border-color: rgba(34,197,94,.5); }

/* SPINNER */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
  border-radius: 50%; animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* EMPTY */
.empty { padding: 32px 20px; text-align: center; color: var(--text-3); font-size: 13px; }
.empty .ico { font-size: 28px; opacity: .4; margin-bottom: 8px; }

/* LIVE TRACKER */
.live-tracker {
  background: linear-gradient(135deg, rgba(34,197,94,.08), rgba(34,197,94,.03));
  border: 1px solid rgba(34,197,94,.3);

}
.live-tracker .lt-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success); animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(1.3); } }

/* ERROR/REFUND BANNER */
.status-alert {
  padding: 12px; border-radius: var(--radius); margin-bottom: 10px;

/* AUTH UI */
window.showRegister = () => {
  document.getElementById('loginForm').classList.add('hidden');

};
window.showLogin = () => {
  document.getElementById('registerForm').classList.add('hidden');

  const el = document.getElementById(which === 'login' ? 'loginMsg' : 'registerMsg');

  el.innerHTML = `<div style="padding:10px 12px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:12px;background:${bg};color:${fg};border:1px solid ${bd}">${text}</div>`;
}

window.doLogin = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) return loginMsg('Enter email and password');
  const btn = document.getElementById('loginBtn');

  try {
    await signInWithEmailAndPassword(auth, email, pass);

    loginMsg((e.message||'').replace('Firebase: ','')||'Sign in failed');

window.doRegister = async () => {
  const name = document.getElementById('regName').value.trim();

window.doLogout = async () => {

/* AUTH OBSERVER */
onAuthStateChanged(auth, async (user) => {
  unsubAll();
  if (!user) {
    state.user = null; state.profile = null; state.isAdmin = false;
    state.matches = []; state.players = []; state.predictions = [];
    state.users = []; state.rounds = []; state.history = [];
    Object.assign(state.mines, {
      gameId: null, status: 'IDLE', revealedTiles: [], revealedSafe: [],
      minePositions: null, multiplier: 1, payout: 0, busy: false,
      view: 'game', history: [], adminGames: [], liveGames: []
    });
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('appView').classList.add('hidden');
    return;
  }
  state.user = user;

  let isAdmin = false;
  try {
    const aSnap = await getDoc(doc(db, 'admins', user.uid));
    isAdmin = aSnap.exists();
  } catch(e) {}
  state.isAdmin = isAdmin;

  const profRef = doc(db, 'users', user.uid);
  let profSnap = await getDoc(profRef);

    try {
      await setDoc(profRef, {
        email: user.email,
        name: user.displayName || (user.email||'').split('@')[0],
        demoPoints: 1000, blocked: false, role: 'customer',
        createdAt: serverTimestamp()
      });
      profSnap = await getDoc(profRef);

  }
  if (profSnap.exists() && profSnap.data().blocked) {
    toast('Account blocked.', 'err');
    setTimeout(() => signOut(auth), 1500);
    return;

  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');

  attachProfileListener();
  attachSettingsListener();
  attachMatchesListener();
  attachPlayersListener();
  attachPredictionsListener();
  attachRoundsListener();
  if (isAdmin) {
    attachUsersListener();
    attachHistoryListener();
    attachAdminMinesLiveListener();
  }

  state.currentPage = 'home';
  renderNav();
  render();

  // Auto-refund stale active games on user login
  await checkAndRefundStaleGames();
});

/* LISTENERS */
function attachProfileListener() {
  const un = onSnapshot(doc(db, 'users', state.user.uid), snap => {
    if (!snap.exists()) return;

      if (pill) { pill.classList.add('bump'); setTimeout(()=>pill.classList.remove('bump'),200); }

function attachSettingsListener() {

function attachMatchesListener() {

    state.matches = snap.docs.map(d => ({ id: d.id, ...d.data() }))

/* NAV */

function svgIcon(name) {

    home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/>',

/* COMBINATORICS */
function C(n, k) {
  if (k < 0 || k > n) return 0;
  if (k === 0 || k === n) return 1;
  k = Math.min(k, n - k);
  let r = 1;
  for (let i = 1; i <= k; i++) r = r * (n - k + i) / i;
  return Math.round(r);
}

/* MINES MULTIPLIER — House Edge 7% */
function calcMinesMultiplier(safeRevealed, mines) {
  const totalTiles = 25;
  const remaining = totalTiles - safeRevealed;
  if (mines > remaining) return 0;
  const total = C(totalTiles, mines);
  const left = C(remaining, mines);
  if (left === 0) return 0;
  return (total / left) * 0.93;
}

function maxMultiplier(mines) {
  return calcMinesMultiplier(25 - mines, mines);
}

/* MATH (Survivor) */
function currentMatch() {
  if (!state.currentMatchId) return null;
  return state.matches.find(m => m.id === state.currentMatchId) || null;
}

function teamStats(teamId, matchId = null) {
  const s = state.settings || { baseWinRate: 25, baseRate: 2 };
  const mid = matchId || state.currentMatchId;
  const all = state.players.filter(p => p.teamId === teamId && (!mid || !p.matchId || p.matchId === mid));
  const alive = all.filter(p => p.status === 'ACTIVE').length;
  const dead = all.filter(p => p.status === 'ELIMINATED').length;
  const otherId = teamId === 'A' ? 'B' : 'A';
  const otherAlive = state.players.filter(p => p.teamId === otherId && (!mid || !p.matchId || p.matchId === mid) && p.status === 'ACTIVE').length;
  const totalAlive = alive + otherAlive;
  const isDead = all.length > 0 && alive === 0;
  let winRate = 0;
  if (totalAlive > 0) winRate = (s.baseWinRate * alive) / totalAlive;
  let rate = s.baseRate;
  if (alive > 0 && totalAlive > 0) rate = s.baseRate * (totalAlive / (2 * alive));
  rate = Math.min(100, Math.max(1.01, rate));
  return { teamId, activeCount: alive, eliminatedCount: dead, totalPlayers: all.length, totalAlive, winRate, rate, isDead };
}

function roundStatusForMatch(m) {
  if (!m) return { code: 'NO_MATCH', msg: 'No match' };
  if (m.status === 'FINISHED') return { code: 'FINISHED', msg: `Match #${m.matchNumber} finished`, winner: m.winner };
  if (m.status === 'WAITING') return { code: 'WAITING', msg: 'Match starting soon' };
  const r = state.rounds.find(x => x.roundNumber === m.currentRound && x.matchId === m.id);
  if (!r) return { code: 'NO_ROUND', msg: 'Waiting for next round' };
  if (r.status === 'OPEN') return { code: 'OPEN', msg: `Round ${r.roundNumber} — Betting open`, round: r };
  if (r.status === 'CLOSED') return { code: 'CLOSED', msg: `Round ${r.roundNumber} — Closed`, round: r };
  if (r.status === 'RESULT_DECLARED') {
    if (!r.eliminationDone) return { code: 'ELIMINATING', msg: `Awaiting elimination`, round: r };
    return { code: 'COMPLETED', msg: `Team ${r.winner} won round ${r.roundNumber}`, round: r };
  }
  return { code: 'UNKNOWN', msg: 'Unknown' };
}

function fmt(n, d = 2) { return Number(n || 0).toFixed(d); }
function fmtInt(n) { return Math.floor(Number(n || 0)).toLocaleString(); }
function fmtRate(n) {
  if (n >= 1000) return n.toFixed(0) + 'X';
  if (n >= 100) return n.toFixed(1) + 'X';
  return n.toFixed(2) + 'X';
}
function timeAgo(ts) {
  if (!ts) return '—';
  const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h';
  return Math.floor(diff / 86400) + 'd';
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* GAME ID */
function generateGameId() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const rand = crypto.getRandomValues(new Uint8Array(4));
  const hex = Array.from(rand).map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase().slice(0,6);
  return `MINES-${y}${m}${d}-${hex}`;
}
function secureRandomInt(max) {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] % max;
}
function pickMines(count) {
  const positions = [];
  const used = new Set();
  while (positions.length < count) {
    const v = secureRandomInt(25);
    if (!used.has(v)) { used.add(v); positions.push(v); }
  }
  return positions.sort((a,b)=>a-b);
}

/* ═══════════════════════════════════════════════════
   AUTO-SETTLE / REFUND LOGIC
   - Runs on user login
   - Checks activeGames lock
   - If game doc exists and status !== ACTIVE → clean lock
   - If game doc missing / undefined → REFUND stake
   - If minePositions missing → REFUND stake
   ═══════════════════════════════════════════════════ */
async function checkAndRefundStaleGames() {
  if (!state.user) return;
  try {
    const lockRef = doc(db, 'activeGames', state.user.uid);
    const lockSnap = await getDoc(lockRef);
    if (!lockSnap.exists()) return;

    const gameId = lockSnap.data().gameId;
    const gameRef = doc(db, 'minesGames', gameId);
    const privRef = doc(db, 'minesGamesPrivate', gameId);

    const [gSnap, pSnap] = await Promise.all([getDoc(gameRef), getDoc(privRef)]);

    // Case 1: game doc missing → REFUND
    if (!gSnap.exists()) {
      await refundStaleGame(gameId, null, 'GAME_DOC_MISSING');
      return;
    }

    const g = gSnap.data();

    // Case 2: game already finished → just clean lock
    if (g.status !== 'ACTIVE') {
      await deleteDoc(lockRef);
      return;
    }

    // Case 3: still active but data inconsistent → REFUND
    const missingMines = !pSnap.exists() || !(pSnap.data().minePositions || []).length;
    const badStake = !Number.isFinite(g.stake) || g.stake <= 0;
    const badMine = !Number.isFinite(g.mineCount) || g.mineCount < 1 || g.mineCount > 24;
    const staleFor = g.createdAt?.seconds
      ? (Date.now() / 1000 - g.createdAt.seconds) > 3600  // 1 hour
      : true;

    if (missingMines || badStake || badMine) {
      await refundStaleGame(gameId, g, missingMines ? 'MISSING_MINES' : badStake ? 'BAD_STAKE' : 'BAD_MINE_COUNT');
      return;
    }

    // Case 4: stale (1 hour old) → REFUND
    if (staleFor) {
      await refundStaleGame(gameId, g, 'STALE_TIMEOUT');
      return;
    }

    // Otherwise resume
    state.mines.gameId = g.gameId;
    state.mines.mineCount = g.mineCount;
    state.mines.stake = g.stake;
    state.mines.status = 'ACTIVE';
    state.mines.revealedTiles = g.revealedTiles || [];
    state.mines.revealedSafe = g.revealedSafe || [];
    state.mines.multiplier = g.multiplier || 1;
    state.mines.minePositions = pSnap.data().minePositions || null;
    toast('Resumed ' + g.gameId, 'ok');
  } catch(e) {
    console.error('checkAndRefundStaleGames', e);
  }
}

async function refundStaleGame(gameId, gameData, reason) {
  const userRef = doc(db, 'users', state.user.uid);
  const gameRef = doc(db, 'minesGames', gameId);
  const lockRef = doc(db, 'activeGames', state.user.uid);

  try {
    await runTransaction(db, async (tx) => {
      const uSnap = await tx.get(userRef);
      const gSnap = gameData ? null : await tx.get(gameRef);
      const g = gameData || (gSnap && gSnap.exists() ? gSnap.data() : null);
      const stake = Number(g?.stake || 0);

      const bal = uSnap.data().demoPoints || 0;
      const newBal = bal + stake;

      tx.update(userRef, { demoPoints: newBal });

      if (gSnap && gSnap.exists && gSnap.exists()) {
        tx.update(gameRef, {
          status: 'REFUND',
          result: 'REFUND',
          refundAmount: stake,
          refundReason: reason,
          completedAt: serverTimestamp()
        });
      } else if (g) {
        // recreate doc with refund
        tx.set(gameRef, {
          ...g,
          status: 'REFUND',
          result: 'REFUND',
          refundAmount: stake,
          refundReason: reason,
          completedAt: serverTimestamp()
        }, { merge: true });
      }

      tx.delete(lockRef);
      tx.set(doc(collection(db, 'coinTransactions')), {
        uid: state.user.uid, gameId,
        type: 'GAME_REWARD', amount: stake,
        previousBalance: bal, newBalance: newBal,
        timestamp: serverTimestamp(),
        note: 'Auto-refund: ' + reason
      });
    });

    toast(`↩️ Refunded ${gameId} (${reason})`, 'ok');
    Object.assign(state.mines, {
      gameId: null, status: 'IDLE', revealedTiles: [], revealedSafe: [],
      minePositions: null, multiplier: 1, payout: 0, result: null
    });
    render();
  } catch(e) {
    console.error('refundStaleGame', e);
    toast('Refund failed — contact admin', 'err');
  }
}

  switch (state.currentPage) {

    case 'mines': html = viewMines(); break;
    case 'survivor': html = viewSurvivor(); break;
    case 'history': html = viewHistory(); break;

  if (state.currentPage === 'mines') attachMinesStakeListener();
}

function renderMinesBoard() {
  const mg = state.mines;

  for (let i = 0; i < 25; i++) {
    const isRevealed = mg.revealedTiles.includes(i);
    const isSafe = mg.revealedSafe.includes(i);
    const isMine = mg.minePositions && mg.minePositions.includes(i);
    const gameOver = mg.status !== 'ACTIVE' && mg.status !== 'IDLE';
    const isActive = mg.status === 'ACTIVE';
    let cls = 'tile', content = '';
    if (isRevealed) {
      if (isSafe) {
        cls += ' revealed safe';
        content = `<svg class="gem" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>`;
      } else {
        cls += ' revealed mine';
        if (gameOver) cls += ' boom';
        content = `<svg class="bomb" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="14" r="7"/></svg>`;
      }
    } else if (gameOver && isMine) {
      cls += ' revealed mine';
      content = `<svg class="bomb" viewBox="0 0 24 24" fill="currentColor" opacity=".4"><circle cx="12" cy="14" r="7"/></svg>`;
    } else {
      content = `<span class="idx">${i}</span>`;
      if (!isActive) cls += ' disabled';
    }
    if (mg.busy) cls += ' disabled';
    tiles.push(`<div class="${cls}" data-idx="${i}" onclick="minesTileClick(${i})">${content}</div>`);
  }
  return tiles.join('');
}

window.minesStartGame = async () => {
  const mg = state.mines;
  if (mg.busy) return;

  try {

    const lockRef = doc(db, 'activeGames', state.user.uid);

    const lockSnap = await getDoc(lockRef);
    if (lockSnap.exists()) {
      mg.busy = false; toast('Active game exists', 'err'); render(); return;
    }

    await runTransaction(db, async (tx) => {
      const uSnap = await tx.get(userRef);

      const u = uSnap.data();
      if (u.blocked) throw new Error('Blocked');
      const bal = u.demoPoints || 0;
      if (bal < mg.stake) throw new Error('Insufficient');
      const newBal = bal - mg.stake;

      tx.update(userRef, { demoPoints: newBal });
      tx.set(gameRef, {
        gameId, uid: state.user.uid, userName: u.name || '',
        mineCount: mg.mineCount, stake: mg.stake,
        status: 'ACTIVE', result: null,
        revealedTiles: [], revealedSafe: [],
        currentTile: null, lastClickAt: null,
        payout: 0, multiplier: 1, refundAmount: 0,
        createdAt: serverTimestamp(), completedAt: null
      });
      tx.set(privRef, { gameId, uid: state.user.uid, minePositions, createdAt: serverTimestamp() });
      tx.set(lockRef, { gameId, startedAt: serverTimestamp() });
      tx.set(doc(collection(db, 'coinTransactions')), {
        uid: state.user.uid, gameId, type: 'GAME_STAKE',
        amount: -mg.stake, previousBalance: bal, newBalance: newBal,
        timestamp: serverTimestamp()
      });
    });

    mg.gameId = gameId;
    mg.status = 'ACTIVE';
    mg.revealedTiles = []; mg.revealedSafe = [];
    mg.minePositions = minePositions;
    mg.multiplier = 1; mg.payout = 0;
    mg.busy = false;
    toast(`Started ${gameId}`, 'ok');
    render();
  } catch (e) {
    mg.busy = false;
    console.error(e);
    toast((e?.message||'Failed').replace('Firebase: ',''), 'err');
    render();
  }
};

window.minesTileClick = async (idx) => {
  const mg = state.mines;
  if (mg.status !== 'ACTIVE' || mg.busy) return;
  if (mg.revealedTiles.includes(idx)) return;
  if (!mg.gameId || !mg.minePositions) return;

  const isMine = mg.minePositions.includes(idx);
  const newRevealed = [...mg.revealedTiles, idx];
  mg.busy = true; render();

  try {
    const gameRef = doc(db, 'minesGames', mg.gameId);
    const lockRef = doc(db, 'activeGames', state.user.uid);
    const userRef = doc(db, 'users', state.user.uid);

    if (isMine) {
      await runTransaction(db, async (tx) => {
        const gSnap = await tx.get(gameRef);
        if (!gSnap.exists()) throw new Error('Missing');
        if (gSnap.data().status !== 'ACTIVE') throw new Error('Not active');
        if (gSnap.data().revealedTiles.includes(idx)) throw new Error('Already');
        tx.update(gameRef, {
          status: 'LOST',
          result: 'LOSS',
          revealedTiles: newRevealed,
          currentTile: idx,
          lastClickAt: serverTimestamp(),
          payout: 0, multiplier: 0,
          completedAt: serverTimestamp()
        });
        tx.delete(lockRef);
        tx.set(doc(collection(db, 'coinTransactions')), {
          uid: state.user.uid, gameId: mg.gameId,
          type: 'GAME_LOSS', amount: 0,
          previousBalance: 0, newBalance: 0,
          timestamp: serverTimestamp()
        });
      });
      mg.status = 'LOST';
      mg.result = 'LOSS';
      mg.revealedTiles = newRevealed;
      mg.multiplier = 0;
      mg.busy = false;
      toast('💥 Mine hit!', 'err');
      if (navigator.vibrate) navigator.vibrate([100,50,100]);
      render(); return;
    }

    const newSafe = [...mg.revealedSafe, idx];
    const newMult = calcMinesMultiplier(newSafe.length, mg.mineCount);
    const safeTotal = 25 - mg.mineCount;
    const autoWin = newSafe.length === safeTotal;
    const payout = autoWin ? Math.floor(mg.stake * newMult) : 0;

    await runTransaction(db, async (tx) => {
      const gSnap = await tx.get(gameRef);
      if (!gSnap.exists()) throw new Error('Missing');
      if (gSnap.data().status !== 'ACTIVE') throw new Error('Not active');
      if (gSnap.data().revealedTiles.includes(idx)) throw new Error('Already');

      if (autoWin) {
        const uSnap = await tx.get(userRef);
        const bal = uSnap.data().demoPoints || 0;
        const newBal = bal + payout;
        tx.update(userRef, { demoPoints: newBal });
        tx.update(gameRef, {
          status: 'WON', result: 'WIN',
          revealedTiles: newRevealed, revealedSafe: newSafe,
          currentTile: idx, lastClickAt: serverTimestamp(),
          payout, multiplier: newMult,
          completedAt: serverTimestamp()
        });
        tx.delete(lockRef);
        tx.set(doc(collection(db, 'coinTransactions')), {
          uid: state.user.uid, gameId: mg.gameId,
          type: 'GAME_REWARD', amount: payout,
          previousBalance: bal, newBalance: newBal,
          timestamp: serverTimestamp()
        });
      } else {
        tx.update(gameRef, {
          revealedTiles: newRevealed, revealedSafe: newSafe,
          currentTile: idx, lastClickAt: serverTimestamp(),
          multiplier: newMult
        });
      }
    });

    mg.revealedTiles = newRevealed;
    mg.revealedSafe = newSafe;
    mg.multiplier = newMult;
    if (autoWin) {
      mg.status = 'WON'; mg.result = 'WIN';
      mg.payout = payout;
      toast(`🎉 All safe! +🪙 ${fmtInt(payout)}`, 'ok');
    } else {
      if (navigator.vibrate) navigator.vibrate(20);
    }
    mg.busy = false;
    render();
  } catch (e) {
    mg.busy = false;
    toast((e?.message||'Failed').replace('Firebase: ',''), 'err');
    render();
  }
};

  if (mg.revealedSafe.length === 0) return toast('Reveal at least 1', 'err');

function bindPredictInputs() {
  const inp = document.getElementById('stakeInput');
  if (!inp) return;
  inp.oninput = e => {
    state.bet.stake = Math.max(0, Math.floor(Number(e.target.value) || 0));
    clearTimeout(bindPredictInputs._t);
    bindPredictInputs._t = setTimeout(() => {
      const pos = inp.selectionStart;
      render();
      const nInp = document.getElementById('stakeInput');
      if (nInp) { nInp.focus(); nInp.setSelectionRange(pos, pos); }
    }, 400);
  };
}

window.confirmPrediction = async () => {
  const liveMatches = state.matches.filter(m => m.status === 'LIVE' || m.status === 'WAITING');
  const m = liveMatches.find(x => x.id === state.currentMatchId) || liveMatches[0];
  if (!m) return toast('No match', 'err');
  const rs = roundStatusForMatch(m);
  if (rs.code !== 'OPEN') return toast('Betting closed', 'err');
  const r = rs.round;
  const tid = state.bet.teamId;
  if (!tid) return toast('Select team', 'err');
  const t = teamStats(tid, m.id);
  if (t.isDead) return toast('Team eliminated', 'err');
  const existing = state.predictions.find(p =>
    p.roundNumber === r.roundNumber && p.matchId === m.id && p.status === 'PENDING');
  if (existing) return toast('Already bet', 'err');
  const stake = Number(state.bet.stake) || 0;
  const pts = state.profile.demoPoints || 0;
  if (stake <= 0) return toast('Invalid stake', 'err');
  if (stake > pts) return toast('Low balance', 'err');
  try {
    await updateDoc(doc(db, 'users', state.user.uid), { demoPoints: pts - stake });
    await addDoc(collection(db, 'predictions'), {
      userId: state.user.uid,
      userName: state.profile.name || state.profile.email,
      matchId: m.id, matchNumber: m.matchNumber || 1,
      roundNumber: r.roundNumber, teamId: tid, stake,
      rate: t.rate, winRate: t.winRate,
      potentialReturn: stake * t.rate,
      potentialProfit: stake * t.rate - stake,
      status: 'PENDING',
      createdAt: serverTimestamp()
    });
    toast(`Bet on Team ${tid}`, 'ok');
    state.bet.teamId = null;
    render();
  } catch (e) {
    console.error(e); toast('Bet failed', 'err');
  }
};

window.openRound = async (num) => {
  const m = currentMatch();
  if (!m) return;
  const A = teamStats('A', m.id), B = teamStats('B', m.id);
  if (A.activeCount===0 || B.activeCount===0) return toast('Both teams need players', 'err');
  if (num > 1) {
    const prev = state.rounds.find(r => r.roundNumber===num-1 && r.matchId===m.id);
    if (!prev || prev.status !== 'RESULT_DECLARED') return toast('Settle prev', 'err');
    if (!prev.eliminationDone) return toast('Eliminate first', 'err');
  }
  try {
    await addDoc(collection(db, 'rounds'), {
      matchId: m.id, roundNumber: num, status: 'OPEN', winner: null,
      teamARate: A.rate, teamBRate: B.rate,
      teamAAlive: A.activeCount, teamBAlive: B.activeCount,
      eliminationDone: false, startTime: serverTimestamp()
    });
    await updateDoc(doc(db, 'matches', m.id), { status: 'LIVE', currentRound: num });
    toast(`Round ${num} opened`, 'ok');
  } catch(e) { toast('Failed', 'err'); }
};
window.closeRound = async () => {
  const m = currentMatch(); if (!m) return;
  const r = state.rounds.find(x => x.roundNumber===m.currentRound && x.matchId===m.id);
  if (!r) return;
  try { await updateDoc(doc(db, 'rounds', r.id), { status: 'CLOSED' }); toast('Closed', 'ok'); }
  catch(e) { toast('Failed','err'); }
};
window.declareResult = (winner) => {
  const m = currentMatch(); if (!m) return;
  const r = state.rounds.find(x => x.roundNumber===m.currentRound && x.matchId===m.id);
  if (!r) return;
  openSheet('Confirm', `
    <div class="txt-sm txt-3 mb-12">Team ${winner} won round ${r.roundNumber}?</div>
    <button class="btn ${winner==='A'?'btn-success':'btn-warning'}" onclick="declareResultDo('${winner}')">Confirm Team ${winner}</button>
  `);
};
window.declareResultDo = async (winner) => {
  const m = currentMatch(); if (!m) return;
  const r = state.rounds.find(x => x.roundNumber===m.currentRound && x.matchId===m.id);
  if (!r) return;
  try {
    const pending = state.predictions.filter(p => p.status==='PENDING' && p.roundNumber===r.roundNumber && p.matchId===m.id);
    for (const p of pending) {
      const isWin = p.teamId === winner;
      if (isWin) {
        const uSnap = await getDoc(doc(db, 'users', p.userId));
        if (uSnap.exists()) {
          await updateDoc(doc(db, 'users', p.userId), {
            demoPoints: (uSnap.data().demoPoints||0) + (p.potentialReturn||0)
          });
        }
      }
      await updateDoc(doc(db, 'predictions', p.id), {
        status: isWin?'WON':'LOST',
        returnAmount: isWin ? (p.potentialReturn||0) : 0,
        profitAmount: isWin ? (p.potentialProfit||0) : -p.stake,
        settledAt: serverTimestamp(), winnerTeam: winner
      });
    }
    await updateDoc(doc(db, 'rounds', r.id), {
      status: 'RESULT_DECLARED', winner, eliminationDone: false, resultTime: serverTimestamp()
    });
    const nA = (m.teamARoundsWon||0) + (winner==='A'?1:0);
    const nB = (m.teamBRoundsWon||0) + (winner==='B'?1:0);
    await updateDoc(doc(db, 'matches', m.id), { teamARoundsWon: nA, teamBRoundsWon: nB });
    closeSheet(); toast(`Team ${winner} won`, 'ok');
  } catch(e) { toast('Failed','err'); }
};
window.eliminatePlayer = async (pid, teamId) => {
  const m = currentMatch(); if (!m) return;
  const r = state.rounds.find(x => x.roundNumber===m.currentRound && x.matchId===m.id);
  if (!r) return;
  const player = state.players.find(p => p.id === pid);
  if (!player || player.status !== 'ACTIVE') return;
  if (!confirm(`Eliminate ${player.name}?`)) return;
  try {
    await updateDoc(doc(db, 'players', pid), { status: 'ELIMINATED', eliminatedInRound: r.roundNumber });
    await updateDoc(doc(db, 'rounds', r.id), {
      eliminationDone: true, eliminatedPlayerId: pid, eliminatedPlayerName: player.name, eliminatedPlayerTeam: teamId
    });
    const nA = teamStats('A', m.id), nB = teamStats('B', m.id);
    if (nA.isDead && !nB.isDead) { await endMatchAuto('B'); return; }
    if (nB.isDead && !nA.isDead) { await endMatchAuto('A'); return; }
    if (nA.isDead && nB.isDead) { await endMatchAuto('DRAW'); return; }
    toast(`${player.name} out`, 'ok');
  } catch(e) { toast('Failed','err'); }
};
window.endMatchByRounds = async () => {
  const m = currentMatch(); if (!m) return;
  const aW = m.teamARoundsWon||0, bW = m.teamBRoundsWon||0;
  let w = 'DRAW'; if (aW > bW) w = 'A'; else if (bW > aW) w = 'B';
  await endMatchAuto(w);
};
window.endMatchAuto = async (winner) => {
  const m = currentMatch(); if (!m) return;
  try {
    await addDoc(collection(db, 'match_history'), {
      matchNumber: m.matchNumber, winner,
      teamARoundsWon: m.teamARoundsWon||0, teamBRoundsWon: m.teamBRoundsWon||0,
      maxRounds: m.maxRounds, totalRounds: m.currentRound,
      finishedAt: serverTimestamp()
    });
    const pending = state.predictions.filter(p => p.status==='PENDING' && p.matchId===m.id);
    for (const p of pending) {
      const isWin = winner !== 'DRAW' && p.teamId === winner;
      if (isWin) {
        const uSnap = await getDoc(doc(db, 'users', p.userId));
        if (uSnap.exists()) {
          await updateDoc(doc(db, 'users', p.userId), {
            demoPoints: (uSnap.data().demoPoints||0) + (p.potentialReturn||0)
          });
        }
      }
      await updateDoc(doc(db, 'predictions', p.id), {
        status: isWin?'WON':'LOST',
        returnAmount: isWin ? (p.potentialReturn||0) : 0,
        settledAt: serverTimestamp(), winnerTeam: winner
      });
    }
    await updateDoc(doc(db, 'matches', m.id), {
      status: 'FINISHED', winner, finishedAt: serverTimestamp()
    });
    toast(`Match finished`, 'ok');
  } catch(e) { toast('Failed','err'); }
};
window.addPlayer = async () => {
  const name = document.getElementById('newPName').value.trim();
  const teamId = document.getElementById('newPTeam').value;
  if (!name) return toast('Enter name','err');
  if (state.players.filter(p => p.teamId===teamId).length >= 4) return toast(`Team ${teamId} full`,'err');
  try {
    await addDoc(collection(db, 'players'), {
      name, teamId, status: 'ACTIVE', matchId: state.currentMatchId, createdAt: serverTimestamp()
    });
    toast(`"${name}" added`,'ok');
    document.getElementById('newPName').value = '';
  } catch(e) { toast('Failed','err'); }
};

window.adminOpenMines = async (gameId) => {
  try {
    const gSnap = await getDoc(doc(db, 'minesGames', gameId));
    const pSnap = await getDoc(doc(db, 'minesGamesPrivate', gameId));
    if (!gSnap.exists()) return toast('Not found', 'err');
    const g = gSnap.data();
    const mines = pSnap.exists() ? (pSnap.data().minePositions || []) : [];

    const miniTiles = [];
    for (let i = 0; i < 25; i++) {
      const isMine = mines.includes(i);
      const isRevealedSafe = (g.revealedSafe || []).includes(i);
      const isRevealedMine = (g.revealedTiles || []).includes(i) && isMine;
      let bg = 'var(--surface-2)', col = 'var(--text-3)', border = 'var(--border)';
      if (isRevealedMine) { bg = 'rgba(239,68,68,.7)'; col = '#fff'; border = 'var(--danger)'; }
      else if (isRevealedSafe) { bg = 'rgba(34,197,94,.4)'; col = '#fff'; border = 'var(--success)'; }
      else if (isMine) { bg = 'rgba(239,68,68,.35)'; col = '#fff'; border = 'var(--danger)'; }
      miniTiles.push(`<div style="aspect-ratio:1;border-radius:4px;background:${bg};color:${col};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;border:1px solid ${border}">${i}</div>`);
    }

    const statusCls = g.status === 'WON' ? 'won' : g.status === 'LOST' ? 'lost' : g.status === 'REFUND' ? 'refund' : 'active';

    openSheet('Game Details', `
      <div style="font-family:ui-monospace,monospace;font-size:12px;font-weight:800;margin-bottom:12px;padding:10px;background:var(--surface-2);border-radius:8px;text-align:center">
        ${g.gameId}
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:8px 0">${miniTiles.join('')}</div>
      <div class="txt-xs txt-3 txt-center" style="margin-bottom:12px">
        🔴 Mine · 🟢 Revealed Safe · ⚪ Unrevealed
      </div>
      <div class="list" style="background:transparent">
        <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
          <span class="txt-3 txt-xs">User</span><b>${escapeHtml(g.userName||'—')}</b>
        </div>
        <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
          <span class="txt-3 txt-xs">Status</span>
          <span class="badge ${statusCls}">${g.status}</span>
        </div>
        ${g.refundReason ? `
          <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
            <span class="txt-3 txt-xs">Refund Reason</span><b style="color:var(--warning)">${g.refundReason}</b>
          </div>
        ` : ''}
        <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
          <span class="txt-3 txt-xs">Mines</span><b>${g.mineCount}</b>
        </div>
        <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
          <span class="txt-3 txt-xs">Stake</span><b>🪙 ${g.stake}</b>
        </div>
        <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
          <span class="txt-3 txt-xs">Payout</span><b style="color:var(--success)">🪙 ${g.payout||0}</b>
        </div>
        <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
          <span class="txt-3 txt-xs">Multiplier</span><b>${fmtRate(g.multiplier||0)}</b>

      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h3>${title}</h3>
          <button class="sheet-close" onclick="closeSheet()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:16px;height:16px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="sheet-body">${body}</div>
      </div>
    </div>
  `;
};
window.closeSheet = () => { document.getElementById('modalRoot').innerHTML = ''; };

render();
</script>
</body>
</html>
