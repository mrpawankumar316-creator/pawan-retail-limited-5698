function paintAdminOrders() {
  const el = $("#adminOrdersList");
  if (!el) return;
  let list = S.cached.orders;
  if (adminOrderFilter !== "all") list = list.filter(o => o.status === adminOrderFilter);
  if (!list.length) { el.innerHTML = `<div class="empty">No orders</div>`; return; }
  el.innerHTML = `<div class="table-wrap scroll"><table class="table">
    <thead><tr><th>Order</th><th>Customer</th><th>Company</th><th>Total</th><th>Status</th><th></th></tr></thead>
    <tbody>${list.map(o => {
      const info = ORDER_STATUS[o.status] || { label: o.status, tone: "neutral" };
      return `<tr>
        <td class="font-mono text-xs font-bold">#${escapeHtml(o.orderId || o.id)}</td>
        <td>${escapeHtml(o.customerName || "")}</td>
        <td>${escapeHtml(o.companyName || "")}</td>
        <td class="font-bold">${fmtINR(o.grandTotal)}</td>
        <td><span class="badge badge-${info.tone}">${info.label}</span>${o.hasComplaint ? ' <span class="badge badge-danger">⚠️</span>' : ""}</td>
        <td><button class="btn btn-secondary btn-xs" onclick="adminOpenOrder('${o.id}')">Manage</button></td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

window.adminOpenOrder = async (orderId) => {
  const snap = await getDoc(doc(db,"orders",orderId));
  if (!snap.exists()) return toast("Not found", "error");
  const o = { id: snap.id, ...snap.data() };
  const info = ORDER_STATUS[o.status] || { label: o.status, tone: "neutral" };
  const payLabel = o.paymentMethod === "cod" ? "Cash on Delivery" : "Online (UPI)";
  let complaint = null;
  try {
    const cS = await getDocs(query(collection(db,"complaints"), where("orderId","==",orderId)));
    if (!cS.empty) complaint = { id: cS.docs[0].id, ...cS.docs[0].data() };
  } catch(_){}
  openModal(`
    <div class="modal-title">Order #${escapeHtml(o.orderId || o.id)}</div>
    <div class="mb-3" style="text-align:center"><span class="badge badge-${info.tone}">${info.label}</span>${o.hasComplaint ? ' <span class="badge badge-danger">⚠️ Complaint</span>' : ""}</div>
    ${complaint ? `
      <div class="card" style="background:var(--warning-soft);border:1.5px solid #fcd34d;margin-bottom:12px">
        <div class="text-xs" style="color:var(--warning);text-transform:uppercase;font-weight:800;margin-bottom:8px">⚠️ Complaint</div>
        <div class="text-sm" style="color:var(--warning);font-weight:700;margin-bottom:10px">${escapeHtml(complaint.complaintType || "")}</div>
        <button class="btn btn-warning btn-sm" onclick="closeModal();openComplaintChat('${orderId}')" style="width:100%">💬 Open Chat</button>
      </div>` : ""}
    <div class="section-title">Customer</div>
    <div class="text-sm font-semibold">${escapeHtml(o.customerName || "")}</div>
    <div class="text-sm text-muted">${escapeHtml(o.customerPhone || "")}</div>
    <div class="text-sm text-muted">${escapeHtml(o.customerEmail || "")}</div>
    <div class="section-title mt-4">Company</div>
    <div class="text-sm font-semibold">${escapeHtml(o.companyName || "")}</div>
    <div class="section-title mt-4">Items</div>
    ${(o.items || []).map(i => `<div class="row" style="padding:8px 0">
      <img src="${escapeHtml(isValidUrl(i.imageUrl) ? i.imageUrl : PLACEHOLDER_IMG)}" style="width:48px;height:48px;border-radius:12px;object-fit:cover" onerror="this.src='${PLACEHOLDER_IMG}'">
      <div style="flex:1"><div class="text-sm font-semibold">${escapeHtml(i.name)}</div><div class="text-xs text-soft">${i.quantity} × ${fmtINR(i.unitPrice)}</div></div>
    </div>`).join("")}
    <div class="price-row total"><span>Total</span><span>${fmtINR(o.grandTotal)}</span></div>
    <div class="price-row"><span class="text-muted">Payment</span><span class="font-bold">${escapeHtml(payLabel)}</span></div>
    <div class="section-title mt-4">Update Status</div>
    <select class="form-select mb-2" id="admStatus">
      ${Object.keys(ORDER_STATUS).map(k => `<option value="${k}" ${o.status === k ? "selected" : ""}>${ORDER_STATUS[k].label}</option>`).join("")}
    </select>
    <button class="btn btn-primary btn-block mb-2" id="admUpdateStatus">Update Status</button>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`);
  $("#admUpdateStatus").onclick = async () => {
    const newStatus = $("#admStatus").value;
    if (newStatus === o.status) return toast("Unchanged", "info");
    if (newStatus === "rejected" || newStatus === "cancelled") {
      openModal(`<div class="modal-title">Reason</div>
        <div class="form-group"><textarea class="form-textarea" id="cancelReasonInput" placeholder="Why?"></textarea></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="adminOpenOrder('${o.id}')">Back</button>
          <button class="btn btn-danger" id="cancelConfirm">Confirm</button>
        </div>`);
      $("#cancelConfirm").onclick = async () => {
        const reason = $("#cancelReasonInput").value.trim();
        if (!reason) return toast("Reason required", "error");
        await updateOrderStatusWithReason(o, newStatus, reason);
      };
      return;
    }
    if (newStatus === "successful") {
      openModal(`<div class="modal-title">Tracking URL</div>
        <div class="form-group"><input class="form-input" id="trackUrlInput" type="url" value="${escapeHtml(o.trackingUrl || "")}" placeholder="https://..."></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="adminOpenOrder('${o.id}')">Back</button>
          <button class="btn btn-success" id="trackConfirm">Mark Delivered</button>
        </div>`);
      $("#trackConfirm").onclick = async () => {
        const url = $("#trackUrlInput").value.trim();
        if (!url) return toast("URL required", "error");
        if (!isValidUrl(url)) return toast("Invalid URL", "error");
        await markOrderDeliveredWithTracking(o, url);
      };
      return;
    }
    await updateOrderStatusWithReason(o, newStatus, "");
  };
};

async function markOrderDeliveredWithTracking(o, trackingUrl) {
  try {
    await updateDoc(doc(db,"orders",o.id), { status: "successful", trackingUrl, deliveredAt: serverTimestamp(), updatedAt: serverTimestamp() });
    await addDoc(collection(db,"orders",o.id,"statusHistory"), {
      status: "successful", note: "Delivered", changedBy: S.user.uid, createdAt: serverTimestamp()
    });
    toast("Delivered!", "success"); closeModal();
  } catch(err) { toast(errorMsg(err), "error"); }
}

async function updateOrderStatusWithReason(o, newStatus, reason) {
  try {
    const updates = { status: newStatus, updatedAt: serverTimestamp() };
    if (reason) { updates.cancelReason = reason; updates.cancelledAt = serverTimestamp(); updates.cancelledBy = S.user.uid; }
    await updateDoc(doc(db,"orders",o.id), updates);
    await addDoc(collection(db,"orders",o.id,"statusHistory"), {
      status: newStatus, note: reason || "", changedBy: S.user.uid, createdAt: serverTimestamp()
    });
    toast("Updated", "success"); closeModal();
  } catch(err) { toast(errorMsg(err), "error"); }
}

function renderAdminComplaints() {
  $("#adminContent").innerHTML = `<div id="complaintsList"><div class="skeleton"></div></div>`;
  const unsub = onSnapshot(collection(db,"complaints"), snap => {
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
    const el = $("#complaintsList");
    if (!el) return;
    if (!list.length) { el.innerHTML = `<div class="empty">No complaints yet</div>`; return; }
    el.innerHTML = `<div class="table-wrap scroll"><table class="table">
      <thead><tr><th>Order</th><th>Customer</th><th>Type</th><th>Status</th><th>Date</th><th></th></tr></thead>
      <tbody>${list.map(c => {
        const statusInfo = COMPLAINT_STATUS[c.status] || COMPLAINT_STATUS.pending;
        return `<tr>
          <td class="font-mono text-xs font-bold">#${escapeHtml(c.orderNumber || c.orderId)}</td>
          <td>${escapeHtml(c.customerName || "")}<div class="text-xs text-soft">${escapeHtml(c.customerPhone || "")}</div></td>
          <td><span class="badge badge-warning">${escapeHtml((c.complaintType || "").slice(0, 30))}</span></td>
          <td><span class="badge badge-${statusInfo.tone}">${statusInfo.label}</span></td>
          <td class="text-xs text-soft">${fmtDate(c.createdAt)}</td>
          <td><button class="btn btn-primary btn-xs" onclick="openComplaintChat('${c.orderId}')">💬 Chat</button></td>
        </tr>`;
      }).join("")}</tbody></table></div>`;
  });
  S.adminSubs.add(unsub);
}

function renderAdminReviews() {
  $("#adminContent").innerHTML = `<div id="reviewsList"><div class="skeleton"></div></div>`;
  const unsub = onSnapshot(collection(db,"reviews"), snap => {
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
    const el = $("#reviewsList");
    if (!el) return;
    if (!list.length) { el.innerHTML = `<div class="empty">No reviews</div>`; return; }
    el.innerHTML = `<div class="table-wrap scroll"><table class="table">
      <thead><tr><th>Order</th><th>Customer</th><th>Rating</th><th>Review</th><th>Date</th></tr></thead>
      <tbody>${list.map(r => `
        <tr>
          <td class="font-mono text-xs font-bold">#${escapeHtml(r.orderId || "")}</td>
          <td>${escapeHtml(r.customerName || "")}</td>
          <td><span style="color:var(--amber)">${[1,2,3,4,5].map(n => `<span style="${n<=r.rating?"":"opacity:.3"}">★</span>`).join("")}</span></td>
          <td class="text-xs">${escapeHtml(r.reviewText || "—")}</td>
          <td class="text-xs text-soft">${fmtDate(r.createdAt)}</td>
        </tr>`).join("")}</tbody></table></div>`;

async function renderAdminCustomers() {
  $("#adminContent").innerHTML = `
    <div class="mb-4" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-primary" id="addCustomerBtn">+ Add Customer</button>
      <div class="info-box" style="flex:1;min-width:200px;margin:0">
        ℹ️ Admin creates → Customer logs in → Auto password creation
      </div>
    </div>
    <div id="customersList"><div class="skeleton"></div></div>`;
  $("#addCustomerBtn").onclick = () => addCustomerForm();
  try {
    const snap = await getDocs(collection(db,"users"));
    const users = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => u.role !== "admin");
    const el = $("#customersList");
    if (!users.length) { el.innerHTML = `<div class="empty">No customers</div>`; return; }
    el.innerHTML = `<div class="table-wrap scroll"><table class="table">
      <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${users.map(u => {
        const status = u.status || "active";
        const statusInfo = ACCOUNT_STATUS[status] || ACCOUNT_STATUS.active;
        return `<tr>
          <td class="font-semibold">${escapeHtml(u.name || "")}<div class="text-xs text-soft">${escapeHtml(u.phone || "")}</div></td>
          <td>${escapeHtml(u.email || "")}</td>
          <td><span class="badge badge-${statusInfo.tone}">${statusInfo.label}</span></td>
          <td class="acts">
            ${status === "active" ? `
              <button class="btn btn-secondary btn-xs" onclick="adminSuspendUser('${u.id}')">Suspend</button>
              <button class="btn btn-danger btn-xs" onclick="adminBlockUser('${u.id}')">Block</button>
            ` : status === "pending_password" ? `
              <button class="btn btn-danger btn-xs" onclick="adminDeleteUser('${u.id}', '${escapeHtml(u.email || '')}')">Remove</button>
            ` : `
              <button class="btn btn-success btn-xs" onclick="adminUnblockUser('${u.id}')">Unblock</button>
            `}
          </td>
        </tr>`;
      }).join("")}</tbody></table></div>`;
  } catch(err) { $("#customersList").innerHTML = `<div class="empty">Failed</div>`; }
}

window.addCustomerForm = () => {
  openModal(`<div class="modal-title">➕ Add New Customer</div>
    <div class="info-box mb-4">📩 Customer will login with this email — app will ask for password.</div>
    <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="ncName"></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="ncEmail" type="email"></div>
    <div class="form-group"><label class="form-label">Mobile</label><input class="form-input" id="ncPhone" inputmode="numeric" maxlength="10"></div>
    <div class="form-group"><label class="form-label">Address</label><textarea class="form-textarea" id="ncAddress"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="ncSave">Create</button>
    </div>`);
  $("#ncSave").onclick = async () => {
    const name = $("#ncName").value.trim();
    const email = $("#ncEmail").value.trim().toLowerCase();
    const phone = $("#ncPhone").value.trim();
    const address = $("#ncAddress").value.trim();
    if (!name) return toast("Name required", "error");
    if (!email) return toast("Email required", "error");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast("Invalid email", "error");
    if (!/^[0-9]{10}$/.test(phone)) return toast("Valid 10-digit phone", "error");
    if (!address) return toast("Address required", "error");
    const btn = $("#ncSave");
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Creating';
    try {
      const existing = await getDocs(query(collection(db,"users"), where("email","==",email)));
      if (!existing.empty) return toast("Email already registered", "error");
      await addDoc(collection(db,"users"), {
        name, email, phone, address,
        role: "customer",
        status: "pending_password",
        blockReason: "", suspendedUntil: null,
        createdBy: "admin", createdByUid: S.user.uid,
        createdAt: serverTimestamp()
      });
      toast("✅ Account created!", "success");
      closeModal(); renderAdminCustomers();
    } catch(err) {
      console.error(err);
      toast(errorMsg(err), "error");
    } finally {
      btn.disabled = false; btn.textContent = "Create";
    }
  };
};

window.adminBlockUser = (userId) => {
  openModal(`<div class="modal-title">Block User</div>
    <div class="form-group"><label class="form-label">Reason</label><textarea class="form-textarea" id="blockReason"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="blockConfirm">Block</button>
    </div>`);
  $("#blockConfirm").onclick = async () => {
    const reason = $("#blockReason").value.trim();
    if (!reason) return toast("Reason required", "error");
    try {
      await updateDoc(doc(db,"users",userId), { status: "blocked", blockReason: reason, blockedAt: serverTimestamp(), blockedBy: S.user.uid });
      toast("Blocked", "success"); closeModal(); renderAdminCustomers();
    } catch(err) { toast(errorMsg(err), "error"); }
  };
};

window.adminSuspendUser = (userId) => {
  openModal(`<div class="modal-title">Suspend User</div>
    <div class="form-group"><label class="form-label">Duration</label>
      <select class="form-select" id="suspendDuration">
        <option value="1">1 hour</option><option value="6">6 hours</option>
        <option value="24" selected>24 hours</option><option value="72">3 days</option>
        <option value="168">7 days</option>
      </select></div>
    <div class="form-group"><label class="form-label">Reason</label><textarea class="form-textarea" id="suspendReason"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="suspendConfirm">Suspend</button>
    </div>`);
  $("#suspendConfirm").onclick = async () => {
    const reason = $("#suspendReason").value.trim();
    const hours = parseInt($("#suspendDuration").value, 10);
    if (!reason) return toast("Reason required", "error");
    const until = new Date(Date.now() + hours * 60 * 60 * 1000);
    try {
      await updateDoc(doc(db,"users",userId), { status: "suspended", blockReason: reason, suspendedUntil: until, suspendedAt: serverTimestamp(), suspendedBy: S.user.uid });
      toast("Suspended", "success"); closeModal(); renderAdminCustomers();
    } catch(err) { toast(errorMsg(err), "error"); }
  };
};

window.adminUnblockUser = (userId) => {
  confirmDialog("Unblock user?", async () => {
    try {
      await updateDoc(doc(db,"users",userId), { status: "active", blockReason: "", suspendedUntil: null, unblockedAt: serverTimestamp(), unblockedBy: S.user.uid });
      toast("Unblocked", "success"); renderAdminCustomers();
    } catch(err) { toast(errorMsg(err), "error"); }
  });
};

window.adminDeleteUser = (userId, email) => {
  openModal(`<div class="modal-title">Delete User</div>
    <div class="warn-box mb-3"><strong>⚠️ Warning:</strong> This permanently deletes the user.</div>
    <p class="text-sm text-muted mb-3">Email: <strong>${escapeHtml(email)}</strong></p>
    <div class="form-group"><label class="form-label">Type email to confirm</label>
      <input class="form-input font-mono" id="delConfirmEmail"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="delConfirmBtn">Delete</button>
    </div>`);
  $("#delConfirmBtn").onclick = async () => {
    const typed = $("#delConfirmEmail").value.trim().toLowerCase();
    if (typed !== email.toLowerCase()) return toast("Email does not match", "error");
    try {
      await deleteDoc(doc(db,"users",userId));
      toast("Deleted", "success"); closeModal(); renderAdminCustomers();
    } catch(err) { toast(errorMsg(err), "error"); }
  };
};

/* ============ ORDER STATUS MAP ============ */
const ORDER_STATUS = {
  pending: { label: "Pending", tone: "warning" },
  processing: { label: "Processing", tone: "info" },
  successful: { label: "Delivered", tone: "success" },
  rejected: { label: "Rejected", tone: "danger" },
  cancelled: { label: "Cancelled", tone: "neutral" }
};
const ACCOUNT_STATUS = {
  active: { label: "Active", tone: "success" },
  pending_password: { label: "Pending Password", tone: "warning" },
  suspended: { label: "Suspended", tone: "warning" },
  blocked: { label: "Blocked", tone: "danger" }
};
const COMPLAINT_STATUS = {
  pending: { label: "Pending", tone: "warning" },
  in_progress: { label: "In Progress", tone: "info" },
  resolved: { label: "Resolved", tone: "success" }
};

} catch(e) {

    <p><strong>${e.message || 'Unknown'}</strong></p>
  </div>`;
}

try {
  onAuthStateChanged(auth, onAuthChanged);
} catch(e) { console.error("Auth error:", e); }

</script>
