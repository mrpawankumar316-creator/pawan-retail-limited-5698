<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pawan Retail Limited — Food Ordering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-900:#1e1b4b; --brand-800:#312e81; --brand-700:#3730a3; --brand-600:#4338ca; --brand-500:#4f46e5; --brand-100:#e0e7ff; --brand-50:#eef2ff;
    --ink-900:#0f172a; --ink-800:#1e293b; --ink-700:#334155; --ink-600:#475569; --ink-500:#64748b; --ink-400:#94a3b8; --ink-300:#cbd5e1; --ink-200:#e2e8f0; --ink-100:#f1f5f9; --ink-50:#f8fafc;
    --success:#059669; --success-bg:#ecfdf5; --success-border:#a7f3d0;
    --danger:#dc2626; --danger-bg:#fef2f2; --danger-border:#fecaca;
    --warning:#d97706; --warning-bg:#fffbeb;
    --radius:8px; --radius-lg:12px; --radius-xl:16px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05); --shadow:0 1px 3px rgba(15,23,42,.08); --shadow-md:0 4px 12px rgba(15,23,42,.08); --shadow-lg:0 10px 32px rgba(15,23,42,.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif; background:var(--ink-50); color:var(--ink-800); min-height:100vh; -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;}
  h1,h2,h3,h4{letter-spacing:-.01em; font-weight:700; color:var(--ink-900);}
  
  .page{animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .modal-anim{animation:popIn .25s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
  @keyframes popIn{from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);}}
  .img-fade{animation:imgFade .5s ease;}
  @keyframes imgFade{from{opacity:0; transform:scale(.98);} to{opacity:1; transform:scale(1);}}

  .app-shell{min-height:100vh; display:flex; flex-direction:column; padding-bottom:76px;}
  
  /* TOPBAR */
  .topbar{background:#fff; border-bottom:1px solid var(--ink-200); position:sticky; top:0; z-index:50;}
  .topbar-inner{max-width:1200px; margin:0 auto; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; gap:16px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:36px; height:36px; border-radius:8px; background:var(--brand-700); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px;}
  .brand-text .name{font-size:15px; font-weight:700; color:var(--ink-900); line-height:1.2;}
  .brand-text .tag{font-size:11px; color:var(--ink-500);}
  .penalty-chip{display:inline-flex; align-items:center; gap:6px; background:var(--danger-bg); color:var(--danger); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid var(--danger-border); cursor:pointer;}

  /* MAIN */
  .main{flex:1; max-width:1200px; margin:0 auto; width:100%; padding:24px;}
  .card{background:#fff; border-radius:var(--radius-lg); border:1px solid var(--ink-200); padding:20px;}
  .muted{color:var(--ink-500); font-size:13px;}

  /* BUTTONS */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--brand-700); color:white; border:none; padding:9px 16px; border-radius:var(--radius); cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; font-family:inherit;}
  .btn:hover{background:var(--brand-800); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
  .btn.secondary{background:#fff; color:var(--ink-700); border:1px solid var(--ink-300);}
  .btn.secondary:hover{background:var(--ink-50);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#b91c1c;}
  .btn.ghost{background:transparent; color:var(--ink-600);}
  .btn.ghost:hover{background:var(--ink-100);}
  .btn.sm{padding:6px 12px; font-size:12px;}
  .btn.block{width:100%;}

  /* FORMS */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-700); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; padding:9px 12px; border:1px solid var(--ink-300); border-radius:var(--radius); font-size:14px; outline:none; font-family:inherit; transition:border .15s; background:#fff;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand-500); box-shadow:0 0 0 3px var(--brand-100);}
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  /* SEARCH */
  .search-bar{background:#fff; border:1px solid var(--ink-300); border-radius:var(--radius); display:flex; align-items:center; gap:10px; padding:0 14px; margin-bottom:20px;}
  .search-bar:focus-within{border-color:var(--brand-500); box-shadow:0 0 0 3px var(--brand-100);}
  .search-bar input{flex:1; border:none; background:transparent; padding:11px 0; outline:none; font-size:14px; font-family:inherit;}

  /* RESTAURANT CARDS */
  .restaurant-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px;}
  .restaurant-card{background:#fff; border:1px solid var(--ink-200); border-radius:var(--radius-lg); overflow:hidden; cursor:pointer; transition:all .15s;}
  .restaurant-card:hover{border-color:var(--brand-500); box-shadow:var(--shadow-md); transform:translateY(-2px);}
  .restaurant-img{height:140px; background:var(--brand-700); display:flex; align-items:center; justify-content:center; color:white; font-size:48px; font-weight:700; overflow:hidden;}
  .restaurant-img img{width:100%; height:100%; object-fit:cover;}
  .restaurant-body{padding:14px 16px;}
  .restaurant-body h3{font-size:15px; margin-bottom:4px;}
  .restaurant-cat{display:inline-block; font-size:10.5px; font-weight:600; color:var(--brand-700); background:var(--brand-50); padding:2px 8px; border-radius:4px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
  .restaurant-desc{font-size:12.5px; color:var(--ink-500); line-height:1.5;}

  /* FOOD ITEMS */
  .food-list{display:flex; flex-direction:column; gap:8px;}
  .food-item{background:#fff; border:1px solid var(--ink-200); border-radius:var(--radius); padding:12px; display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .food-item.disabled{opacity:.6; background:var(--ink-100);}
  .food-thumb{width:64px; height:64px; border-radius:8px; background:var(--ink-100); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--ink-400); font-weight:700; font-size:20px;}
  .food-thumb img{width:100%; height:100%; object-fit:cover;}
  .food-info{flex:1; min-width:0;}
  .food-name{font-weight:600; font-size:14px; margin-bottom:2px;}
  .food-desc{font-size:12px; color:var(--ink-500); margin-bottom:4px;}
  .food-price{font-weight:700; color:var(--brand-700); font-size:14px;}

  .qty-control{display:flex; align-items:center; gap:6px; background:var(--ink-100); padding:3px; border-radius:var(--radius);}
  .qty-control button{width:28px; height:28px; border-radius:5px; border:none; background:#fff; color:var(--brand-700); cursor:pointer; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center;}
  .qty-control button:hover{background:var(--brand-700); color:white;}
  .qty-control span{font-weight:600; min-width:20px; text-align:center; font-size:13px;}

  /* CART */
  .cart-layout{display:grid; grid-template-columns:1fr 340px; gap:20px; align-items:start;}
  .cart-items-card{background:#fff; border:1px solid var(--ink-200); border-radius:var(--radius-lg); overflow:hidden;}
  .cart-item-row{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--ink-100); gap:14px;}
  .cart-item-row:last-child{border-bottom:none;}
  .cart-item-info{flex:1; min-width:0;}
  .cart-item-name{font-weight:600; font-size:14px;}
  .cart-item-price{font-size:12.5px; color:var(--ink-500); margin-top:1px;}
  .cart-item-total{font-weight:700; color:var(--brand-700); font-size:14px; min-width:70px; text-align:right;}

  .cart-summary{background:#fff; border:1px solid var(--ink-200); border-radius:var(--radius-lg); padding:20px; position:sticky; top:80px;}
  .summary-line{display:flex; justify-content:space-between; padding:8px 0; font-size:13.5px;}
  .summary-line.total{border-top:1px solid var(--ink-200); margin-top:8px; padding-top:14px; font-size:16px; font-weight:700; color:var(--ink-900);}
  .penalty-line{display:flex; justify-content:space-between; padding:10px 0; font-size:13.5px; color:var(--danger); font-weight:600; border-top:1px dashed var(--danger-border); border-bottom:1px dashed var(--danger-border); margin:8px 0;}

  /* ADDRESS PICKER */
  .address-list{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .address-card{background:#fff; border:1px solid var(--ink-300); border-radius:var(--radius); padding:12px 14px; display:flex; gap:12px; align-items:flex-start; cursor:pointer; transition:all .15s;}
  .address-card:hover{border-color:var(--brand-500);}
  .address-card.selected{border-color:var(--brand-600); background:var(--brand-50); box-shadow:0 0 0 3px var(--brand-100);}
  .address-radio{width:16px; height:16px; border-radius:50%; border:2px solid var(--ink-400); flex-shrink:0; margin-top:3px; position:relative;}
  .address-card.selected .address-radio{border-color:var(--brand-700); background:var(--brand-700);}
  .address-card.selected .address-radio::after{content:''; position:absolute; inset:2px; border-radius:50%; background:#fff;}
  .address-content{flex:1; min-width:0;}
  .address-label{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--ink-900); margin-bottom:3px; text-transform:uppercase; letter-spacing:.03em;}
  .address-badge{background:var(--brand-700); color:white; font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px;}
  .address-text{font-size:13px; color:var(--ink-600); line-height:1.5;}
  .address-actions{display:flex; gap:4px; flex-shrink:0;}
  .address-actions button{background:transparent; border:none; color:var(--ink-500); cursor:pointer; font-size:14px; padding:4px; border-radius:4px;}
  .address-actions button:hover{background:var(--ink-100); color:var(--ink-800);}
  .add-address-btn{width:100%; padding:12px; border:1.5px dashed var(--ink-300); background:#fff; border-radius:var(--radius); cursor:pointer; color:var(--ink-600); font-family:inherit; font-size:13px; font-weight:600; transition:all .15s;}
  .add-address-btn:hover{border-color:var(--brand-500); color:var(--brand-700); background:var(--brand-50);}

  /* ORDERS */
  .order-card{background:#fff; border:1px solid var(--ink-200); border-radius:var(--radius-lg); margin-bottom:12px; overflow:hidden;}
  .order-header{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background:var(--ink-50); border-bottom:1px solid var(--ink-200); gap:12px; flex-wrap:wrap;}
  .order-id{font-weight:700; color:var(--ink-900); font-size:14px;}
  .order-meta{font-size:12px; color:var(--ink-500); margin-top:2px;}
  .order-body{padding:14px 18px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center;}
  .order-items-list{font-size:13px; color:var(--ink-600); line-height:1.7;}
  .order-total-label{font-size:11px; color:var(--ink-500); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .order-total-value{font-size:18px; font-weight:700; color:var(--brand-700);}

  .status-badge{display:inline-block; padding:4px 10px; border-radius:20px; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap;}
  .status-Placed{background:#dbeafe; color:#1e40af;}
  .status-Accepted{background:#e0e7ff; color:#3730a3;}
  .status-Preparing{background:#fef3c7; color:#92400e;}
  .status-Ready{background:#fed7aa; color:#9a3412;}
  .status-OutforDelivery{background:#cffafe; color:#155e75;}
  .status-Delivered{background:#dcfce7; color:#166534;}
  .status-Cancelled{background:#fee2e2; color:#991b1b;}

  /* ADMIN TABS */
  .admin-tabs{display:flex; gap:4px; margin-bottom:18px; background:#fff; padding:4px; border-radius:var(--radius); border:1px solid var(--ink-200); width:fit-content; flex-wrap:wrap;}
  .admin-tabs button{background:transparent; border:none; padding:7px 14px; border-radius:6px; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-500); cursor:pointer; transition:all .15s;}
  .admin-tabs button:hover{background:var(--ink-100); color:var(--ink-800);}
  .admin-tabs button.active{background:var(--brand-700); color:white;}

  /* TABLES */
  .data-table{background:#fff; border:1px solid var(--ink-200); border-radius:var(--radius-lg); overflow:hidden;}
  .data-table table{width:100%; border-collapse:collapse; font-size:13px;}
  .data-table th{text-align:left; padding:11px 16px; background:var(--ink-50); color:var(--ink-600); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--ink-200);}
  .data-table td{padding:12px 16px; border-bottom:1px solid var(--ink-100); vertical-align:middle;}
  .data-table tr:last-child td{border-bottom:none;}
  .data-table tr:hover td{background:var(--ink-50);}
  .data-table .actions{display:flex; gap:5px; justify-content:flex-end; flex-wrap:wrap;}
  .data-table .thumb{width:36px; height:36px; border-radius:6px; background:var(--ink-100); overflow:hidden; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-400); font-weight:700; font-size:14px; margin-right:8px; vertical-align:middle;}
  .data-table .thumb img{width:100%; height:100%; object-fit:cover;}

  /* STATS */
  .stats-row{display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:20px;}
  .stat-card{background:#fff; border:1px solid var(--ink-200); border-radius:var(--radius-lg); padding:16px;}
  .stat-label{font-size:11px; font-weight:600; color:var(--ink-500); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .stat-value{font-size:22px; font-weight:700; color:var(--ink-900);}

  /* PROFILE */
  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
  .penalty-box{background:var(--danger-bg); border:1px solid var(--danger-border); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .penalty-box-label{font-size:13px; font-weight:700; color:var(--danger);}
  .penalty-box-value{font-size:20px; font-weight:800; color:var(--danger);}

  /* AUTH */
  .auth-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--ink-50);}
  .auth-card{background:#fff; border-radius:var(--radius-lg); border:1px solid var(--ink-200); box-shadow:var(--shadow-md); padding:32px; width:100%; max-width:400px;}
  .auth-logo{width:48px; height:48px; border-radius:10px; background:var(--brand-700); color:white; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; margin:0 auto 16px;}
  .auth-card h1{text-align:center; font-size:20px; margin-bottom:4px;}
  .auth-sub{text-align:center; color:var(--ink-500); font-size:13px; margin-bottom:24px;}
  .auth-tabs{display:flex; background:var(--ink-100); padding:4px; border-radius:var(--radius); margin-bottom:20px;}
  .auth-tabs button{flex:1; background:transparent; border:none; padding:8px; border-radius:6px; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-500); cursor:pointer;}
  .auth-tabs button.active{background:#fff; color:var(--brand-700); box-shadow:var(--shadow-sm);}

  /* CART BAR */
  .cart-bar{position:fixed; bottom:76px; left:50%; transform:translateX(-50%); background:var(--ink-900); color:white; padding:12px 20px; border-radius:var(--radius); display:flex; align-items:center; gap:16px; cursor:pointer; z-index:60; box-shadow:var(--shadow-lg); font-size:13px; font-weight:600; max-width:calc(100% - 32px);}
  .cart-bar .count{background:var(--brand-500); color:white; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:700;}

  /* TOAST */
  .toast{position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--ink-900); color:white; padding:12px 20px; border-radius:var(--radius); font-size:13px; font-weight:500; z-index:1000; box-shadow:var(--shadow-lg); animation:dropDown .3s ease; max-width:90%; text-align:center;}
  .toast.error{border-bottom:3px solid var(--danger);}
  .toast.success{border-bottom:3px solid var(--success);}
  @keyframes dropDown{from{opacity:0; transform:translate(-50%, -20px);} to{opacity:1; transform:translate(-50%, 0);}}

  /* SPINNER */
  .spinner{width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
  .spinner.dark{border-color:var(--ink-200); border-top-color:var(--brand-700);}
  @keyframes spin{to{transform:rotate(360deg);}}

  .loading{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; gap:12px;}
  .loading .spinner{width:28px; height:28px; border-width:3px; border-color:var(--ink-200); border-top-color:var(--brand-700);}
  .loading p{color:var(--ink-500); font-size:13px;}

  /* MODAL */
  .modal-bg{position:fixed; inset:0; background:rgba(15,23,42,.6); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px; animation:fadeIn .15s;}
  .modal{background:#fff; border-radius:var(--radius-xl); padding:24px; max-width:480px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg);}
  .modal h3{margin-bottom:16px; font-size:16px;}

  /* EMPTY */
  .empty{text-align:center; padding:48px 20px; color:var(--ink-500);}
  .empty .icon{font-size:40px; margin-bottom:12px; opacity:.4;}
  .empty h3{color:var(--ink-700); margin-bottom:4px; font-size:15px;}

  /* BOTTOM NAV */
  .bottom-nav{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--ink-200); z-index:100;}
  .bottom-nav-inner{max-width:720px; margin:0 auto; display:flex; justify-content:space-around; padding:6px 8px;}
  .nav-item{flex:1; background:transparent; border:none; padding:8px 4px; cursor:pointer; color:var(--ink-500); font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px; border-radius:8px; position:relative; max-width:120px; font-family:inherit;}
  .nav-item .icon{font-size:20px; line-height:1;}
  .nav-item:hover{background:var(--ink-100);}
  .nav-item.active{color:var(--brand-700);}
  .nav-item .badge{position:absolute; top:4px; right:calc(50% - 24px); background:var(--danger); color:white; font-size:9px; font-weight:700; padding:2px 6px; border-radius:10px; min-width:16px; text-align:center;}

  /* HELPERS */
  .flex-between{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  @media (max-width:860px){
    .main{padding:16px;}
    .cart-layout{grid-template-columns:1fr;}
    .cart-summary{position:static;}
    .profile-grid{grid-template-columns:1fr;}
    .stats-row{grid-template-columns:repeat(2, 1fr);}
    .order-body{grid-template-columns:1fr;}
    .data-table{overflow-x:auto;}
    .data-table table{min-width:600px;}
    .restaurant-grid{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .toast{top:12px; left:12px; right:12px; transform:none; max-width:none;}
    .cart-bar{bottom:72px; left:12px; right:12px; transform:none; max-width:none; justify-content:space-between;}
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="cart-root"></div>
<div id="toast-root"></div>
<div id="modal-root"></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, sendPasswordResetEmail, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc,
  query, where, onSnapshot, getDocs, serverTimestamp,
  deleteDoc, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZy_JeQH7Ofvqru2DME1EsH59Yh5JtRjs",
  authDomain: "pawan-retail-limited07.firebaseapp.com",
  projectId: "pawan-retail-limited07",
  storageBucket: "pawan-retail-limited07.firebasestorage.app",
  messagingSenderId: "595261097611",
  appId: "1:595261097611:web:88a136d144129b142b368e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ============ STATE ============ */
const state = {
  user: null, profile: null, addresses: [], view: 'home',
  cart: JSON.parse(localStorage.getItem('cart') || '{}'),
  currentRestaurant: null, checkoutAddressId: null,
  adminTab: 'restaurants', unsubs: {},
};

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const money = n => '₹' + Number(n||0).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => { if (!ts) return '—'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); };
const saveCart = () => localStorage.setItem('cart', JSON.stringify(state.cart));
const cartSubtotal = () => Object.values(state.cart).reduce((s,i)=>s+i.qty*i.price,0);
const cartItemCount = () => Object.values(state.cart).reduce((s,i)=>s+i.qty,0);
const currentPenalty = () => Number(state.profile?.penaltyBalance || 0);
const cartGrandTotal = () => cartSubtotal() + currentPenalty();
const clearCart = () => { state.cart = {}; saveCart(); };
const loadingHTML = (msg='Loading…') => `<div class="loading"><div class="spinner dark"></div><p>${msg}</p></div>`;

function toast(msg, type='') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  $('toast-root').appendChild(el); setTimeout(() => el.remove(), 3500);
}
function openModal(html, onMount) {
  $('modal-root').innerHTML = `<div class="modal-bg" id="mb"><div class="modal modal-anim">${html}</div></div>`;
  $('mb').onclick = e => { if (e.target.id === 'mb') closeModal(); };
  if (onMount) onMount();
}
function closeModal() { $('modal-root').innerHTML = ''; }

const formatAddress = a => {
  if (!a) return '';
  return [a.street, a.sector, a.landmark, a.city, a.state, a.pincode].filter(Boolean).join(', ');
};

/* ============ NAV ============ */
const NAV_ITEMS = [
  { id:'home', label:'Home', icon:'⌂' },
  { id:'orders', label:'Orders', icon:'▤' },
  { id:'cart', label:'Cart', icon:'▣' },
  { id:'profile', label:'Profile', icon:'◉' },
  { id:'admin', label:'Admin', icon:'⚙', admin:true },
];

function renderShell() {
  const isAdmin = state.profile?.role === 'admin';
  const penalty = currentPenalty();
  $('app').innerHTML = `
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="brand-mark">P</div>
            <div class="brand-text"><span class="name">Pawan Retail Limited</span><span class="tag">Food Ordering</span></div>
          </div>
          <div class="topbar-actions">
            ${penalty > 0 ? `<button class="penalty-chip" id="penalty-chip">Penalty ${money(penalty)}</button>` : ''}
          </div>
        </div>
      </header>
      <main class="main" id="root"></main>
      <nav class="bottom-nav"><div class="bottom-nav-inner" id="bottom-nav"></div></nav>
    </div>
  `;
  renderBottomNav();
  if ($('penalty-chip')) $('penalty-chip').onclick = () => navigate('profile');
}

function renderBottomNav() {
  const nav = $('bottom-nav'); if (!nav) return;
  const isAdmin = state.profile?.role === 'admin';
  const items = NAV_ITEMS.filter(n => !n.admin || isAdmin);
  const cartCount = cartItemCount();
  nav.innerHTML = items.map(item => {
    const isActive = state.view === item.id || (state.view === 'restaurant' && item.id === 'home');
    let badge = (item.id === 'cart' && cartCount > 0) ? `<span class="badge">${cartCount}</span>` : '';
    return `<button class="nav-item ${isActive?'active':''}" data-nav="${item.id}"><span class="icon">${item.icon}</span><span>${item.label}</span>${badge}</button>`;
  }).join('');
  nav.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navigate(b.dataset.nav));
}

function navigate(view) {
  state.view = view; render(); window.scrollTo({ top:0, behavior:'smooth' });
}

/* ============ AUTH ============ */
function renderAuth() {
  $('app').innerHTML = `
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-logo">P</div>
        <h1>Pawan Retail Limited</h1>
        <p class="auth-sub">Sign in to order food</p>
        <div class="auth-tabs">
          <button class="active" id="tab-login">Sign In</button>
          <button id="tab-reg">Register</button>
        </div>
        <div id="auth-form"></div>
      </div>
    </div>
  `;
  $('tab-login').onclick = showLogin;
  $('tab-reg').onclick = showRegister;
  showLogin();
}
function showLogin() {
  $('tab-login').classList.add('active'); $('tab-reg').classList.remove('active');
  $('auth-form').innerHTML = `
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com" /></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••" /></div>
    <button class="btn block" id="do-login" style="margin-top:4px">Sign In</button>
    <p style="text-align:center;margin-top:16px"><a href="#" id="forgot" style="color:var(--brand-700); font-size:12.5px; font-weight:600; text-decoration:none">Forgot password?</a></p>
  `;
  $('do-login').onclick = doLogin;
  $('forgot').onclick = async e => {
    e.preventDefault();
    const email = $('email').value.trim();
    if (!email) return toast('Enter your email first','error');
    try { await sendPasswordResetEmail(auth, email); toast('Reset email sent','success'); }
    catch (err) { toast(err.message,'error'); }
  };
}
function showRegister() {
  $('tab-reg').classList.add('active'); $('tab-login').classList.remove('active');
  $('auth-form').innerHTML = `
    <div class="field"><label>Full Name</label><input id="r-name" placeholder="Your name" /></div>
    <div class="field"><label>Email</label><input id="r-email" type="email" placeholder="you@example.com" /></div>
    <div class="field"><label>Password</label><input id="r-pass" type="password" placeholder="Min 6 characters" /></div>
    <div class="field"><label>Phone</label><input id="r-phone" placeholder="+91 90000 00000" /></div>
    <button class="btn block" id="do-reg" style="margin-top:4px">Create Account</button>
  `;
  $('do-reg').onclick = doRegister;
}
async function doLogin() {
  const email = $('email').value.trim(), pass = $('password').value;
  if (!email || !pass) return toast('Fill all fields','error');
  const btn = $('do-login'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';
  try { await signInWithEmailAndPassword(auth, email, pass); toast('Welcome back','success'); }
  catch (e) { toast(e.message,'error'); btn.disabled = false; btn.textContent = 'Sign In'; }
}
async function doRegister() {
  const name = $('r-name').value.trim(), email = $('r-email').value.trim();
  const pass = $('r-pass').value, phone = $('r-phone').value.trim();
  if (!name || !email || !pass || !phone) return toast('Fill all fields','error');
  if (pass.length < 6) return toast('Password must be 6+ characters','error');
  const btn = $('do-reg'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating…';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db,'users',cred.user.uid), {
      uid: cred.user.uid, name, email, phone,
      role: 'customer', penaltyBalance: 0,
      createdAt: serverTimestamp()
    });
    toast('Account created','success');
  } catch (e) { toast(e.message,'error'); btn.disabled = false; btn.textContent = 'Create Account'; }
}

/* ============ HOME ============ */
async function renderHome() {
  const root = $('root');
  const penalty = currentPenalty();
  root.innerHTML = `
    <div class="page">
      <div style="margin-bottom:20px">
        <h1>Discover Restaurants</h1>
        <p class="muted" style="margin-top:4px">Order from the best places near you</p>
      </div>
      ${penalty > 0 ? `
        <div class="penalty-box">
          <div>
            <div class="penalty-box-label">Outstanding penalty</div>
            <div class="muted" style="font-size:12px; color:#b91c1c">Will be auto-added to your next order.</div>
          </div>
          <div class="penalty-box-value">${money(penalty)}</div>
        </div>
      ` : ''}
      <div class="search-bar"><span style="color:var(--ink-400)">⌕</span><input id="search" placeholder="Search restaurants or cuisines…" /></div>
      <div id="rgrid">${loadingHTML()}</div>
    </div>
  `;
  const snap = await getDocs(query(collection(db,'restaurants'), where('active','==',true)));
  const list = [];
  snap.forEach(d => list.push({ id: d.id, ...d.data() }));
  const paint = (filter='') => {
    const f = filter.toLowerCase();
    const filtered = list.filter(r => (r.name||'').toLowerCase().includes(f) || (r.category||'').toLowerCase().includes(f));
    $('rgrid').innerHTML = filtered.length ? `
      <div class="restaurant-grid">
        ${filtered.map(r => `
          <div class="restaurant-card" data-rid="${r.id}">
            <div class="restaurant-img">${r.imageUrl ? `<img src="${esc(r.imageUrl)}" class="img-fade" onerror="this.parentNode.textContent='${esc((r.name||'R')[0])}'" />` : esc((r.name||'R')[0])}</div>
            <div class="restaurant-body">
              <span class="restaurant-cat">${esc(r.category||'Restaurant')}</span>
              <h3>${esc(r.name)}</h3>
              <p class="restaurant-desc">${esc(r.description||'')}</p>
            </div>
          </div>
        `).join('')}
      </div>
    ` : `<div class="empty"><div class="icon">⌕</div><h3>No restaurants found</h3><p>Try a different search</p></div>`;
    document.querySelectorAll('[data-rid]').forEach(c => c.onclick = () => {
      state.currentRestaurant = c.dataset.rid; navigate('restaurant');
    });
  };
  paint();
  $('search').oninput = e => paint(e.target.value);
}

/* ============ RESTAURANT ============ */
async function renderRestaurant() {
  if (state.unsubs.menu) { state.unsubs.menu(); state.unsubs.menu = null; }
  if (!state.currentRestaurant) return navigate('home');
  const rDoc = await getDoc(doc(db,'restaurants',state.currentRestaurant));
  if (!rDoc.exists()) { toast('Restaurant not found','error'); return navigate('home'); }
  const r = rDoc.data();
  $('root').innerHTML = `
    <div class="page">
      <button class="btn ghost sm" id="back" style="margin-bottom:16px">← Back</button>
      <div class="card" style="margin-bottom:16px; background:var(--brand-700); border-color:var(--brand-700); color:white; padding:0; overflow:hidden">
        <div style="display:flex; align-items:center; gap:16px; padding:20px">
          <div style="width:80px; height:80px; background:rgba(255,255,255,.15); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:700; flex-shrink:0; overflow:hidden">
            ${r.imageUrl ? `<img src="${esc(r.imageUrl)}" style="width:100%; height:100%; object-fit:cover" onerror="this.parentNode.textContent='${esc((r.name||'R')[0])}'" />` : esc((r.name||'R')[0])}
          </div>
          <div style="min-width:0">
            <h1 style="color:white; font-size:22px; margin-bottom:4px">${esc(r.name)}</h1>
            <p style="opacity:.85; font-size:13px">${esc(r.category||'')} · ${esc(r.description||'')}</p>
          </div>
        </div>
      </div>
      <h2 style="font-size:16px; margin-bottom:12px">Menu</h2>
      <div id="menu">${loadingHTML()}</div>
    </div>
  `;
  $('back').onclick = () => navigate('home');

  state.unsubs.menu = onSnapshot(collection(db,'restaurants',state.currentRestaurant,'menu'), snap => {
    const items = [];
    snap.forEach(d => items.push({ id:d.id, ...d.data() }));
    const el = $('menu'); if (!el) return;
    if (!items.length) {
      el.innerHTML = `<div class="empty"><div class="icon">▤</div><h3>No items yet</h3></div>`; return;
    }
    el.innerHTML = `<div class="food-list">${items.map(it => {
      const cartItem = state.cart[it.id];
      const qty = cartItem?.qty || 0;
      const otherRest = cartItem && cartItem.restaurantId !== state.currentRestaurant;
      return `
        <div class="food-item ${it.available===false?'disabled':''}">
          <div class="food-thumb">${it.imageUrl ? `<img src="${esc(it.imageUrl)}" onerror="this.parentNode.textContent='${esc((it.name||'F')[0])}'" />` : esc((it.name||'F')[0])}</div>
          <div class="food-info">
            <div class="food-name">${esc(it.name)}</div>
            <div class="food-desc">${esc(it.description||'')}</div>
            <div class="food-price">${money(it.price)} ${it.available===false?'<span class="muted">· Unavailable</span>':''}</div>
          </div>
          ${it.available===false || otherRest ? '' : qty > 0 ? `
            <div class="qty-control">
              <button data-act="dec" data-id="${it.id}">−</button>
              <span>${qty}</span>
              <button data-act="inc" data-id="${it.id}" data-name="${esc(it.name)}" data-price="${it.price}" data-rid="${state.currentRestaurant}">+</button>
            </div>` : `
            <button class="btn sm" data-act="inc" data-id="${it.id}" data-name="${esc(it.name)}" data-price="${it.price}" data-rid="${state.currentRestaurant}">Add</button>
          `}
        </div>
      `;
    }).join('')}</div>`;
    el.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
      const { act, id, name, price, rid } = btn.dataset;
      if (act === 'inc') {
        if (Object.values(state.cart).some(c => c.restaurantId !== rid))
          return toast('Clear cart from another restaurant first','error');
        if (!state.cart[id]) state.cart[id] = { itemId: id, name, price: Number(price), qty: 0, restaurantId: rid };
        state.cart[id].qty++;
      } else {
        if (state.cart[id]) { state.cart[id].qty--; if (state.cart[id].qty <= 0) delete state.cart[id]; }
      }
      saveCart(); renderBottomNav(); renderCartBar(); renderRestaurant();
    });
  });
}

/* ============ CART BAR ============ */
function renderCartBar() {
  const root = $('cart-root');
  const n = cartItemCount();
  if (!n) { root.innerHTML = ''; return; }
  root.innerHTML = `<div class="cart-bar" id="cartbar"><span>Cart</span><span class="count">${n}</span><span>${money(cartGrandTotal())}</span></div>`;
  $('cartbar').onclick = () => navigate('cart');
}

/* ============ ADDRESSES ============ */
function loadAddresses() {
  if (state.unsubs.addresses) state.unsubs.addresses();
  state.unsubs.addresses = onSnapshot(collection(db,'users',state.user.uid,'addresses'), snap => {
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    list.sort((a,b) => (b.isDefault?1:0) - (a.isDefault?1:0));
    state.addresses = list;
    if (!state.checkoutAddressId || !list.find(x => x.id === state.checkoutAddressId)) {
      const def = list.find(a => a.isDefault) || list[0];
      state.checkoutAddressId = def ? def.id : null;
    }
    if (['cart','profile'].includes(state.view)) render();
  });
}
function addressFormHTML(a = {}) {
  return `
    <div class="field-row">
      <div class="field"><label>Label</label><input id="a-label" value="${esc(a.label||'')}" placeholder="Home, Office…" /></div>
      <div class="field"><label>Phone</label><input id="a-phone" value="${esc(a.phone||'')}" placeholder="+91…" /></div>
    </div>
    <div class="field"><label>Street / House No.</label><input id="a-street" value="${esc(a.street||'')}" /></div>
    <div class="field-row">
      <div class="field"><label>Sector / Area</label><input id="a-sector" value="${esc(a.sector||'')}" /></div>
      <div class="field"><label>Landmark</label><input id="a-landmark" value="${esc(a.landmark||'')}" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>City</label><input id="a-city" value="${esc(a.city||'')}" /></div>
      <div class="field"><label>State</label><input id="a-state" value="${esc(a.state||'')}" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Pincode</label><input id="a-pincode" value="${esc(a.pincode||'')}" maxlength="6" /></div>
      <div class="field" style="display:flex;align-items:flex-end">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;text-transform:none;cursor:pointer;margin-bottom:9px"><input type="checkbox" id="a-default" ${a.isDefault?'checked':''} style="width:auto;margin:0" /> Set as default</label>
      </div>
    </div>
  `;
}
function readAddressForm() {
  return {
    label: $('a-label').value.trim(), phone: $('a-phone').value.trim(),
    street: $('a-street').value.trim(), sector: $('a-sector').value.trim(),
    landmark: $('a-landmark').value.trim(), city: $('a-city').value.trim(),
    state: $('a-state').value.trim(), pincode: $('a-pincode').value.trim(),
    isDefault: $('a-default').checked,
  };
}
function validateAddress(a) {
  if (!a.label) return 'Label required';
  if (!a.phone) return 'Phone required';
  if (!a.street) return 'Street required';
  if (!a.city) return 'City required';
  if (!a.state) return 'State required';
  if (!a.pincode || a.pincode.length < 4) return 'Valid pincode required';
  return null;
}
async function saveAddress(addrId, data) {
  if (data.isDefault) {
    await Promise.all(state.addresses.filter(a => a.isDefault && a.id !== addrId).map(a =>
      updateDoc(doc(db,'users',state.user.uid,'addresses',a.id), { isDefault: false })
    ));
  }
  const payload = { ...data, updatedAt: serverTimestamp() };
  if (addrId) await updateDoc(doc(db,'users',state.user.uid,'addresses',addrId), payload);
  else {
    const ref = doc(collection(db,'users',state.user.uid,'addresses'));
    payload.createdAt = serverTimestamp();
    await setDoc(ref, payload);
    state.checkoutAddressId = ref.id;
  }
}
async function deleteAddress(addrId) {
  if (!confirm('Delete this address?')) return;
  await deleteDoc(doc(db,'users',state.user.uid,'addresses',addrId));
  toast('Address deleted','success');
}
function openAddressModal(addr = null) {
  openModal(`
    <h3>${addr ? 'Edit' : 'Add'} Address</h3>
    ${addressFormHTML(addr || {})}
    <div style="display:flex; gap:8px; margin-top:8px">
      <button class="btn secondary" id="cancel-addr" style="flex:1">Cancel</button>
      <button class="btn" id="save-addr" style="flex:1">Save</button>
    </div>
  `, () => {
    $('cancel-addr').onclick = closeModal;
    $('save-addr').onclick = async () => {
      const data = readAddressForm();
      const err = validateAddress(data);
      if (err) return toast(err,'error');
      const btn = $('save-addr'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving…';
      try {
        await saveAddress(addr?.id || null, data);
        toast('Address saved','success'); closeModal();
      } catch (e) { toast(e.message,'error'); btn.disabled = false; btn.textContent = 'Save'; }
    };
  });
}

/* ============ CART ============ */
function renderCart() {
  const items = Object.values(state.cart);
  if (!items.length) {
    $('root').innerHTML = `<div class="page empty"><div class="icon">▣</div><h3>Your cart is empty</h3><p style="margin-bottom:16px">Add items to get started</p><button class="btn" id="shop">Browse Restaurants</button></div>`;
    $('shop').onclick = () => navigate('home');
    renderCartBar(); return;
  }
  const subtotal = cartSubtotal();
  const penalty = currentPenalty();
  const grand = subtotal + penalty;
  const selectedAddr = state.addresses.find(a => a.id === state.checkoutAddressId) || state.addresses[0] || null;

  $('root').innerHTML = `
    <div class="page">
      <h1 style="margin-bottom:16px">Checkout</h1>
      <div class="cart-layout">
        <div>
          <div class="cart-items-card" style="margin-bottom:16px">
            <div style="padding:14px 18px; border-bottom:1px solid var(--ink-200)"><h3 style="margin:0">Items (${cartItemCount()})</h3></div>
            ${items.map(it => `
              <div class="cart-item-row">
                <div class="cart-item-info"><div class="cart-item-name">${esc(it.name)}</div><div class="cart-item-price">${money(it.price)} each</div></div>
                <div class="qty-control">
                  <button data-id="${it.itemId}" data-act="dec">−</button><span>${it.qty}</span>
                  <button data-id="${it.itemId}" data-act="inc">+</button>
                </div>
                <div class="cart-item-total">${money(it.price*it.qty)}</div>
              </div>
            `).join('')}
          </div>
          <div class="card">
            <div class="flex-between" style="margin-bottom:12px">
              <h3 style="margin:0">Delivery Address</h3>
              <button class="btn sm secondary" id="add-address-btn">+ Add</button>
            </div>
            ${state.addresses.length ? `
              <div class="address-list">
                ${state.addresses.map(a => `
                  <div class="address-card ${a.id === selectedAddr?.id ? 'selected' : ''}" data-aid="${a.id}">
                    <div class="address-radio"></div>
                    <div class="address-content">
                      <div class="address-label">${esc(a.label)} ${a.isDefault?'<span class="address-badge">Default</span>':''}</div>
                      <div class="address-text"><strong>${esc(a.street||'')}</strong>${a.sector ? ', '+esc(a.sector) : ''}${a.landmark ? ', near '+esc(a.landmark) : ''}<br>${esc(a.city||'')}, ${esc(a.state||'')} — ${esc(a.pincode||'')}<br>${esc(a.phone||'')}</div>
                    </div>
                    <div class="address-actions">
                      <button data-edit-addr="${a.id}">✎</button>
                      <button data-del-addr="${a.id}">✕</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : `<p class="muted" style="margin-bottom:12px">No saved addresses yet.</p>`}
          </div>
        </div>
        <div class="cart-summary">
          <h3 style="margin-bottom:12px">Summary</h3>
          <div class="summary-line"><span>Subtotal</span><span>${money(subtotal)}</span></div>
          ${penalty > 0 ? `<div class="penalty-line"><span>Penalty (auto)</span><span>${money(penalty)}</span></div>` : ''}
          <div class="summary-line total"><span>Total</span><span>${money(grand)}</span></div>
          <div class="field" style="margin-top:16px"><label>Notes</label><input id="d-notes" placeholder="Optional" /></div>
          <button class="btn block" id="place" ${!selectedAddr ? 'disabled' : ''}>Place Order · ${money(grand)}</button>
        </div>
      </div>
    </div>
  `;
  document.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.id;
    if (btn.dataset.act === 'inc') state.cart[id].qty++;
    else { state.cart[id].qty--; if (state.cart[id].qty <= 0) delete state.cart[id]; }
    saveCart(); renderCart(); renderCartBar(); renderBottomNav();
  });
  document.querySelectorAll('[data-aid]').forEach(card => card.onclick = e => {
    if (e.target.closest('[data-edit-addr]') || e.target.closest('[data-del-addr]')) return;
    state.checkoutAddressId = card.dataset.aid; renderCart();
  });
  document.querySelectorAll('[data-edit-addr]').forEach(b => b.onclick = e => { e.stopPropagation(); openAddressModal(state.addresses.find(x => x.id === b.dataset.editAddr)); });
  document.querySelectorAll('[data-del-addr]').forEach(b => b.onclick = e => { e.stopPropagation(); deleteAddress(b.dataset.delAddr); });

/* ============ PLACE ORDER ============ */
async function placeOrder() {
  const items = Object.values(state.cart);
  const addr = state.addresses.find(a => a.id === state.checkoutAddressId);
  if (!addr) return toast('Select a delivery address','error');
  const notes = $('d-notes')?.value.trim() || '';
  const restaurantId = items[0].restaurantId;
  const btn = $('place'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Placing…';
  try {
    const restSnap = await getDoc(doc(db,'restaurants',restaurantId));
    if (!restSnap.exists() || restSnap.data().active === false) throw new Error('Restaurant is closed');
    let subtotal = 0; const orderItems = [];
    for (const it of items) {
      const mSnap = await getDoc(doc(db,'restaurants',restaurantId,'menu',it.itemId));
      if (!mSnap.exists()) throw new Error(`Item not found: ${it.name}`);
      const m = mSnap.data();
      if (m.available === false) throw new Error(`${m.name} is unavailable`);
      const lineTotal = Number(m.price) * it.qty;
      subtotal += lineTotal;
      orderItems.push({ itemId: it.itemId, name: m.name, price: Number(m.price), qty: it.qty, lineTotal });
    }
    subtotal = Math.round(subtotal * 100) / 100;
    const orderId = doc(collection(db,'foodOrders')).id;
    const customerRef = doc(db,'users',state.user.uid);
    const result = await runTransaction(db, async tx => {
      const userSnap = await tx.get(customerRef);
      if (!userSnap.exists()) throw new Error('Profile missing');
      const penalty = Number(userSnap.data().penaltyBalance || 0);
      const grandTotal = Math.round((subtotal + penalty) * 100) / 100;
      tx.set(doc(db,'foodOrders',orderId), {
        orderId, customerUid: state.user.uid, customerName: userSnap.data().name || '',
        restaurantId, restaurantName: restSnap.data().name,
        items: orderItems, subtotal, penaltyApplied: penalty, total: grandTotal,
        status: 'Placed', deliveryAddress: formatAddress(addr),
        deliveryAddressDetail: { label: addr.label, street: addr.street, sector: addr.sector, landmark: addr.landmark, city: addr.city, state: addr.state, pincode: addr.pincode, phone: addr.phone },
        phone: addr.phone, notes, penaltyAmount: 0, penaltyStatus: 'none', refundStatus: 'n/a',
        createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
      });
      if (penalty > 0) {
        tx.update(customerRef, { penaltyBalance: 0 });
        tx.set(doc(collection(db,'penaltyHistory')), {
          customerUid: state.user.uid, orderId, type: 'cleared', amount: -penalty,
          balanceBefore: penalty, balanceAfter: 0,
          reason: `Cleared in order #${orderId.slice(-8).toUpperCase()}`,
          createdBy: 'system', createdAt: serverTimestamp(),
        });
      }
      return { grandTotal, penalty };
    });
    if (state.profile) state.profile.penaltyBalance = 0;
    toast(`Order placed! ${money(result.grandTotal)}${result.penalty > 0 ? ` (${money(result.penalty)} penalty cleared)` : ''}`,'success');
    clearCart(); navigate('orders');
  } catch (e) {
    toast(e.message || 'Order failed','error');
    btn.disabled = false; btn.textContent = 'Place Order · ' + money(cartGrandTotal());
  }
}

    <div style="display:flex; gap:8px; margin-top:8px">

      <button class="btn danger" id="yes" style="flex:1">Confirm Cancel</button>

async function doCancel(orderId, reason, total) {
  const btn = $('yes'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Cancelling…';
  try {
    const customerRef = doc(db,'users',state.user.uid);
    const orderRef = doc(db,'foodOrders',orderId);
    const result = await runTransaction(db, async tx => {
      const oSnap = await tx.get(orderRef);
      if (!oSnap.exists()) throw new Error('Order not found');
      const o = oSnap.data();
      if (o.customerUid !== state.user.uid) throw new Error('Not your order');
      if (o.status === 'Cancelled') throw new Error('Already cancelled');
      if (!['Placed','Accepted'].includes(o.status)) throw new Error(`Cannot cancel at status: ${o.status}`);
      const penaltyAmount = Math.round(o.total * 100) / 100;
      const uSnap = await tx.get(customerRef);
      const prevBal = uSnap.data()?.penaltyBalance || 0;
      const newBal = Math.round((prevBal + penaltyAmount) * 100) / 100;
      tx.update(orderRef, { status: 'Cancelled', cancelledBy: 'customer', cancellationReason: reason, cancelledAt: serverTimestamp(), penaltyAmount, penaltyStatus: 'applied', updatedAt: serverTimestamp() });
      tx.update(customerRef, { penaltyBalance: newBal });
      tx.set(doc(collection(db,'penaltyHistory')), {
        customerUid: state.user.uid, orderId, type: 'penalty', amount: penaltyAmount,
        balanceBefore: prevBal, balanceAfter: newBal,
        reason: `Order cancellation: ${reason}`, createdBy: 'customer', createdAt: serverTimestamp(),
      });
      return { penaltyAmount, newBal };
    });
    if (state.profile) state.profile.penaltyBalance = result.newBal;
    closeModal();
    setTimeout(() => {
      openModal(`
        <div style="text-align:center; padding:8px 0">
          <div style="font-size:44px; margin-bottom:10px">⚠️</div>
          <h3 style="margin-bottom:8px">Penalty Applied</h3>
          <p class="muted" style="margin-bottom:16px">A penalty of <b style="color:var(--danger)">${money(result.penaltyAmount)}</b> has been added to your account. It will be auto-adjusted in your next order.</p>
          <button class="btn block" id="ok-pen">Understood</button>
        </div>
      `, () => { $('ok-pen').onclick = () => { closeModal(); renderShell(); }; });
    }, 200);
  } catch (e) {
    toast(e.message || 'Cancel failed','error');
    btn.disabled = false; btn.textContent = 'Confirm Cancel';
  }
}

    };
  });
}

/* ---------- ADMIN: ORDERS ---------- */
async function adminOrders() {
  const el = $('admin-body');
  el.innerHTML = `<div class="flex-between" style="margin-bottom:14px"><p class="muted">All orders</p><button class="btn" id="new-order">+ Create Order for Customer</button></div><div id="ol">${loadingHTML()}</div>`;
  $('new-order').onclick = () => adminCreateOrder();
  const snap = await getDocs(collection(db,'foodOrders'));
  const orders = []; snap.forEach(d => orders.push({ id:d.id, ...d.data() }));
  orders.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  const ol = $('ol');
  if (!orders.length) { ol.innerHTML = `<div class="empty"><div class="icon">▤</div><h3>No orders yet</h3></div>`; return; }
  const statuses = ['Placed','Accepted','Preparing','Ready','Out for Delivery','Delivered'];
  ol.innerHTML = `<div class="data-table"><table><thead><tr><th>Order</th><th>Customer</th><th>Restaurant</th><th>Total</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>
    ${orders.map(o => `<tr>
      <td><b>#${esc(o.orderId.slice(-8).toUpperCase())}</b><div class="muted">${fmtDate(o.createdAt)}</div></td>
      <td>${esc(o.customerName||'—')}<div class="muted">${esc(o.phone||'')}</div></td>
      <td>${esc(o.restaurantName||'—')}</td>
      <td><b>${money(o.total)}</b>${o.penaltyApplied > 0 ? `<div class="muted" style="color:var(--danger)">+${money(o.penaltyApplied)} penalty</div>` : ''}</td>
      <td><span class="status-badge status-${o.status.replace(/\s/g,'')}">${esc(o.status)}</span></td>
      <td class="actions">
        ${o.status !== 'Cancelled' ? `
          <select data-status="${o.id}" style="width:auto;padding:6px 8px;font-size:12px;border-radius:6px;border:1px solid var(--ink-300)">
            ${statuses.map(s => `<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
          </select>
          <button class="btn sm danger" data-ccancel="${o.id}">Cancel</button>
        ` : `<span class="muted">by ${esc(o.cancelledBy||'—')}</span>`}
      </td>
    </tr>`).join('')}
  </tbody></table></div>`;
  ol.querySelectorAll('[data-status]').forEach(sel => sel.onchange = async () => {
    const orderId = sel.dataset.status, newStatus = sel.value;
    try {
      await updateDoc(doc(db,'foodOrders',orderId), { status: newStatus, updatedAt: serverTimestamp() });
      await addDoc(collection(db,'adminAuditLogs'), { action: 'updateOrderStatus', orderId, toStatus: newStatus, adminUid: state.user.uid, createdAt: serverTimestamp() });
      toast('Status updated','success');
    } catch (e) { toast(e.message,'error'); adminOrders(); }
  });
  ol.querySelectorAll('[data-ccancel]').forEach(b => b.onclick = () => {
    openModal(`
      <h3>Cancel Order (Company)</h3>
      <p class="muted" style="margin-bottom:16px">No penalty to customer.</p>
      <div class="field"><label>Reason</label><input id="cr" /></div>
      <div style="display:flex;gap:8px">
        <button class="btn secondary" id="no" style="flex:1">Cancel</button>
        <button class="btn danger" id="ok" style="flex:1">Confirm</button>
      </div>
    `, () => {
      $('no').onclick = closeModal;
      $('ok').onclick = async () => {
        const reason = $('cr').value.trim() || 'Company cancelled';
        try {
          await updateDoc(doc(db,'foodOrders',b.dataset.ccancel), { status: 'Cancelled', cancelledBy: 'company', cancellationReason: reason, cancelledAt: serverTimestamp(), penaltyAmount: 0, penaltyStatus: 'none', updatedAt: serverTimestamp() });
          await addDoc(collection(db,'adminAuditLogs'), { action: 'companyCancel', orderId: b.dataset.ccancel, reason, adminUid: state.user.uid, createdAt: serverTimestamp() });
          toast('Cancelled (no penalty)','success'); closeModal(); adminOrders();
        } catch (e) { toast(e.message,'error'); }
      };
    });
  });
}

/* ---------- ADMIN: CREATE ORDER FOR CUSTOMER ---------- */
async function adminCreateOrder() {
  // Step 1: fetch customers and restaurants
  const [uSnap, rSnap] = await Promise.all([getDocs(collection(db,'users')), getDocs(query(collection(db,'restaurants'), where('active','==',true)))]);
  const users = []; uSnap.forEach(d => users.push({ id:d.id, ...d.data() }));
  const rests = []; rSnap.forEach(d => rests.push({ id:d.id, ...d.data() }));
  users.sort((a,b) => (a.name||'').localeCompare(b.name||''));

  openModal(`
    <h3>Create Order for Customer</h3>
    <div class="field"><label>Customer</label>
      <select id="ao-cust">
        <option value="">— Select customer —</option>
        ${users.map(u => `<option value="${u.id}">${esc(u.name||u.email)} (${esc(u.email)})</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Restaurant</label>
      <select id="ao-rest">
        <option value="">— Select restaurant —</option>
        ${rests.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('')}
      </select>
    </div>
    <div id="ao-menu" class="muted" style="margin-bottom:12px">Select restaurant to load menu.</div>
    <div id="ao-items" style="max-height:240px; overflow-y:auto; border:1px solid var(--ink-200); border-radius:8px; padding:8px; margin-bottom:12px"></div>
    <div class="field-row">
      <div class="field"><label>Delivery Address (override)</label><input id="ao-addr" placeholder="Address text" /></div>
      <div class="field"><label>Phone</label><input id="ao-phone" placeholder="Phone" /></div>
    </div>
    <div style="background:var(--ink-50); padding:10px; border-radius:8px; margin-bottom:12px; display:flex; justify-content:space-between"><b>Total:</b><b id="ao-total">₹0.00</b></div>
    <div style="display:flex;gap:8px">
      <button class="btn secondary" id="ao-cancel" style="flex:1">Cancel</button>
      <button class="btn" id="ao-create" style="flex:1">Create Order</button>
    </div>
  `, () => {
    const aoItemsState = {};
    const recalc = () => {
      const total = Object.values(aoItemsState).reduce((s,i) => s + i.price*i.qty, 0);
      $('ao-total').textContent = money(total);
    };
    $('ao-cancel').onclick = closeModal;
    $('ao-rest').onchange = async () => {
      const rid = $('ao-rest').value;
      const wrap = $('ao-items');
      Object.keys(aoItemsState).forEach(k => delete aoItemsState[k]);
      recalc();
      if (!rid) { wrap.innerHTML = ''; $('ao-menu').textContent = 'Select restaurant to load menu.'; return; }
      wrap.innerHTML = '<span class="spinner dark"></span> Loading menu…';
      const mSnap = await getDocs(collection(db,'restaurants',rid,'menu'));
      const items = []; mSnap.forEach(d => items.push({ id:d.id, ...d.data() }));
      if (!items.length) { wrap.innerHTML = '<p class="muted">No items</p>'; $('ao-menu').textContent = ''; return; }
      $('ao-menu').textContent = '';
      wrap.innerHTML = items.map(it => `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--ink-100)">
          <div><b style="font-size:13px">${esc(it.name)}</b><div class="muted">${money(it.price)}</div></div>
          <div class="qty-control">
            <button data-aid-dec="${it.id}">−</button>
            <span data-aid-qty="${it.id}">0</span>
            <button data-aid-inc="${it.id}" data-name="${esc(it.name)}" data-price="${it.price}">+</button>
          </div>
        </div>
      `).join('');
      wrap.querySelectorAll('[data-aid-inc]').forEach(b => b.onclick = () => {
        const id = b.dataset.aidInc;
        if (!aoItemsState[id]) aoItemsState[id] = { itemId: id, name: b.dataset.name, price: Number(b.dataset.price), qty: 0 };
        aoItemsState[id].qty++;
        wrap.querySelector(`[data-aid-qty="${id}"]`).textContent = aoItemsState[id].qty;
        recalc();
      });
      wrap.querySelectorAll('[data-aid-dec]').forEach(b => b.onclick = () => {
        const id = b.dataset.aidDec;
        if (!aoItemsState[id]) return;
        aoItemsState[id].qty--;
        if (aoItemsState[id].qty <= 0) delete aoItemsState[id];
        wrap.querySelector(`[data-aid-qty="${id}"]`).textContent = aoItemsState[id]?.qty || 0;
        recalc();
      });
    };
    $('ao-create').onclick = async () => {
      const custId = $('ao-cust').value;
      const rid = $('ao-rest').value;
      const addr = $('ao-addr').value.trim();
      const phone = $('ao-phone').value.trim();
      if (!custId || !rid) return toast('Select customer and restaurant','error');
      if (!Object.keys(aoItemsState).length) return toast('Add at least one item','error');
      const cust = users.find(u => u.id === custId);
      const rest = rests.find(r => r.id === rid);
      if (!cust || !rest) return toast('Invalid selection','error');
      const btn = $('ao-create'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating…';
      try {
        const orderItems = Object.values(aoItemsState).map(i => ({ ...i, lineTotal: i.price * i.qty }));
        const subtotal = Math.round(orderItems.reduce((s,i) => s + i.lineTotal, 0) * 100) / 100;
        const orderId = doc(collection(db,'foodOrders')).id;
        await setDoc(doc(db,'foodOrders',orderId), {
          orderId, customerUid: custId, customerName: cust.name || '',
          restaurantId: rid, restaurantName: rest.name,
          items: orderItems, subtotal, penaltyApplied: 0, total: subtotal,
          status: 'Placed',
          deliveryAddress: addr || 'Admin created order',
          phone: phone || cust.phone || '',
          notes: 'Created by admin',
          penaltyAmount: 0, penaltyStatus: 'none', refundStatus: 'n/a',
          createdByAdmin: state.user.uid,
          createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
        });
        await addDoc(collection(db,'adminAuditLogs'), { action: 'createOrder', orderId, customerUid: custId, adminUid: state.user.uid, createdAt: serverTimestamp() });
        toast('Order created','success'); closeModal(); adminOrders();
      } catch (e) { toast(e.message,'error'); btn.disabled = false; btn.textContent = 'Create Order'; }
    };
  });
}

/* ---------- ADMIN: CUSTOMERS ---------- */
async function adminCustomers() {
  const el = $('admin-body');
  el.innerHTML = `
    <div class="flex-between" style="margin-bottom:14px">
      <p class="muted">Customers</p>
      <button class="btn" id="new-cust">+ Create Customer</button>
    </div>
    <div class="card" style="margin-bottom:14px;padding:6px"><input id="cs" placeholder="Search by UID or email…" style="border:none;padding:9px 12px;width:100%;outline:none;font-family:inherit" /></div>
    <div id="cl">${loadingHTML()}</div>
  `;
  $('new-cust').onclick = () => adminCreateCustomer();
  const run = async (term='') => {
    const snap = await getDocs(collection(db,'users'));
    const users = []; snap.forEach(d => users.push({ id:d.id, ...d.data() }));
    const filtered = term ? users.filter(u => u.id.includes(term) || (u.email||'').toLowerCase().includes(term.toLowerCase())) : users;
    const cl = $('cl');
    if (!filtered.length) { cl.innerHTML = `<div class="empty"><div class="icon">▤</div><h3>No customers found</h3></div>`; return; }
    cl.innerHTML = `<div class="data-table"><table><thead><tr><th>Name</th><th>Email</th><th>Penalty</th><th style="text-align:right">Actions</th></tr></thead><tbody>
      ${filtered.map(u => `<tr>
        <td><b>${esc(u.name||'Unnamed')}</b> ${u.role==='admin'?'<span class="status-badge status-Accepted" style="margin-left:6px">ADMIN</span>':''}</td>
        <td>${esc(u.email||'—')}</td>
        <td>${u.penaltyBalance > 0 ? `<b style="color:var(--danger)">${money(u.penaltyBalance)}</b>` : '<span class="muted">—</span>'}</td>
        <td class="actions"><button class="btn sm" data-adjust="${u.id}" data-bal="${u.penaltyBalance||0}">Adjust Penalty</button></td>
      </tr>`).join('')}
    </tbody></table></div>`;
    cl.querySelectorAll('[data-adjust]').forEach(b => b.onclick = () => adjustPenalty(b.dataset.adjust, b.dataset.bal));
  };
  $('cs').oninput = e => run(e.target.value);
  run();
}

async function adminCreateCustomer() {
  openModal(`
    <h3>Create New Customer</h3>
    <div class="field"><label>Full Name</label><input id="nc-name" /></div>
    <div class="field"><label>Email</label><input id="nc-email" type="email" /></div>
    <div class="field"><label>Phone</label><input id="nc-phone" /></div>
    <div class="field"><label>Password (temporary)</label><input id="nc-pass" type="text" value="Pawan@123456" /></div>
    <p class="muted" style="margin-bottom:14px; font-size:12px">Customer can change password after first login. Minimum 6 characters.</p>
    <div style="display:flex;gap:8px">
      <button class="btn secondary" id="nc-cancel" style="flex:1">Cancel</button>
      <button class="btn" id="nc-create" style="flex:1">Create Customer</button>
    </div>
  `, () => {
    $('nc-cancel').onclick = closeModal;
    $('nc-create').onclick = async () => {
      const name = $('nc-name').value.trim();
      const email = $('nc-email').value.trim();
      const phone = $('nc-phone').value.trim();
      const pass = $('nc-pass').value;
      if (!name || !email || !phone || !pass) return toast('Fill all fields','error');
      if (pass.length < 6) return toast('Password 6+ characters','error');
      const btn = $('nc-create'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating…';
      try {
        // Create user in a secondary app instance so admin stays logged in
        const secondaryApp = initializeApp(firebaseConfig, 'secondary-' + Date.now());
        const secondaryAuth = getAuth(secondaryApp);
        const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        const uid = cred.user.uid;
        await setDoc(doc(db,'users',uid), {
          uid, name, email, phone, role: 'customer', penaltyBalance: 0,
          createdAt: serverTimestamp(), createdByAdmin: state.user.uid,
        });
        await signOut(secondaryAuth);
        await deleteApp(secondaryApp);
        await addDoc(collection(db,'adminAuditLogs'), { action: 'createCustomer', customerUid: uid, adminUid: state.user.uid, createdAt: serverTimestamp() });
        toast('Customer created','success'); closeModal(); adminCustomers();
      } catch (e) { toast(e.message,'error'); btn.disabled = false; btn.textContent = 'Create Customer'; }
    };
  });
}

function adjustPenalty(uid, currentBal) {
  openModal(`
    <h3>Adjust Penalty</h3>
    <p class="muted" style="margin-bottom:16px">Current balance: <b>${money(currentBal)}</b></p>
    <div class="field"><label>Type</label><select id="at"><option value="add">Add Penalty</option><option value="waive">Waive / Remove</option></select></div>
    <div class="field"><label>Amount (₹)</label><input id="aa" type="number" min="0" step="0.01" /></div>
    <div class="field"><label>Reason (required)</label><input id="ar" /></div>
    <button class="btn block" id="ok">Apply</button>
  `, () => {
    $('ok').onclick = async () => {
      const type = $('at').value, amt = Number($('aa').value), reason = $('ar').value.trim();
      if (!amt || amt <= 0) return toast('Enter positive amount','error');
      if (!reason) return toast('Reason required','error');
      const btn = $('ok'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Applying…';
      try {
        const customerRef = doc(db,'users',uid);
        await runTransaction(db, async tx => {
          const s = await tx.get(customerRef);
          if (!s.exists()) throw new Error('User not found');
          const prev = s.data().penaltyBalance || 0;
          const delta = type === 'add' ? amt : -amt;
          let next = Math.round((prev + delta) * 100) / 100;
          if (next < 0) next = 0;
          tx.update(customerRef, { penaltyBalance: next });
          tx.set(doc(collection(db,'penaltyHistory')), {
            customerUid: uid, type: type === 'add' ? 'penalty' : 'waive',
            amount: delta, balanceBefore: prev, balanceAfter: next,
            reason, createdBy: state.user.uid, createdAt: serverTimestamp(),
          });
          tx.set(doc(collection(db,'adminAuditLogs')), {
            action: 'adjustPenalty', customerUid: uid, type, amount: delta,
            balanceBefore: prev, balanceAfter: next, reason,
            adminUid: state.user.uid, createdAt: serverTimestamp(),
          });
        });
        toast('Adjusted','success'); closeModal(); adminCustomers();
      } catch (e) { toast(e.message,'error'); btn.disabled = false; btn.textContent = 'Apply'; }
    };
  });
}

/* ============ MAIN ============ */
function render() {
  if (!state.user) { renderAuth(); return; }
  renderShell();
  renderCartBar();
  switch (state.view) {
    case 'home': return renderHome();
    case 'restaurant': return renderRestaurant();
    case 'cart': return renderCart();
    case 'orders': return renderOrders();
    case 'profile': return renderProfile();
    case 'admin': return renderAdmin();
    default: return renderHome();
  }
}

onAuthStateChanged(auth, async user => {
  state.user = user;
  if (user) {
    try {
      const pSnap = await getDoc(doc(db,'users',user.uid));
      state.profile = pSnap.exists() ? pSnap.data() : { role: 'customer', penaltyBalance: 0 };
    } catch { state.profile = { role: 'customer', penaltyBalance: 0 }; }
    if (state.unsubs.profile) state.unsubs.profile();
    state.unsubs.profile = onSnapshot(doc(db,'users',user.uid), s => {
      if (s.exists()) { state.profile = s.data(); renderShell(); if (['profile','cart'].includes(state.view)) render(); }
    });
    loadAddresses();
    navigate('home');
  } else {
    state.profile = null; state.addresses = []; state.checkoutAddressId = null;
    Object.values(state.unsubs).forEach(u => u && u());
    state.unsubs = {}; render();
  }
});
</script>
